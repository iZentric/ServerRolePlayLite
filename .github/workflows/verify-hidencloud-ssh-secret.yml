name: Verify HidenCloud candidate secret FUN without revealing it
# Trigger only on this workflow's change. No checkout, artifacts or network access to host.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/verify-hidencloud-ssh-secret.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify secret presence and matching public key only
        env:
          PRIVATE_KEY: ${{ secrets.FUN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo '::error title=HidenCloud SSH secret::NOT_PRESENT'
            exit 2
          fi
          key_file=$(mktemp "$RUNNER_TEMP/fc-ssh-key-XXXXXX")
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          # GitHub's form may receive Windows CRLF from the PC clipboard.
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$key_file"
          if [ "$(head -n 1 "$key_file")" != '-----BEGIN OPENSSH PRIVATE KEY-----' ]; then
            echo '::error title=HidenCloud SSH secret::NOT_A_PRIVATE_KEY_CHECK_PASTED_VALUE'
            exit 2
          fi
          mode='empty'
          if actual=$(ssh-keygen -y -P '' -f "$key_file" 2>/dev/null | awk '{print $2}'); then
            :
          elif actual=$(ssh-keygen -y -P '""' -f "$key_file" 2>/dev/null | awk '{print $2}'); then
            mode='literal-quotes'
          else
            echo '::error title=HidenCloud SSH secret::UNREADABLE_PRIVATE_KEY'
            exit 2
          fi
          expected='AAAAC3NzaC1lZDI1NTE5AAAAIM25Ri3sNCuYzBIPpErBs3rwDSdDM3BWn5qUcgQRMfJy'
          if [ "$actual" != "$expected" ]; then
            echo '::error title=HidenCloud SSH secret::DOES_NOT_MATCH_PC_PUBLIC_KEY'
            exit 2
          fi
          if [ "$mode" = 'literal-quotes' ]; then
            echo '::warning title=HidenCloud SSH secret::MATCHES_PC_PUBLIC_KEY_BUT_AUTOMATION_PASSPHRASE_NEEDS_REVIEW; host login NOT tested'
          else
            echo '::notice title=HidenCloud SSH secret::PRESENT_AND_MATCHES_PC_PUBLIC_KEY; host login NOT tested'
          fi
