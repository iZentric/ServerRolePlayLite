name: pc-cp
on:
  push:
    paths:
      - .github/workflows/pc-cp.yml
jobs:
  cp:
    permissions:
      contents: write
    timeout-minutes: 8
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: CoreProtect via PC
        shell: powershell
        run: |
          $steps = @()
          try {
            Set-Location $env:GITHUB_WORKSPACE
            $steps += "cwd ok"
            $t = Join-Path $env:RUNNER_TEMP "cp.jar"
            $ok = $false
            foreach ($u in @("https://github.com/PlayPro/CoreProtect/releases/download/v21.2/CoreProtect-21.2.jar","https://github.com/PlayPro/CoreProtect/releases/download/v21.1/CoreProtect-21.1.jar")) {
              try { Invoke-WebRequest -UseBasicParsing $u -OutFile $t -TimeoutSec 120; if ((Get-Item $t).Length -gt 500000) { $ok = $true; $steps += "dl ok"; break } } catch { $steps += "dl esec" }
            }
            if ($ok) {
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($t))
              Set-Content -Path "diag/CoreProtect.jar.b64" -Value $b64 -NoNewline -Encoding ascii
              $steps += "wrote $((Get-Item diag/CoreProtect.jar.b64).Length)B"
              $h = git status --porcelain
              $steps += "dirty: [$h]"
              git config user.email pc@functity.local
              git config user.name functity-pc
              git add -f diag/CoreProtect.jar.b64
              git commit -m "cp via pc $($steps -join ' | ')"
              $steps += "commit $LASTEXITCODE"
              git push origin "HEAD:$env:GITHUB_REF_NAME" 2> pusherr.txt
              $steps += "push $LASTEXITCODE : $(Get-Content pusherr.txt -Raw)"
            }
          } catch { $steps += "EX: $($_.Exception.Message)" }
          Add-Content -Path "$env:GITHUB_WORKSPACE\diag\pc-cp.txt" -Value ($steps -join " ;; ")
          git add -f diag/pc-cp.txt
          git commit -qm "cp steps $(Get-Random)"
          git push origin "HEAD:$env:GITHUB_REF_NAME" 2>$null
        env:
          GH_TOKEN: ${{ github.token }}
