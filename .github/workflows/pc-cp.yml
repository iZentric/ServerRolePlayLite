name: pc-cp
on:
  push:
    paths:
      - .github/workflows/pc-cp.yml
jobs:
  cp:
    permissions:
      contents: write
    timeout-minutes: 8
    runs-on: [self-hosted, Windows]
    steps:
      - name: Curata workdir
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          try { Set-Location "$env:GITHUB_WORKSPACE" } catch { exit 0 }
          Remove-Item -Force -ErrorAction SilentlyContinue "diag\CoreProtect.jar.b64","diag\pc-cp.txt"
          git checkout -- . 2>$null
          git clean -fdx diag 2>$null
          exit 0
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: CoreProtect via PC
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $steps = @()
          try {
            Set-Location $env:GITHUB_WORKSPACE
            $t = Join-Path $env:RUNNER_TEMP "cp.jar"
            Remove-Item -Force -EA SilentlyContinue $t
            $u = "https://github.com/PlayPro/CoreProtect/releases/download/v21.2/CoreProtect-21.2.jar"
            curl.exe -fLso $t $u
            $steps += "curl=$LASTEXITCODE size=$((Get-Item $t -EA SilentlyContinue).Length)"
            if ((Get-Item $t -EA SilentlyContinue).Length -gt 500000) {
              Copy-Item $t "diag\CoreProtect.jar" -Force
              $steps += "copiat"
            } else { $steps += "NU-E-JAR" }
          } catch { $steps += "EX:$($_.Exception.Message)" }
          try {
            "PC $(Get-Date -Format HH:mm:ss): $($steps -join ' | ')" | Set-Content diag\pc-cp.txt -Encoding ascii
            git config user.email pc@functity.local
            git config user.name functity-pc
            git add -f diag/CoreProtect.jar diag/pc-cp.txt
            $pre = git status --porcelain
            git commit -qm "cp $(Get-Random)"
            git push "https://x-access-token:$env:GH_TOKEN@github.com/iZentric/ServerRolePlayLite" "HEAD:$env:GITHUB_REF_NAME" > "$env:RUNNER_TEMP\pushout.txt" 2>&1
            $steps += "push=$LASTEXITCODE dirtyBefore=[$pre]"
            $steps -join ' | ' | Set-Content "$env:RUNNER_TEMP\stepsum.txt" -Encoding ascii
            "PC $(Get-Date -Format HH:mm:ss): $($steps -join ' | ')" | Set-Content diag\pc-cp.txt -Encoding ascii
            git add -f diag/pc-cp.txt
            git commit -qm "cp-report $(Get-Random)"
            git push "https://x-access-token:$env:GH_TOKEN@github.com/iZentric/ServerRolePlayLite" "HEAD:$env:GITHUB_REF_NAME" 2>$null
            $steps | Out-File "$env:RUNNER_TEMP\stepsum.txt"
          } catch { "EX2:$($_.Exception.Message)" | Out-File "$env:RUNNER_TEMP\stepsum.txt" }
          exit 0
      - name: Raport final
        shell: powershell
        run: |
          $s = Get-Content "$env:RUNNER_TEMP\stepsum.txt" -Raw -ErrorAction SilentlyContinue
          "FINAL: $s"
          exit 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sanseaza token pe push
        shell: powershell
        run: exit 0
