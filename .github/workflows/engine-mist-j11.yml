# Mist launcher requests Java 11-15; equal-runtime gate and benchmark only if both boot.
name: ENGINE MIST — Java 11 same-pack smoke then A/B/B/A
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-mist-j11.txt"]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - name: Download original CatServer and Mist release pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine-family-releases
          for engine in CatServer Mist-EXPERIMENTAL; do
            gh release download lite --repo "$GITHUB_REPOSITORY" -p "CUANTIC-Server-$engine-1.7.7.zip" -D /tmp/engine-family-releases
          done
      - name: Both 36-mod/14-plugin packs must boot on the SAME Java 11
        id: gate
        env: { ENGINE_FAMILY_ONLY: 'live-CatServer,Mist' }
        run: |
          python3 scripts/engine_family_smoke.py /tmp/engine-family-releases /tmp/mist-java11-smoke
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('/tmp/mist-java11-smoke/result.json'))['candidates']
          print('qualified='+str(int(all(data[x].get('qualified_for_performance_A_B') for x in ('live-CatServer','Mist')))))
          PY
      - name: ABBA with original pack only if both pass complete smoke
        if: steps.gate.outputs.qualified == '1'
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/engine-family-releases/CUANTIC-Server-Mist-EXPERIMENTAL-1.7.7.zip')
          n=[x for x in z.namelist() if x.lower().startswith('mist') and x.endswith('.jar') and '/' not in x]
          assert len(n)==1, n
          open('/tmp/mist-j11.jar','wb').write(z.read(n[0]))
          PY
          python3 scripts/engine_family_compare.py /tmp/engine-family-releases/CUANTIC-Server-CatServer-1.7.7.zip /tmp/mist-j11.jar Mist /tmp/mist-java11-abba
      - name: Publish smoke and A/B (if eligible); never touch production
        if: always()
        run: |
          { echo '# CatServer vs Mist — same pack and Java 11'; echo;
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            echo 'Mist launch screen requires Java 11–15; both arms use J11 here. Only isolated GitHub VMs.';
            echo 'No Forge client login, human player, city traffic, vehicle driving or live JAR change.'; echo;
            echo '## Compatibility gate'; echo '```json'; cat /tmp/mist-java11-smoke/result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
            echo '## Equal-runtime A/B/B/A, only if both passed'; echo '```json'; cat /tmp/mist-java11-abba/result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
          } > docs/ENGINE-MIST-J11-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-MIST-J11-RESULT.md
          git commit -m 'engine: Mist Java 11 same-pack benchmark verdict' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
