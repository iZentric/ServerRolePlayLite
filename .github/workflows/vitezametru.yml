name: VITEZAMETRUL (TPS+RAM+spark live de pe host, din log)
on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths: [ "deploy/vitezametru-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  citeste:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Citește loguri + rapoarte spark de pe host
        env:
          SFTP_HOST: node12.zampto.net
          SFTP_PORT: "2022"
          SFTP_USER: 15254.1388b9af
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          mkdir -p run analysis
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; get logs/latest.log -o run/latest.log; mirror spark run/spark; bye" || true
          {
            echo "# Vitezametru CUANTIC — ultima citire $(date -u '+%F %T UTC')"
            echo
            grep -E "TPS from last" run/latest.log | tail -4 > /tmp/tps.raw
            if [ -s /tmp/tps.raw ]; then
              echo "| timp | TPS 1m/5m/15m |"
              echo "|---|---|"
              while IFS= read -r LIN; do
                T=$(echo "$LIN" | grep -oE "[0-9]{2}:[0-9]{2}:[0-9]{2}" | head -1)
                V=$(echo "$LIN" | grep -oE "[0-9]+\.[0-9]+, \*?[0-9]+\.[0-9]+, \*?[0-9]+\.[0-9]+" | head -1)
                echo "| $T | $V |"
              done < /tmp/tps.raw
            else
              echo "_Linii TPS in fisier: NU EXISTA (CatServer tipareste TPS doar in consola panoului — valoarea reala de citit acolo cand intra jucatorii)_"
            fi
            echo
            echo "- Can't keep up (intarzieri tick): $(grep -c "Can't keep up" run/latest.log)"
            echo "- Evenimente join/leave: $(grep -cE 'entered the game|lost connection' run/latest.log)"
            echo "- Linii [ERROR] in log: $(grep -cE '[[]ERROR[]]' run/latest.log)"
            H=$(ls -t run/spark/reports/health-report*.json 2>/dev/null | head -1)
            if [ -n "$H" ]; then
              echo
              echo "## RAPORT SPARK (profilare sub sarcina reala)"
              jq -r '"- TPS mediu " + (.average_tps|tostring) + " | mediana " + (.median_tps|tostring) + " | minim " + (.min_tps|tostring) + " / 20", "- Uptime " + (((.uptime_ms // 0)/1000)|floor|tostring) + "s | jucatori max " + (((.players.max // .players) // "?")|tostring), "- GC: " + (((.gc.collections) // "?")|tostring) + " colectii, pauza " + (((.gc.total_pause_time) // "?")|tostring) + "ms", "- Heap: " + (((((.memory.pools.heap.used // 0))/1048576)|floor|tostring)) + "MB / " + (((((.memory.pools.heap.max // 0))/1048576)|floor|tostring)) + "MB", (if ((.tick_list // [])|length) > 0 then "- MSPT: mediana " + ((.tick_list|sort|.[((.tick_list|length)/2)|floor])|tostring) + "ms | p95 " + ((.tick_list|sort|.[((.tick_list|length)*0.95)|floor])|tostring) + "ms (buget 50)" else empty end)' "$H" 2>/dev/null || echo "(spark json prezent dar neparsabil)"
            else
              echo
              echo "_Nicun /spark healthreport rulat pe host inca — cand intra lumea, da comanda si raportul apare aici automat la urmatorul tur de cron_"
            fi
          } > analysis/viteza-live.md
          echo "== audit disc =="
          URL=$(curl -fsS https://api.github.com/repos/"$GITHUB_REPOSITORY"/releases/tags/lite 2>/dev/null | jq -r '.assets[].browser_download_url' | grep -m1 Server-CatServer)
          EXPMD=NU; HOSTMD=NU
          if [ -n "$URL" ]; then
            curl -fsSL -m 120 "$URL" -o /tmp/exp.zip 2>/dev/null
            lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; cat unix_args.txt; bye" > run/ua-remote.txt 2>/dev/null
            lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; cls -1 mods; bye" > run/mods-remote.txt 2>/dev/null
            lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; cat server.properties; bye" > run/sp-remote.txt 2>/dev/null
            if [ -f /tmp/exp.zip ]; then
              unzip -p /tmp/exp.zip unix_args.txt 2>/dev/null | md5sum | cut -c1-8 > /tmp/exp-md
              md5sum run/ua-remote.txt 2>/dev/null | cut -c1-8 > /tmp/host-md
              unzip -l /tmp/exp.zip 2>/dev/null | awk '{print $4}' | grep -E '^mods/[^/]+.jar$' | sed 's|mods/||' | sort -u > /tmp/exp-mods
              sort -u run/mods-remote.txt 2>/dev/null | grep -E '.jar$' > /tmp/host-mods || true
              grep -E "^player-idle-timeout" run/sp-remote.txt 2>/dev/null | head -1 > /tmp/host-idle
              EXPMD=$(cat /tmp/exp-md); HOSTMD=$(cat /tmp/host-md)
            fi
          fi
          DIFFMODS=$(diff /tmp/exp-mods /tmp/host-mods 2>/dev/null | grep -cE '^[<>]' || echo 0)
          {
            echo ""
            echo "## AUDIT DISC (host vs release \`lite\`)"
            echo "- moduri: host $(wc -l < /tmp/host-mods 2>/dev/null || echo ?) vs release $(wc -l < /tmp/exp-mods 2>/dev/null || echo ?) — fisiere care difera: **$DIFFMODS**"
            if [ "$EXPMD" != "NU" ]; then
              if [ "$EXPMD" = "$HOSTMD" ]; then echo "- unix_args.txt: **LA ZI** ($HOSTMD)"; else echo "- unix_args.txt: **VECHI** (host $HOSTMD vs release $EXPMD)"; fi
            fi
            echo "- $(cat /tmp/host-idle 2>/dev/null | sed 's/^/player-idle remota: /' || echo 'idle: necunoscut')"
          } >> analysis/viteza-live.md
          STALE=NU
          if [ -n "$URL" ]; then
            if [ "$DIFFMODS" -gt 0 ] 2>/dev/null || [ "$EXPMD" != "$HOSTMD" ]; then STALE=DA; fi
          fi
          if [ "$STALE" = "DA" ]; then
            KEY=$( (echo "$DIFFMODS"; md5sum run/ua-remote.txt 2>/dev/null; sort /tmp/host-mods 2>/dev/null) | md5sum | cut -c1-12 )
            OLDKEY=$(cat analysis/audit-key.txt 2>/dev/null || echo vechi)
            echo "stale=$STALE key=$KEY old=$OLDKEY"
            if [ "$KEY" != "$OLDKEY" ]; then
              mkdir -p analysis deploy
              echo "$KEY" > analysis/audit-key.txt
              date -u +%FT%TZ > deploy/trigger.txt
              git add -f analysis/audit-key.txt deploy/trigger.txt
              git commit -q -m "auto-deploy: host vechitate $KEY" || true
            fi
          fi
          cat analysis/viteza-live.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/viteza-live.md
          git commit -m "vitezametru: citire" || true
          for t in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "$GITHUB_REF_NAME" && break; sleep $((RANDOM%5+3)); done
          exit 0
