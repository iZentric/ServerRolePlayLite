name: world-factory

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/world-factory-trigger.txt"

concurrency:
  group: world-factory
  cancel-in-progress: false

env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: 2022
  SFTP_USER: 15254.1388b9af

jobs:
  genereaza:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Pregateste serverul de generare (MaxLite, fara EXTREME)
        run: |
          set -eo pipefail
          gh release download lite -R ${{ github.repository }} -p '*Server-MaxLite*.zip' -O srv.zip
          mkdir -p srv && cd srv && unzip -q ../srv.zip
          # scoatem piesele care nu au ce cauta la generare (experimentale/idle)
          rm -f mods/jmt_mcmt*.jar mods/performant*.jar mods/*ibernat*.jar mods/*server-pause*.jar || true
          # Chunky pentru Forge 1.16.5 (de pe Modrinth, cu API)
          V=$(curl -s 'https://api.modrinth.com/v2/project/chunky/version?game_versions=%5B%221.16.5%22%5D&loaders=%5B%22forge%22%5D' | python3 -c "import json,sys; v=json.load(sys.stdin); print(v[0]['files'][0]['url'])")
          curl -sL -o mods/chunky-forge.jar "$V"
          echo "eula=true" > eula.txt
          sh install-forge.sh > /dev/null 2>&1 || sh install-forge.sh
          ls forge-*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Genereaza lumea + granita
        run: |
          set -o pipefail
          cd srv
          R=$(tr -dc 0-9 < ../deploy/world-factory-trigger.txt 2>/dev/null | head -c 6); R=${R:-1000}; echo "RAZA=$R"
          mkfifo console.in
          # tinem FIFO deschis ca sa putem scrie comenzi pe rand
          exec 3> console.in
          (java -Xms2G -Xmx5G -jar forge-1.16.5-*.jar nogui < console.in >> gen.log 2>&1; echo SERVER_EXITED >> gen.log) &
          # asteptam pornirea completa (max 25 min)
          for i in $(seq 1 150); do
            grep -q 'Done (' gen.log && break
            grep -q SERVER_EXITED gen.log && { echo "SERVERUL A MURIT LA PORNIRE"; tail -50 gen.log; exit 1; }
            sleep 10
          done
          grep -q 'Done (' gen.log || { echo "TIMEOUT PORNIRE"; tail -50 gen.log; exit 1; }
          echo ">>> Server pornit. Setez granita si pornesc generarea (raza $R)"
          echo "worldborder center 0 0" >&3
          echo "worldborder set $((R*2))" >&3
          sleep 2
          echo "chunky center 0 0" >&3
          echo "chunky radius $R" >&3
          echo "chunky start" >&3
          # asteptam finalul generarii (max ~4h)
          for i in $(seq 1 1400); do
            grep -qi 'Task finished' gen.log && break
            grep -q SERVER_EXITED gen.log && { echo "SERVERUL A MURIT IN TIMPUL GENERARII"; tail -80 gen.log; exit 1; }
            sleep 10
          done
          grep -qi 'Task finished' gen.log || echo "ATENTIE: generarea nu a raportat final — salvez cat s-a facut"
          echo "save-all flush" >&3; sleep 10
          echo "stop" >&3
          for i in $(seq 1 60); do grep -q SERVER_EXITED gen.log && break; sleep 5; done
          exec 3>&-
          du -sh world; ls world

      - name: Livreaza lumea pe Zampto
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          P='${{ secrets.ZAMPTO_SFTP_PASS }}'
          cd srv
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            set net:timeout 30; set net:max-retries 2;
            mirror -R --verbose --parallel=2 --only-newer --ignore-time world world;
            bye
          "
          echo "LUMEA E PE SERVER."

      - name: Arhiveaza lumea si in Releases (plasa de siguranta)
        if: always()
        run: |
          cd srv && zip -q -r ../world-pregen.zip world || exit 0
          cd .. && gh release delete world --yes || true
          gh release create world world-pregen.zip --title "Lume pre-generata (fabrica)" \
            --notes "Generata de world-factory, granita stabilita de trigger."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
