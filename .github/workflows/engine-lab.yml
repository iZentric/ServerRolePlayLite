# Laborator izolat: NICIODATA nu publica release-ul "lite" si nu atinge serverul live.
name: ENGINE LAB — CatServer upstream 1.16.5 + test CUANTIC
on:
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-lab.txt", "scripts/engine_lab.py", ".github/workflows/engine-lab.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      # 1.16.5 upstream: contine fixul hopper-event (98eabb0, Aug 2023)
      # si fixurile de respawn (1c92118, Apr 2024). Live = 1d8d631 (Mai 2023).
      CATSERVER_REV: 1c92118fcca69ffac97a48c8e1f6e1bb861b41d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compileaza CatServer 1.16.5 upstream intr-un director temporar
        run: |
          mkdir -p engine-lab
          curl -fL --retry 3 --retry-delay 5 \
            "https://codeload.github.com/Luohuayu/CatServer/tar.gz/${CATSERVER_REV}" -o /tmp/catserver-source.tgz
          mkdir -p /tmp/catserver-source
          tar -xzf /tmp/catserver-source.tgz -C /tmp/catserver-source --strip-components=1
          cd /tmp/catserver-source
          chmod +x gradlew
          # Flag Java 8 scos din Java 17; nu schimbam codul/motorul, doar JVM-ul de build.
          sed -i -e 's/-XX:MaxPermSize=512m//g' -e 's/-Xmx3G/-Xmx5G/g' -e 's/org.gradle.parallel=true/org.gradle.parallel=false/' -e 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
          set -o pipefail
          # ForgeGradle patcher needs MCP setup fully completed BEFORE compileJava.
          ./gradlew --no-daemon --no-parallel setup 2>&1 | tee "$GITHUB_WORKSPACE/engine-lab/build.log"
          # Javac-ul Java 8 ruleaza separat de daemonul Gradle 17. Heapul Gradle
          # de 5G nu ajuta compilatorul care murea cu GC overhead; dam 4G javac.
          cat >> build.gradle <<'EOF'
          project(':forge') {
              tasks.withType(JavaCompile).configureEach {
                  options.fork = true
                  options.forkOptions.memoryMaximumSize = '4g'
              }
          }
          EOF
          sed -i 's/-Xmx5G/-Xmx2G/g' gradle.properties
          ./gradlew --no-daemon --no-parallel --max-workers=1 buildCatServer 2>&1 | tee -a "$GITHUB_WORKSPACE/engine-lab/build.log"
          find . -type f -iname '*server.jar' -size +5M | head -20
      - name: Pregateste candidatul, fara sa publice/deployeze
        run: |
          set -euo pipefail
          mkdir -p engine-lab stage
          jar=$(find /tmp/catserver-source -type f -iname 'CatServer*server.jar' -size +5M | head -1)
          test -n "$jar"
          cp "$jar" engine-lab/CatServer-upstream-candidate.jar
          cp /tmp/catserver-source/LICENSE engine-lab/CATSERVER-LICENSE.txt
          printf 'Upstream source: https://github.com/Luohuayu/CatServer/tree/%s (LGPL-3.0)\nBranding source: scripts/brand_engine.py in this repository\n' "$CATSERVER_REV" > engine-lab/SOURCE.txt
          python3 scripts/brand_engine.py engine-lab/CatServer-upstream-candidate.jar engine-lab/CUANTIC-CatServer-candidate.jar > engine-lab/brand.json
          gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -O /tmp/live-pack.zip
          unzip -q /tmp/live-pack.zip -d stage
          test -f stage/CatServer-1.16.5-1d8d6313-server.jar
          cp engine-lab/CUANTIC-CatServer-candidate.jar stage/CatServer-1.16.5-1d8d6313-server.jar
          echo 'TESTARE STAGING — NU ESTE SERVER LIVE' > engine-lab/README.txt
          sha256sum engine-lab/*jar > engine-lab/SHA256SUMS.txt
      - name: Smoke test cu cele 36 moduri si 14 pluginuri reale
        run: python3 scripts/engine_lab.py stage engine-lab/boot.log
      - name: Salveaza diagnosticul pe ramura sesiunii (fara deploy)
        if: always()
        run: |
          { echo '# ENGINE LAB — build izolat'; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID";
            echo; echo 'Ultimele linii din compilare (nu sunt cifre de TPS):'; echo '```';
            tail -80 engine-lab/build.log 2>/dev/null || echo 'Compilarea a esuat inainte de Gradle.';
            echo '```'; echo; echo 'Smoke:'; echo '```';
            cat engine-lab/smoke-result.json 2>/dev/null || echo 'NU RULAT'; echo '```';
          } > docs/ENGINE-LAB-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-LAB-RESULT.md
          git commit -m 'engine lab: rezultat build izolat' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Arhiveaza candidatul (nu publica release-ul si nu reporneste live-ul)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuantic-engine-upstream-candidate
          path: engine-lab/
          retention-days: 7
