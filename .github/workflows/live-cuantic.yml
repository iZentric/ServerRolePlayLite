name: CUANTIC LIVE — server + adresa (tine ~2h)
on:
  push:
    paths: [ "deploy/live.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-cuantic
  cancel-in-progress: true
jobs:
  live:
    runs-on: [self-hosted]
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - name: Server + relay
        run: bash scripts/ip.sh || true
