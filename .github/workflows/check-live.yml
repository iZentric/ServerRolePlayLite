name: CHECK-LIVE
permissions:
  contents: write
on:
  push:
    branches: ['arena/*']
    paths: ['.github/workflows/check-live.yml', 'diag/addr.txt']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MC ping extern (mcstatus)
        run: |
          AD=$(cat diag/addr.txt 2>/dev/null | tr -d '\n[:space:]')
          echo "adresa: $AD"
          pip install -q mcstatus 2>&1 | tail -1
          if mcstatus "$AD" status > /tmp/mcs.txt 2>&1; then
            head -c 400 /tmp/mcs.txt
            echo "EXTERIOR: JUCABIL - serverul raspunde prin tunel" > /tmp/verdict.txt
            head -3 /tmp/mcs.txt >> /tmp/verdict.txt
          else
            echo "ESUAT:"; head -c 300 /tmp/mcs.txt
            { echo "EXTERIOR: ESUAT"; head -3 /tmp/mcs.txt; } > /tmp/verdict.txt
          fi
      - name: Verdict in repo
        if: always()
        run: |
          git config user.email b@b && git config user.name chk
          mkdir -p diag && { date -u; cat /tmp/verdict.txt; } > diag/live-check.txt
          git add -f diag/live-check.txt && git commit -qm "live check $(date +%s)" && git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" HEAD:$GITHUB_REF_NAME
