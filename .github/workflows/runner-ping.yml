name: RUNNER-PING
on:
  push:
    paths: [ "deploy/runner-ping.txt" ]
permissions:
  contents: write
jobs:
  ping:
    runs-on: [self-hosted]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic complet
        run: |
          set +e
          mkdir -p analysis
          {
            echo "# Diagnostic runner VM"
            echo "- user: $(whoami)  home: $HOME"
            echo "- sudo fara parola: $(sudo -n true 2>&1 && echo DA || echo NU)"
            for c in java dnf yum curl unzip jq git python3 iptables systemctl; do
              echo "- $c: $(command -v $c || echo LIPSA)"
            done
            echo "- java version: $(java -version 2>&1 | head -1)"
            echo "- github api reachable: $(curl -fsS -o /dev/null -w '%{http_code}' -m 8 https://api.github.com 2>/dev/null)"
            echo "- memorie: $(free -g | awk '/Mem:/{print $2" GB total, "$7" disponibila"}')"
            echo "- disc: $(df -h $HOME | awk 'NR==2{print $4" liberi din "$2}')"
          } > analysis/runner-diag.md
          git config user.name "diag-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/runner-diag.md
          git commit -m "diag runner" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
