name: harta-js

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/harta-trigger.txt"

permissions:
  contents: write

jobs:
  harta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Descarca JS-ul panoului si extrage rutele
        run: |
          set +e
          mkdir -p /tmp/js analysis
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          curl -sL -A "$UA" "https://dash.zampto.net/auth/login" -o /tmp/js/page.html
          echo "page: $(wc -c < /tmp/js/page.html) bytes"
          grep -oE 'src="[^"]+\.js"' /tmp/js/page.html | sed 's/src="//;s/"//' | sort -u > /tmp/js/chunks.txt
          grep -oE 'href="[^"]+\.js"' /tmp/js/page.html | sed 's/href="//;s/"//' | sort -u >> /tmp/js/chunks.txt
          sort -u /tmp/js/chunks.txt -o /tmp/js/chunks.txt
          echo "chunks: $(wc -l < /tmp/js/chunks.txt)"
          while read -r C; do
            case "$C" in http*) U="$C";; /*) U="https://dash.zampto.net$C";; *) U="https://dash.zampto.net/$C";; esac
            N=$(echo "$C" | tr '/' '_')
            curl -sL -A "$UA" "$U" -o "/tmp/js/$N" --max-time 25
            sleep 0.4
          done < /tmp/js/chunks.txt
          echo "== FISIERE JS =="
          ls -la /tmp/js/ | head -30
          {
            echo "# HARTA API ZAMPTO ($(date -u))"
            echo
            echo "## Rute API gasite in JS"
            grep -ohE '"/api/[a-zA-Z0-9/_${}.-]+"|`/api/[a-zA-Z0-9/_${}.-]+`' /tmp/js/*.js /tmp/js/page.html 2>/dev/null | sort -u | head -60
            echo
            echo "## Rute auth"
            grep -ohE '"/auth/[a-zA-Z0-9/_${}.-]+"' /tmp/js/*.js /tmp/js/page.html 2>/dev/null | sort -u | head -30
            echo
            echo "## Header/chei"
            grep -ohE '"[xX]-[a-zA-Z-]+"|Authorization[^,;]{0,40}|Bearer [^"]{0,30}|zamptonet[a-zA-Z0-9_-]*' /tmp/js/*.js 2>/dev/null | sort -u | head -40
            echo
            echo "## power/restart/console/ws"
            grep -ohE '.{60}(power|restart|/console|websocket|wss://|ws://).{60}' /tmp/js/*.js 2>/dev/null | head -40
          } > analysis/harta-js.md
          cat analysis/harta-js.md
          exit 0

      - name: Comita
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/harta-js.md 2>/dev/null || true
          git commit -m "analysis: harta JS a panoului Zampto" || echo "nimic"
          git pull --rebase -X ours origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
