name: cloudshell-on
# Trezeste Cloud Shell-ul prin API-ul OCI (create = exact butonul Start din consola).
# Liniile de mai jos se activeaza cand exista secret-urile OCI_PEM + OCI_FINGERPRINT
# (cheia API, generata de owner in consola OCI -> pusa in repo Secrets; cheia NU trece prin chat).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */4 * * *"
permissions: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Porneste mediul Cloud Shell (nevoie doar de cheie API)
        env:
          PEM: ${{ secrets.OCI_PEM }}
          FP: ${{ secrets.OCI_FINGERPRINT }}
          TEN: ${{ vars.OCI_TENANCY }}
          USR: ${{ vars.OCI_USER }}
          REG: ${{ vars.OCI_REGION }}
        run: |
          set +e
          TEN="${TEN:-ocid1.tenancy.oc1..aaaaaaaanlzitmrgwn5f3g3iyapyiuxt2ayh43u6mdq3nszvcswrkcw5eyfa}"
          USR="${USR:-ocid1.user.oc1..aaaaaaaafg2fu7zqt4q7kzdy7fzqbvg6wr5wj2f3yb5e452eas7cu3hbghma}"
          REG="${REG:-us-abilene-1}"
          if [ -z "$PEM" ] || [ -z "$FP" ]; then
            echo "inactiv: lipsesc OCI_PEM/OCI_FINGERPRINT — workflow nu face nimic pana le added (tenancy/user/region deja hardcode)"
            exit 0
          fi
          python3 -m venv ~/venv-oci >/dev/null 2>&1
          ~/venv-oci/bin/pip -q install oci-cli 2>/dev/null
          OCI=~/venv-oci/bin/oci
          mkdir -p ~/.oci && umask 077
          printf '%s\n' "$PEM" > ~/.oci/gh.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$USR
          fingerprint=$FP
          tenancy=$TEN
          region=$REG
          key_file=~/.oci/gh.pem
          EOF
          echo "--- stare inainte:"
          $OCI --region $REG cloud-shell environment get 2>&1 | grep -oE '"lifecycleState": *"[A-Z_]+"' || true
          echo "--- create (porneste daca e INACTIVE; deja ACTIV = eroare inofensiva):"
          $OCI --region $REG cloud-shell environment create 2>&1 | head -3
          sleep 8
          echo "--- stare dupa:"
          $OCI --region $REG cloud-shell environment get 2>&1 | grep -oE '"lifecycleState": *"[A-Z_]+"' || true
          rc=$?
          echo "verdict: $([ $rc -eq 0 ] && echo SUS || echo 'de verificat manual') la $(date -u '+%F %T') UTC"
