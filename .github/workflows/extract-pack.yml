name: Extract pack analysis
on:
  push:
    branches: [ "arena/a29b4ef4-serverroleplaylite" ]
    paths: [ ".github/workflows/extract-pack.yml" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pack from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pack-original -p '*.mrpack' -O pack.mrpack
      - name: Extract analysis files
        shell: bash
        run: |
          mkdir -p analysis
          exec > >(tee analysis/extract-debug.log) 2>&1
          set -x
          ls -la pack.mrpack || true
          file pack.mrpack || true
          mkdir -p work
          ( cd work && unzip -q ../pack.mrpack ) || echo "UNZIP_FAILED=$?"
          echo "--- structura top-level:"
          ls -la work || true
          cp work/modrinth.index.json analysis/ || echo "NO_INDEX"
          ( cd work && find . -type f -printf '%s\t%p\n' | sort -t$'\t' -k2 ) > analysis/files-listing.tsv || true
          ( cd work && find . -name '*.jar' -exec sha1sum {} \; ) > analysis/override-jars-sha1.txt || true
          for d in overrides client-overrides server-overrides; do
            if [ -d "work/$d" ]; then
              ( cd work && zip -q -r ../analysis/overrides-configs.zip "$d" -x '*.jar' ) || echo "ZIP_SKIP_$d"
            fi
          done
          if [ -f analysis/overrides-configs.zip ] && [ "$(stat -c%s analysis/overrides-configs.zip)" -gt 95000000 ]; then
            split -b 90m analysis/overrides-configs.zip analysis/overrides-configs.zip.part- && rm analysis/overrides-configs.zip
          fi
          mkdir -p analysis/override-jars
          ( cd work && find . -name '*.jar' -type f ) | while read -r j; do
            sz=$(stat -c%s "work/$j" || echo 0)
            base=$(basename "$j")
            if [ "$sz" -le 95000000 ]; then
              cp "work/$j" "analysis/override-jars/$base" || true
            else
              split -b 90m "work/$j" "analysis/override-jars/$base.part-" || true
            fi
          done
          rmdir analysis/override-jars 2>/dev/null || true
          rm -rf work pack.mrpack
          du -sh analysis || true
          ls -la analysis || true
          true
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis || true
          git commit -m "analysis: continut extras din Freeroam 1.0.0 mrpack" || echo "nimic de comis"
          git push || true
