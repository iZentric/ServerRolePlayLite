name: PACK-SRV (retired)
# world-live and server-live must never be overwritten by an old stitch job.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse world/server release overwrite
        run: |
          echo '::error::Live world/server assets require backup, restore test and explicit approval.'
          exit 1
