name: zip-patch
on:
  push:
    paths:
      - .github/workflows/zip-patch.yml
jobs:
  p:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: CoreProtect in FUNCTITY-SERVER.zip
        run: |
          set -e
          exec > >(tee /tmp/patch.log) 2>&1
          mkdir -p $GITHUB_WORKSPACE/s && cd $GITHUB_WORKSPACE/s
          echo "== jos zip + jar =="
          curl -sfL "https://github.com/PlayPro/CoreProtect/releases/download/v21.2/CoreProtect-21.2.jar" -o CoreProtect.jar
          echo "CP jar: $(stat -c%s CoreProtect.jar)B"
          echo "descarc zip curent..."
          curl -sfL "https://github.com/iZentric/ServerRolePlayLite/releases/download/funcity/FUNCTITY-SERVER.zip" -o f.zip
          echo "zip: $(stat -c%s f.zip)B"
          unzip -q f.zip -d unz
          mkdir -p unz/plugins && cp CoreProtect.jar unz/plugins/CoreProtect.jar
          grep -q "^motd=" unz/server.properties && sed -i 's|^motd=.*|motd=\\u00a7b\\u00a7lFuncity \\u00a77RolePlay \\u00a7aRomania - loguri CoreProtect active|' unz/server.properties
          cat > unz/plugins/Citeste-pluginuri.txt <<'TXT'
          CoreProtect.jar  = log FIECARE block spart/pus (inclusiv din moduri), /co inspect cu lopata + /co rollback la paguba
          EssentialsX      = /sethome /home /spawn /tpa /back
          ClaimChunk       = protectie terena (chunk claims) - fusioniaza cu blocurile din moduri
          Chunky           = pre-generare lume (fara lag la margini)
          LuckPerms        = grade/permisiuni /lp
          TXT
          cd unz && zip -qr9 ../functity2.zip . -x "*.log" "unz/logs/*" && cd ..
          echo "zip nou: $(stat -c%s functity2.zip 2>/dev/null || stat -c%s ../functity2.zip)B"
          mv ../functity2.zip "$GITHUB_WORKSPACE/" 2>/dev/null || true
          gh release upload funcity "$GITHUB_WORKSPACE/functity2.zip" -R "$GITHUB_REPOSITORY" --clobber 2>/dev/null || gh release upload funcity "$GITHUB_WORKSPACE/FUNCTITY-SERVER.zip" --clobber
          echo PATCH-DONE
      - name: Log pe branch
        if: always()
        run: |
          git config user.email b@b && git config user.name chk
          mkdir -p diag && cp /tmp/patch.log diag/zip-patch.log
          git add -f diag/zip-patch.log && git commit -qm "zip-patch log $(date +%s)" && git push -q "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY" HEAD:"$GITHUB_REF_NAME" || true
