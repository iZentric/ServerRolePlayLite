# FunCity 1.16.5 Lite - spawn-limit din referinta HYPECITY BK; spawn nefortat
settings:
  allow-end: false
  keep-spawn-loaded: false
  warn-on-overload: false
spawn-limits:
  monsters: 8
  animals: 5
  water-animals: 1
  water-ambient: 2
  ambient: 0
chunk-gc:
  period-in-ticks: 400
  load-threshold: 300
ticks-per:
  animal-spawns: 400
  monster-spawns: 10
  water-spawns: 40
  ambient-spawns: 400
  autosave: 6000
