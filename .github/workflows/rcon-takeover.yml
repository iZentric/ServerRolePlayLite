name: RCON takeover (inarmeaza consola de la distanta)
# Rost: serverul Zampto n-are consola accesibila noua (panoul cere captcha).
# Prin SFTP bagam 3 linii in server.properties -> la urmatorul restart al serverului
# portul 28147 (alocare libera) devine RCON = noi controlam consola de pe runneri.
# Parola RCON = aceeasi cheie din secretul ZAMPTO_SFTP_PASS (nu cream secret nou).
on:
  push:
    paths: [ "deploy/rcon-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: "2022"
  SFTP_USER: 15254.1388b9af
jobs:
  inarmare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Instaleaza lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Scrie RCON in server.properties (pe host, fara a atinge lumea)
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          mkdir -p work analysis
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get server.properties -o work/server.properties;
            bye"
          if [ ! -s work/server.properties ]; then echo "FISIER DESCARCAT GOL - opresc"; exit 0; fi
          if grep -q '^enable-rcon=true' work/server.properties; then
            echo "RCON deja inarmat, nu schimb nimic"
          else
            printf 'enable-rcon=true\nrcon.port=28147\nrcon.password=%s\n' "$P" >> work/server.properties
            lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
              set sftp:auto-confirm yes;
              put work/server.properties -o server.properties;
              bye"
            echo "RCON ARMAT pe port 28147 — devine viu la urmatorul restart al serverului"
          fi
          tail -5 work/server.properties | cut -d= -f1 > analysis/rcon-stare.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/rcon-stare.txt
          git commit -m "analysis: stare server.properties dupa inarmare RCON" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push || true
          exit 0
