name: VMNEW — VM Ampere gratuit (cont propriu, 0 lei)

# Ruleaza DOAR pe runner-ul self-hosted din Cloud Shell: acolo exista config-ul OCI (~/.oci/config
# sau ~/remote/.oci/config) si un python care are deja SDK-ul.
# Logs-urile runner-ului self-hosted NU se vad prin API, deci tot ce conteaza se scrie in
# analysis/vm-setup.txt + analysis/vm-status.txt si se impinge in commit (ales cu git log).

on:
  push:
    paths:
      - "deploy/vmnew.txt"
      - "scripts/vmnew.py"
      - "scripts/cuantic-vm.sh"
      - ".github/workflows/vmnew.yml"
  workflow_dispatch: {}

jobs:
  vm:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: gaseste un python cu SDK OCI (si isi face singur diagnosticul)
        run: |
          mkdir -p analysis
          {
            echo "HOME=$HOME  user=$(id -un)"
            command -v oci || echo "oci pe PATH: NU"
            ls -d "$HOME"/*venv* 2>/dev/null || echo "niciun *venv* in \$HOME"
            PY=""
            OCLI=$(command -v oci 2>/dev/null || true)
            if [ -n "$OCLI" ]; then
              CAND=$(head -1 "$OCLI" | sed 's/^#!//')
              if [ -x "$CAND" ] && "$CAND" -c "import oci" 2>/dev/null; then PY="$CAND"; echo "python din shebang-ul lui oci: $PY"; fi
            fi
            for c in "$HOME/oci-venv/bin/python" "$HOME/.venv/bin/python" "$(command -v python3 || true)"; do
              if [ -n "$c" ] && [ -x "$c" ] && [ -z "$PY" ]; then
                if "$c" -c "import oci" 2>/dev/null; then PY="$c"; echo "python existent cu oci: $PY"; fi
              fi
            done
            if [ -z "$PY" ]; then
              P3=$(command -v python3)
              echo "niciun python cu 'import oci' -> incerc: $P3 -m pip install --user oci"
              "$P3" -m pip install --quiet --disable-pip-version-check --user oci 2>&1 | tail -3
              if "$P3" -c "import oci" 2>/dev/null; then PY="$P3"; else
                echo "reincerc cu --break-system-packages (PEP 668)"
                "$P3" -m pip install --quiet --disable-pip-version-check --user --break-system-packages oci 2>&1 | tail -3
                if "$P3" -c "import oci" 2>/dev/null; then PY="$P3"; fi
              fi
            fi
            if [ -z "$PY" ]; then echo "PYTHON OCI: NICIUNUL - opresc aici"; exit 3; fi
            "$PY" -c "import oci; print('oci SDK', oci.__version__)"
            echo "PY=$PY" >> "$GITHUB_ENV"
            if [ ! -f "$HOME/.oci/config" ] && [ -d "$HOME/remote/.oci" ]; then cp -r "$HOME/remote/.oci" "$HOME/.oci"; echo "config copiat din ~/remote/.oci"; fi
              grep -E "^[A-Za-z]" "$HOME/.oci/config" | cut -c1-42 | head -6
            test -f "$HOME/.oci/config" || exit 4
          } 2>&1 | tee analysis/vm-setup.txt

      - name: ruleaza scripts/vmnew.py
        run: |
          mkdir -p analysis
          "$PY" scripts/vmnew.py 2>&1 | tail -40 | tee analysis/vm-run.txt

      - name: impinge verdictul (IP + parola intra in repo = alegi tu ce faci cu ele)
        if: always()
        run: |
          git config user.name "cuantic-bot"
          git config user.email "bot@cuantic.local"
          git add -f analysis/vm-instance.json analysis/vm-status.txt analysis/vm-run.txt analysis/vm-setup.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "vmnew: $(tr -d '\n' < analysis/vm-status.txt 2>/dev/null | head -c 180)" || true
          git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          git push -q origin "HEAD:$GITHUB_REF_NAME" >/dev/null 2>&1 || echo "nimic de impins"
          echo "===== verdict ====="; cat analysis/vm-status.txt 2>/dev/null || cat analysis/vm-setup.txt
