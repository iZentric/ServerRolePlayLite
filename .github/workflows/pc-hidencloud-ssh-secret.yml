name: Store existing HidenCloud PC key as GitHub Actions secret
# No private material in repository, workflow output, artifacts, or logs.
# Existing PC-side gh auth must independently have Actions Secrets permission;
# GITHUB_TOKEN with contents:read will NOT be promoted to admin access.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/pc-hidencloud-ssh-secret.yml
      - scripts/fc_pc_hidencloud_ssh_secret.ps1
permissions:
  contents: read
jobs:
  store-secret-if-authorized:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax before reading any key
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/fc_pc_hidencloud_ssh_secret.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw 'SSH_SECRET_SCRIPT_SYNTAX_FAILED' }
      - name: Store key through authenticated GitHub CLI if available; report status only
        shell: powershell
        run: |
          & ./scripts/fc_pc_hidencloud_ssh_secret.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
