name: FunCity vs both CatServers - same 18 RP+optimization mods
# One GitHub-hosted VM, Java 11, same frozen generated world, 6 plugins,
# FerriteCore+ModernFix+RoadRunner; ONLY engine JAR differs. No owner PC/live.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/engine-mods-ab.yml
      - scripts/fc_engine_mods_ab.py
      - scripts/fc_engine_mods_ab_test.py
permissions:
  contents: read
jobs:
  same-runner-abc:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Synthetic exact-swap and path-safety checks
        run: python3 scripts/fc_engine_mods_ab_test.py
      - name: SHA-pinned old content and both engines, hosted ephemeral only
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          mkdir -p "$root"
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" \
            -p functity-jare-toate.tar.gz -O "$root/engines.tar.gz"
          echo "f2cb921efbf751fa24534a9a02b57197db46294ca7b71d9711b04996bf6d1784  $root/engines.tar.gz" | sha256sum -c -
          python3 scripts/fc_plugin_first_extract.py "$root/engines.tar.gz" "$root/motor.jar"
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -O "$root/old-plugins.zip"
          echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  $root/old-plugins.zip" | sha256sum -c -
          gh release download 23.05.26-1 -R Luohuayu/CatServer \
            -p CatServer-1.16.5-1d8d6313-server.jar -O "$root/official.jar"
          echo "8edea98c597e7af44a45ef9093678c38ca3749d55a71cdff10218c1c6b946fd0  $root/official.jar" | sha256sum -c -
          gh release download v21.2 -R PlayPro/CoreProtect \
            -p CoreProtect-21.2.jar -O "$root/CoreProtect.jar"
          echo "04f31b609d1e3e1c53e99aaa06ca10ea6bdf5172c94bf5af8ccf108b0bc4b977  $root/CoreProtect.jar" | sha256sum -c -
          gh release download v21.0 -R google/guava \
            -p guava-21.0.jar -O "$root/guava-21.0.jar"
          echo "972139718abc8a4893fa78cba8cf7b2c903f35c97aaf44fa3031b0669948b480  $root/guava-21.0.jar" | sha256sum -c -
      - name: Full historical RP content + server optimizers, no world/players
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          python3 scripts/fc_modded_candidate.py --engine "$root/motor.jar" \
            --archive "$root/old-plugins.zip" --coreprotect "$root/CoreProtect.jar" \
            --guava21 "$root/guava-21.0.jar" --output "$root/stage" --server-optimizer-lab
      - name: Interleaved F/C/O/O/C/F - publish only after every trial succeeds
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          python3 scripts/fc_engine_mods_ab.py "$root" "$root/old-plugins.zip" "$root/official.jar"
