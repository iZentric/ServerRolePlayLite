name: PLAY ACUM — server pe Cloud Shell + adresa
on:
  push:
    paths: [ "deploy/play.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: play-cuantic
  cancel-in-progress: true
jobs:
  p:
    runs-on: [self-hosted]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/play.sh || true
