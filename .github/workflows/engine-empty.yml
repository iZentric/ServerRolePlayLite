# Patch exactly the May 2023 CatServer source running in production. CI ONLY.
name: ENGINE EMPTY HOPPER — minimal source patch vs live CatServer
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-empty.txt"]
permissions:
  contents: write
jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CATSERVER_REV: 1d8d63138be77a606df2a5e940b960065948f983
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Download exact live-source CatServer LGPL-3.0 and unchanged pack
        run: |
          set -euo pipefail
          mkdir -p engine-empty-results /tmp/cuantic-empty-source
          curl -fL --retry 3 --retry-delay 5 "https://codeload.github.com/Luohuayu/CatServer/tar.gz/$CATSERVER_REV" -o /tmp/empty-source.tgz
          tar -xzf /tmp/empty-source.tgz -C /tmp/cuantic-empty-source --strip-components=1
          gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -O /tmp/cuantic-current.zip
      - name: Patch source, compile standalone experimental JAR
        run: |
          set -euo pipefail
          python3 scripts/patch_catserver_empty_hopper.py /tmp/cuantic-empty-source
          cp /tmp/cuantic-empty-source/LICENSE engine-empty-results/CATSERVER-LICENSE.txt
          cd /tmp/cuantic-empty-source
          chmod +x gradlew
          sed -i -e 's/-XX:MaxPermSize=512m//g' -e 's/-Xmx3G/-Xmx5G/g' -e 's/org.gradle.parallel=true/org.gradle.parallel=false/' -e 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
          ./gradlew --no-daemon --no-parallel setup 2>&1 | tee "$GITHUB_WORKSPACE/engine-empty-results/build.log"
          cat >> build.gradle <<'EOF'
          project(':forge') {
              tasks.withType(JavaCompile).configureEach {
                  options.fork = true
                  options.forkOptions.memoryMaximumSize = '4g'
              }
          }
          EOF
          sed -i 's/-Xmx5G/-Xmx2G/g' gradle.properties
          ./gradlew --no-daemon --no-parallel --max-workers=1 buildCatServer 2>&1 | tee -a "$GITHUB_WORKSPACE/engine-empty-results/build.log"
      - name: Smoke with all 36 mods and 14 plugins
        run: |
          set -euo pipefail
          jar=$(find /tmp/cuantic-empty-source -type f -iname 'CatServer*server.jar' -size +5M | head -1)
          test -s "$jar"
          python3 scripts/brand_engine.py "$jar" engine-empty-results/CUANTIC-CatServer-empty-hopper.jar > engine-empty-results/brand.json
          sha256sum engine-empty-results/*.jar > engine-empty-results/SHA256SUMS.txt
          mkdir -p /tmp/cuantic-empty-smoke
          unzip -q /tmp/cuantic-current.zip -d /tmp/cuantic-empty-smoke
          cp engine-empty-results/CUANTIC-CatServer-empty-hopper.jar /tmp/cuantic-empty-smoke/CatServer-1.16.5-1d8d6313-server.jar
          python3 scripts/engine_lab.py /tmp/cuantic-empty-smoke engine-empty-results/smoke.log
      - name: ABBA 4 independent runs on same machine with 256 empty hoppers
        env: { CUANTIC_WORKLOAD: empty }
        run: python3 scripts/engine_current_compare.py /tmp/cuantic-current.zip engine-empty-results/CUANTIC-CatServer-empty-hopper.jar engine-empty-results/abba
      - name: Publish measurements only, NEVER experimental JAR as release
        if: always()
        run: |
          { echo '# ENGINE EMPTY HOPPER — minimal source patch to live CatServer, experimental only'; echo;
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            echo 'Base source: Luohuayu/CatServer 1d8d63138be77a606df2a5e940b960065948f983, LGPL-3.0. Patch: scripts/patch_catserver_empty_hopper.py.';
            echo 'No real player login, vehicles, or production change.'; echo;
            echo '## Smoke'; echo '```json'; cat engine-empty-results/smoke-result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
            echo '## A/B/B/A empty-hopper comparison'; echo '```json'; cat engine-empty-results/abba/result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
            echo '## Build tail'; echo '```'; tail -25 engine-empty-results/build.log 2>/dev/null || true; echo '```';
          } > docs/ENGINE-EMPTY-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-EMPTY-RESULT.md
          git commit -m 'engine empty: minimal source patch benchmark verdict' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Keep candidate as artifact only, expires in 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuantic-engine-empty-hopper-EXPERIMENTAL
          path: |
            engine-empty-results/CUANTIC-CatServer-empty-hopper.jar
            engine-empty-results/CATSERVER-LICENSE.txt
            engine-empty-results/SHA256SUMS.txt
            engine-empty-results/smoke-result.json
            engine-empty-results/abba/result.json
          retention-days: 7
