name: TRIBUNAL CUANTIC — toti hibrizii 1.16.5 de pe planeta
# Regula: acelasi set de 32 moduri + 9 pluginuri (zipul CUANTIC), DOAR jarul se schimba.
# Fingerprint obligatoriu: md5 + nume jar in log. Descarcare esuata = rand ROSU, nu fallback.
on:
  push:
    paths: [ "deploy/tribunal-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "TENET-MOHIST",   art: "maven" }
          - { id: "CATSERVER-OFICIAL", art: "ghurl", url: "https://github.com/Luohuayu/CatServer/releases/download/23.05.26-1/CatServer-1.16.5-1d8d6313-server.jar" }
          - { id: "CATSERVER-EVOKODE", art: "custom" }
          - { id: "ARCLIGHT-OFICIAL", art: "ghurl", url: "https://github.com/IzzelAliz/Arclight/releases/download/1.16%2F1.0.25/arclight-forge-1.16.5-1.0.25.jar" }
          - { id: "ARCLIGHT-CHATNAUT", art: "ghrel", repo: "Chatnaut/Arclight", ref: "latest" }
          - { id: "MIST-33",        art: "ghurl", url: "https://github.com/MinecraftMist/Mist/releases/download/1.16.5-33/mist-1.16.5-33-server.jar" }
          - { id: "MAGMA-1.16.5",   art: "magma" }
          - { id: "ARCLIGHT-CITY",  art: "exclus" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Monta baza CUANTIC (moduri+pluginuri identice) + jarul candidatului
        env:
          GH_TOKEN: ${{ github.token }}
          ART: ${{ matrix.art }}
          URL: ${{ matrix.url }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
        run: |
          set +e
          mkdir -p srv cand
          gh release download lite -R "$GITHUB_REPOSITORY" -p '*Server-CatServer*.zip' -O srv.zip
          (cd srv && unzip -q ../srv.zip)
          case "$ART" in
            custom)
              gh release download custom -R "$GITHUB_REPOSITORY" -p '*.jar' -O cand/cand.jar
              ;;
            ghurl)
              curl -sL --max-time 180 -o cand/cand.jar "$URL"
              ;;
            ghrel)
              gh release download "$REF" -R "$REPO" -p '*.jar' -O cand/cand.jar 2>/dev/null \
                || gh release download -R "$REPO" -p '*.jar' -O cand/cand.jar 2>/dev/null
              ;;
            maven)
              for A in Mohist-1.16.5 Tenet-1.16.5; do
                for BASE in https://maven.mohistmc.com/com/mohistmc https://repo.mohistmc.com/releases/com/mohistmc; do
                  MJ=$(curl -sL --max-time 30 "$BASE/$A/maven-metadata.xml" | grep -oE '<latest>[^<]+|<version>[^<]+' | tail -1 | sed -E "s/.*>//")
                  [ -n "$MJ" ] || continue
                  for SUFF in "-server" ""; do
                    curl -sL --max-time 240 -o cand/cand.jar "$BASE/$A/$MJ/$A$SUFF-$MJ.jar" 2>/dev/null
                    head -c2 cand/cand.jar 2>/dev/null | grep -q PK && { echo "$A $MJ (via $BASE)" > cand/cand.name; break 3; }
                  done
                done
              done
              # fallback: API-ul vechi al site-ului
              curl -sL --max-time 60 "https://mohistmc.com/api/1.16.5/mohist/latest" -o /tmp/mapi.json 2>/dev/null
              JU=$(python3 -c "import json;d=json.load(open('/tmp/mapi.json'));print(d.get('url') or (d.get('data') or {}).get('url',''))" 2>/dev/null)
              if [ -n "$JU" ]; then
                curl -sL --max-time 240 -o cand/cand.jar "$JU" && head -c2 cand/cand.jar | grep -q PK && echo "mohist API $JU" > cand/cand.name
              fi
              ;;
            magma)
              for G in magma magmaforge magma-forge; do
                for BASE in https://repo.magmafoundation.org/releases/org/magmafoundation https://maven.magmafoundation.org/releases/org/magmafoundation; do
                  MV=$(curl -sL --max-time 30 "$BASE/$G/maven-metadata.xml" | grep -oE "<version>[^<]*1\.16\.5[^<]*" | tail -1 | sed "s/<version>//")
                  [ -n "$MV" ] || continue
                  curl -sL --max-time 240 -o cand/cand.jar "$BASE/$G/$MV/$G-$MV.jar"
                  head -c2 cand/cand.jar 2>/dev/null | grep -q PK && { echo "magma $G $MV" > cand/cand.name; break 3; }
                done
              done
              ;;
            exclus)
              mkdir -p "$GITHUB_WORKSPACE/analysis/tribunal"
              { echo "# ${{ matrix.id }}"; echo "- ARTIFACT: n/a"; echo "- STATUS: **EXCLUS-DIN-OFICIU** (repo-ul e un MOD de oras pentru Arclight, nu un server hibrid — cercetat pe GitHub azi)"; echo "- DONE: NICIODATA"; } > "$GITHUB_WORKSPACE/analysis/tribunal/${{ matrix.id }}.md"
              exit 0
              ;;
          esac
          if head -c2 cand/cand.jar 2>/dev/null | grep -q PK && [ "$(stat -c%s cand/cand.jar)" -gt 500000 ]; then
            CJ=$(ls srv/*.jar 2>/dev/null | head -1)
            [ -n "$CJ" ] || CJ="srv/server.jar"
            cp cand/cand.jar "$CJ"
            [ -f cand/cand.name ] && cp cand/cand.name srv/CANDIDAT.txt
            echo "ARTIFACT-OK" > /tmp/gate
            md5sum "$CJ" | cut -d' ' -f1 > /tmp/md5
            stat -c%s "$CJ" > /tmp/size
          else
            echo "ARTIFACT-LIPSA" > /tmp/gate
            echo "$ART a picat: niciun jar valid descarcabil" > /tmp/md5
            echo "0" > /tmp/size
          fi
      - name: Porne-ste si masora (identic cu bancul functional — mkfifo fd3)
        run: |
          set +e
          if [ "$(cat /tmp/gate)" != "ARTIFACT-OK" ]; then
            mkdir -p "$GITHUB_WORKSPACE/analysis/tribunal"
            { echo "# ${{ matrix.id }}"; echo "- ARTIFACT: $(cat /tmp/md5)"; echo "- STATUS: ARTIFACT-LIPSA (niciun download valid din sursele oficiale)"; echo "- DONE: NICIODATA"; } > "$GITHUB_WORKSPACE/analysis/tribunal/${{ matrix.id }}.md"
            exit 0
          fi
          cd srv
          echo "eula=true" > eula.txt
          NumeCandidat=$(cat CANDIDAT.txt 2>/dev/null || echo "$URL")
          START=$(date +%s)
          mkfifo in
          exec 3<> in
          java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false @unix_args.txt < in > boot.log 2>&1 &
          JP=$!
          MAXRSS=0
          DONE=""
          for k in $(seq 1 100); do
            if ! kill -0 $JP 2>/dev/null; then break; fi
            RSS=$(ps -o rss= -p $JP 2>/dev/null | awk '{print int($1/1024)}')
            [ -n "$RSS" ] && [ "$RSS" -gt "$MAXRSS" ] && MAXRSS=$RSS
            if [ -z "$DONE" ] && grep -q "Done (" boot.log 2>/dev/null; then
              DONE=$(grep -m1 -oE "Done \([0-9.]+s\)" boot.log)
              T1=$(date +%s); DUR=$((T1-START))
              break
            fi
            sleep 5
          done
          [ -z "$DONE" ] && { kill -0 $JP 2>/dev/null && DONE="TIMEOUT" || DONE="CRAPAT"; }
          echo "stop" >&3 2>/dev/null; sleep 8
          kill -9 $JP 2>/dev/null
          PLGI=$(grep -cE "\]: \[[A-Za-z]+\] Enabling" boot.log)
          MODURI=$(grep -m1 -oE "[0-9]+ mods loaded|Mods: \[[0-9]+\]" boot.log | grep -oE "[0-9]+" | head -1)
          PROCE=$(grep -c "ERROR" boot.log)
          mkdir -p ../analysis/tribunal
          {
            echo "# ${{ matrix.id }}"
            echo "- ARTIFACT: \`$(cat /tmp/md5)\` ($(cat /tmp/size) bytes) — $NumeCandidat"
            echo "- STATUS: **$DONE** in ${DUR:-?}s"
            echo "- DONE: ${DONE:-NICIODATA} (RAM varf ${MAXRSS}MB, plugini ${PLGI:-0}, jar-mods ${MODURI:-?}, linii ERROR: ${PROCE:-0})"
            echo '```'
            grep -m4 -iE "mohist|tenet|arclight|catserver|mist|magma" boot.log | head -4
            echo "--- tail boot.log:"
            tail -12 boot.log
            echo '```'
          } > "../analysis/tribunal/${{ matrix.id }}.md"
          echo "verdict salvat local"
      - name: Verdictul calatoreste prin artefact (fara curse)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trib-${{ matrix.id }}
          path: analysis/tribunal/${{ matrix.id }}.md
          if-no-files-found: ignore
  tablou:
    needs: probe
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trib-*
          path: trib
          merge-multiple: true
      - name: Tabloul final CUANTIC
        run: |
          set +e
          {
            echo "# ⚛️ TABLOUL CUANTIC — tribunalul tuturor hibrizilor 1.16.5"
            echo "_Generat: $(date -u '+%F %T UTC') — baza comuna: 32 moduri + 9 pluginuri CUANTIC 1.5.6, Java 17, -Xmx identic, RAM = varf_ "
            echo
            echo "| Probă | Verdict | Done | RAM vârf | Plugini | Erori |"
            echo "|---|---|---|---|---|---|"
            for F in trib/*.md; do
              ID=$(basename "$F" .md)
              ST=$(grep -m1 "STATUS" "$F" | sed 's/.*STATUS: //;s/\*//g')
              DT=$(grep -m1 "DONE" "$F" | sed 's/.*DONE: //;s/ (.*//')
              EXTRA=$(grep -m1 "DONE" "$F" | grep -oE "RAM varf [0-9]+MB, plugini [0-9]+, jar-mods [0-9?]+, linii ERROR: [0-9]+" )
              echo "| $ID | $ST | $DT | $EXTRA |"
            done
            echo
            echo "Regula CUANTIC: castigatorul trebuie sa invinga campionul cu numere, altfel campionul ramane."
          } > docs/TRIBUNAL-CUANTIC.md
          cat docs/TRIBUNAL-CUANTIC.md
          git -c user.name=bot -c user.email=bot@bot add -f docs/TRIBUNAL-CUANTIC.md
          git -c user.name=bot -c user.email=bot@bot commit -m "tribunal: tabloul cuantic final" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
