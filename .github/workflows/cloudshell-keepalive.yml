name: cloudshell-keepalive
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
permissions:
  contents: write
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inimă pentru Cloud Shell (reset ceas de reclaim + trezire daca e jos)
        run: |
          set +e
          if [ -z "${{ secrets.CSH_KEY }}" ]; then echo "CSH_KEY secret absentin — keepalive inactiv (plan B ramas)"; echo "keepalive: INACTIV (fara cheie configurata)" > /tmp/hb.txt; exit 0; fi
          mkdir -p ~/.ssh && printf '%s' "${{ secrets.CSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # host+port le luam din secret-uri separate ca sa nu le tinem in fisier
          H="${{ secrets.CSH_HOST }}"; P="${{ secrets.CSH_PORT }}"
          [ -n "$H" ] || H=92.5.171.150
          [ -n "$P" ] || P=22
          R=$(ssh -i ~/.ssh/id -p "$P" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o BatchMode=yes "cloudshell@$H" 'echo ok; pgrep -fc "bash .*[/]c[.]sh" || echo 0')
          RC=$?
          if [ $RC -eq 0 ]; then echo "keepalive $(date -u '+%F %T UTC'): SUS ($R)"; echo "keepalive SUS | $R" > /tmp/hb.txt
          else echo "keepalive $(date -u '+%F %T UTC'): esec rc=$RC — verificare manuala"; echo "keepalive ESEC rc=$RC" > /tmp/hb.txt; fi
      - name: Marcaj in analysis/ALIVE-SSH.md
        run: |
          set +e
          git config user.name bot; git config user.email bot@arena.local
          { echo "# ALIVE-SSH — $(date -u '+%F %T UTC')"; echo; cat /tmp/hb.txt; } > analysis/ALIVE-SSH.md
          git add analysis/ALIVE-SSH.md && git commit -qm "keepalive: $(date -u +%H:%M)" || exit 0
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git push -q origin "HEAD:$GITHUB_REF_NAME" || true
