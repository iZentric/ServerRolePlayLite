name: pc-probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pc-probe.yml
permissions: {}
jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 2
    steps:
      - name: Verifica rapid PC-ul si serverul local
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $client = Join-Path $env:APPDATA 'PrismLauncher\instances\FunCity\minecraft\mods'
          Write-Host "PC runner: $env:COMPUTERNAME; cont: $env:USERNAME"
          Write-Host "Server b1.0827: $(Test-Path (Join-Path $server 'FunCityEngine.jar'))"
          Write-Host "Prism FunCity: $(Test-Path $client); Clumps: $(Test-Path (Join-Path $client 'Clumps-6.0.0.28.jar'))"
          foreach ($port in @(25565, 25575)) {
            $tcp = New-Object Net.Sockets.TcpClient
            $open = $false
            try {
              $attempt = $tcp.BeginConnect('127.0.0.1', $port, $null, $null)
              if ($attempt.AsyncWaitHandle.WaitOne(1000)) {
                $tcp.EndConnect($attempt)
                $open = $true
              }
            } catch { } finally { $tcp.Close() }
            Write-Host "127.0.0.1:${port} deschis: $open"
          }
          # Portul RCON deschis nu demonstreaza autentificarea; nu citim sau afisam parola.
