an1:
  change-interval: 8000
  texts:
  - "&7ɪɴᴛʀᴀ ᴘᴇ ᴅɪꜱᴄᴏʀᴅᴜʟ ɴᴏꜱᴛʀᴜ &6ᴅꜱᴄ.ɢɢ/ᴠɪʙᴇʀᴏ"
  - "&7ᴀʀᴜɴᴄᴀ ᴜɴ ᴏᴄʜɪ ʟᴀ ꜱᴇᴄᴛɪᴜɴᴇᴀ ꜱʜᴏᴘ ᴘᴇ ꜱᴇʀᴠᴇʀᴜʟ ᴅᴇ ᴅɪꜱᴄᴏʀᴅ!"
  - "&7ʀᴇꜱᴘᴇᴄᴛᴀ ʀᴇɢᴜʟᴀᴍᴇɴᴛᴜʟ ꜱᴇʀᴠᴇʀᴜʟᴜɪ ᴘᴇɴᴛʀᴜ ᴀ ᴇᴠɪᴛᴀ ꜱᴀɴᴄᴛɪᴜɴɪʟᴇ ."
