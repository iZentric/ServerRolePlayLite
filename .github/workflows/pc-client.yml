name: pc-client
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pc-client.yml
jobs:
  ck:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Client gameplay plus performanta activa
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = @("PC client $(Get-Date -Format s)")
          foreach ($name in @('FunCity', 'CUANTIC-Client-1.7.7')) {
            $mods = Join-Path $env:APPDATA ('PrismLauncher\instances\' + $name + '\minecraft\mods')
            if (-not (Test-Path $mods)) { $report += "$name : fara mods"; continue }
            $changed = @()
            foreach ($file in @(Get-ChildItem -LiteralPath $mods -Filter '*.jar' -File)) {
              if ($file.Name -notmatch '^(dynamic[-_]?fps|TextruesRubidiumOptions)') { continue }
              try {
                Rename-Item -LiteralPath $file.FullName -NewName ($file.Name + '.disabled') -ErrorAction Stop
                $changed += $file.Name
              } catch { $report += "EROARE $name : $($file.Name) : $($_.Exception.Message)" }
            }
            $restored = @()
            foreach ($file in @(Get-ChildItem -LiteralPath $mods -Filter '*.jar.disabled' -File)) {
              if ($file.Name -notmatch '^(lazydfu|oculus)') { continue }
              $original = $file.Name -replace '\.disabled$', ''
              if (Test-Path (Join-Path $mods $original)) { continue }
              try {
                Rename-Item -LiteralPath $file.FullName -NewName $original -ErrorAction Stop
                $restored += $original
              } catch { $report += "EROARE restabilire $name : $($file.Name) : $($_.Exception.Message)" }
            }
            $left = @(Get-ChildItem -LiteralPath $mods -Filter '*.jar' -File)
            $report += "$name : active=$($left.Count) restabilite=[$($restored -join ', ')] dezactivate=[$($changed -join ', ')]"
            $report += "lista: $(($left | ForEach-Object { $_.Name } | Sort-Object) -join ', ')"
          }
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $jar = Test-Path (Join-Path $server 'FunCityEngine.jar')
          $serverMods = @(Get-ChildItem -Path (Join-Path $server 'mods') -Filter '*.jar' -ErrorAction SilentlyContinue).Count
          $report += "server: jar=$jar mods=$serverMods"
          $text = $report -join "`n"
          Write-Host $text
          $base = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/diag/pc-client.txt'
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'FunCity' }
          $body = @{ message = 'pc client cleanup'; branch = $env:GITHUB_REF_NAME; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text)) }
          $url = $base + '?ref=' + [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          for ($attempt = 0; $attempt -lt 2; $attempt++) {
            try {
              $body.sha = (Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop).sha
              Invoke-RestMethod -Method Put -Uri $base -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
              Write-Host 'Raport PC incarcat'
              break
            } catch { Write-Host "Raport nereusit: $($_.Exception.Message)"; if ($attempt -eq 1) { exit 1 } }
          }
