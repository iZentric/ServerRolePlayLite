name: ENGINE PROFILE — analyze published CPU sample
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["scripts/engine_profile_analyze.py", ".github/workflows/engine-profile-analyze.yml"]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Summarize published Spark profile (no access to live server)
        run: |
          python3 scripts/engine_profile_analyze.py docs/ENGINE-PROFILE-ANALYSIS.md
          cat docs/ENGINE-PROFILE-ANALYSIS.md
      - name: Commit sanitized method summary only
        run: |
          git config user.name cuantic-bot
          git config user.email bot@users.noreply.github.com
          git add docs/ENGINE-PROFILE-ANALYSIS.md
          git commit -m 'engine: publish summarized Spark method weights' || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
