name: WHY-400
on:
  push:
    paths: [ "deploy/why.txt" ]
permissions:
  contents: write
jobs:
  citeste:
    runs-on: [self-hosted]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: citire log + limite a1
        run: |
          set +e
          TEN=ocid1.tenancy.oc1..aaaaaaaanlzitmrgwn5f3g3iyapyiuxt2ayh43u6mdq3nszvcswrkcw5eyfa
          AD=$(oci iam availability-domain list --compartment-id "$TEN" --output json 2>/dev/null | jq -r '.data[0].name')
          {
            echo "# WHY-400"
            echo "## capul erorii de launch:"
            echo '```'
            head -14 /tmp/a1-launch.log 2>/dev/null
            echo '```'
            echo "## limite A1 (free):"
            for L in compute-a1-standard-count-allow-list-free compute-a1-standard-ocpu-count-allow-list-free compute-a1-standard-memory-allow-list-free; do
              echo "- $L: avail=$(oci limits resource-availability get --service-name compute --limit-name $L --compartment-id $TEN --availability-domain "$AD" --output json 2>/dev/null | jq -r '.data.availableValue // "?"') actual=$(oci limits resource-availability get --service-name compute --limit-name $L --compartment-id $TEN --availability-domain "$AD" --output json 2>/dev/null | jq -r '.data["actualValue"] // "?"')"
            done
          } > analysis/why400.md
          cat analysis/why400.md
          git config user.name why-bot; git config user.email bot@arena.local
          git add -f analysis/why400.md; git commit -m why || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
