name: PC Lite LazyDFU and safe obsolete Lab cleanup
# After Minecraft closes: preserve one LowSpec profile, add verified LazyDFU in
# place, remove only two exact untouched labs we created. Never touch user worlds
# or EGK / V RP / Fabuliso profiles. Raw game logs stay on the PC.
on:
  push:
    branches:
      - arena/9bbcb24f-serverroleplaylite
    paths:
      - .github/workflows/pc-low-spec-triage.yml
      - scripts/fc_pc_lowspec_cleanup.py
      - scripts/fc_pc_lowspec_cleanup_test.py
      - scripts/fc_pc_lowspec_lazy.py
      - scripts/fc_pc_lowspec_lazy_test.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triage:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect only the three Lab profiles and known warning markers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Note([string]$title,[string]$value) {
            $safe = $value -replace '[^A-Za-z0-9 ._+=:|,-]','_'
            Write-Output ('::notice title=' + $title + '::' + $safe.Substring(0,[Math]::Min(700,$safe.Length)))
          }
          $root = Join-Path $env:APPDATA 'PrismLauncher\instances'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'Prism root not visible; no changes' }
          $labels = @{
            zero='FunCity-Lite-PluginFirst-LAB-1.16.5';
            content='FunCity-Lite-Content-LAB-1.16.5';
            lowspec='FunCity-Lite-LowSpec-LAB-1.16.5'
          }
          foreach ($label in @('zero','content','lowspec')) {
            $profile = Join-Path $root $labels[$label]
            if (-not (Test-Path -LiteralPath $profile -PathType Container)) {
              Note ($label + ' profile') 'ABSENT'
              continue
            }
            $mc = Join-Path $profile '.minecraft'
            $mods = Join-Path $mc 'mods'
            $names = if (Test-Path -LiteralPath $mods -PathType Container) {
              @(Get-ChildItem -LiteralPath $mods -File -Filter '*.jar' | ForEach-Object Name)
            } else { @() }
            $worlds = if (Test-Path -LiteralPath (Join-Path $mc 'saves') -PathType Container) {
              @(Get-ChildItem -LiteralPath (Join-Path $mc 'saves') -Force).Count
            } else { 0 }
            $screenshots = if (Test-Path -LiteralPath (Join-Path $mc 'screenshots') -PathType Container) {
              @(Get-ChildItem -LiteralPath (Join-Path $mc 'screenshots') -Force).Count
            } else { 0 }
            $userFiles = @('servers.dat','servers.dat_old','usercache.json') | Where-Object {
              Test-Path -LiteralPath (Join-Path $mc $_)
            }
            Note ($label + ' inventory') ('mods=' + $names.Count + '|world_entries=' + $worlds +
              '|screenshots=' + $screenshots + '|user_files=' + $userFiles.Count)
            if ($label -eq 'lowspec') {
              Note 'LowSpec LazyDFU' ([string]($names -contains 'lazydfu-0.1.3.jar'))
              $log = Join-Path $mc 'logs\latest.log'
              if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
                Note 'LowSpec latest log' 'ABSENT'
              } else {
                # Read locally; expose only fixed marker booleans, NEVER raw log lines.
                $lines = @(Get-Content -LiteralPath $log -Tail 1800 -ErrorAction Stop)
                $text = $lines -join "`n"
                Note 'LowSpec log markers' ('present=true|lazy_warning=' + [bool]($text -match 'LazyDFU is not installed') +
                  '|fatal=' + [bool]($text -match '(?i)\bFATAL\b|Mod Loading has failed') +
                  '|mixin_error=' + [bool]($text -match '(?i)Mixin apply failed|MixinTransformerError') +
                  '|missing_dep=' + [bool]($text -match '(?i)requires.*(not present|missing)|missing mandatory dependencies') +
                  '|java_exception=' + [bool]($text -match 'Exception in thread|NoSuchMethodError') +
                  '|main_menu=' + [bool]($text -match '(?i)Sound engine started|OpenAL initialized'))
              }
            }
          }
          $live = @(Get-CimInstance Win32_Process -Filter "name = 'java.exe' OR name = 'javaw.exe'")
          Note 'Running Java processes' ([string]$live.Count)
          $sourceCount = 0
          foreach ($profile in @(Get-ChildItem -LiteralPath $root -Directory | Where-Object {
            $_.Name -like '*FunCity*' -and $_.Name -notlike '*LAB*' })) {
            foreach ($rel in @('.minecraft\mods', 'minecraft\mods')) {
              $candidate = Join-Path $profile.FullName $rel
              if (Test-Path -LiteralPath (Join-Path $candidate 'lazydfu-0.1.3.jar') -PathType Leaf) {
                $sourceCount++
              }
            }
          }
          Note 'LazyDFU old profile sources' ([string]$sourceCount)
          $temps = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -match '^fc-(plugin-first|modded)-PC-[0-9]+$' })
          Note 'Runner temporary lab folders' ([string]$temps.Count)
          Write-Output '::notice title=PC triage inspection::no_world_or_profile_or_server_modified_by_inspection=true'
      - name: Remove ONLY untouched obsolete profiles after Minecraft closes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $live = @(Get-CimInstance Win32_Process -Filter "name = 'java.exe' OR name = 'javaw.exe'")
          if ($live.Count -gt 0) {
            Write-Output '::notice title=PC safe cleanup::SKIPPED because Java/Minecraft is running; close the game first'
            exit 0
          }
          python scripts/fc_pc_lowspec_cleanup_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup safety fixture failed; no PC profiles changed' }
          $root = Join-Path $env:APPDATA 'PrismLauncher\instances'
          python scripts/fc_pc_lowspec_cleanup.py --instances $root --apply
          if ($LASTEXITCODE -ne 0) { throw 'Lab cleanup refused' }
          Write-Output '::notice title=PC safe cleanup::only pristine generated zero/content LAB profiles removed if eligible; LowSpec and all user profiles preserved'
          python scripts/fc_pc_lowspec_lazy_test.py
          if ($LASTEXITCODE -ne 0) { throw 'LazyDFU safety fixture failed; no LowSpec changes' }
          python scripts/fc_pc_lowspec_lazy.py --instances $root --apply
          if ($LASTEXITCODE -ne 0) { throw 'LazyDFU LowSpec addition refused; inspect source/manifest, do not create another profile' }
          Write-Output '::notice title=PC LowSpec LazyDFU::in-place verified from old FunCity source; no new Prism instance; EGK VRP Fabuliso untouched'
      - name: Verify exactly one new FunCity Lite profile remains
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:APPDATA 'PrismLauncher\instances'
          $zero = Test-Path -LiteralPath (Join-Path $root 'FunCity-Lite-PluginFirst-LAB-1.16.5')
          $content = Test-Path -LiteralPath (Join-Path $root 'FunCity-Lite-Content-LAB-1.16.5')
          $low = Join-Path $root 'FunCity-Lite-LowSpec-LAB-1.16.5'
          if (-not (Test-Path -LiteralPath $low -PathType Container)) { throw 'LowSpec profile missing' }
          $manifest = Get-Content -LiteralPath (Join-Path $low 'LAB-MANIFEST.json') -Raw | ConvertFrom-Json
          $lazy = Join-Path $low '.minecraft\mods\lazydfu-0.1.3.jar'
          $hash = if (Test-Path -LiteralPath $lazy -PathType Leaf) { (Get-FileHash -LiteralPath $lazy -Algorithm SHA256).Hash.ToLowerInvariant() } else { '' }
          $recorded = [string]($manifest.jar_sha256.PSObject.Properties['lazydfu-0.1.3.jar'].Value)
          $count = @(Get-ChildItem -LiteralPath (Join-Path $low '.minecraft\mods') -File -Filter '*.jar').Count
          $otherNames = @((Get-ChildItem -LiteralPath $root -Directory).Name)
          $egk = @($otherNames | Where-Object { $_ -match '(?i)egk' }).Count
          $vrp = @($otherNames | Where-Object { $_ -match '(?i)v[ _-]?rp' }).Count
          $fabuliso = @($otherNames | Where-Object { $_ -match '(?i)fabuliso' }).Count
          Write-Output ('::notice title=PC Prism cleanup verification::old_zero_present=' + $zero + ' old_content_present=' + $content +
            ' low_spec_present=true low_spec_mods=' + $count + ' lazy_sha_matches_manifest=' + [bool]($hash -and $hash -eq $recorded) +
            ' EGK_count=' + $egk + ' V_RP_count=' + $vrp + ' Fabuliso_count=' + $fabuliso)
          if ($count -ne 15 -or -not $hash -or $hash -ne $recorded) { throw 'LowSpec LazyDFU verification failed' }
