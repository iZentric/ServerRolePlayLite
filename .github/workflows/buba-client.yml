name: Buba client (de ce-i respins)
on:
  workflow_dispatch: {}
  push:
    paths: [ "deploy/buba-trigger.txt" ]
permissions:
  contents: write
env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: "2022"
  SFTP_USER: 15254.1388b9af
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Trage latest.log si cauta rejecțiile
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          mkdir -p run
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get logs/latest.log -o run/latest.log;
            bye"
          {
            echo "# BUBA CLIENT — $(date -u '+%F %T UTC')"
            echo
            echo "## Rejectii handshake (cu 2 linii in jur)"
            echo '```'
            grep -niE -B1 -A2 "rejected|synchroniz|synchroni|mismatch|missing|extra|version number|channel" run/latest.log | tail -60
            echo '```'
            echo "## Moduri incarcate de server (nume + versiuni din log)"
            echo '```'
            grep -oiE "[A-Za-z0-9_.-]+ [0-9]+\.[0-9][^ ]* \(=[^)]*\)" run/latest.log | sort -u | head -50
            echo "## Forge afisat la boot:"
            grep -iE "forge|mohist|catserver|arclight" run/latest.log | head -6
            echo '```'
          } > analysis/buba-client.md
          wc -c analysis/buba-client.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/buba-client.md
          git commit -m "analysis: buba client — rejectii de handshake" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push || true
          exit 0
