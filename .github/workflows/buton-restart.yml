name: buton-restart

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/restart-trigger.txt"

permissions:
  contents: write

jobs:
  buton:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Discriminator token + vanatoare rute + cookie-uri Next
        run: |
          set +e
          mkdir -p /tmp/zt analysis
          T="REDACTED_PANEL_TOKEN"
          echo "| HTTP | USA | AUTH | RASPUNS |" > /tmp/zt/r.md
          echo "|---|---|---|---|" >> /tmp/zt/r.md
          hit () {
            CODE=$(curl -s -o /tmp/zt/resp.txt -w "%{http_code}" -X "$1" "$2" \
              -H "$3" -H "Accept: application/json" ${4:+-H "$4"} ${5:+-d "$5"} --max-time 20)
            BODY=$(head -c 220 /tmp/zt/resp.txt | tr -d '\n')
            echo "| $CODE | $1 $2 | ${3:0:45} | $BODY" >> /tmp/zt/r.md
            echo "$CODE $1 $2 [${3:0:35}] -> $BODY"
          }
          echo "== DISCRIMINATOR: /health cu token-bun vs gunoi =="
          hit GET "https://api.zampto.net/health" "Authorization: Bearer $T"
          hit GET "https://api.zampto.net/health" "Authorization: Bearer gunoi-gunos-12345"
          echo "== RUTE cu Bearer (daca tokenul e bun, vreuna raspunde) =="
          for P in "/servers" "/servers/17192" "/servers/17192/power" "/servers/17192/state" \
                   "/servers/17192/status" "/servers/17192/restart" "/servers/1388b9af/power" \
                   "/servers/15254.1388b9af/power" "/server/17192/power" "/power/17192" \
                   "/servers/17192/command" "/servers/17192/actions" ; do
            hit GET "https://api.zampto.net$P" "Authorization: Bearer $T"
          done
          echo "== POST power cu Bearer pe toate formele =="
          for P in "/servers/17192/power" "/servers/17192/restart" "/server/17192/power" "/power" ; do
            hit POST "https://api.zampto.net$P" "Authorization: Bearer $T" "Content-Type: application/json" '{"signal":"restart"}'
          done
          echo "== COOKIE-URI Next.js pe dash /api/servers =="
          for C in "next-auth.session-token=$T" "authjs.session-token=$T" "__Secure-next-auth.session-token=$T" \
                   "token=$T" "auth=$T" "session_token=$T" "zamptonet_session=$T" "connect.sid=$T"; do
            hit GET "https://dash.zampto.net/api/servers" "Cookie: $C"
          done
          cp /tmp/zt/r.md analysis/restart-usi.md
          exit 0

      - name: O SINGURA bataie SFTP (fail2ban) — parola noua
        env:
          P_NOU: "REDACTED_PANEL_TOKEN"
        run: |
          set +e
          sudo apt-get install -y -qq lftp 2>/dev/null
          lftp -u "15254.1388b9af","$P_NOU" "sftp://node12.zampto.net:2022" -e "
            set sftp:auto-confirm yes; set net:timeout 25;
            echo BATAIE-UNICA-REUSITA;
            cls -l mods/ | grep -i pause && echo INCA-PE-DISC || echo STERS-DE-PE-DISC;
            cls -l world/level.dat;
            get logs/latest.log -o /tmp/zt/ultimul.log || echo NOLOG;
            bye
          " > /tmp/zt/sftp-unic.txt 2>&1
          cat /tmp/zt/sftp-unic.txt
          { echo; echo "## SFTP bataie unica"; cat /tmp/zt/sftp-unic.txt; } >> analysis/restart-usi.md
          if [ -f /tmp/zt/ultimul.log ]; then echo "## LOG LIVE (coada)"; tail -8 /tmp/zt/ultimul.log >> analysis/restart-usi.md; fi
          exit 0

      - name: Comita
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/restart-usi.md 2>/dev/null || true
          git commit -m "analysis: discriminator token + rute + bataie SFTP" || echo "nimic"
          git pull --rebase -X ours origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
