name: MIST-LAB
on:
  push:
    paths: ["deploy/mist-trigger.txt"]
permissions:
  contents: write
jobs:
  mist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - name: Pregateste pacientul
        run: |
          gh release download lite -R ${{ github.repository }} -p '*Server-Mist*.zip' -O srv.zip
          mkdir srv && cd srv && unzip -q ../srv.zip
          echo "eula=true" > eula.txt
          # ARMA 1+3: piesa de Java vindecata + registrul de amprente rescris
          curl -sL -o /tmp/ml.jar https://maven.minecraftforge.net/cpw/mods/modlauncher/8.1.3/modlauncher-8.1.3.jar
          M5=$(md5sum /tmp/ml.jar | cut -d' ' -f1); SZ=$(stat -c%s /tmp/ml.jar)
          MJ=$(ls mist-*.jar | head -1)
          unzip -Z1 "$MJ" | grep -viE '\.class$|\.jar$|^META-INF/' > /tmp/entries.txt || true
          : > /tmp/found.txt
          while read -r f; do
            unzip -p "$MJ" "$f" 2>/dev/null | grep -q "modlauncher-8.0.9" && echo "$f" >> /tmp/found.txt || true
          done < /tmp/entries.txt
          while read -r r; do
            mkdir -p "/tmp/fix/$(dirname "$r")"
            unzip -p "$MJ" "$r" > "/tmp/fix/$r"
            sed -i -E "/modlauncher-8\.0\.9/ s/[0-9a-fA-F]{32}/$M5/g; /modlauncher-8\.0\.9/ s/\b[0-9]{5,9}\b/$SZ/g" "/tmp/fix/$r"
            (cd /tmp/fix && zip -q "$GITHUB_WORKSPACE/srv/$MJ" "$r")
          done < /tmp/found.txt
          zip -dq "$MJ" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          mkdir -p libraries/cpw/mods/modlauncher/8.0.9
          cp /tmp/ml.jar libraries/cpw/mods/modlauncher/8.0.9/modlauncher-8.0.9.jar
          # ARMA 2: telefonul taiat
          mkdir -p mohist-config && printf 'check_update: false\n' > mohist-config/mohist.yml
          # ARMA 4: pasapoartele modurilor
          for j in mods/*.jar; do
            if unzip -p "$j" META-INF/mods.toml 2>/dev/null | grep -q 'versionRange="\[36\.2\.[1-9]'; then
              rm -rf /tmp/mt && mkdir -p /tmp/mt/META-INF
              unzip -p "$j" META-INF/mods.toml > /tmp/mt/META-INF/mods.toml
              sed -i -E 's/versionRange="\[36\.2\.[0-9]+/versionRange="[36.2.0/g' /tmp/mt/META-INF/mods.toml
              (cd /tmp/mt && zip -q "$GITHUB_WORKSPACE/srv/$j" META-INF/mods.toml)
            fi
          done
          # ARMA 5 (runda 1): DEZBRACAT de toate modurile-mixin de performanta
          # (Mist are peticele Paper native - compenseaza; le reinarmam pe rand daca traieste)
          rm -fv mods/RoadRunner*.jar mods/FastWorkbench*.jar mods/FastFurnace*.jar \
                 mods/fastsuite*.jar mods/Placebo*.jar mods/saturn*.jar mods/smooth*.jar mods/Smooth* \
                 mods/ksyxis*.jar mods/Ksyxis* mods/connectivity*.jar mods/Connectivity* \
                 mods/memoryleakfix*.jar mods/modernfix*.jar mods/ferritecore*.jar mods/lazydfu*.jar \
                 mods/clumps*.jar mods/Clumps* 2>/dev/null || true
          ls mods/ | head -40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: BOOT 0-100
        run: |
          cd srv
          START=$(date +%s)
          mkfifo in; exec 3<> in
          java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false -jar $(ls mist-*.jar | head -1) nogui < in > boot.log 2>&1 &
          JPID=$!
          STATUS=ZOMBIE
          for i in $(seq 1 150); do
            sleep 10
            if ! kill -0 $JPID 2>/dev/null; then STATUS=CRAPAT; break; fi
            if grep -q 'Done (' boot.log; then STATUS=PORNIT; break; fi
          done
          T=$(( $(date +%s) - START ))
          RAM=$(ps -o rss= -p $JPID 2>/dev/null | awk '{printf "%d", $1/1024}' || echo n/a)
          [ "$STATUS" = "ZOMBIE" ] && STATUS=TIMEOUT
          echo stop >&3 || true; sleep 15; kill -9 $JPID 2>/dev/null || true
          mkdir -p ../analysis
          { echo "# MIST-LAB runda-dezbracat ($(date -u))"
            echo "- REZULTAT: **$STATUS** in ${T}s | RAM: **${RAM}MB**"
            grep -m1 'Done (' boot.log | sed 's/^/    /' || true
            echo "- Erori cheie:"
            grep -iE "FATAL|ERROR|Exception|Caused by" boot.log | sort | uniq -c | sort -rn | head -12 | sed 's/^/    /' || true
          } > ../analysis/mist-lab.md
          tail -150 boot.log > ../analysis/mist-lab-tail.log
          cat ../analysis/mist-lab.md
      - name: Publica
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          for t in 1 2 3 4 5; do
            git add analysis/ || true
            git commit -m "mist-lab verdict" || true
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((RANDOM % 10 + 2))
          done
