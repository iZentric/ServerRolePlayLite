name: FunCity Lite published-asset audit
# Hosted runner only. Reads the existing release; produces no download artifact,
# release, JAR, PC action, server action or deployment.
on:
  push:
    branches:
      - arena/9bbcb24f-serverroleplaylite
    paths:
      - '.github/workflows/lite-asset-audit.yml'
      - 'scripts/fc_lite_repack.py'
      - 'scripts/fc_mrpack_audit.py'
      - 'agent/DECIZII.md'
      - 'agent/voicechat-1.16.5-2.3.23.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentic old release and inspect source names
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/fc-asset"
          gh release download funcity -R "$GITHUB_REPOSITORY" \
            -p FunCity-1.2.5.mrpack -D "$RUNNER_TEMP/fc-asset"
          pack="$RUNNER_TEMP/fc-asset/FunCity-1.2.5.mrpack"
          printf '%s  %s\n' 'cd9c8ddeaff2e02e009934d7a35eba14b1b5a2bc919797ad7a0ab2a92bc5fb47' "$pack" | sha256sum -c -
          python3 scripts/fc_mrpack_audit.py "$pack" --historical diag/pc-client.txt \
            > "$RUNNER_TEMP/fc-asset/baseline.json"
          cat "$RUNNER_TEMP/fc-asset/baseline.json"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'fc-asset/FunCity-1.2.5.mrpack'
          with zipfile.ZipFile(p) as z:
              files=set(z.namelist())
              if {'pack.png','overrides/pack.png'} <= files:
                  match=hashlib.sha256(z.read('pack.png')).digest()==hashlib.sha256(z.read('overrides/pack.png')).digest()
                  print('::notice file=agent/BETA-LITE.md,line=1,title=Icon duplication::'
                        f'root_equals_override={str(match).lower()}')
              big=sorted((i for i in z.infolist() if not i.is_dir()),
                         key=lambda i:i.compress_size,reverse=True)[:10]
              for i in big:
                  if any(c in i.filename for c in ('\\n','\\r','::')):
                      raise SystemExit('unsafe archive name for annotation')
                  print('::notice file=agent/BETA-LITE.md,line=1,title=Large pack entry::'
                        f'{i.filename} compressed_bytes={i.compress_size}')
          PY
      - name: Verify old server voice JAR against pinned client metadata
        run: |
          set -Eeuo pipefail
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -D "$RUNNER_TEMP/fc-asset"
          server="$RUNNER_TEMP/fc-asset/CUANTIC-Server-CatServer-1.7.7.zip"
          printf '%s  %s\n' fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15 "$server" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'fc-asset'
          meta=json.loads(Path('agent/voicechat-1.16.5-2.3.23.json').read_text())
          with zipfile.ZipFile(root/'CUANTIC-Server-CatServer-1.7.7.zip') as z:
              matches=[i for i in z.infolist() if not i.is_dir() and
                       i.filename.split('/')[-1]==meta['filename']]
              print('::notice file=agent/RP-EVIDENCE.md,line=1,title=Voice archive count::'
                    f'{len(matches)} entry/entries with expected filename')
              assert len(matches)==1, 'voice JAR missing or ambiguous in historical server'
              data=z.read(matches[0])
          h1=hashlib.sha1(data).hexdigest()
          h512=hashlib.sha512(data).hexdigest()
          print('::notice file=agent/RP-EVIDENCE.md,line=1,title=Voice binary comparison::'
                f'archive_bytes={len(data)} official_bytes={meta["size"]} '
                f'sha1_matches={h1==meta["sha1"]} sha512_matches={h512==meta["sha512"]} '
                f'archive_sha1={h1}')
          assert len(data)==meta['size'] and h1==meta['sha1'] and h512==meta['sha512']
          print('::notice file=agent/RP-EVIDENCE.md,line=1,title=Verified server voice::'
                f"name={meta['filename']} bytes={len(data)} hashes_equal_official=true")
          PY
      - name: Build local, non-distributed candidate and audit 24-mod target
        run: |
          set -Eeuo pipefail
          pack="$RUNNER_TEMP/fc-asset/FunCity-1.2.5.mrpack"
          target="$RUNNER_TEMP/fc-asset/FunCity-Lite-Beta-candidate.mrpack"
          python3 scripts/fc_lite_repack.py "$pack" \
            --source-sha256 cd9c8ddeaff2e02e009934d7a35eba14b1b5a2bc919797ad7a0ab2a92bc5fb47 \
            --output "$target" > "$RUNNER_TEMP/fc-asset/candidate.json"
          python3 scripts/fc_mrpack_audit.py "$target" > "$RUNNER_TEMP/fc-asset/candidate-audit.json"
          cat "$RUNNER_TEMP/fc-asset/candidate.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'fc-asset'
          a=json.loads((root/'candidate-audit.json').read_text())
          b=json.loads((root/'baseline.json').read_text())
          c=json.loads((root/'candidate.json').read_text())
          assert b['client_mod_count']==25 and a['client_mod_count']==24
          assert a['remote_files_without_declared_size']==0
          summary=Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text('## Structural only; NO Prism/Forge login or FPS test\n'
                             f"Source: {b['archive_bytes']} bytes / 25 mods; "
                             f"candidate: {a['archive_bytes']} bytes / 24 mods (voice RP).\n"
                             f"Remote downloads declared: {a['remote_download_bytes_declared']} bytes; "
                             f"candidate SHA256: `{c['output_sha256']}`.\n")
          print('::notice file=agent/BETA-LITE.md,line=1,title=Lite ZIP metadata::'
                f"old_bytes={b['archive_bytes']} new_bytes={a['archive_bytes']} "
                f"remote_bytes={a['remote_download_bytes_declared']} "
                f"new_sha256={c['output_sha256']} source_sha256={c['source_sha256']}")
          PY
