name: Freeroam original — read-only target inventory
# No Prism launch, server start, JAR upload, artifact, world, account or log read.
# A branch push only asks the self-hosted Windows runner for an inventory verdict.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/pc-freeroam-inventory.yml
      - scripts/fc_freeroam_target_preflight.py
      - scripts/fc_freeroam_target_preflight_test.py
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic read-only inventory safety tests
        run: |
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 scripts/fc_freeroam_inventory_test.py
          PYTHONPATH=scripts PYTHONDONTWRITEBYTECODE=1 python3 scripts/fc_freeroam_target_preflight_test.py
  read-only-pc:
    needs: guards
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check only the owner-selected Freeroam profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          python scripts/fc_freeroam_target_preflight.py `
            --profile 'C:\Users\Administrator\AppData\Roaming\PrismLauncher\instances\Freeroam 1.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
