## name: RP-LITE
# Ruleaza EXCLUSIV pe runnerul self-hosted ARM64: identifica masina si, daca e Cloud Shell, executa cmd.sh (curatenie+server).
on:
  push:
    paths: [ .github/workflows/rp-lite.yml ]
  workflow_dispatch:
jobs:
  lite:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 14
    permissions: contents: write
    steps:
      - uses: actions/checkout@v4
      - name: identitate + executie
        run: |
          {
            echo "# RP-LITE $(date -u '+%F %T UTC')"
            echo "hostname: $(hostname 2>/dev/null || cat /etc/hostname 2>/dev/null || echo ?)"
            echo "user: $(whoami) | arch: $(uname -m)"
            echo "home: $(ls ~ | tr '\n' ' ' | head -c 300)"
            echo "cuantic-live: $([ -d ~/cuantic-live ] && echo DA-BOXA || echo NU)"
            echo "srpl-claie: $([ -d ~/srpl-claie ] && echo DA-CLOUDSHELL || echo NU)"
            if [ -d ~/srpl-claie ] || { [ ! -d ~/cuantic-live ] && [ "$(whoami)" = "mndvasi9" ]; }; then
              echo "=== doar identitate (claia executa) ==="
            else
              echo "=== ACEASTA E BOXA DE PRODUCTIE - NU EXECUT NIMIC, doar inventar ==="
              ls ~/cuantic-live | head -8
            fi
          } > REPORT.txt 2>&1
      - name: push report
        run: |
          git config user.email bot@arena && git config user.name arena
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          mkdir -p analysis && cp REPORT.txt analysis/RP-LITE.md
          git add analysis/RP-LITE.md && git commit -qm "raport runner" && git push -q origin HEAD:arena/9bbcb24f-serverroleplaylite
