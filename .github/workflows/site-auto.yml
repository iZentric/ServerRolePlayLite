name: site-auto
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  s:
    runs-on: [ self-hosted ]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/9bbcb24f-serverroleplaylite }
      - name: Actualizeaza site-ul cu cifrele vii din productie
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/functity-stage.sh site-sync
