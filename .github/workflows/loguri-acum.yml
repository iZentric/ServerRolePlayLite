name: loguri-acum

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loguri:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Trage logurile de pe Zampto (o singura conexiune)
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p /tmp/zlogs analysis
          lftp -u "15254.1388b9af","$P" "sftp://node12.zampto.net:2022" -e "
            set sftp:auto-confirm yes;
            cls -l;
            echo ===LOGS===;
            cls -l logs/;
            echo ===CRASH===;
            cls -l crash-reports/;
            echo ===GET===;
            get logs/latest.log -o /tmp/zlogs/latest.log || echo NO_LATEST_LOG;
            bye
          " > /tmp/zlogs/inventar-log.txt 2>&1 || true
          echo "--- conexiune facuta ---"
          ls -la /tmp/zlogs/ || true

      - name: Judeca logul
        run: |
          python3 << 'PYEOF'
          import os, re, datetime
          out = []
          inv = open('/tmp/zlogs/inventar-log.txt', errors='replace').read()
          has_log = os.path.exists('/tmp/zlogs/latest.log') and os.path.getsize('/tmp/zlogs/latest.log') > 0
          out.append('# Loguri Zampto — judecata\n')
          if not has_log:
              out.append('## ❌ ZERO LOGURI\n')
              out.append('`logs/latest.log` **NU exista** → **serverul NU a fost pornit niciodata** (sau logul a fost sters).\n')
              out.append('Inventarul gasit:\n```\n' + inv[-3000:] + '\n```\n')
          else:
              log = open('/tmp/zlogs/latest.log', errors='replace').read()
              lines = log.splitlines()
              out.append(f'Logul: **{len(lines)} randuri**, {os.path.getsize("/tmp/zlogs/latest.log")} bytes\n')
              # pornire
              booted = [l for l in lines if 'Done (' in l]
              for b in booted[-3:]:
                  out.append(f'- 🟢 **BOOT**: `{b.strip()[:160]}`')
              # versiune / engine
              for l in lines:
                  if 'Starting minecraft server' in l or 'CatServer' in l and 'version' in l.lower():
                      out.append(f'- `{l.strip()[:160]}`')
                      break
              for l in lines:
                  if 'Forge Mod Loader has successfully loaded' in l or 'mods, 0 mods' in l or 'successfully loaded' in l:
                      out.append(f'- 🧩 `{l.strip()[:160]}`')
              # plugins
              for l in lines:
                  if re.search(r'Plugins \(\d+\)', l) or 'Plugins:' in l:
                      out.append(f'- 🔌 `{l.strip()[:200]}`')
              # jucatori
              joins = [l for l in lines if 'joined the game' in l or 'logged in with entity id' in l]
              out.append(f'- 👥 Intrari jucatori: **{len(joins)}**')
              for j in joins[-5:]:
                  out.append(f'  - `{j.strip()[:140]}`')
              # erori / warn
              errs = [l for l in lines if '/ERROR' in l or '[ERROR]' in l]
              warns = [l for l in lines if '/WARN' in l or '[WARN]' in l]
              fatals = [l for l in lines if 'FATAL' in l or 'Encountered an unexpected exception' in l or 'crash' in l.lower()]
              out.append(f'- ❌ Erori: **{len(errs)}** | ⚠️ Avertismente: **{len(warns)}** | 💀 Fatale: **{len(fatals)}**')
              out.append('\n## Ultimele 10 erori (daca exista)\n```\n')
              out.extend(e.strip()[:200] for e in errs[-10:])
              out.append('\n```\n')
              # ram daca apare
              mem = [l for l in lines if 'Memory' in l or 'MB' in l and 'free' in l.lower()]
              if mem:
                  out.append('\n## Memorie\n```\n')
                  out.extend(m.strip()[:160] for m in mem[-5:])
                  out.append('\n```\n')
              # coada ultimelor randuri
              out.append('\n## Coada logului (ultimele 25 randuri)\n```\n')
              out.extend(l[:200] for l in lines[-25:])
              out.append('\n```\n')
          open('/tmp/zlogs/rezumat.md','w').write('\n'.join(out))
          # in pasi mici in summary
          open(os.environ['GITHUB_STEP_SUMMARY'],'w').write('\n'.join(out))
          print('\n'.join(out)[:4000])
          PYEOF
          cp /tmp/zlogs/rezumat.md analysis/loguri-rezumat.md 2>/dev/null || true

      - name: Salveaza dovezile (artifact — logul complet nu intra in git)
        uses: actions/upload-artifact@v4
        with:
          name: loguri-zampto
          path: /tmp/zlogs/
          if-no-files-found: warn

      - name: Comita dovezile mici
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/loguri-rezumat.md 2>/dev/null || true
          git commit -m "analysis: judecata logurilor de pe Zampto" || echo "nimic nou"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
