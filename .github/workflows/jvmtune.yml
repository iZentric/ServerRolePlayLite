name: JVMTUNE — setul de flaguri GC, validat pe Java 17
on:
  push:
    paths: [ "scripts/jvm-tune.sh", "deploy/tune.txt", ".github/workflows/jvmtune.yml" ]
  workflow_dispatch:
    inputs:
      heap: { description: "-Xmx tinta", required: false, default: "2G" }
permissions:
  contents: write
jobs:
  t:
    runs-on: [self-hosted]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/jvm-tune.sh
        env:
          HEAP_TINTA: ${{ github.event.inputs.heap || '2G' }}

      - name: Regula — serverul ramane pornit dupa orice comanda
        if: always()
        run: bash scripts/ensure-up.sh
