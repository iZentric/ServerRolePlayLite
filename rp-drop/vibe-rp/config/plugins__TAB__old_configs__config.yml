# Detailed explanation of all options available at https://github.com/NEZNAMY/TAB/wiki/config.yml
change-nametag-prefix-suffix: true
change-tablist-prefix-suffix: true
enable-header-footer: true
header:
- '&f❖ &#185cfb&lꜱ&#296dfb&lᴇ&#397efb&lʀ&#4a8efb&lᴠ&#5a9ffc&lᴇ&#6bb0fc&lʀ&#7bc0fc&lɴ&#8bd1fc&lᴀ&#9ce2fc&lᴍ&#acf2fd&lᴇ
  &f❖'
- '&f↿ &7ᴘʟᴀʏ.ꜱᴇʀᴠᴇʀɴᴀᴍᴇ.ᴄᴏᴍ &f↾'
- ''
- ''
footer:
- ''
- ''
- '&f❖ &#8bd1fcRank: %rank% &8&L| &#8bd1fcPing: &a%ping% &8&L| &#8bd1fcHealth: &a%health%
  &f❖'
- '&f◀ &7ᴅɪꜱᴄᴏʀᴅ.ɪᴏ/ꜱᴇʀᴠᴇʀɴᴀᴍᴇ &8&L| &7ᴡᴡᴡ.ꜱᴇʀᴠᴇʀɴᴀᴍᴇ.ᴄᴏᴍ &f▶'
- '&#8bd1fcOnline Player: &a%online%'
yellow-number-in-tablist: ''
group-sorting-priority-list:
- owner
- admin
- mod
- helper
- mvp+
- mvp
- vip+
- vip
- default
Groups:
  Owner:
    tabprefix: '&c&lOwner &7| &c'
    tagprefix: '&c&lOwner &7| &c'
  Admin:
    tabprefix: '&d&lAdmin &7| &d'
    tagprefix: '&d&lAdmin &7| &d'
  Mod:
    tabprefix: '&6&lMod &7| &6'
    tagprefix: '&6&lMod &7| &6'
  Helper:
    tabprefix: '&3&lHelper &7| &3'
    tagprefix: '&3&lHelper &7| &3'
  MVP+:
    tabprefix: '&bMVP&e+ &7| &b'
    tagprefix: '&bMVP&e+ &7| &b'
  MVP:
    tabprefix: '&bMVP &7| &b'
    tagprefix: '&bMVP &7| &b'
  VIP+:
    tabprefix: '&aVIP&e+ &7| &a'
    tagprefix: '&aVIP&e+ &7| &a'
  VIP:
    tabprefix: '&aVIP &7| &a'
    tagprefix: '&aVIP &7| &a'
  Default:
    tabprefix: '&7'
    tagprefix: '&7'
  example_group:
    header:
    - This is an example of per-group header/footer
    footer:
    - applied to a group
  _OTHER_:
    tabprefix: '%vault-prefix%'
    tagprefix: '%vault-prefix%'
    tabsuffix: '%afk%'
    tagsuffix: '%afk%'
    customtabname: '%essentialsnick%'
    customtagname: '%essentialsnick%'
Users:
  _NEZNAMY_:
    tabprefix: '&6&lTAB Author &a'
    tagprefix: '&6&lTAB &r&a'
    abovename: '&bOh look, 3 lines of text !'
    belowname: '&eThere''s only one plugin out there supporting it'
classic-vanilla-belowname:
  enabled: false
  number: '%health%'
  text: Health
enable-collision: true
revert-collision-rule-in-worlds:
- revertedworld
do-not-move-spectators: false
allow-spectator-bypass-permission: false
unlimited-nametag-prefix-suffix-mode:
  enabled: false
  use-marker-tag-for-1-8-x-clients: false
  disable-on-boats: true
  space-between-lines: 0.22
per-world-settings:
  world1:
    header:
    - an example of world with custom
    footer:
    - header/footer and prefix/suffix
    Groups:
      Owner:
        tabprefix: '&0&l[&a&lOwner&0&l] &a'
        tagprefix: '&2&lOwner &a'
  world2-world3:
    header:
    - This is a shared header for
    - world2 and world3
placeholders:
  afk-yes: ' &4*&4&lAFK&4*&r'
  afk-no: ''
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  remove-strings:
  - '[]'
  - < >
rank-aliases:
  Owner: '&cOwner'
  Admin: '&dAdmin'
  Mod: '&6Mod'
  Helper: '&3Helper'
  MVP+: '&bMVP&e+'
  MVP: '&bMVP'
  VIP+: '&aVIP&e+'
  VIP: '&aVIP'
  Default: '&7'
  _OTHER_: '&7No Rank'
disable-features-in-worlds:
  header-footer:
  - disabledworld
  tablist-names:
  - disabledworld
  nametag:
  - disabledworld
  yellow-number:
  - disabledworld
  bossbar:
  - disabledworld
  belowname:
  - disabledworld
  unlimited-nametags:
  - disabledworld
placeholderapi-refresh-intervals:
  default-refresh-interval: 500
  server:
    '%server_uptime%': 1000
    '%server_tps_1_colored%': 1000
  player:
    '%player_health%': 200
    '%player_ping%': 1000
    '%vault_prefix%': 1000
  relational:
    '%rel_factionsuuid_relation_color%': 500
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
sort-players-by-permissions: false
fix-pet-names: false
use-primary-group: true
primary-group-finding-list:
- Owner
- Admin
- Helper
- default
assign-groups-by-permissions: false
anti-override:
  scoreboard-teams: true
  scoreboard-objectives: true
  tablist-names: true
  usernames: true
invisible-nametags: false
ping-spoof:
  enabled: false
  value: 0
debug: false
use-online-uuid-in-tablist: true
