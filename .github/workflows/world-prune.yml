name: world-prune

# CURATENIE LUNARA: sterge chunk-urile in care nimeni n-a stat >1 min.
# ATENTIE: se ruleaza DOAR cu serverul OPRIT! (de-aia e doar manual)
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/prune-trigger.txt"

env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: 2022
  SFTP_USER: 15254.1388b9af

jobs:
  curata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Trage lumea de pe server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          P='${{ secrets.ZAMPTO_SFTP_PASS }}'
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; mirror --parallel=4 world world; bye"
          du -sh world
      - name: MCASelector - sterge chunk-urile nelocuite
        run: |
          URL=$(curl -s https://api.github.com/repos/Querz/mcaselector/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.jar')][0])")
          curl -sL -o mcaselector.jar "$URL"
          java -jar mcaselector.jar --mode delete --world world/region --query "InhabitedTime < 1200" --headless || \
          java -jar mcaselector.jar --headless --mode delete --world world/region --query "InhabitedTime < 1200"
          du -sh world
      - name: Impinge lumea curatata inapoi
        run: |
          P='${{ secrets.ZAMPTO_SFTP_PASS }}'
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "set sftp:auto-confirm yes; mirror -R --parallel=4 --delete world/region world/region; bye"
          echo "LUMEA CURATATA. Porneste serverul la loc."
