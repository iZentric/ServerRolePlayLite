name: pc-client
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pc-client.yml
jobs:
  ck:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Client gameplay plus performanta activa
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = @("PC client $(Get-Date -Format s)")
          foreach ($name in @('FunCity', 'CUANTIC-Client-1.7.7')) {
            $mods = Join-Path $env:APPDATA ('PrismLauncher\instances\' + $name + '\minecraft\mods')
            if (-not (Test-Path $mods)) { $report += "$name : fara mods"; continue }
            $changed = @()
            foreach ($file in @(Get-ChildItem -LiteralPath $mods -Filter '*.jar' -File)) {
              if ($file.Name -notmatch '^(dynamic[-_]?fps|TextruesRubidiumOptions)') { continue }
              try {
                Rename-Item -LiteralPath $file.FullName -NewName ($file.Name + '.disabled') -ErrorAction Stop
                $changed += $file.Name
              } catch { $report += "EROARE $name : $($file.Name) : $($_.Exception.Message)" }
            }
            $restored = @()
            foreach ($file in @(Get-ChildItem -LiteralPath $mods -Filter '*.jar.disabled' -File)) {
              if ($file.Name -notmatch '^(lazydfu|oculus)') { continue }
              $original = $file.Name -replace '\.disabled$', ''
              if (Test-Path (Join-Path $mods $original)) { continue }
              try {
                Rename-Item -LiteralPath $file.FullName -NewName $original -ErrorAction Stop
                $restored += $original
              } catch { $report += "EROARE restabilire $name : $($file.Name) : $($_.Exception.Message)" }
            }
            $left = @(Get-ChildItem -LiteralPath $mods -Filter '*.jar' -File)
            $report += "$name : active=$($left.Count) restabilite=[$($restored -join ', ')] dezactivate=[$($changed -join ', ')]"
            $report += "lista: $(($left | ForEach-Object { $_.Name } | Sort-Object) -join ', ')"
          }
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $jar = Test-Path (Join-Path $server 'FunCityEngine.jar')
          $serverMods = @(Get-ChildItem -Path (Join-Path $server 'mods') -Filter '*.jar' -ErrorAction SilentlyContinue).Count
          $report += "server: jar=$jar mods=$serverMods"
          $text = $report -join "`n"
          Write-Host $text
          $base = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/diag/pc-client.txt'
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'FunCity' }
          $body = @{ message = 'pc client cleanup'; branch = $env:GITHUB_REF_NAME; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text)) }
          $url = $base + '?ref=' + [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          for ($attempt = 0; $attempt -lt 2; $attempt++) {
            try {
              $body.sha = (Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop).sha
              Invoke-RestMethod -Method Put -Uri $base -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
              Write-Host 'Raport PC incarcat'
              break
            } catch { Write-Host "Raport nereusit: $($_.Exception.Message)"; if ($attempt -eq 1) { exit 1 } }
          }
      - name: Restabileste dependintele serverului si porneste local
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $client = Join-Path $env:APPDATA 'PrismLauncher\instances\FunCity\minecraft\mods'
          New-Item -ItemType Directory -Force (Join-Path $server 'mods') | Out-Null
          foreach ($name in @('selene', 'obfuscate')) {
            $source = @(Get-ChildItem -LiteralPath $client -File -Filter ($name + '*.jar') | Sort-Object Length -Descending | Select-Object -First 1)
            if (-not $source.Count -or $source[0].Length -lt 10000) { throw "Dependinta lipseste din client: $name" }
            $target = Join-Path (Join-Path $server 'mods') $source[0].Name
            if (-not (Test-Path $target)) { Copy-Item -LiteralPath $source[0].FullName -Destination $target -ErrorAction Stop }
            Write-Host "dependinta $name : $($source[0].Name)"
          }
          $url = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/tools/FunCity-Local.ps1?ref=arena/9bbcb24f-serverroleplaylite'
          $h = @{Authorization=('Bearer '+$env:GH_TOKEN); Accept='application/vnd.github+json'; 'User-Agent'='FunCity'}
          $data = Invoke-RestMethod -Uri $url -Headers $h -ErrorAction Stop
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($data.content -replace '\s','')))
          & ([ScriptBlock]::Create($script))

      - name: Diagnostic server local dupa ultimul boot
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $report = @("Diagnostic server $(Get-Date -Format s)")
          $latest = @(Get-Content (Join-Path $root 'logs\latest.log') -ErrorAction SilentlyContinue)
          $ready = @($latest | Where-Object { $_ -match 'Done \(' }).Count -gt 0
          $socket = New-Object Net.Sockets.TcpClient
          try { $ar = $socket.BeginConnect('127.0.0.1', 25565, $null, $null); $port = $ar.AsyncWaitHandle.WaitOne(2000); if($port){ $socket.EndConnect($ar) } } catch { $port = $false } finally { $socket.Close() }
          $report += "SERVER LIVE=$($ready -and $port) Done=$ready localhost:25565=$port"
          foreach ($file in @('logs\latest.log', 'logs\console.err', 'logs\console.log')) {
            $path = Join-Path $root $file
            $lines = @(Get-Content -LiteralPath $path -ErrorAction SilentlyContinue)
            $report += "$file : $($lines.Count) linii"
            $hits = @($lines | Where-Object { $_ -match '(?i)error|exception|caused by|failed|missing|mixin|duplicate|requires|not found|fatal|invalid' } | Select-Object -Last 55)
            foreach ($hit in $hits) {
              $safe = $hit -replace '(?i)(password|token|secret)[= :]+\S+', '$1=<redacted>'
              $safe = $safe -replace 'C:\\Users\\[^\\]+', 'C:\Users\<user>'
              $report += ($safe.Substring(0, [Math]::Min($safe.Length, 350)))
            }
          }
          $report += "mods: $(@(Get-ChildItem (Join-Path $root 'mods') -Filter '*.jar' -ErrorAction SilentlyContinue).Count)"
          $text = ($report -join "`n")
          Write-Host $text
          $base = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/diag/fix.txt'
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'FunCity' }
          $body = @{ message = 'server boot diagnosis'; branch = $env:GITHUB_REF_NAME; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text)) }
          $body.sha = (Invoke-RestMethod -Uri ($base + '?ref=' + [uri]::EscapeDataString($env:GITHUB_REF_NAME)) -Headers $headers).sha
          Invoke-RestMethod -Method Put -Uri $base -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) | Out-Null
      - name: Compara serverul actual cu PRIMUL modpack si serverul original
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $originalPack = Join-Path $env:TEMP 'FunCity-first-pack.zip'
          $originalServer = Join-Path $env:TEMP 'FunCity-first-server.tar.gz'
          curl.exe -fLso $originalPack 'https://github.com/iZentric/ServerRolePlayLite/releases/download/freeroam/Freeroam.1.0.0.zip'
          if ($LASTEXITCODE -ne 0 -or (Get-Item $originalPack).Length -lt 100000000) { throw 'Lipseste primul modpack original' }
          curl.exe -fLso $originalServer 'https://github.com/iZentric/ServerRolePlayLite/releases/download/world-live/functity-live.tar.gz'
          if ($LASTEXITCODE -ne 0 -or (Get-Item $originalServer).Length -lt 100000000) { throw 'Lipseste serverul original cu toate modurile' }
          $pack = [IO.Compression.ZipFile]::OpenRead($originalPack)
          try {
            $entry = $pack.GetEntry('modrinth.index.json')
            if (-not $entry) { throw 'Primul modpack nu are index Modrinth' }
            $reader = New-Object IO.StreamReader($entry.Open())
            try { $idx = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            $packMods = @($idx.files | Where-Object { $_.path -match '(?i)^mods/[^/]+\.jar$' } | ForEach-Object { [IO.Path]::GetFileName($_.path) })
            $packMods += @($pack.Entries | Where-Object { $_.FullName -match '(?i)^overrides/mods/[^/]+\.jar$' } | ForEach-Object { $_.Name })
            $clientOnly = @($idx.files | Where-Object { $_.path -match '(?i)^mods/[^/]+\.jar$' -and $_.env.server -eq 'unsupported' } | ForEach-Object { [IO.Path]::GetFileName($_.path) })
          } finally { $pack.Dispose() }
          $tarNames = @(tar -tzf $originalServer)
          if ($LASTEXITCODE -ne 0) { throw 'Arhiva serverului original e corupta' }
          $oldMods = @($tarNames | Where-Object { $_ -match '(?i)^(\./)?mods/[^/]+\.jar$' } | ForEach-Object { [IO.Path]::GetFileName($_) })
          $oldPlugins = @($tarNames | Where-Object { $_ -match '(?i)^(\./)?plugins/[^/]+\.jar$' } | ForEach-Object { [IO.Path]::GetFileName($_) })
          $nowMods = @(Get-ChildItem (Join-Path $server 'mods') -File -Filter '*.jar' | ForEach-Object { $_.Name })
          $nowPlugins = @(Get-ChildItem (Join-Path $server 'plugins') -File -Filter '*.jar' | ForEach-Object { $_.Name })
          $report = @(
            "BAZA ORIGINALA vs server PC $(Get-Date -Format s)",
            'Sursa originala Freeroam.1.0.0.zip (rebrand FunCity 1.0.0), NU zip-ul nou FUNCTITY-SERVER.zip',
            "Client original: $($packMods.Count) jar-uri; explicit client-only: $($clientOnly -join ', ')",
            "Client original absent ca nume pe server: $((@($packMods | Where-Object { $_ -notin $nowMods }) | Sort-Object -Unique) -join ', ')",
            "Server original live: mods=$($oldMods.Count) plugins=$($oldPlugins.Count)",
            "Server PC acum: mods=$($nowMods.Count) plugins=$($nowPlugins.Count)",
            "Lipsesc din serverul original: $((@($oldMods | Where-Object { $_ -notin $nowMods }) | Sort-Object -Unique) -join ', ')",
            "In plus fata de serverul original: $((@($nowMods | Where-Object { $_ -notin $oldMods }) | Sort-Object -Unique) -join ', ')",
            "Pluginuri lipsa: $((@($oldPlugins | Where-Object { $_ -notin $nowPlugins }) | Sort-Object -Unique) -join ', ')",
            "Pluginuri in plus: $((@($nowPlugins | Where-Object { $_ -notin $oldPlugins }) | Sort-Object -Unique) -join ', ')"
          )
          $text = $report -join "`n"
          Write-Host $text
          $base = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/diag/fix.txt'
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'FunCity' }
          $body = @{ message = 'compare first modpack'; branch = $env:GITHUB_REF_NAME; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text)) }
          $body.sha = (Invoke-RestMethod -Uri ($base + '?ref=' + [uri]::EscapeDataString($env:GITHUB_REF_NAME)) -Headers $headers).sha
          Invoke-RestMethod -Method Put -Uri $base -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) | Out-Null
