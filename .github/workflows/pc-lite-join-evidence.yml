name: Inspect latest Lite connection failure privately
# No log upload, JAR edits, server stop, Prism control or network changes.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/pc-lite-join-evidence.yml]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic client and server logs; privacy assertion
        run: python3 scripts/fc_join_failure_probe_test.py
  pc-read-only:
    needs: guards
    runs-on: [self-hosted, Windows]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Classify recent Forge errors without emitting raw logs
        shell: powershell
        run: |
          $profile = 'C:\Users\Administrator\AppData\Roaming\PrismLauncher\instances\FunCity RP Lite'
          $server = 'C:\Users\Administrator\Desktop\FunCityLocal\server'
          & ./scripts/fc_join_failure_probe.ps1 -Profile $profile -Server $server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
