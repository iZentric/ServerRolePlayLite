name: copoiul-magma
on:
  push:
    paths: ["deploy/magma-trigger.txt"]
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cauta jarul Magma 1.16.5 in arhiva internetului + gitlab
        run: |
          mkdir -p analysis
          { echo "# COPOIUL MAGMA ($(date -u))"
            echo "== gitlab-ul lor:"
            curl -s --max-time 15 "https://git.magmafoundation.org/api/v4/projects?search=magma&per_page=10" | head -c 600 || true
            echo; echo "== wayback (site-ul lor 2022):"
            for u in "magmafoundation.org/downloads/magma-1.16.5.jar" "magmafoundation.org/downloads" "ci.magmafoundation.org"; do
              curl -s --max-time 12 "https://archive.org/wayback/available?url=$u&timestamp=20220901" | head -c 300; echo
            done
            echo "== cautare directa in snapshoturi:"
            curl -s --max-time 20 "https://web.archive.org/cdx/search/cdx?url=magmafoundation.org*&filter=original:.*jar.*&limit=15&output=text" | head -15 || true
            curl -s --max-time 20 "https://web.archive.org/cdx/search/cdx?url=ci.magmafoundation.org*&limit=10&output=text" | head -10 || true
          } > analysis/magma-hunt.md 2>&1
          cat analysis/magma-hunt.md
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/ && git commit -m "copoiul magma" && git pull --rebase -X ours && git push || true
