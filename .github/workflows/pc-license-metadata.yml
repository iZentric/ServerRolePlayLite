name: FunCity JAR source and license metadata inventory
# Read-only: inspect JAR metadata already on PC; no binary transfer or release.
# Syntax gate runs on the same Windows runner so no hosted runner is required.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/pc-license-metadata.yml
      - scripts/fc_pc_jar_license_inventory.ps1
permissions:
  contents: read
jobs:
  metadata:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax before metadata access
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/fc_pc_jar_license_inventory.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw 'LICENSE_INVENTORY_SCRIPT_SYNTAX_FAILED' }
      - name: Read installed mod and plugin license fields only
        shell: powershell
        run: |
          & ./scripts/fc_pc_jar_license_inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
