name: audit-zampto

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/audit-trigger.txt"

permissions:
  contents: write

jobs:
  inventar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventarul complet al serverului
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # VERIFICARE PANICA: modurile-s INTREGI? (panoul arata doar 68MB disk)
          lftp -u "15254.1388b9af","$P" "sftp://node12.zampto.net:2022" -e "
            set sftp:auto-confirm yes;
            ls -la mods/ | head -40;
            du -s mods 2>/dev/null || true;
            bye" > analysis/mods-sizes.txt 2>&1 || true
          tail -40 analysis/mods-sizes.txt
          P='${{ secrets.ZAMPTO_SFTP_PASS }}'
          lftp -u "15254.1388b9af","$P" "sftp://node12.zampto.net:2022" -e "
            set sftp:auto-confirm yes;
            find .;
            bye
            cat server.properties; echo ---;
            cat spigot.yml; echo ---;
            cat bukkit.yml; echo ---;
            cat catserver.yml; echo ---;
            cat unix_args.txt; echo ---;
            cat config/forge-common.toml; echo ---;
            cat defaultconfigs/forge-server.toml; echo ---;
            cat config/incontrol/spawn.json; echo ---;
          " > analysis/server-inventory.txt 2>&1 || true
          wc -l analysis/server-inventory.txt
      - name: Publica inventarul
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/server-inventory.txt
          git commit -m "analysis: inventarul fisierelor de pe Zampto" || echo "nimic nou"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
