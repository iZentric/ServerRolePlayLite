name: CUANTIC LIVE — IP public pe iZen + server
on:
  push:
    paths: [ "deploy/live.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-cuantic
  cancel-in-progress: true
jobs:
  live:
    runs-on: [self-hosted]
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Ruleaza ip3 cu python-ul CLI-ului OCI
        run: |
          set +e
          PYPY=$(head -1 "$(which oci)" 2>/dev/null | sed 's/^#!//' | tr -d '\r')
          "$PYPY" -c "import oci.core" 2>/dev/null || PYPY=$(for c in ~/.local/lib/oracle-cli/bin/python3 /usr/lib/oracle/oci-cli*/bin/python3 /opt/oci-cli/bin/python3; do [ -x "$c" ] && "$c" -c "import oci" 2>/dev/null && echo "$c" && break; done)
          echo "python: $PYPY"
          "$PYPY" scripts/ip3.py > /tmp/ip3-run.txt 2>&1; echo "rc=$?" >> /tmp/ip3-run.txt
          tail -40 /tmp/ip3-run.txt
          mkdir -p analysis
          { printf '# IP pe iZen — %s\n```\n' "$(date -u '+%F %T UTC')"; cat /tmp/ip3.txt 2>/dev/null; echo "---- brute ----"; tail -60 /tmp/ip3-run.txt; printf '```\n'; } > analysis/ip.md
          git config user.name "ip-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/ip.md
          git commit -q -m "ip: raport" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          cat analysis/ip.md | head -50
