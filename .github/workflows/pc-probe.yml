name: pc-probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pc-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 2
    steps:
      - name: Verifica rapid PC-ul si serverul local
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = @("PC probe $(Get-Date -Format s)")
          $server = Join-Path $env:USERPROFILE 'Desktop\FunCityLocal\server'
          $client = Join-Path $env:APPDATA 'PrismLauncher\instances\FunCity\minecraft\mods'
          $report += "PC runner: $env:COMPUTERNAME; cont: $env:USERNAME"
          $report += "Server b1.0827: $(Test-Path (Join-Path $server 'FunCityEngine.jar'))"
          $report += "Prism FunCity: $(Test-Path $client); Clumps: $(Test-Path (Join-Path $client 'Clumps-6.0.0.28.jar'))"
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $report += "RAM fizic PC: $ram GB"
          foreach ($name in @('FunCity', 'CUANTIC-Client-1.7.7')) {
            $instance = Join-Path $env:APPDATA ("PrismLauncher\instances\" + $name)
            $cfg = Join-Path $instance 'instance.cfg'
            $options = Join-Path $instance 'minecraft\options.txt'
            $mods = Join-Path $instance 'minecraft\mods'
            $jars = @(Get-ChildItem -LiteralPath $mods -Filter '*.jar' -File -ErrorAction SilentlyContinue)
            $report += "$name : jar-uri=$($jars.Count)"
            if (Test-Path $cfg) {
              foreach ($line in @(Get-Content -LiteralPath $cfg | Where-Object { $_ -match '^(OverrideMemory|MinMemAlloc|MaxMemAlloc)=' })) {
                $report += "$name : $line"
              }
              foreach ($line in @(Get-Content -LiteralPath $cfg | Where-Object { $_ -match '^JavaArguments=' })) {
                $sizes = @([regex]::Matches($line, '-Xm[sx]\S+') | ForEach-Object { $_.Value })
                $report += "$name : argumente heap=[$($sizes -join ', ')]"
              }
            }
            if (Test-Path $options) {
              foreach ($line in @(Get-Content -LiteralPath $options | Where-Object { $_ -match '^(renderDistance|simulationDistance|graphicsMode|fancyGraphics|particles):' })) {
                $report += "$name : $line"
              }
            }
            $shaders = Join-Path $instance 'minecraft\config\oculus.properties'
            if (Test-Path $shaders) {
              $enabled = @(Get-Content -LiteralPath $shaders | Where-Object { $_ -match '^enableShaders=true$' }).Count -gt 0
              $report += "$name : shaders activati=$enabled"
            }
          }
          foreach ($port in @(25565, 25575)) {
            $tcp = New-Object Net.Sockets.TcpClient
            $open = $false
            try {
              $attempt = $tcp.BeginConnect('127.0.0.1', $port, $null, $null)
              if ($attempt.AsyncWaitHandle.WaitOne(1000)) {
                $tcp.EndConnect($attempt)
                $open = $true
              }
            } catch { } finally { $tcp.Close() }
            $report += "127.0.0.1:${port} deschis: $open"
          }
          # Raportul nu contine parola RCON sau continutul altor fisiere de pe PC.
          $text = $report -join "`n"
          Write-Host $text
          $base = 'https://api.github.com/repos/iZentric/ServerRolePlayLite/contents/diag/pc-probe.txt'
          $headers = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'FunCity' }
          $uri = $base + '?ref=' + [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $existing = Invoke-RestMethod -Uri $uri -Headers $headers -ErrorAction Stop
          $body = @{
            message = 'PC quick probe'
            branch = $env:GITHUB_REF_NAME
            sha = $existing.sha
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Put -Uri $base -Headers $headers -ContentType 'application/json' -Body $body -ErrorAction Stop | Out-Null
          Write-Host 'Raport PC actualizat'
          # Portul RCON deschis nu demonstreaza autentificarea.
