name: MC-RUN
# Serverul VIU de pe masina (Cloud Shell + frp, 92.5.171.150:25565).
# Regula casei (PROMPT-CUANTIC-AGENT.md): verdictul se publica DEVREME, inainte de
# orice asteptare; restart SE cere prin puntea cmd.in, nu cu java manual (pe aceeasi
# lume = mort). Token-ul runner-ului e read-only, deci publicarea se face cu node
# https + credentialii reali ai masinii (gh hosts.yml / .git-credentials / remote),
# ca botul site-ului. Niciodata nu se printeaza vreo cheie.
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml

jobs:
  live:
    runs-on: self-hosted
    steps:
      - name: Stare inainte si verdict rapid
        run: |
          T=/tmp/mcst.txt
          D=$HOME/cuantic-live
          {
            echo "=== stare inainte $(date -u '+%F %T UTC') ==="
            pgrep -af "java @unix_args" | head -2 || echo "JAVA: jos"
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/25565' 2>/dev/null && echo "PORT 25565 local: viu" || echo "PORT 25565 local: inchis"
            pgrep -f "frpc" >/dev/null && echo "frpc: sus" || echo "frpc: jos"
            pgrep -f "c.sh|cuantic-live" >/dev/null && echo "supervisor c.sh: sus" || echo "supervisor c.sh: jos"
            if [ -f "$D/logs/latest.log" ]; then echo "--- latest.log (ultimele 15)"; tail -15 "$D/logs/latest.log"; else echo "fara latest.log in $D"; fi
            awk '/MemTotal|MemAvailable/ {printf "%s %d MiB\n", $1, $2/1024}' /proc/meminfo
            cat /proc/loadavg
          } > $T 2>&1
          cat $T
          node -e '
            const fs = require("fs"), https = require("https");
            function citeste(){
              const c = [];
              try { const h = fs.readFileSync(process.env.HOME + "/.config/gh/hosts.yml","utf8");
                const m = h.match(/oauth_token: (\S+)/); if (m) c.push(m[1]); } catch(e){}
              try { const g = fs.readFileSync(process.env.HOME + "/.git-credentials","utf8");
                for (const l of g.split("\n")) { if (l.includes("github.com")) { const t = l.split("://")[1].split("@")[0].split(":").pop(); if (t) c.push(decodeURIComponent(t)); } } } catch(e){}
              return c.filter(Boolean);
            }
            const toks = [...new Set(citeste())];
            if (!toks.length) { console.log("FARA TOKEN PE MASINA gasit in keyring"); process.exit(0); }
            const repo = process.env.GITHUB_REPOSITORY, br = process.env.GITHUB_REF_NAME;
            const content = fs.readFileSync("/tmp/mcst.txt").toString("base64");
            const msg = "mc-run: stare inainte " + new Date().toISOString().slice(11,19);
            function api(method, path, body, tok){ return new Promise(res => {
              const data = body ? JSON.stringify(body) : null;
              const r = https.request({host:"api.github.com", path, method, headers: Object.assign({
                "Authorization":"Bearer "+tok, "User-Agent":"mc-run", "Accept":"application/vnd.github+json"},
                data ? {"Content-Type":"application/json","Content-Length":Buffer.byteLength(data)} : {})},
                x => { let b=""; x.on("data",d=>b+=d); x.on("end",()=>res({status:x.statusCode, body:b})); });
              r.on("error",e=>res({status:0, body:String(e)})); if(data) r.write(data); r.end();
            });}
            (async () => {
              for (const tok of toks) {
                let sha;
                const g = await api("GET", "/repos/"+repo+"/contents/analysis/MC-STATUS.md?ref="+encodeURIComponent(br), null, tok);
                if (g.status === 200) { try { sha = JSON.parse(g.body).sha; } catch(e){} }
                const p = await api("PUT", "/repos/"+repo+"/contents/analysis/MC-STATUS.md",
                  Object.assign({ message: msg, content, branch: br }, sha?{sha}:{}), tok);
                if (p.status === 200 || p.status === 201) { console.log("VERDICT OK " + JSON.parse(p.body).commit.sha.slice(0,7)); return; }
                console.log("PUT " + p.status + " " + p.body.slice(0,120));
              }
            })();
          ' || echo "node a cracat"
      - name: Trezire doar daca e jos
        timeout-minutes: 9
        run: |
          T=/tmp/mcst.txt
          D=$HOME/cuantic-live
          if pgrep -f "java @unix_args" >/dev/null; then
            echo "java e deja sus - nu ating nimic"
            { echo "=== dupa control $(date -u '+%F %T UTC') ==="; echo "serverul era deja pornit, nu am atins nimic."; pgrep -af "java @unix_args" | head -2; } > $T
            exit 0
          fi
          if [ -f "$D/logs/latest.log" ]; then wc -l < "$D/logs/latest.log" > /tmp/mcmark; else echo 0 > /tmp/mcmark; fi
          mkdir -p "$D"
          if pgrep -f "c.sh|cuantic-live.sh" >/dev/null; then
            echo "punte: cer restart in cmd.in"
            echo restart > "$D/cmd.in"
          else
            echo "supervisor jos: il ridic cu c.sh (in Background, ca la boot.sh)"
            [ -x "$HOME/c.sh" ] || { curl -fsSLo "$HOME/c.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/scripts/cuantic-live.sh" && chmod +x "$HOME/c.sh"; }
            ( setsid bash "$HOME/c.sh" >> "$D/sup.log" 2>&1 </dev/null & )
          fi
          OK=0
          for i in $(seq 1 45); do
            sleep 10
            tail -n +"$(($(cat /tmp/mcmark) + 1))" "$D/logs/latest.log" 2>/dev/null | grep -q "Done (" && { OK=1; break; }
          done
          echo "boot proaspat: $([ $OK = 1 ] && echo DA || echo NU-IN-FERESTRA)"
          {
            echo "=== dupa trezire $(date -u '+%F %T UTC') ==="
            echo "rezultat: $([ $OK = 1 ] && echo 'Done ( proaspat in log' || echo 'Done ( nu s-a vazut in ~7 min')"
            pgrep -af "java @unix_args" | head -2 || echo "java inca jos"
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/25565' 2>/dev/null && echo "PORT 25565 local: viu" || echo "PORT 25565 local: inchis"
            tail -n +"$(($(cat /tmp/mcmark) + 1))" "$D/logs/latest.log" 2>/dev/null | grep -E "Done \(|Can.t keep up|ERROR" | tail -6
            awk '/MemAvailable/ {printf "MemAvailable %d MiB\n", $2/1024}' /proc/meminfo
          } > $T 2>&1
          cat $T
          node -e '
            const fs = require("fs"), https = require("https");
            function citeste(){
              const c = [];
              try { const h = fs.readFileSync(process.env.HOME + "/.config/gh/hosts.yml","utf8");
                const m = h.match(/oauth_token: (\S+)/); if (m) c.push(m[1]); } catch(e){}
              try { const g = fs.readFileSync(process.env.HOME + "/.git-credentials","utf8");
                for (const l of g.split("\n")) { if (l.includes("github.com")) { const t = l.split("://")[1].split("@")[0].split(":").pop(); if (t) c.push(decodeURIComponent(t)); } } } catch(e){}
              return c.filter(Boolean);
            }
            const toks = [...new Set(citeste())];
            if (!toks.length) { console.log("FARA TOKEN PE MASINA gasit in keyring"); process.exit(0); }
            const repo = process.env.GITHUB_REPOSITORY, br = process.env.GITHUB_REF_NAME;
            const content = fs.readFileSync("/tmp/mcst.txt").toString("base64");
            const msg = "mc-run: dupa trezire " + new Date().toISOString().slice(11,19);
            function api(method, path, body, tok){ return new Promise(res => {
              const data = body ? JSON.stringify(body) : null;
              const r = https.request({host:"api.github.com", path, method, headers: Object.assign({
                "Authorization":"Bearer "+tok, "User-Agent":"mc-run", "Accept":"application/vnd.github+json"},
                data ? {"Content-Type":"application/json","Content-Length":Buffer.byteLength(data)} : {})},
                x => { let b=""; x.on("data",d=>b+=d); x.on("end",()=>res({status:x.statusCode, body:b})); });
              r.on("error",e=>res({status:0, body:String(e)})); if(data) r.write(data); r.end();
            });}
            (async () => {
              for (const tok of toks) {
                let sha;
                const g = await api("GET", "/repos/"+repo+"/contents/analysis/MC-STATUS.md?ref="+encodeURIComponent(br), null, tok);
                if (g.status === 200) { try { sha = JSON.parse(g.body).sha; } catch(e){} }
                const p = await api("PUT", "/repos/"+repo+"/contents/analysis/MC-STATUS.md",
                  Object.assign({ message: msg, content, branch: br }, sha?{sha}:{}), tok);
                if (p.status === 200 || p.status === 201) { console.log("VERDICT OK " + JSON.parse(p.body).commit.sha.slice(0,7)); return; }
                console.log("PUT " + p.status + " " + p.body.slice(0,120));
              }
            })();
          ' || echo "node a cracat"
          exit 0
