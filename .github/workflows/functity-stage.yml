name: FUNCIŢY-STAGE
# Staging FunCity PE GAZDA: backup, asamblare, boot, oprire, repornire din date salvate.
# Executati pe runner-ul self-hosted (masina mamei), directoare separate fata de productie,
# port separat (25566 implicit). NU atinge lumea de productie; NU reporneste productia.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "mod: backup | assemble | test | up | down"
        required: true
        default: "test"
      candidat:
        description: "build din functity-out:builds/ (ex. b1.2256)"
        required: false
        default: "b1.2256"
      port:
        description: "port test (NU 25565 decat cu productia Jos)"
        required: false
        default: "25566"
      heap:
        description: "Xmx heap staging (ex. 3G)"
        required: false
        default: "3G"
permissions:
  contents: read
jobs:
  s:
    runs-on: [ self-hosted ]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ruleaza modul ${{ inputs.mod }}
        env:
          FUNCITY_JAR: ${{ inputs.candidat }}
          FUNCITY_PORT: ${{ inputs.port }}
          FUNCITY_XMX: ${{ inputs.heap }}
        run: |
          set +e
          bash scripts/functity-stage.sh "${{ inputs.mod }}"
          echo "RC=$?" >> /tmp/funcity-stage.txt
      - name: Publica raportul pe bransa sesiunii
        run: |
          { echo; echo "(raport complet: si in /tmp/funcity-stage.txt pe gazda la $(date -u '+%F %T') UTC)"; } >> /tmp/funcity-stage.txt
          bash scripts/functity-publish.sh /tmp/funcity-stage.txt analysis/FUNCTITY-STAGE.md "FUNCIŢY-STAGE ${{ inputs.mod }}: raport $(date -u '+%F %H:%M') UTC"

