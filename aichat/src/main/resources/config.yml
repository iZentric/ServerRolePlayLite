# FunCityAI — configurație
# UUID-urile care pot folosi acțiuni sensibile (whitelist add, kick). Goale = doar reversibile.
admin_uuids: []
# Limita de cereri per jucător (ms)
rate_limit_ms: 1500
# Răspunsurile /ai se trimit și în consolă pentru audit?
echo_in_console: true
# OPTIONAL: LLM pentru /ai ask <text>. Ramă golit -> /ai ask răspunde "netestat" si restul merge oricum.
# Cheia NU se pune aici pe producție dacă ai access public la fișiere; folosește variabila de mediu FUNCITYAI_KEY.
ai:
  endpoint: ""            # ex: https://api.openai.com/v1/chat/completions (compatibil OpenAI)
  model: ""               # ex: gpt-4o-mini
  api_key: ""             # gol -> se încearcă env FUNCITYAI_KEY
  max_input_chars: 400
  timeout_ms: 15000
