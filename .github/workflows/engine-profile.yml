# Profile existing live JVM only with a REAL player online. No restarts or deploys.
name: ENGINE PROFILE — real player CPU sampling
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-profile.txt"]
permissions:
  contents: write
jobs:
  sample:
    runs-on: [self-hosted]
    timeout-minutes: 4
    env: { RUNNER_TRACKING_ID: '' }
    steps:
      - uses: actions/checkout@v4
      - name: Spark 60s numai daca un jucator e online
        run: python3 scripts/engine_player_profile.py /tmp/engine-profile-${{ github.run_id }}.json
      - name: Raport diagnostic (fara log complet)
        if: always()
        run: |
          { echo '# Profil CPU CUANTIC — server live, fara restart'; echo;
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID";
            echo 'Nu este o comparatie intre motoare.'; echo;
            echo '```json'; cat /tmp/engine-profile-${{ github.run_id }}.json 2>/dev/null || echo 'NO DATA'; echo '```';
          } > docs/ENGINE-PROFILE-RESULT.md
          git config user.name cuantic-bot
          git config user.email bot@users.noreply.github.com
          git add docs/ENGINE-PROFILE-RESULT.md
          git commit -m 'engine: profile CPU cu jucator real, fara restart' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
