name: VPS-LIVE — gaseste/porneste VM-ul nostru + IP public + SSH
on:
  push:
    paths: [ "deploy/vps.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  traitam:
    runs-on: [self-hosted]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Ruleaza VPS-LIVE cu python-ul CLI-ului
        run: |
          set +e
          PYPY=$(head -1 "$(which oci)" 2>/dev/null | sed 's/^#!//' | tr -d '\r')
          "$PYPY" -c "import oci" 2>/dev/null || PYPY=$(for c in ~/.local/lib/oracle-cli/bin/python3 /usr/lib/oracle/oci-cli*/bin/python3 /opt/oci-cli/bin/python3; do [ -x "$c" ] && "$c" -c "import oci" 2>/dev/null && echo "$c" && break; done)
          echo "python folosit: $PYPY"
          "$PYPY" scripts/vps.py > /tmp/vps-run.txt 2>&1; echo "rc=$?" >> /tmp/vps-run.txt; tail -80 /tmp/vps-run.txt
          mkdir -p analysis
          { echo "# VPS-LIVE — $(date -u '+%F %T UTC')"; echo; echo '```'; { cat /tmp/vps.txt 2>/dev/null; echo "---- iesire bruta:"; cat /tmp/vps-run.txt 2>/dev/null; } | head -170; echo '```'; } > analysis/vps-live.md
          cat analysis/vps-live.md
          git config user.name "vps-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/vps-live.md
          git commit -m "vps-live: raport" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
