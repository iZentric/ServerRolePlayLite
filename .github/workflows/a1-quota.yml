name: A1-QUOTA — cer singuri cresterea de limita ARM prin API
on:
  push:
    paths: [ "deploy/quota.txt" ]
permissions:
  contents: write
jobs:
  cere:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Descopera metrica si deschide cererea
        run: |
          set +e
          TEN=ocid1.tenancy.oc1..aaaaaaaanlzitmrgwn5f3g3iyapyiuxt2ayh43u6mdq3nszvcswrkcw5eyfa
          mkdir -p analysis
          R=analysis/a1-quota.md
          {
            echo "# A1-QUOTA V2 (QMS) - $(date -u '+%F %T UTC')"
            echo "## A) exista serviciul quotas in CLI?"
            echo '```'
            oci quotas --help 2>&1 | head -14
            echo '```'
            echo "## B) listez quotas compute si caut a1 (brut):"
            echo '```'
            oci quotas quota list --scope-id $TEN --service-name compute --max-results 1000 2>&1 > /tmp/q.json
            head -c 300 /tmp/q.json; echo
            jq -r '.data[]? | select(.name|test("a1";"i")) | .name + " | " + (.limitValue|tostring) + " | " + (.adjustable // "?") + " | used:" + (.usedValue|tostring)' /tmp/q.json 2>/dev/null | head -10
            echo '```'
            echo "## C) help change (cum se cere cresterea):"
            echo '```'
            oci quotas quota change --help 2>&1 | sed -n '1,26p'
            echo '```'
          } > $R
          cat $R
          git config user.name "quota-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/a1-quota.md
          git commit -m "a1-quota: cerere deschisa" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
