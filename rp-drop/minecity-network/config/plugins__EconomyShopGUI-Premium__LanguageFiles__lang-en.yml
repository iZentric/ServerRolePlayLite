#StartUp/Reload
creating-latest-shops: Se creează magazinele implicite pentru cea mai recentă versiune deoarece nu a fost găsită nicio configurație existentă compatibilă cu versiunea serverului %version%. Te rugăm să folosești o versiune de server acceptată.
default-shops-created: S-a creat configurația implicită a magazinelor compatibilă cu versiunea %version% la %path%.
loaded-shop-configurations: S-au încărcat cu succes %total% configurații de magazine din /shops/.
default-sections-created: S-a creat configurația implicită a secțiunilor la %path%.
loaded-section-configurations: S-au încărcat cu succes %total% configurații de secțiuni din /sections/.
updating-shop-settings: Se actualizează setările magazinului...
creating-new-shop-config: Se creează o nouă configurație de magazin pentru secțiunea '%section%' deoarece nu a fost găsită nicio configurație de magazin în timp ce exista o configurație pentru secțiuni. A fost ștearsă corect?
creating-new-section-config: Se creează o nouă configurație pentru secțiuni pentru '%section%' deoarece nu a fost găsită nicio configurație pentru secțiuni în timp ce exista o configurație pentru magazinuri. A fost ștearsă corect?
adding-new-shop-shops,yml: Se adaugă un nou magazin numit %shopsection% în shops.yml.
adding-new-shop-sections,yml: Se adaugă o nouă secțiune de magazin numită %shopsection% în sections.yml.
disabled-due-no-vault: Dezactivat din cauza lipsei dependenței Vault. Te rugăm să instalezi Vault.
disabled-due-no-economy: Dezactivat din cauza lipsei unui plugin de economie. Te rugăm să instalezi un plugin precum EssentialsX.
update-available: Există o actualizare disponibilă pentru EconomyShopGUI Premium. Rulezi versiunea v%plugin_version%, dar s-a găsit versiunea v%latest_version%.
done: Inițializat - A durat %millis%ms pentru a finaliza.
completed-delayed: Încărcarea amânată a fost finalizată.
updating-sections-config: Se actualizează configurația secțiunilor...
debug-mode-enabled: Modul de debug este activat.
economy-provider-null: EconomyProvider este nul.
successfully-hooked-into-vault: S-a conectat cu succes la Vault.
language-file-using: Se folosește fișierul de limbă %languagefile%.
cannot-find-language-file: Nu se poate găsi fișierul de limbă!
minecraft-version-using: Se folosește versiunea Minecraft %version%...
checking-each-item: Se verifică fiecare element pentru valori greșite/lipsă...
loading-items: Se încarcă toate elementele...
could-not-find-valid-version: Nu s-a putut găsi o implementare validă pentru această versiune a serverului. Acest lucru va determina ca pluginul să nu aibă o versiune de utilizat și va rezulta în disfuncționalități ale elementelor/metodelor. Te rugăm să folosești o versiune de Minecraft acceptată.
updating-configs: Se actualizează configurațiile deoarece s-a găsit o versiune mai nouă...
creating-backup: Se creează o copie de rezervă a fișierului vechi %fileName%, care poate fi găsită în folderul "backups" din interiorul folderului pluginului EconomyShopGUI.
discounts-feature-unavailable: Funcționalitatea de reducere nu poate fi activată deoarece nu s-a găsit niciun plugin de permisiuni.
cannot-hook-permissions: Eșec la găsirea unui plugin de permisiuni acceptat.
enabled-papi-hook: S-a activat conexiunea cu PlaceholderAPI...
failed-papi-integration: Eșec la conectarea cu PlaceholderAPI, pluginul este dezactivat...
enabled-plugin-hook: S-a activat conexiunea cu %plugin%...
failed-plugin-integration: Eșec la conectarea cu %plugin%, pluginul este dezactivat sau nu a fost găsit...
loading-season-modifiers: Se încarcă modificatorii de sezon din configurație...
loaded-season-modifiers: S-a finalizat încărcarea a %total% modificator(i) pentru sezonul '%season%' în lumea '%world%'.
no-season-modifiers-found: Nu s-au găsit modificatori de sezon pentru sezonul %season% în configurație.
season-change: S-a detectat schimbarea de sezon în lumea '%world%', se încarcă modificatorii pentru sezonul %season%...
economy-providers-loaded: S-a finalizat încărcarea a %total% furnizor(i) de economie pentru toate secțiunile de magazin (%shops%).
section-economy-provider-loaded: Se folosește '%economy%' ca economie implicită pentru magazinul '%shop%'.

