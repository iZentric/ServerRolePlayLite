name: runner-probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runner-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: [ self-hosted, Windows ]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: identitate PC
        run: |
          $os  = (Get-CimInstance Win32_OperatingSystem).Caption
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)
          $free= [math]::Round((Get-PSDrive $env:SystemDrive).Free/1GB,0)
          $j   = if (Get-Command java -ErrorAction SilentlyContinue) { ((cmd /c "java -version 2>&1") | Select-Object -First 1) } else { "NICE" }
          $lines = @(
            "## PROBE PC $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC"
            "host : $env:COMPUTERNAME"
            "os   : $os"
            "cpu  : $cpu"
            "nproc: $env:NUMBER_OF_PROCESSORS"
            "ram  : $ram GB total"
            "disc : $free GB liberi pe $env:SystemDrive`:"
            "java : $j"
          )
          New-Item -ItemType Directory -Force analysis | Out-Null
          ($lines -join "`n") | Add-Content analysis/RUNNER-PROBE.md
          git config user.name "pc-probe"; git config user.email "pc@functity.local"
          git add analysis/RUNNER-PROBE.md
          git commit -qm "probe PC: $env:COMPUTERNAME"
          git pull -q --no-rebase origin $env:GITHUB_REF_NAME 2>$null
          git push -q origin HEAD:$env:GITHUB_REF_NAME
