name: FUNCITY-SMOKE
# Smoke-only: porneste JAR-ul din functity-out (builderul nostru sau official 1237),
# il lasa sa dea Done, trimite 'version' pe consola prin fifo, verdict pe annotatie.
on:
  push:
    paths:
      - deploy/functity-smoke.txt

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cheia smok-ului (care jar)
        id: key
        run: |
          echo "JARKEY=$(head -1 $GITHUB_WORKSPACE/../deploy-key 2>/dev/null || true)" >> "$GITHUB_ENV" || true
      - name: Adu jar-urile de pe functity-out
        run: |
          set -e
          git clone -q --depth 1 -b functity-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" out
          mkdir -p /tmp/smoke
          cp out/builds/b0/FunCity-1.16.5-b0.jar out/builds/b0/mohist-1.16.5-1237-server.jar /tmp/smoke/ 2>/dev/null || true
          ls -la /tmp/smoke
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - name: Smoc builder + console bukkit
        run: |
          set +e
          cd /tmp/smoke
          for NAME in FunCity-1.16.5-b0 mohist-1.16.5-1237-server; do
            J=/tmp/smoke/$NAME.jar
            [ -f "$J" ] || { echo "LIPSA $NAME"; continue; }
            rm -rf w-$NAME; mkdir -p w-$NAME; cd w-$NAME
            printf 'online-mode=false\nview-distance=4\nsimulation-distance=4\nlevel-type=minecraft\\:flat\nmax-world-size=128\nspawn-protection=0\n' > server.properties
            echo eula=true > eula.txt
            mkfifo cmd.in
            ( for i in $(seq 1 40); do sleep 10; if grep -qa "Done (" boot.log; then echo version; sleep 20; echo stop; break; fi; done ) &
            timeout 600 java -Xms1536M -Xmx1536M -jar "$J" --nogui < cmd.in > boot.log 2>&1
            D=$(grep -aoE "Done \([0-9.]+s\)! For help" boot.log | tail -1)
            V=$(grep -a "This server is running" boot.log | tail -1 | sed 's/\x1b\[[0-9;]*m//g' | head -c 130)
            printf '::warning::smoc %s: done=[%s] bukkit=[%s] marime_jar=%sB\n' "$NAME" "${D:-NUFARACA}" "${V:-nicio linie}" "$(stat -c %s $J)"
            tail -c 1200 boot.log | tr '\n' '~' > /tmp/smoke/tail-$NAME.txt
            printf '::warning::smoc %s cosada: %s\n' "$NAME" "$(head -c 900 /tmp/smoke/tail-$NAME.txt)"
            cd /tmp/smoke
          done
