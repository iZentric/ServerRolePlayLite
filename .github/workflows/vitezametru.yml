name: VITEZAMETRUL (TPS+RAM live de pe host, din log)
on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths: [ "deploy/vitezametru-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  citeste:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Extrage bataile TPS-ului din latest.log
        env:
          SFTP_HOST: node12.zampto.net
          SFTP_PORT: "2022"
          SFTP_USER: 15254.1388b9af
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          mkdir -p run analysis
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get logs/latest.log -o run/latest.log;
            bye"
          {
            echo "# Vitezametru CUANTIC — ultima citire $(date -u '+%F %T UTC')"
            echo
            echo "| timp | TPS 1m/5m/15m | RAM |"
            echo "|---|---|---|"
            grep -E "TPS from last" run/latest.log | tail -8 | sed -E 's/^\[([0-9:]+)\].*last 1m\/5m\/15m: ([0-9.,* ]+) .*/|\1 |\2 |/' > /tmp/a.txt
            grep -E "Current Memory Usage" run/latest.log | tail -8 | grep -oE "[0-9]+\/[0-9]+ mb" > /tmp/b.txt
            for i in 1 2 3 4 5 6 7 8; do
              A=$(sed -n "${i}p" /tmp/a.txt); B=$(sed -n "${i}p" /tmp/b.txt)
              [ -n "$A" ] && echo "$A $B |" | sed 's/ | \([0-9/]* mb\) |/ | \1 |/'
            done
            echo
            N=$(grep -E "TPS from last" run/latest.log | tail -1 | grep -oE "[0-9]+\.[0-9]," | head -1 | tr -d ,)
            echo "- Ultima fereastra 1m: $N / 20"
            if [ -n "$N" ]; then
              python3 -c "import sys; print('- ALERTA sub 18 TPS: **' + ('DA' if $N < 18 else 'NU') + '**')"
            fi
            echo "- Evenimente join/leave in log: $(grep -cE 'entered the game|lost connection' run/latest.log)"
            echo "- Linii [ERROR] in log: $(grep -cE '[[]ERROR[]]' run/latest.log)"
          } > analysis/viteza-live.md
          cat analysis/viteza-live.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/viteza-live.md
          git commit -m "vitezametru: citire" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
