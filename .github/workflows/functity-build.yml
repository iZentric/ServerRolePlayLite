name: FUNCITY-BUILD
# Build 0 = referinta: Mohist 1.16.5 la commit fixat, compilat reproducibil pe runner
# curat. Fara patch-uri FunCity in acest tur (incă). Arunca JAR-ul + logul + metadata
# pe bransa functity-out; de acolo le citesc si decidem pasul cu patch-urile.
on:
  push:
    paths:
      - deploy/functity-build.txt
      - .github/workflows/functity-build.yml
      - functity/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MOHIST_PIN: 754b578ef3e4881d854bcd1df5d299ada3fd429f
    steps:
      - name: Adu sursa la commit fixat
        run: |
          set -euo pipefail
          git clone -q --branch 1.16.5 https://github.com/MohistMC/Mohist src
          git -C src fetch -q --tags origin || true
          git -C src checkout -q "$MOHIST_PIN"
          git -C src log -1 --format='pin: %H %ci %s' | head -1
          shopt -s nullglob
          PATCHES=(functity/patches/*.patch)
          if [ ${#PATCHES[@]} -gt 0 ]; then
            git -C src apply --check "${PATCHES[0]}" 2>/tmp/applycheck.txt || { echo "PATCH respins:"; cat /tmp/applycheck.txt; exit 1; }
            for pt in "${PATCHES[@]}"; do git -C src apply "$pt" && echo "aplicat: $(basename "$pt")"; done
            echo "BUILD_ID=b$(( ${#PATCHES[@]} )).$(git -C src rev-parse --short HEAD | tail -c5)" >> "$GITHUB_ENV"
          else
            echo "BUILD_ID=b0" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compileaza
        continue-on-error: true
        run: |
          set -uo pipefail
          cd src
          chmod +x gradlew
          /usr/bin/time -v ./gradlew build -x test --no-daemon --max-workers=4 > ../build-out.log 2>&1
          echo "gradle exit: $?" | tee -a ../build-out.log
          tail -5 ../build-out.log

      - name: Colecteaza artefactele
        run: |
          set -uo pipefail
          mkdir -p /tmp/fc
          JAR=$(find src/build src/run -name '*.jar' -size +5M -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
          if [ -n "${JAR:-}" ]; then
            cp "$JAR" "/tmp/fc/FunCity-1.16.5-${BUILD_ID:-b0}.jar"
            ( cd /tmp/fc && sha256sum "FunCity-1.16.5-${BUILD_ID:-b0}.jar" > SHA256SUMS.txt )
            JNAME=$(basename "$JAR")
          else
            echo "NICIUN JAR GASIT" > /tmp/fc/ESUARE.txt
            find src -name '*.jar' 2>/dev/null | head -20 >> /tmp/fc/ESUARE.txt || true
          fi
          tail -c 350000 build-out.log > /tmp/fc/BUILD-LOG.txt 2>/dev/null || cp src/build-out.log /tmp/fc/BUILD-LOG.txt 2>/dev/null || echo "log pierdut" > /tmp/fc/BUILD-LOG.txt
          {
            echo "{"
            echo "  \"build\": \"b0-baseline\","
            echo "  \"mohist_pin\": \"$MOHIST_PIN\","
            echo "  \"jar\": \"${JNAME:-niciunul}\","
            echo "  \"data_utc\": \"$(date -u '+%F %T')\","
            echo "  \"runner\": \"ubuntu-24.04 hosted\","
            echo "  \"java\": \"$(java -version 2>&1 | head -1 | tr -d '"')\""
            echo "}"
          } > /tmp/fc/metadata.json
          ls -la /tmp/fc

      - name: Publica faza 1 (diagnostice) pe functity-out
        run: |
          set +e
          exec > >(tee -a /tmp/fc/PUBLISH-DEBUG.txt) 2>&1
          [ -d /tmp/fc ] || { mkdir -p /tmp/fc; echo "nu exista /tmp/fc" > /tmp/fc/ESUARE.txt; }
          dbg() { echo "$(date -u +%T) $*" >> /tmp/fc/PUBLISH-DEBUG.txt; }
          dbg "fisiere: $(ls -la /tmp/fc | wc -l) bucati, jar: $(ls /tmp/fc/*.jar 2>/dev/null | head -1)"
          cd "$GITHUB_WORKSPACE" || exit 0
          git config user.name 'functity-ci[bot]'
          git config user.email 'functity-ci@localhost'
          if ! git ls-remote --exit-code origin refs/heads/functity-out >/dev/null 2>&1; then
            dbg "ramura noua: creez radacina"
            root=$(git commit-tree "$(git hash-object -w -t tree --stdin </dev/null)" -m "functity-out: radacina")
            dbg "root=$root"
            git push origin "$root:refs/heads/functity-out" && dbg "radacina impinsa" || dbg "IMPINGERE RADACINA ESUATA"
          fi
          git fetch origin refs/heads/functity-out && dbg "fetch ok: $(git rev-parse FETCH_HEAD | head -c8)" || dbg "FETCH ESUAT"
          git worktree prune
          rm -rf /tmp/wtf
          git worktree add /tmp/wtf --detach FETCH_HEAD || dbg "WORKTREE ESUAT"
          D="/tmp/wtf/builds/${BUILD_ID:-b0}"
          mkdir -p "$D"
          cp /tmp/fc/PUBLISH-DEBUG.txt /tmp/fc/ESUARE.txt /tmp/fc/metadata.json /tmp/fc/BUILD-LOG.txt /tmp/fc/SHA256SUMS.txt "$D/" 2>/dev/null
          dbg "continut D:"; ls -la "$D"
          git -C /tmp/wtf add -A "builds/${BUILD_ID:-b0}"
          git -C /tmp/wtf -c commit.gpgsign=false commit -m "functity ${BUILD_ID:-b0}: loguri si diagnostice" || dbg "COMMIT ESUAT (nimic nou?)"
          for i in 1 2 3; do
            git -C /tmp/wtf push origin HEAD:refs/heads/functity-out && { dbg "PUSH1 OK"; break; }
            dbg "push reincercare $i"
            git -C /tmp/wtf pull -q --rebase origin functity-out || true
            git -C /tmp/wtf push origin HEAD:refs/heads/functity-out || dbg "PUSH1 TOT ESUAT"
          done
          git -C "$GITHUB_WORKSPACE" worktree remove --force /tmp/wtf || true
          exit 0

      - name: Publica faza 2 (JAR)
        run: |
          set +e
          JAR=$(ls /tmp/fc/FunCity-*.jar 2>/dev/null | head -1)
          [ -n "$JAR" ] || { echo "fara jar, sar peste"; exit 0; }
          cd "$GITHUB_WORKSPACE"
          git fetch origin refs/heads/functity-out
          git worktree prune; rm -rf /tmp/wtf2
          git worktree add /tmp/wtf2 --detach FETCH_HEAD || { echo "worktree esuat"; exit 0; }
          D="/tmp/wtf2/builds/${BUILD_ID:-b0}"
          mkdir -p "$D"
          cp "$JAR" /tmp/fc/SHA256SUMS.txt "$D/"
          git -C /tmp/wtf2 add -A "builds/${BUILD_ID:-b0}"
          git -C /tmp/wtf2 -c user.name='functity-ci[bot]' -c user.email='functity-ci@localhost' -c commit.gpgsign=false commit -m "functity ${BUILD_ID:-b0}: JAR" || echo "nimic nou"
          git -C /tmp/wtf2 push origin HEAD:refs/heads/functity-out || { git -C /tmp/wtf2 pull -q --rebase origin functity-out || true; git -C /tmp/wtf2 push origin HEAD:refs/heads/functity-out; }
          git -C "$GITHUB_WORKSPACE" worktree remove --force /tmp/wtf2 || true
          exit 0
