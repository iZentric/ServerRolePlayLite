name: FunCity - safe source build failure triage
# One-time public-source build diagnostic on GitHub-hosted Ubuntu. Read ONLY
# logs of the known failed source-only run; never fetch private PC/host data.
# Raw logs stay in RUNNER_TEMP and are never uploaded or printed.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/funcity-source-build-triage.yml
      - scripts/fc_funcity_build_log_triage.py
      - scripts/fc_funcity_build_log_triage_test.py
permissions:
  contents: read
  actions: read
jobs:
  public-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify redacted classifier using artificial logs
        run: python3 scripts/fc_funcity_build_log_triage_test.py
      - name: Classify failed pinned CatServer source build without showing its log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/funcity-build-private.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/120549240877/logs" > "$log"
          test -s "$log"
          python3 scripts/fc_funcity_build_log_triage.py "$log"
          rm -f "$log"
