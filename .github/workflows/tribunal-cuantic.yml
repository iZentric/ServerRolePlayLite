name: TRIBUNAL CUANTIC — toti hibrizii 1.16.5 de pe planeta
# Regula: acelasi set de 32 moduri + 9 pluginuri (zipul CUANTIC), DOAR jarul se schimba.
# Fingerprint obligatoriu: md5 + nume jar in log. Descarcare esuata = rand ROSU, nu fallback.
on:
  push:
    paths: [ "deploy/tribunal-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "TENET-MOHIST",   art: "maven" }
          - { id: "CATSERVER-OFICIAL", art: "ghurl", url: "https://github.com/Luohuayu/CatServer/releases/download/23.05.26-1/CatServer-1.16.5-1d8d6313-server.jar" }
          - { id: "CATSERVER-EVOKODE", art: "custom" }
          - { id: "ARCLIGHT-OFICIAL", art: "ghurl", url: "https://github.com/IzzelAliz/Arclight/releases/download/1.16%2F1.0.25/arclight-forge-1.16.5-1.0.25.jar" }
          - { id: "ARCLIGHT-CHATNAUT", art: "ghrel", repo: "Chatnaut/Arclight", ref: "latest" }
          - { id: "MIST-33",        art: "ghurl", url: "https://github.com/MinecraftMist/Mist/releases/download/1.16.5-33/mist-1.16.5-33-server.jar" }
          - { id: "MAGMA-FORGE",    art: "magma" }
          - { id: "ARCLIGHT-CITY",  art: "ghrel", repo: "DexterHuang/Arclight-City", ref: "latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Monta baza CUANTIC (moduri+pluginuri identice) + jarul candidatului
        env:
          GH_TOKEN: ${{ github.token }}
          ART: ${{ matrix.art }}
          URL: ${{ matrix.url }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
        run: |
          set +e
          mkdir -p srv cand
          gh release download lite -R "$GITHUB_REPOSITORY" -p '*Server-CatServer*.zip' -O srv.zip
          (cd srv && unzip -q ../srv.zip)
          case "$ART" in
            custom)
              gh release download custom -R "$GITHUB_REPOSITORY" -p '*.jar' -O cand/cand.jar
              ;;
            ghurl)
              curl -sL --max-time 180 -o cand/cand.jar "$URL"
              ;;
            ghrel)
              gh release download "$REF" -R "$REPO" -p '*.jar' -O cand/cand.jar 2>/dev/null \
                || gh release download -R "$REPO" -p '*.jar' -O cand/cand.jar 2>/dev/null
              ;;
            maven)
              for A in Tenet-1.16.5 Mohist-1.16.5; do
                MJ=$(curl -s --max-time 30 "https://maven.mohistmc.com/com/mohistmc/$A/maven-metadata.xml" | grep -oE '<latest>[^<]+' | cut -d'>' -f2)
                [ -n "$MJ" ] || continue
                curl -sL --max-time 240 -o cand/cand.jar "https://maven.mohistmc.com/com/mohistmc/$A/$MJ/$A-$MJ.jar" && \
                  head -c2 cand/cand.jar | grep -q PK && { echo "$A $MJ" > cand/cand.name; break; }
              done
              ;;
            magma)
              for U in "https://magmafork.com/api/download/latest/1.16.5" "https://www.magmafork.com/api/download/latest/1.16.5" "https://magmafork.com/download/1.16.5"; do
                curl -sL --max-time 120 -o cand/cand.jar "$U" && head -c2 cand/cand.jar | grep -q PK && { echo "magma $U" > cand/cand.name; break; }
              done
              ;;
          esac
          if head -c2 cand/cand.jar 2>/dev/null | grep -q PK && [ "$(stat -c%s cand/cand.jar)" -gt 500000 ]; then
            rm -f srv/*.jar
            cp cand/cand.jar srv/server.jar
            [ -f cand/cand.name ] && cp cand/cand.name srv/CANDIDAT.txt
            sed -i -E "s|-jar [^ ]+\.jar|-jar server.jar|" srv/unix_args.txt
            echo "ARTIFACT-OK" > /tmp/gate
            md5sum srv/server.jar | cut -d' ' -f1 > /tmp/md5
            stat -c%s srv/server.jar > /tmp/size
          else
            echo "ARTIFACT-LIPSA" > /tmp/gate
            echo "$ART a picat: niciun jar valid descarcabil" > /tmp/md5
            echo "0" > /tmp/size
          fi
      - name: Porne-ste si masora (RAM de varf + timp Done + plugini/moduri/erori)
        run: |
          set +e
          [ "$(cat /tmp/gate)" = "ARTIFACT-OK" ] || { echo "SARI PESTE (fara artefact)"; exit 0; }
          cd srv
          echo "eula=true" > eula.txt
          NumeCandidat=$(cat CANDIDAT.txt 2>/dev/null || echo "?(din url)")
          java -Xms512M @unix_args.txt < /dev/null > boot.log 2>&1 &
          JP=$!
          MAXRSS=0
          T0=$(date +%s)
          DONE=""
          for k in $(seq 1 120); do
            kill -0 $JP 2>/dev/null || break
            RSS=$(ps -o rss= -p $JP 2>/dev/null | awk '{print int($1/1024)}')
            [ -n "$RSS" ] && [ "$RSS" -gt "$MAXRSS" ] && MAXRSS=$RSS
            if [ -z "$DONE" ] && grep -q "Done (" boot.log 2>/dev/null; then
              DONE=$(grep -m1 -oE "Done \([0-9.]+s\)" boot.log)
              T1=$(date +%s); DUR=$((T1-T0))
              sleep 25
              kill $JP 2>/dev/null; sleep 2; kill -9 $JP 2>/dev/null
              break
            fi
            sleep 2
          done
          [ -z "$DONE" ] && DONE="NICIODATA"
          PLGI=$(grep -cE "\]: \[[A-Za-z]+\] Enabling" boot.log)
          MODURI=$(grep -m1 -oE "Loading [0-9]+ mods|loaded [0-9]+ mods" boot.log | grep -oE "[0-9]+" | head -1)
          PROCE=$(grep -c "ERROR" boot.log)
          mkdir -p ../analysis/tribunal
          {
            echo "# ${{ matrix.id }}"
            echo "- ARTIFACT: $(cat /tmp/md5) md5, $(cat /tmp/size) bytes, $NumeCandidat"
            echo "- STATUS: $([ "$DONE" = NICIODATA ] && echo CRAPAT/NU-PORNESTE || echo PORNIT)"
            echo "- DONE: $DONE (timp real ${DUR:-?}s, RAM varf ${MAXRSS}MB, plugini ${PLGI:-0}, jar-mods ${MODURI:-?}, linii ERROR: ${PROCE:-0})"
            echo '```'
            grep -m3 -iE "mohist|tenet|arclight|catserver|mist|magma" boot.log | head -3
            grep -m4 "ERROR" boot.log | head -4
            echo '```'
          } > "../analysis/tribunal/${{ matrix.id }}.md"
          cd "$GITHUB_WORKSPACE"
          for inc in 1 2 3 4 5; do
            git -c user.name=bot -c user.email=bot@bot add -f analysis/tribunal/ 2>/dev/null
            git -c user.name=bot -c user.email=bot@bot commit -m "tribunal: ${{ matrix.id }}" 2>/dev/null || break
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "$GITHUB_REF_NAME" && break
            sleep $((RANDOM % 8 + 2))
          done
      - name: Curata chiflele in caz de esec
        if: failure()
        run: |
          mkdir -p analysis/tribunal
          echo "# ${{ matrix.id }}" > "analysis/tribunal/${{ matrix.id }}.md"
          echo "- STATUS: JOB-ESUAT (fara verdict)" >> "analysis/tribunal/${{ matrix.id }}.md"
          git -c user.name=bot -c user.email=bot@bot add -f analysis/tribunal/
          git -c user.name=bot -c user.email=bot@bot commit -m "tribunal: ${{ matrix.id }} esuat" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
  tablou:
    needs: probe
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tabloul final CUANTIC
        run: |
          set +e
          {
            echo "# ⚛️ TABLOUL CUANTIC — tribunalul tuturor hibrizilor 1.16.5"
            echo "_Generat: $(date -u '+%F %T UTC') — baza comuna: 32 moduri + 9 pluginuri CUANTIC 1.5.6, Java 17, -Xmx identic, RAM = varf_ "
            echo
            echo "| Probă | Verdict | Done | RAM vârf | Plugini | Erori |"
            echo "|---|---|---|---|---|---|"
            for F in analysis/tribunal/*.md; do
              ID=$(basename "$F" .md)
              ST=$(grep -m1 "STATUS" "$F" | sed 's/.*STATUS: //;s/\*//g')
              DT=$(grep -m1 "DONE" "$F" | sed 's/.*DONE: //;s/ (.*//')
              EXTRA=$(grep -m1 "DONE" "$F" | grep -oE "RAM varf [0-9]+MB, plugini [0-9]+, jar-mods [0-9?]+, linii ERROR: [0-9]+" )
              echo "| $ID | $ST | $DT | $EXTRA |"
            done
            echo
            echo "Regula CUANTIC: castigatorul trebuie sa invinga campionul cu numere, altfel campionul ramane."
          } > docs/TRIBUNAL-CUANTIC.md
          cat docs/TRIBUNAL-CUANTIC.md
          git -c user.name=bot -c user.email=bot@bot add -f docs/TRIBUNAL-CUANTIC.md
          git -c user.name=bot -c user.email=bot@bot commit -m "tribunal: tabloul cuantic final" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
