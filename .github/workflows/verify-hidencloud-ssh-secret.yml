name: Verify HidenCloud SSH secret without revealing it
# Trigger only on this workflow's change. No checkout, artifacts or network access to host.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/verify-hidencloud-ssh-secret.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify secret presence and matching public key only
        env:
          PRIVATE_KEY: ${{ secrets.FUNCITY_HIDENCLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo '::error title=HidenCloud SSH secret::NOT_PRESENT'
            exit 2
          fi
          key_file=$(mktemp "$RUNNER_TEMP/fc-ssh-key-XXXXXX")
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$key_file"
          actual=$(ssh-keygen -y -P '' -f "$key_file" 2>/dev/null | awk '{print $2}') || {
            echo '::error title=HidenCloud SSH secret::UNREADABLE_PRIVATE_KEY'
            exit 2
          }
          expected='AAAAC3NzaC1lZDI1NTE5AAAAIM25Ri3sNCuYzBIPpErBs3rwDSdDM3BWn5qUcgQRMfJy'
          if [ "$actual" != "$expected" ]; then
            echo '::error title=HidenCloud SSH secret::DOES_NOT_MATCH_PC_PUBLIC_KEY'
            exit 2
          fi
          echo '::notice title=HidenCloud SSH secret::PRESENT_AND_MATCHES_PC_PUBLIC_KEY; host login NOT tested'
