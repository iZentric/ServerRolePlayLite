name: test-server

# TRIBUNALUL JARURILOR: testeaza TOATE variantele de server pe Java-ul Zampto
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/test-trigger.txt"

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [Mist, Arclight, CatServer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - name: Descarca varianta ${{ matrix.variant }}
        run: |
          gh release download lite -R ${{ github.repository }} -p '*Server-${{ matrix.variant }}*.zip' -O srv.zip
          mkdir srv && cd srv && unzip -q ../srv.zip
          echo "eula=true" > eula.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PORNESTE serverul ${{ matrix.variant }}
        run: |
          cd srv
          V="${{ matrix.variant }}"
          if [ "$V" = "Mist" ]; then
            # OPERATIA LAZARUS: transplant ModLauncher 8.1.3 (vindecat de Forge pt Java modern)
            # peste toate versiunile pe care le-ar cauta Mist - downloaderul sare ce exista deja
            curl -sL -o /tmp/ml.jar https://maven.minecraftforge.net/cpw/mods/modlauncher/8.1.3/modlauncher-8.1.3.jar
            for mlv in 8.0.9 8.0.10 8.1.0 8.1.3; do
              mkdir -p libraries/cpw/mods/modlauncher/$mlv
              cp /tmp/ml.jar libraries/cpw/mods/modlauncher/$mlv/modlauncher-$mlv.jar
            done
            # LAZARUS 2: taiem telefonul spre casa (update-checker mort din 2021)
            mkdir -p mohist-config
            printf 'check_update: false\n' > mohist-config/mohist.yml
            ls -la libraries/cpw/mods/modlauncher/*/
            # LAZARUS 4: CHIRURGIE PE JAR - daca modlauncher e cusut IN jarul Mist,
            # scoatem clasele bolnave si coasem inauntru pe cele vindecate din 8.1.3
            MJ=$(ls mist-*.jar | head -1)
            echo "== continut modlauncher in $MJ:"
            unzip -l "$MJ" | grep -cE "cpw/mods/modlauncher" || true
            if unzip -l "$MJ" | grep -qE "cpw/mods/modlauncher/SecureJarHandler"; then
              echo "== SHADED GASIT - operam pe jar"
              mkdir -p /tmp/mlfix && (cd /tmp/mlfix && unzip -oq /tmp/ml.jar 'cpw/*')
              zip -dq "$MJ" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
              zip -dq "$MJ" 'cpw/mods/modlauncher/*' 2>/dev/null || true
              (cd /tmp/mlfix && zip -rq "$OLDPWD/$MJ" cpw)
              echo "== transplant intern terminat"
            fi
          fi
          START=$(date +%s)
          mkfifo in
          exec 3<> in
          if [ "$V" = "Mist" ]; then
            # LAZARUS 6: faza 1 - wrapperul doar INSTALEAZA (moare la start, nu conteaza)
            timeout 420 java -Dterminal.jline=false -jar "$MJ" nogui >> boot.log 2>&1 || true
            echo "== INSTALARE TERMINATA, pornim DIRECT ServerMain (fara paznic) ==" >> boot.log
            # faza 2 - motorul pornit direct, cu comanda smulsa din manifest; erorile curg goale
            java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false -javaagent:"$MJ" -cp "$MJ" \
              net.minecraftforge.server.ServerMain --gameDir . --launchTarget fmlserver \
              --fml.forgeVersion 36.2.4 --fml.mcpVersion 20210115.111550 \
              --fml.mcVersion 1.16.5 --fml.forgeGroup net.minecraftforge nogui < in >> boot.log 2>&1 &
          else
            java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false @unix_args.txt < in > boot.log 2>&1 &
          fi
          JPID=$!
          STATUS=TIMEOUT
          for i in $(seq 1 100); do
            if grep -q 'Done (' boot.log 2>/dev/null; then STATUS=PORNIT; break; fi
            if ! kill -0 $JPID 2>/dev/null; then STATUS=CRAPAT; break; fi
            sleep 10
          done
          T=$(( $(date +%s) - START ))
          RAM="n/a"
          kill -0 $JPID 2>/dev/null && RAM=$(( $(ps -o rss= -p $JPID 2>/dev/null || echo 0) / 1024 ))MB
          echo "stop" >&3; sleep 25; kill -9 $JPID 2>/dev/null || true
          {
            echo "# VERDICT ${V} ($(date -u))"
            echo "- REZULTAT: **$STATUS** in ${T}s | RAM: **$RAM**"
            echo "- Done-line:"; grep 'Done (' boot.log | head -2 | sed 's/^/    /' || true
            echo "- Erori cheie:"
            grep -iE "ERROR|FATAL|NoSuchMethod|Exception in thread|Could not load" boot.log | sort | uniq -c | sort -rn | head -12 | sed 's/^/    /' || true
            echo "- Pluginuri pornite:"
            grep -iE "Enabling (AuthMe|SkinsRestorer|FastLogin|ProtocolLib|LuckPerms|Essentials|WorldGuard|spark|Chunky|GriefPrevention|ZNPC|Vault|WorldEdit)" boot.log | head -17 | sed 's/^/    /' || true
          } > ../analysis/test-boot-${V}.md
          tail -200 boot.log > ../analysis/test-boot-${V}-tail.log
          if [ "$V" = "Mist" ]; then
            MJ=$(ls mist-*.jar | head -1)
            { echo "===== DOSAR MIST ====="
              echo "-- MANIFEST:"; unzip -p "$MJ" META-INF/MANIFEST.MF | head -20
              echo "-- clase modlauncher cusute in jar:"; unzip -l "$MJ" | grep -c "cpw/mods/modlauncher" || true
              echo "-- clase mohist/mist wrapper:"; unzip -l "$MJ" | grep -iE "mohistmc|ServerMain|Main\.class" | head -10
              echo "-- jaruri nascute de instalare:"; find libraries -name '*.jar' -path '*forge*' | head -10
              find libraries -name '*.jar' -path '*minecraft*' | head -10
              ls -la *.jar 2>/dev/null
            } >> ../analysis/test-boot-${V}-tail.log 2>&1
          fi
          # autopsia completa: jurnalele interne ale serverului (eroarea reala ascunsa de wrapper)
          for f in $(find . -name '*.log' -not -name boot.log 2>/dev/null | head -6); do
            echo "===== JURNAL INTERN: $f =====" >> ../analysis/test-boot-${V}-tail.log
            tail -60 "$f" >> ../analysis/test-boot-${V}-tail.log
          done
          for f in $(find crash-reports -name '*.txt' 2>/dev/null | head -2); do
            echo "===== CRASH REPORT: $f =====" >> ../analysis/test-boot-${V}-tail.log
            head -60 "$f" >> ../analysis/test-boot-${V}-tail.log
          done
          cat ../analysis/test-boot-${V}.md
      - name: Publica verdictul
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          for t in 1 2 3 4 5; do
            git add analysis/ || true
            git commit -m "analysis: verdict ${{ matrix.variant }}" || true
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((RANDOM % 15 + 3))
          done
