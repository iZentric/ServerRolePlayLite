name: test-server

# BANCUL DE PROBE: porneste serverul Mist EXACT ca pe Zampto si raporteaza
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/test-trigger.txt"

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - name: Descarca serverul Mist din Releases
        run: |
          gh release download lite -R ${{ github.repository }} -p '*Server-Mist*.zip' -O srv.zip
          mkdir srv && cd srv && unzip -q ../srv.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PORNESTE serverul (identic cu Zampto - unix_args.txt)
        run: |
          cd srv
          START=$(date +%s)
          mkfifo in; exec 3> in
          (java -Xms128M -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false @unix_args.txt < in >> boot.log 2>&1; echo EXITED >> boot.log) &
          JPID=$!
          STATUS=TIMEOUT
          for i in $(seq 1 150); do
            if grep -q 'Done (' boot.log; then STATUS=PORNIT; break; fi
            if grep -q EXITED boot.log; then STATUS=CRAPAT; break; fi
            sleep 10
          done
          T=$(( $(date +%s) - START ))
          RAM="n/a"
          PID=$(pgrep -f 'unix_args' | head -1 || true)
          [ -n "$PID" ] && RAM=$(( $(ps -o rss= -p $PID 2>/dev/null || echo 0) / 1024 ))MB
          echo "stop" >&3; sleep 20; exec 3>&-
          {
            echo "# RAPORT BANC DE PROBE ($(date -u))"
            echo "- REZULTAT: **$STATUS** in ${T}s"
            echo "- RAM dupa pornire: **$RAM**"
            echo "- Erori/avertismente importante:"
            grep -iE "ERROR|FATAL|Exception|Could not|Failed to" boot.log | grep -viE "DEBUG" | sort | uniq -c | sort -rn | head -25 | sed 's/^/    /'
            echo '- Pluginurile incarcate:'
            grep -iE "Enabling|Loading.*plugin" boot.log | head -20 | sed 's/^/    /'
          } > ../analysis/test-boot-report.md
          tail -200 boot.log > ../analysis/test-boot-tail.log
          cat ../analysis/test-boot-report.md
      - name: Publica raportul
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/test-boot-report.md analysis/test-boot-tail.log || true
          git commit -m "analysis: raport banc de probe" || echo nimic
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
