name: Generate HidenCloud SSH public key on owner PC
# A push on the fixed branch creates only a local client key on the Windows runner.
# The PRIVATE key must NEVER appear in logs, artifacts, or commits.
# On a separate explicit user request, the existing PC identity may be stored
# client-side encrypted in GitHub Actions Secrets if PC-side gh auth permits it.
# Treat this as an automation credential: workflows on this PC can use it.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/pc-hidencloud-ssh-key.yml
      - scripts/fc_pc_hidencloud_ssh_key.ps1
permissions:
  contents: read
jobs:
  key-on-pc:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax before modifying the user profile
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/fc_pc_hidencloud_ssh_key.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw 'SSH_KEY_SCRIPT_SYNTAX_FAILED' }
      - name: Generate or verify a dedicated client key; publish PUBLIC key only
        shell: powershell
        run: |
          & ./scripts/fc_pc_hidencloud_ssh_key.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
