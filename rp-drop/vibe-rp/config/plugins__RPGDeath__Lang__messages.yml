# {PREFIX} va fi înlocuit cu prefixul
# {C1} va fi înlocuit cu prima culoare
# {C2} va fi înlocuit cu a doua culoare
# {CR} va fi înlocuit cu culoarea pentru EROARE


#---------------------( General )---------------------#


#Prefixul pluginului
#Variabilă Internă > {PREFIX}
