name: A1-QUOTA — cer singuri cresterea de limita ARM prin API
on:
  push:
    paths: [ "deploy/quota.txt" ]
permissions:
  contents: write
jobs:
  cere:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ruleaza QMS cu python-ul CLI-ului
        run: |
          set +e
          PYPY=$(head -1 "$(which oci)" 2>/dev/null | sed 's/^#!//' | tr -d '\r')
          echo "pymodal din shebang: $PYPY"
          "$PYPY" -c "import oci" 2>/dev/null || PYPY=$(for c in ~/.local/lib/oracle-cli/bin/python3 /usr/lib/oracle/oci-cli*/bin/python3 /opt/oci-cli/bin/python3; do [ -x "$c" ] && "$c" -c "import oci" 2>/dev/null && echo "$c" && break; done)
          echo "python folosit: $PYPY"
          "$PYPY" scripts/qms.py > /tmp/qms-run.txt 2>&1; echo "rc=$?" >> /tmp/qms-run.txt; tail -60 /tmp/qms-run.txt
          mkdir -p analysis
          { echo "# A1-QUOTA (QMS prin SDK) — $(date -u '+%F %T UTC')"; echo; echo '```'; { cat /tmp/qms.txt 2>/dev/null; echo; echo "---- iesire bruta:"; cat /tmp/qms-run.txt 2>/dev/null; } | head -70; echo '``'; echo '``'; } > analysis/a1-quota.md
          cat analysis/a1-quota.md
          git config user.name "quota-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/a1-quota.md
          git commit -m "a1-quota: rulare QMS" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true

