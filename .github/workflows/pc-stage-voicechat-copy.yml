name: Stage Lite voicechat on private no-Clumps server copy
# No second server, live JAR edits, Prism writes, or uploads.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/pc-stage-voicechat-copy.yml
      - scripts/fc_stage_voicechat_on_copy.ps1
      - scripts/fc_stage_voicechat_on_copy_test.ps1
permissions:
  contents: read
concurrency:
  group: funcity-maintenance-one-at-a-time
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic private voicechat copy and original-preservation fixture
        shell: pwsh
        run: ./scripts/fc_stage_voicechat_on_copy_test.ps1
  pc-copy-only:
    needs: guards
    runs-on: [self-hosted, Windows]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Add exact Lite voicechat jar only to already verified private compatibility copy
        shell: powershell
        run: |
          $profile='C:\Users\Administrator\AppData\Roaming\PrismLauncher\instances\FunCity RP Lite'
          $server='C:\Users\Administrator\Desktop\FunCityLocal\server'
          & ./scripts/fc_stage_voicechat_on_copy.ps1 -Profile $profile -Server $server -CopyRunId '39598696934'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
