name: FC-BENCH
# v4 — banca de MASURARE (v1-v3 masurau instalarea bootstrap-ului si/sau mergeau cu
# jar-uri false + java 17; acum: acelasi harness 2-faze validat de FC-SMOKE36, java 11,
# pack 36/14 neschimbat cu SHA fix, 4 braate in paralel, 3 probe boot-la-cald pe world
# comun, probe de login protocol 1.16.5, esantionare TPS/MSPT prin consola, "Can't keep
# up!" numarata, RSS/CPU, jurnal GC). Practici noi de CI: pasul de garda esueaza chior
# (fara exit-0 mascat), rapoarte JSON + loguri pe functity-out, verdict doar din cifre.
on:
  push:
    paths:
      - deploy/fc-bench.txt
      - .github/workflows/fc-bench.yml
      - benches/functity/arms/**
      - scripts/fc_bench.py

permissions:
  contents: write

jobs:
  leg:
    name: FC-BENCH36 ${{ matrix.arm.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.arm.budget_min }}
    strategy:
      fail-fast: false
      matrix:
        arm:
          - { id: oficial1237, conf: oficial, jar: "https://repo1.maven.org/maven2/com/mohistmc/mohist/1.16.5-1237/mohist-1.16.5-1237-server.jar", sha: "17d08ed544aab50f0c9c0281507a44d765cfeb371289a10d47e2143146255bff", budget_min: 120 }
          - { id: functity_b0, conf: functity_b0, jar: "AUTO-B0", sha: "248fb54d4a97d8396a45e3edf859a19275c67c81e6115ca219ece5ebb0ef7f79", budget_min: 120 }
          - { id: functity_b1, conf: functity_b1, jar: "AUTO-B1", sha: "6a63721c376ffb48d2fbff9c5bba425c9c69b9b9392bb543a53af64f70a98194", budget_min: 120 }
          - { id: catserver, conf: catserver, jar: "PACK", sha: "", budget_min: 150 }
    env:
      TRIALS: "3"
      RUN_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Testele de garda (iesirea nenula = alergarea cade, nu se maschcheaza)
        run: python3 -m unittest discover -s tests -q

      - name: Packul de referinta, cu pază de SHA
        run: |
          set -uo pipefail
          mkdir -p /tmp/fcb
          diag() { printf '::error::%s\n' "$*" | tr ':' ' '; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          AID=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/lite --jq '.assets[] | select(.name=="CUANTIC-Server-CatServer-1.7.7.zip") | .id' 2>/tmp/fcb/api-err.txt) || true
          [ -n "$AID" ] || diag "fara asset id (gh api): $(tr '\n' '|' < /tmp/fcb/api-err.txt | cut -c1-200)"
          DL=""
          for i in 1 2 3 4 5 6; do
            OUT=$(gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -D /tmp/fcb 2>&1) && DL=gh || true
            [ "$DL" = gh ] && break
            printf 'gh#%s: %s | ' "$i" "$(printf '%s' "$OUT" | tr '\n' '|' | cut -c1-140)" >> /tmp/fcb/dl-err.txt
            if [ -n "$AID" ]; then
              if curl -fsSL --retry 2 --retry-delay 5 -H "Authorization: Bearer $(gh auth token)" -H "Accept: application/octet-stream" -o /tmp/fcb/pack.zip "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AID" 2>>/tmp/fcb/dl-err.txt; then DL=curl; break; fi
            fi
            sleep $((i*10))
          done
          if [ "$DL" != gh ] && [ "$DL" != curl ]; then
            diag "pack: 5 incercari esuate.detaileri: $(cut -c1-700 /tmp/fcb/dl-err.txt 2>/dev/null)"
            exit 1
          fi
          if ! echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  /tmp/fcb/pack.zip" | sha256sum -c - >/tmp/fcb/pack-check.txt 2>&1; then
            diag "pack SHA nepotrivit: $(tail -1 /tmp/fcb/pack-check.txt) (dl=$DL)"
            exit 1
          fi
          echo "pack ok prin $DL: $(ls -la /tmp/fcb/pack.zip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Jarul bratului, cu pază de SHA
        run: |
          set -uo pipefail
          diag() { printf '::error::%s\n' "$*" | tr ':' ' '; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          ARM='${{ matrix.arm.id }}'
          case "$ARM" in
            catserver) echo "brat catserver: foloseste jarul din pack" >> "$GITHUB_STEP_SUMMARY"; exit 0;;
            oficial1237)
              if ! curl -fsSL --retry 4 --retry-delay 10 -o /tmp/fcb/arm.jar '${{ matrix.arm.jar }}' 2>/tmp/fcb/curl-err.txt; then
                diag "jar oficial descarcare esuata: $(tr '\n' '|' < /tmp/fcb/curl-err.txt | cut -c1-300)"
                exit 1
              fi;;
            functity_b0) REF='builds/b0/FunCity-1.16.5-b0.jar';;
            functity_b1) REF='builds/b1.2256/FunCity-1.16.5-b1.2256.jar';;
            *) diag "brat necunoscut $ARM"; exit 1;;
          esac
          if [ "$ARM" != "oficial1237" ]; then
            if ! git clone -q --depth 1 -b functity-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" /tmp/fcb/out 2>/tmp/fcb/clone-err.txt; then
              diag "clone functity-out esuata: $(tr '\n' '|' < /tmp/fcb/clone-err.txt | cut -c1-300)"
              exit 1
            fi
            if ! cp "/tmp/fcb/out/$REF" /tmp/fcb/arm.jar; then
              diag "lipseste $REF din functity-out: $(ls /tmp/fcb/out/builds 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
          fi
          if ! echo '${{ matrix.arm.sha }}  /tmp/fcb/arm.jar' | sha256sum -c - >/tmp/fcb/arm-check.txt 2>&1; then
            diag "SHA jar brat nepotrivit: $(tail -1 /tmp/fcb/arm-check.txt)"
            exit 1
          fi
          if ! unzip -p /tmp/fcb/arm.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -q 'ServerLaunchArgs'; then
            diag "jar fara manifest ServerLaunchArgs — refuz sa benchesz un ambalaj fals"
            exit 1
          fi



      - name: Gonest pe runner (documentat in raport)
        env: { ARM: '${{ matrix.arm.id }}' }
        run: lscpu | sed -n '1,15p'; free -l | head -2; nproc

      - name: Alergare banca (faza A instalare + 3 probe la cald a 300s)
        env: { ARM: '${{ matrix.arm.id }}' }
        run: |
          set +e
          python3 scripts/fc_bench.py --arm-conf benches/functity/arms/${{ matrix.arm.conf }}.json > /tmp/fcb/driver-$ARM.log 2>&1
          RC=$?
          echo "driver rc=$RC"
          grep -E 'RESUMAT|Traceback|ERROR' /tmp/fcb/driver-$ARM.log | tail -8 >> "$GITHUB_STEP_SUMMARY"
          tail -3 /tmp/fcb/driver-$ARM.log
          if [ ! -f /tmp/fcb/results/${{ matrix.arm.id }}.json ]; then
            echo "::error::bratul ${{ matrix.arm.id }} nu a produs raport (rc=$RC) — ALERGAREA CADE, nu se mascheaza"
            tail -c 4000 /tmp/fcb/results/install.log 2>/dev/null
            exit 1
          fi
          if [ "$RC" -ge 3 ]; then
            echo "::error::bratul ${{ matrix.arm.id }} nu a bootat in nicio proba (rc=$RC) — inregistrat ESUAT_TEHNIC"
          fi

      - name: Verdict pe leg
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path('/tmp/fcb/results/${{ matrix.arm.id }}.json').read_text(encoding='utf-8'))
          parts = [f"status={d.get('status')}", f"probe={d.get('probate_reusite')}/{len(d.get('probe', []))}"]
          for k in ("boot_medie_s", "boot_cv_pct", "join_medie_ms", "tps_p50", "overrun_total", "overrun_max_ms",
                    "critice_total", "rss_medie_mb", "cpu_medie_pct", "gc_pauza_max_ms"):
              if d.get(k) is not None:
                parts.append(f"{k}={d[k]}")
          print("::warning::FC-BENCH ${{ matrix.arm.id }}: " + " ".join(parts))
          if d.get("tps_p50") is None:
              print("::warning::FC-BENCH ${{ matrix.arm.id }}: TPS NEMASURAT prin consola — " + str(d.get("tps_motiv", "")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcbench-${{ matrix.arm.id }}
          path: /tmp/fcb/results/
          if-no-files-found: error
          retention-days: 14

  agregat:
    name: FC-BENCH36 verdict comparat
    needs: leg
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'fcbench-*', path: /tmp/fcb/arms, merge-multiple: true }
      - name: Compara + praguri + publicare pe functity-out
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, pathlib, statistics, sys
          rows = {}
          for f in sorted(pathlib.Path('/tmp/fcb/arms').glob('*.json')):
              d = json.loads(f.read_text(encoding='utf-8'))
              rows[d['arm']] = d
          if not rows:
              print("::error::nicun raport de la legs"); sys.exit(1)
          order = [a for a in ("catserver", "oficial1237", "functity_b0", "functity_b1") if a in rows]
          lines = ["# FC-BENCH v4 — rezultate (masurate, nu estimate)", "",
                   "Metoda: boot la cald, 3 probe/arm, world comun post-instalare, java 11, -Xmx1536M, pack 36/14 cu SHA fix.",
                   "Deviatii declarate: seed fix, online-mode=false pentru probele de login, view-distance=10, check_update=false (Mohist).", ""]
          hdr = ["brat", "stare", "boot_mediu_s", "CV%", "join_mediu_ms", "TPS_p50", "overrun", "overrun_max_ms", "critice", "RSS_MB", "CPU%", "GC_max_ms"]
          lines.append("| " + " | ".join(hdr) + " |")
          lines.append("|" + "---|" * len(hdr))
          for a in order:
              d = rows[a]
              lines.append("| " + " | ".join(str(x) for x in [
                  d.get('eticheta', a), d.get('status'), d.get('boot_medie_s'), d.get('boot_cv_pct'),
                  d.get('join_medie_ms'), d.get('tps_p50'), d.get('overrun_total'), d.get('overrun_max_ms'),
                  d.get('critice_total'), d.get('rss_medie_mb'), d.get('cpu_medie_pct'), d.get('gc_pauza_max_ms')]) + " |")
          # verdicturi comparative, doar unde ambele brațe au MASURAT
          def cmp(metric, a, b, better="lower", pct=True):
              if a in rows and b in rows and rows[a].get(metric) is not None and rows[b].get(metric) is not None:
                  va, vb = rows[a][metric], rows[b][metric]
              else:
                  return f"{metric} {a} vs {b}: NEMASURAT (lipsa date)"
              diff = (va - vb) / vb * 100 if pct and vb else va - vb
              cast = "MAI BINE" if (diff < 0) == (better == "lower") and diff != 0 else ("egal" if diff == 0 else "MAI PROST")
              return f"{metric} {a} vs {b}: {va} vs {vb} ({diff:+.1f}%) — {a} {cast}"
          checks = [
              cmp("boot_medie_s", "functity_b1", "functity_b0"),
              cmp("boot_medie_s", "functity_b0", "oficial1237"),
              cmp("boot_medie_s", "functity_b1", "oficial1237"),
              cmp("join_medie_ms", "functity_b1", "oficial1237", better="lower"),
              cmp("rss_medie_mb", "functity_b1", "oficial1237", better="lower"),
              cmp("tps_p50", "functity_b1", "oficial1237", better="higher"),
              cmp("boot_medie_s", "oficial1237", "catserver"),
          ]
          lines += ["", "## Verdicturi comparative", ""] + [f"- {c}" for c in checks]
          # praguri fixes (acceptante)
          praguri = []
          for a in order:
              d = rows[a]
              cv = d.get("boot_cv_pct")
              praguri.append((f"{a}: boot CV<10%", "TRECUT" if cv is not None and cv < 10 else ("ESUAT" if cv is not None else "NEMĂSURAT")))
              if a == "functity_b1":
                  crit = d.get("critice_total")
                  praguri.append(("functity_b1: 0 erori critice pe 3 probe", "TRECUT" if crit == 0 else ("ESUAT" if crit is not None else "NEMĂSURAT")))
          lines += ["", "## Praguri (fixate INAINTE de rulare)", ""] + [f"- {k}: {v}" for k, v in praguri]
          lines += ["", "## Semnificatie si limite", "",
                    "- 'boot_medie_s' = timp real de pornire pana la 'Done' (Include FML+plugini, world deja existent). Nu e un castig de gameplay.",
                    "- TPS vine din comenzile console; NEMASURAT inseamna ca motorul nu le publica parseabil, NU ca ar fi 20.",
                    "- probele de login masoara intarzierea de logare headless (offline); nu includ ecranul de asset-uri al clientului.",
                    "- overrun = numar de 'Can't keep up!' in fereastra masurata; 0 nu garanteaza absenta sub 120s idle.",
                    ""]
          out = pathlib.Path('/tmp/fcb/ARTEFACT/summary.md'); out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding='utf-8')
          json.dump(rows, open('/tmp/fcb/ARTEFACT/combined.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print("\n".join(lines))
          PY
      - name: Publicare pe functity-out (esec = rosu, nu warn)
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b functity-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" pub
          D="pub/bench-v4/$(date -u +%Y%m%d-%H%M)"
          mkdir -p "$D"
          cp /tmp/fcb/ARTEFACT/summary.md /tmp/fcb/ARTEFACT/combined.json "$D/"
          cp /tmp/fcb/arms/*.json "$D/" 2>/dev/null || true
          cd pub
          git config user.name 'functity-ci[bot]'; git config user.email 'fc@localhost'
          git add -A bench-v4/
          git commit -qm "fc-bench v4 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:refs/heads/functity-out; then echo "publicat in $D"; exit 0; fi
            git pull -q --no-rebase -X theirs origin functity-out && git commit -qm rerere || true
            sleep $((i*7))
          done
          echo "::error::nu am putut publica pe functity-out"; exit 1
