name: VM-CHECK (inventar Oracle + incercare acces)
on:
  push:
    paths: [ "deploy/vm-check.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cauta:
    runs-on: [self-hosted]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Statul VM-ului si cheile
        run: |
          set +e
          mkdir -p analysis
          TEN=ocid1.tenancy.oc1..aaaaaaaanlzitmrgwn5f3g3iyapyiuxt2ayh43u6mdq3nszvcswrkcw5eyfa
          {
            echo "# VM-CHECK"
            echo "## fisier de stare al scriptului (~/cuantic-vm.state):"
            echo '```'
            cat ~/cuantic-vm.state 2>/dev/null || echo "(nu exista — scriptul n-a apucat sa salveze)"
            echo '```'
            echo "## instante compute in tenancy:"
            echo '```'
            oci compute instance list --compartment-id "$TEN" --lifecycle-state RUNNING --output json 2>/dev/null | jq -r '.data[]? | .["display-name"] + " | " + .id + " | " + .["time-created"]'
            oci compute instance list --compartment-id "$TEN" --output json 2>/dev/null | jq -r '.data[]? | .["display-name"] + " | " + .["lifecycle-state"]' | sort -u
            echo '```'
            echo "## chei SSH prezente:"
            ls -la ~/.ssh/ 2>/dev/null
            echo "## detalii instante:"
            for IID in $(oci compute instance list --compartment-id "$TEN" --lifecycle-state RUNNING --output json 2>/dev/null | jq -r '.data[].id'); do
              oci compute instance get --instance-id "$IID" --output json 2>/dev/null | jq -r '.data | "shape: " + .["shape"] + " | agent: " + (.["agent-config"."are-all-plugins-disabled"|tostring) + " | ad: " + .["availability-domain"]'
              ADOM=$(oci compute instance get --instance-id "$IID" --output json 2>/dev/null | jq -r '.data.id')
              VN=$(oci compute vnic-attachment list --compartment-id "$TEN" --instance-id "$ADOM" --output json 2>/dev/null | jq -r '.data[0].vnic_id')
              oci network vnic get --vnic-id "$VN" --output json 2>/dev/null | jq -r '"vnic: " + .data.id + " publicIp: " + (.data.publicIp // "NICIUNUL") + " privateIp: " + (.data["private-ip"])'
              echo "-----"
            done
            echo "## incercari SSH cu cheia noastra (posibil sa mearga doar pe cele create cu ea, dar incercam tot):"
            for IPT in $(for IID in $(oci compute instance list --compartment-id "$TEN" --lifecycle-state RUNNING --output json 2>/dev/null | jq -r '.data[].id'); do VN=$(oci compute vnic-attachment list --compartment-id "$TEN" --instance-id "$IID" --output json 2>/dev/null | jq -r '.data[0].vnic_id'); oci network vnic get --vnic-id "$VN" --output json 2>/dev/null | jq -r '.data.publicIp // empty'; done | sort -u); do
              for U in ubuntu opc ubuntu cloud-init; do
                R=$(ssh -i ~/.ssh/cuantic_oci -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -o BatchMode=yes "$U@$IPT" 'echo VIU; hostname; nproc; free -g | awk "/Mem:/{print \$2\"GB\"}"; df -h / | awk "NR==2{print \$4}"' 2>/dev/null)
                if [ -n "$R" ]; then echo "ACCES DA pe $U@$IPT:"; echo "$R"; break; else echo "acces NU pe $U@$IPT"; fi
              done
            done
          } > analysis/vm-check.md
          cat analysis/vm-check.md | head -40
          git config user.name "vmcheck-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/vm-check.md
          git commit -m "vm-check" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
