name: aichat-build (retired)
# Previous job committed a JAR and report to the running branch on push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse automatic JAR distribution
        run: |
          echo '::error::Build/test plugin offline before any artifact publication.'
          exit 1
