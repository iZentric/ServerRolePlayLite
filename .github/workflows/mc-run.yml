name: MC-RUN
# Ruleaza pe VPS-ul lui marius (runner self-hosted, in container). Doua treburile lui:
# 1) harta masinii (resurse libere, java, porturi, directoare de server banuite);
# 2) dovada ca serverul din release-lite booteaza: pornire + SLP ping + rcon + soak.
# Publica pe bransa mc-run DOAR text rosit. Lumea, bazele si parolele raman acasa.
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml
      - scripts/mc_run_check.py
      - scripts/rp_archive_inspect.py

jobs:
  boot:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Pregatitor (dir scrisibil + java)
        run: |
          MC="$RUNNER_TEMP/mcw"
          mkdir -p "$MC"
          echo "MC=$MC" >> "$GITHUB_ENV"
          {
            if command -v java >/dev/null 2>&1; then java -version 2>&1;
            elif command -v apt-get >/dev/null 2>&1; then
              sudo -n apt-get install -y -qq openjdk-16-jdk-headless 2>/dev/null \
                || sudo -n apt-get install -y -qq openjdk-17-jdk-headless 2>/dev/null \
                || sudo -n apt-get install -y -qq openjdk-11-jdk-headless 2>/dev/null || echo "JAVA LIPSA si instalarea a esuat"
              command -v java >/dev/null 2>&1 && java -version 2>&1
            else
              echo "JAVA LIPSA, fara apt"
            fi
          } > "$MC/javainstall.txt" 2>&1
          true

      - name: Harta VPS (doar citire)
        run: |
          D="$MC/runner-diag.txt"
          {
            echo "== cine ruleaza =="; id -un; hostname; uname -a 2>/dev/null || true
            echo "== container? =="; [ -f /.dockerenv ] && echo "DA, runner-ul e in docker" || echo "nu semnale docker"
            echo "== resurse libere =="
            free -m | head -2; df -h "$RUNNER_TEMP" | tail -1
            nproc; uptime
            echo "== java-uri in viata =="
            ps -eo pid,rss,etime,args 2>/dev/null | grep -i "[j]ava" | head -20 || echo "niciun proces java pe masina"
            echo "== porturi de ascultare 25xxx =="
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':25[0-9]{3}' | head -10 || echo "niciun port de joc ascultat (în spațiul de rețea al containerului)"
            echo "== server.properties gasite (maxdepth 3 pe mount-uri) =="
            for d in / /opt /srv /home /mnt /data; do
              [ -d "$d" ] && find "$d" -maxdepth 3 -name "server.properties" 2>/dev/null | head -4
            done | sort -u | head -12
            echo "== unitati systemd de mc =="
            systemctl list-units --type=service --all 2>/dev/null | grep -iE "mc|minecraft|craft|bukkit|paper|velocity|proxy" | head -8 || echo "fara systemd sau fara servicii mc"
            echo "== python =="; python3 --version
          } > "$D" 2>&1
          true

      - name: Aduce serverul din release
        run: |
          set -uo pipefail
          cd "$MC"
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/lite" \
                --jq '.assets[] | select(.name=="CUANTIC-Server-CatServer-1.7.7.zip") | .browser_download_url' 2>/dev/null || true)
          if [ -n "$url" ] && [ ! -s srv.zip ]; then
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$url" -o srv.zip || true
          fi
          if [ -s srv.zip ]; then
            unzip -oq srv.zip || true
            if [ ! -f server.properties ]; then
              d=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)
              if [ -n "${d:-}" ]; then (cd "$d" && find . -maxdepth 1 -mindepth 1 -exec mv -t "$MC" {} +) || true; fi
            fi
          fi
          JAR=$(find . -maxdepth 2 -name '*.jar' ! -name '*client*' -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
          {
            echo "== jar gasit: ${JAR:-NIMIC}"
            echo "== marime dir =="; du -sh . 2>/dev/null | tail -1
            echo "== fisierle (maxdepth 2, cap 80) =="; find . -maxdepth 2 2>/dev/null | sed 's|^\./||' | sort | head -80
          } >> diag.txt 2>&1
          if [ -n "${JAR:-}" ] && command -v java >/dev/null 2>&1; then
            echo "JAR=$MC/${JAR#./}" >> "$GITHUB_ENV"
          else
            echo "JAR=" >> "$GITHUB_ENV"
            echo "STOP: fara jar sau fara java pe VPS" >> diag.txt
          fi
          true

      - name: Configurare sigura de staging
        run: |
          set -uo pipefail
          [ -n "${JAR:-}" ] || exit 0
          cd "$MC"
          echo "eula=true" > eula.txt
          openssl rand -hex 12 > .rcpass
          python3 - <<'PY'
          import os
          from pathlib import Path
          mc = Path(os.environ["MC"])
          sp = mc / "server.properties"
          lines = sp.read_text(encoding="utf-8").splitlines() if sp.exists() else []
          want = {
              "online-mode": "false",
              "server-port": "25575",           # alt port, ca sa NU calcam serverul live
              "view-distance": "4",
              "simulation-distance": "4",
              "max-players": "2",
              "spawn-protection": "0",
              "level-name": "staging",
              "level-type": "minecraft\\:flat",
              "generate-structures": "false",
              "allow-nether": "false",
              "enable-command-block": "false",
              "motd": "CUANTIC staging - nu intra",
              "enable-rcon": "true",
              "rcon.port": "25585",
              "rcon.password": (mc / ".rcpass").read_text().strip(),
          }
          out = []
          seen = set()
          for ln in lines:
              k = ln.split("=", 1)[0].strip()
              if k in want:
                  out.append(f"{k}={want[k]}"); seen.add(k)
              elif ln.strip():
                  out.append(ln)
          out += [f"{k}={v}" for k, v in want.items() if k not in seen]
          sp.write_text("\n".join(out) + "\n", encoding="utf-8")
          for lock in mc.rglob("session.lock"):
              try:
                  lock.unlink()
              except OSError:
                  pass
          PY
          true

      - name: Porneste si probeaza
        run: |
          [ -n "${JAR:-}" ] || { echo "sari: fara jar/java" > "$MC/checker.log"; exit 0; }
          cd "$MC"
          PASS=$(cat .rcpass 2>/dev/null || echo nimeni)
          nohup java -Xms1G -Xmx3G -XX:+UseG1GC -jar "$JAR" nogui > console.log 2>&1 &
          echo "java pid $!"
          python3 "$GITHUB_WORKSPACE/scripts/mc_run_check.py" \
            --log "$MC/console.log" --wait 420 --port 25575 \
            --rcon-port 25585 --rcon-pass "$PASS" --soak 30 \
            --out "$MC/summary.json" > checker.log 2>&1
          echo "checker: vezi checker.log" >> diag.txt
          pkill -9 -f "staging" 2>/dev/null || true
          sleep 2
          true

      - name: Redacteaza ce se poate
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "scripts")
          try:
              from rp_archive_inspect import scrub
          except Exception as exc:
              scrub = None
              print("scrub indisponibil:", exc)
          base = pathlib.Path(os.environ["MC"])
          names = ("console.log", "checker.log", "diag.txt", "runner-diag.txt",
                   "summary.json", "javainstall.txt")
          for f in names:
              p = base / f
              if p.exists() and scrub:
                  try:
                      scrub(p)
                  except Exception as exc:
                      print("scrub esuat pe", f, exc)
          pwfile = base / ".rcpass"
          pw = pwfile.read_text().strip() if pwfile.exists() else ""
          for f in names:
              p = base / f
              if pw and p.exists():
                  t = p.read_text(encoding="utf-8", errors="replace")
                  if pw in t:
                      p.write_text(t.replace(pw, "<REDACTAT>"), encoding="utf-8")
          try:
              raw = (base / "console.log").read_bytes()
              (base / "console-tail.log").write_bytes(raw[-400000:])
              (base / "boot.log").write_bytes(raw[:160000])
              (base / "console.log").unlink()
          except OSError:
              pass
          try:
              pwfile.unlink()
          except OSError:
              pass
          PY
          true

      - name: Publica pe bransa mc-run
        if: always()
        run: |
          set -euo pipefail
          test -d "$MC" || { echo "nimic de publicat"; exit 0; }
          if ! git ls-remote --exit-code origin refs/heads/mc-run >/dev/null 2>&1; then
            empty=$(git commit-tree "$(git hash-object -w -t tree --stdin </dev/null)" -m "mc-run: radacina")
            git push -q origin "$empty:refs/heads/mc-run"
          fi
          git fetch -q origin refs/heads/mc-run
          git worktree prune || true
          rm -rf /tmp/wt-mcrun
          git worktree add -q /tmp/wt-mcrun -B mc-run FETCH_HEAD
          mkdir -p /tmp/wt-mcrun/mc-run
          cd "$MC"
          for f in runner-diag.txt summary.json boot.log console-tail.log diag.txt checker.log javainstall.txt PROVENIENTA.txt; do
            [ -f "$f" ] && cp "$f" /tmp/wt-mcrun/mc-run/ || true
          done
          { echo "run: $GITHUB_RUN_ID"; echo "url: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; \
            echo "data: $(date -u '+%F %T UTC')"; \
            echo "note: executat pe VPS-ul conectat ca runner; logrosit; lumea nu a fost atinguta."; } > /tmp/wt-mcrun/mc-run/PROVENIENTA.txt
          git -C /tmp/wt-mcrun add -A mc-run
          git -C /tmp/wt-mcrun -c commit.gpgsign=false commit -qm "mc-run: tur $(date -u '+%H:%M') de pe VPS" || echo "nimic nou"
          git -C /tmp/wt-mcrun push -q origin HEAD:refs/heads/mc-run
          echo "publicat pe mc-run"
