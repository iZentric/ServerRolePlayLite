name: FUNCIŢY-STAGE (retired)
# Never start a server on the PC or replace world-live assets from a push/dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse live staging without a rollback test
        run: |
          echo '::error::Live staging needs repeatable A/B, backup, restore test and explicit approval.'
          exit 1
