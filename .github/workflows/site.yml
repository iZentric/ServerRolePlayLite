name: site
on:
  push:
    paths: [ "site/index.html", ".github/workflows/site.yml" ]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
