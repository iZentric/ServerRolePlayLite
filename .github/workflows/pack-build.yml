name: pack-build
on:
  push:
    paths: [ ".github/workflows/pack-build.yml" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  krypton:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { repository: txnimc/KryptonReforged, ref: "1.16.5", fetch-depth: 1 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 8 }
      - name: Build cu ForgeGradle
        run: |
          set +e
          chmod +x gradlew
          ./gradlew build -x test --no-daemon > /tmp/kg.log 2>&1
          echo "BUILD_RC=$?"; tail -6 /tmp/kg.log
      - name: Comite jarul pinat pe functity-out
        run: |
          set +e
          SRC=$PWD
          J=$(ls build/libs/*.jar 2>/dev/null | grep -vE "sources|javadoc|dev|deobf|slim" | head -1)
          if [ -z "$J" ]; then echo "NU S-A PRODUS JARUL (vezi logul de mai sus)"; exit 1; fi
          SHA=$(git -C "$SRC" rev-parse HEAD)
          cd "$RUNNER_TEMP"; rm -rf out; mkdir out; cd out
          git init -q; git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin functity-out && git checkout -q -b functity-out FETCH_HEAD || git checkout -qb functity-out
          mkdir -p pack
          cp "$SRC/$J" pack/krypton-reforged-1.16.5.jar
          S=$(sha256sum pack/krypton-reforged-1.16.5.jar | cut -d" " -f1)
          { echo "sursa: github.com/txnimc/KryptonReforged @ $SHA (ramura 1.16.5)"; echo "build: Actions hosted, Temurin JDK8, ./gradlew build -x test, $(date -u '+%F %T') UTC"; echo "licenta: MIT"; echo "sha256: $S"; } > pack/krypton-reforged-1.16.5.meta.txt
          git config user.name pack-ci; git config user.email p@ci
          git add -A && git commit -qm "krypton-reforged 1.16.5 — build propriu de la commit pinat" && git push -q origin HEAD:functity-out && echo "JAR-PUS sha=${S:0:12}"
