name: CHK — mai traieste serverul?
on:
  push:
    paths: [ "deploy/check.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  c:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/chk.sh || true

      - name: Regula — serverul ramane pornit dupa orice comanda
        if: always()
        run: bash scripts/ensure-up.sh
