RPGDeath: PREMIUM, Thanks for purchasing the plugin!


#---------------------( Corpse Section )---------------------#


#Spawn a corpse when the player dies?
on-death: true

#Time in seconds until the corpse despawns. Set to -1 for the copse to never despawn.
corpse-time: 120

#Put the players items into a GUI when they die? Click the the corpse to open the GUI.
looting-inventory: false

#Should the corpse automaticly despawn after it has been looted? (Only has effect is looting-inventory is true!)
despawn-after-looted: false

#Should we render player armor and items on the corpses?
#Set to false to not render player armor and items on the corpses
render-armor: true

#Show the username of the player? If you set this to false ' ' will be used for the username.
#The skin will still show even if you choose not do display the username.
show-tags: true

#Due to a Minecraft quirk with how the corpses work, the hitboxes were not normal player hitboxes.
#I have now made it so a invisible Cows spawn that covers the whole corpse.
#When you click on the invisible Cow it does the same thing as clicking on the corpse.
#Set to false to use the old glitchy hitboxes.
new-hitboxes: false

#This is used to specify what world(s) corpses should spawn when somebody dies.
#Set world to 'all' for every world.
#Use '|' to add multiple worlds.
#corpse-world-whitelist: world|dungeon|... > for several worlds.
corpse-world-whitelist: all

#List of DamageCauses that should NOT spawn corpse.
corpse-damage-cause-blacklist:
- NOTHING
#- SUFFOCATION
#- SUICIDE

#Should we save corpses on restart?
#Note: v1_8_R1 and below will not save. (1.8.8+ will save)
save-corpses: false

#---------------------( Revive Section )---------------------#


#Can players revive another player?
revive: true

revive-particle-particle: "HEART"

revive-particle-count: 1

revive-particle-offsetx: 1

revive-particle-offsety: 1

revive-particle-offsetz: 1

#Only Faction member and allies can revive player?
#Depend: Factions Plugin
faction-member-ally-revive: true

revive-bar-length: 50

revive-bar: " &7<- {BAR} &7[&c{PERCENT}%&7] -> "

revive-bar-symbol-1: "&3|"

revive-bar-symbol-2: "&c."

revive-bar-time: 150.0

#Set the max player distance for revive.
revive-distance: 5

#Set the player health when his revive.
revive-health: 6

#Set the player food when his revive.
revive-food: 5

#Use HolographicDisplays?
use-holographicdisplays: true

#Use class revive?
class-revive: false

#Class Name. 
#MMOCore support
#class-revive-name: medic > for only one class.
#class-revive-name: medic|druid|... > for several classes.
class-revive-name: "medic|diicot|bra|inf"

#Use faction revive?
faction-revive: false

#Use item for revive?
item-revive: false

#Only Guild member and allies can revive player?
#Depend: FunnyGuilds Plugin
funnyguilds-member-ally-revive: true

#Only Kingdom member and allies can revive player?
#Depend: KingdomsX Plugin
kingdomsX-member-ally-revive: true

#Set the type of click for revive
#LEFT_CLICK
#LEFT_SNEAK_CLICK
#RIGHT_CLICK
#RIGHT_SNEAK_CLICK
#UNKNOWN (Click near to body)
revive-click: UNKNOWN

#Set the type of click for carry
#LEFT_CLICK
#LEFT_SNEAK_CLICK
#RIGHT_CLICK
#RIGHT_SNEAK_CLICK
#UNKNOWN (Click near to body)
carry-click: LEFT_CLICK

#---------------------( Death Spectating Section )---------------------#


#Put player in death spectating when he dies.
use-death-spectating: true

#Time in seconds until the player can respawn.
death-spectating-time: 120

#List of worlds where DeathSpectating should be enabled
#Set world to 'all' for every world.
#Use '|' to add multiple worlds.
#death-spectating-world-whitelist: world|dungeon|... > for several worlds.
death-spectating-world-whitelist: all

#HEAD - 
#NORMAL - 
death-spectating-view-: "HEAD"

death-spectating-particleparticle: "HEART"

death-spectating-particlecount: 10

death-spectating-particleoffsetx: 1

death-spectating-particleoffsety: 1

death-spectating-particleoffsetz: 1

#Can players skip spectator mode?
player-can-skip-death-spectating: false

#Can players carry another player?
carry: true

carry-bar-length: 50

carry-bar: " &7<- {BAR} &7[&c{PERCENT}%&7] -> "

carry-bar-symbol-1: "&2|"

carry-bar-symbol-2: "&c."

carry-bar-time: 10.0

#List of commands that a player is allowed to use while DeathSpectating.
# Players with rpgdeath.deathspectating.commands.allow permission are not subject to this whitelist.
death-spectating-command-whitelist:
- me
- m
- msg
- message
- t
- tell
- w
- whisper
- list
- ?
- info
- report
- l 
- login
- register
- reg

#List of DamageCauses that should NOT put a player into death spectating on death.
death-spectating-damage-cause-blacklist:
- SUFFOCATION
- SUICIDE

#Prevent movement in death spectator? 
death-spectating-prevent-movement: true

#Maximum radius that the player can walk as a spectator
death-spectating-radius: 20

#Op can Bypass death spectating time?. 
op-bypass-death-spectating: false

#Use death spectating multiply time? 
use-death-spectating-multiply-time: false

#Add this extra time to each death. 
#In seconds.
death-spectating-multiply-time: 2

#Time after playerDeath for reset multiply death spectating time.
#In seconds.
death-spectating-reset-multiply-time: 20

#---------------------( Respawn Section )---------------------#


#Use rpg spawn?
use-rpg-spawn: false

#If RPGSpawn disable. 
#Respawn at player body?
respawn-at-body: false

#---------------------( Other )---------------------#


#true = all items inside the list can't be dropped
#false = only items inside the list can be dropped
drop-item-blacklist: true

#List of commands executed when player die.
#PlaceHolders: <PLAYER>, <KILLER>, <POS_X>, <POS_Y>, <POS_Z>
#Set (- NOTHING) to disable
commands-die:
- NOTHING
#- Give <PLAYER> minecraft:dirt 1

#List of commands executed when player die.
#PlaceHolders: <PLAYER>, <POS_X>, <POS_Y>, <POS_Z>
#Set (- NOTHING) to disable
commands-respawn:
- NOTHING
#- Give <PLAYER> minecraft:dirt 1

#List of commands executed when player die.
#PlaceHolders: <PLAYER>, <MEDIC>, <POS_X>, <POS_Y>, <POS_Z>
#Set (- NOTHING) to disable
commands-revived:
- NOTHING
#- Give <PLAYER> minecraft:dirt 1