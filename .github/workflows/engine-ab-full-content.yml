name: FunCity vs CatServer — same 15 RP mods exploratory A/B
# Six bounded runs on ONE hosted VM / Java 11 / frozen generated world.
# No self-hosted runner, real world, public port, user login, release or raw logs.
# RSS/CPU synthetic-only, NOT MSPT/FPS/hybrid gameplay proof.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/engine-ab-full-content.yml
      - scripts/fc_engine_ab_full_content.py
      - scripts/fc_engine_ab_full_content_test.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-host-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Synthetic path and measurement guard tests
        run: |
          set -Eeuo pipefail
          python3 scripts/fc_engine_family_lab_test.py
          python3 scripts/fc_engine_ab_full_content_test.py
      - name: Fetch SHA-pinned old inputs to one disposable VM
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-engine-ab"
          mkdir -p "$root"
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" \
            -p functity-jare-toate.tar.gz -O "$root/engines.tar.gz"
          echo "f2cb921efbf751fa24534a9a02b57197db46294ca7b71d9711b04996bf6d1784  $root/engines.tar.gz" | sha256sum -c -
          python3 scripts/fc_plugin_first_extract.py "$root/engines.tar.gz" "$root/motor.jar"
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -O "$root/old-plugins.zip"
          echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  $root/old-plugins.zip" | sha256sum -c -
          gh release download v21.2 -R PlayPro/CoreProtect \
            -p CoreProtect-21.2.jar -O "$root/CoreProtect.jar"
          echo "04f31b609d1e3e1c53e99aaa06ca10ea6bdf5172c94bf5af8ccf108b0bc4b977  $root/CoreProtect.jar" | sha256sum -c -
          gh release download v21.0 -R google/guava \
            -p guava-21.0.jar -O "$root/guava-21.0.jar"
          echo "972139718abc8a4893fa78cba8cf7b2c903f35c97aaf44fa3031b0669948b480  $root/guava-21.0.jar" | sha256sum -c -
      - name: Build one immutable 15-mod and 6-plugin template
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-engine-ab"
          python3 scripts/fc_modded_candidate.py --engine "$root/motor.jar" \
            --archive "$root/old-plugins.zip" --coreprotect "$root/CoreProtect.jar" \
            --guava21 "$root/guava-21.0.jar" --output "$root/stage"
      - name: Frozen-world A/B/B/A/A/B; no public metric until all arms valid
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-engine-ab"
          python3 scripts/fc_engine_ab_full_content.py "$root" "$root/old-plugins.zip"
