name: Build Freeroam Lite
# Never auto-delete the public release because a build recipe changed.
# A staging release needs explicit approval; it never replaces the current lite.
on:
  workflow_dispatch:
    inputs:
      publish_staging:
        description: "Create a new staging release only; never replace the current lite release"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pack original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pack-original -p '*.mrpack' -O pack.mrpack
      - name: Java 17 (acelasi Java de pe server) pentru validarea flagurilor
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Unit tests for survival, pack invariants and release gates
        run: python3 -m unittest discover -s tests -q
      - name: Validare + taiere flaguri JVM (fara push/deploy)
        run: python3 scripts/prune-flags.py
      - name: Build lite packs
        run: |
          pip install pillow -q
          set -o pipefail
          mkdir -p out
          python3 scripts/build_lite.py pack.mrpack out 2>&1 | tee out/build.log
      - name: Preserve build logs without committing to the branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuantic-build-report
          path: |
            out/REPORT.md
            out/build.log
          if-no-files-found: warn
      - name: Stop on known inverted spawn cap (static screen, not gameplay proof)
        run: |
          set -e
          for pack in out/*Server-CatServer*.zip; do
            test -f "$pack" || { echo "No CatServer pack was built"; exit 1; }
            python3 scripts/cuantic_survival_rules.py "$pack"
          done
      - name: Test all JVM flags before any publication
        run: |
          FLAGS=$(python3 -c "import re;s=open('scripts/build_lite.py').read();m=re.search(r'AIKAR_FLAGS = \((.*?)\n\)',s,re.S);print(eval('('+m.group(1)+')'))")
          java $FLAGS -Xms64M -Xmx256M -version
      - name: Publish a separate prerelease only (never replace lite)
        if: ${{ inputs.publish_staging == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAJ=$(python3 -c "import json;print(json.load(open('pack-rules.json'))['pack_version'])")
          gh release create "cuantic-staging-${{ github.run_id }}" out/*.mrpack out/*.zip \
            --prerelease --target ${{ github.sha }} \
            --title "CUANTIC $VERSAJ — STAGING ONLY, not live validated" \
            --notes-file out/REPORT.md
