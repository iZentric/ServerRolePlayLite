name: Confirm live Forge trial after owner reports successful login
# Read-only: no server stop, no raw player/account/log data or backup upload.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/pc-live-join-confirm.yml]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Parse post-login read-only probe; synthetic status parser
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/fc_live_join_confirm.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'Read-only probe syntax failure' }
      - name: Private status protocol fixture
        run: python3 scripts/fc_local_status_ping_test.py
  pc-read-only:
    needs: guards
    runs-on: [self-hosted, Windows]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify current private backup, exact mod delta, RCON and status
        shell: powershell
        run: |
          $server='C:\Users\Administrator\Desktop\FunCityLocal\server'
          $copy='C:\Users\Administrator\Desktop\FunCityLocal\Arena-CompatStages\bootable-no-clumps-39598696934\server'
          & ./scripts/fc_live_join_confirm.ps1 -Server $server -Copy $copy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
