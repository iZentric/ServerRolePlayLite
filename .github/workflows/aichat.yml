name: aichat-build
on:
  push: { paths: ["aichat/**"] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Compile (Java 8 target pe API 1.16.5)
        working-directory: aichat
        run: mvn -B -ntp -q package
      - name: Salveaza jurnalul pt diagnostic
        if: always()
        run: |
          cd aichat && (mvn -B -ntp package > /tmp/mvn-out.txt 2>&1; true)
          { echo "# AICHAT-BUILD $(date -u '+%F %T UTC')"; echo; echo '```'; tail -60 /tmp/mvn-out.txt; echo '```'; } > /tmp/aichat-report.md
      - name: Publica esec pe bransa (sandbox nu poate citi logurile GH)
        if: failure()
        run: |
          git config user.name bot && git config user.email bot@arena.local
          cp /tmp/aichat-report.md analysis/AICHAT-BUILD.md
          git add analysis/AICHAT-BUILD.md && git commit -qm "aichat: jurnal esec build" || exit 0
          for i in 1 2 3; do git -c pull.rebase=true pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break || sleep 10; done
      - name: Smoke — plugin.yml si clasa in jar
        working-directory: aichat
        run: |
          unzip -l target/FunCityAI-*.jar | grep -q plugin.yml
          unzip -l target/FunCityAI-*.jar | grep -q FunCityAIPlugin.class
          echo "jar OK: $(ls -la target/FunCityAI-*.jar | awk '{print $5" B"}')"
      - uses: actions/upload-artifact@v4
        with:
          name: functityai-jar
          path: aichat/target/FunCityAI-*.jar
          if-no-files-found: error
