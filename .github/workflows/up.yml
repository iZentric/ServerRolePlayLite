name: UP — server CUANTIC pe Cloud Shell (tmux) + adresa
on:
  push:
    paths: [ "deploy/up.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: play-cuantic
  cancel-in-progress: true
jobs:
  up:
    runs-on: [self-hosted]
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/up.sh || true
