# Inventory only. Runs on GitHub-hosted runner; NEVER opens the production server.
name: ENGINE pack audit — actual components, no live changes
on:
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-pack-audit.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check auditor invariants before reading release
        run: python3 -m unittest discover -s tests -p test_engine_pack_audit.py -v
      - name: Download public release and audit by pinned SHA-256
        run: |
          set -euo pipefail
          gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -O /tmp/cuantic-pack-audit.zip
          python3 scripts/engine_pack_audit.py /tmp/cuantic-pack-audit.zip docs/ENGINE-PACK-AUDIT.md
      - name: Publish read-only inventory (only if audit passed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-PACK-AUDIT.md
          git commit -m 'engine: record verified release component inventory'
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort || true; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
