name: A1-QUOTA — cer singuri cresterea de limita ARM prin API
on:
  push:
    paths: [ "deploy/quota.txt" ]
permissions:
  contents: write
jobs:
  cere:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Descopera metrica si deschide cererea
        run: |
          set +e
          TEN=ocid1.tenancy.oc1..aaaaaaaanlzitmrgwn5f3g3iyapyiuxt2ayh43u6mdq3nszvcswrkcw5eyfa
          mkdir -p analysis
          R=analysis/a1-quota.md
          {
            echo "# A1-QUOTA diagnostic - $(date -u '+%F %T UTC')"
            AD=$(oci iam availability-domain list --compartment-id $TEN --query 'data[0].name' --raw-output 2>/dev/null)
            echo "## A) resource-availability (API vechi de limite):"
            echo '```'
            for L in standard-a1-core-count standard-a1-memory-count standard-a1-instance-count; do
              echo "-- $L"
              oci limits resource-availability get --service-name compute --limit-name $L --compartment-id $TEN --availability-domain "$AD" 2>&1 | grep -E '"(name|value|availableValue|adjustable)"' | head -4
            done
            echo '```'
            echo "## B) help quota-change-request create (cine approve, ce campuri):"
            echo '```'
            oci limits quota-change-request create --help 2>&1 | sed -n '1,30p'
            echo '```'
            echo "## C) quota-metric list brut (poate alt nume de optiune):"
            echo '```'
            oci limits quota-metric list --help 2>&1 | head -12
            oci limits quota-metric list --compartment-id $TEN --service-name compute 2>&1 | grep -iE "a1" | head -10
            echo '```'
          } > $R
          cat $R
          git config user.name "quota-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/a1-quota.md
          git commit -m "a1-quota: cerere deschisa" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
