name: FunCity hybrid bridge - Java 11 contract without Gradle
# Independent of Mojang/Forge Maven dependencies. Synthetic Forge/Bukkit
# types around the EXACT patched method; no world, private pack or JAR upload.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/funcity-bridge-java-contract.yml
      - scripts/fc_funcity_bridge_java_contract.py
      - scripts/fc_funcity_bridge_java_contract_test.py
      - functity/catserver/patches/0002-preserve-forge-block-place-cancellation.patch
  pull_request:
    paths:
      - .github/workflows/funcity-bridge-java-contract.yml
      - scripts/fc_funcity_bridge_java_contract.py
      - scripts/fc_funcity_bridge_java_contract_test.py
      - functity/catserver/patches/0002-preserve-forge-block-place-cancellation.patch
permissions:
  contents: read
jobs:
  java11-no-maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify harness refuses an unpatched method
        run: python3 scripts/fc_funcity_bridge_java_contract_test.py
      - name: Compile and run source-patched Forge/Bukkit veto in Java 11
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/catserver-pinned"
          git clone -q --depth 1 --filter=blob:none --branch 23.05.26-1 \
            https://github.com/Luohuayu/CatServer.git "$root"
          test "$(git -C "$root" rev-parse HEAD)" = '1d8d63138be77a606df2a5e940b960065948f983'
          git -C "$root" apply --check "$GITHUB_WORKSPACE/functity/catserver/patches/0002-preserve-forge-block-place-cancellation.patch"
          git -C "$root" apply "$GITHUB_WORKSPACE/functity/catserver/patches/0002-preserve-forge-block-place-cancellation.patch"
          python3 scripts/fc_funcity_bridge_java_contract.py \
            "$root/src/main/java/catserver/server/CatServerEventHandler.java" \
            "$JAVA_HOME/bin/javac" "$JAVA_HOME/bin/java"
          echo '::notice title=FunCity bridge::Java11 synthetic place/multiplace contract PASS; full CatServer build and real RP join remain separate gates.'
