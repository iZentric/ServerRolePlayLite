name: MC-RUN
# Ruleaza pe VPS-ul lui marius (runner self-hosted). Doua treburile lui:
# 1) harta VPS-ului (cat e de liber, ce java ruleaza, unde sta serverul real);
# 2) dovada ca serverul din release-lite booteaza: pornire + SLP ping + rcon + soak.
# Publica pe bransa mc-run DOAR text rosit. Lumea, bazele si parolele raman acasa.
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml
      - scripts/mc_run_check.py
      - scripts/rp_archive_inspect.py

jobs:
  boot:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Harta VPS (doar citire)
        run: |
          mkdir -p /opt/mc || sudo mkdir -p /opt/mc && sudo chown -R "$(id -un)" /opt/mc || true
          D=/opt/mc/runner-diag.txt
          {
            echo "== cine ruleaza =="; id -un; hostname; uname -a
            echo "== resurse libere =="
            free -m | head -2
            df -h / /opt /home 2>/dev/null | tail -4
            nproc; uptime
            echo "== java-uri in viata pe masina =="
            ps -eo pid,rss,etime,cmd | grep -i "[j]ava" | head -20 || echo "niciun proces java"
            echo "== porturi de ascultare (25xxx/255xx) =="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':25[0-9]{3}' | head -10 || echo "niciun port de joc ascultat"
            echo "== directoare de server banuite =="
            for d in /opt /srv /home/*/ /root; do
              [ -d "$d" ] || continue
              find "$d" -maxdepth 3 -name "server.properties" 2>/dev/null | head -6
            done
            echo "== scripturi de pornire gasite =="
            for d in /opt /srv /home/*/; do
              [ -d "$d" ] || continue
              find "$d" -maxdepth 3 \( -name "start*.sh" -o -name "start*.bat" -o -name "*.service" \) 2>/dev/null | head -8
            done
            echo "== systemd servicii mc =="
            systemctl list-units --type=service --all 2>/dev/null | grep -iE "mc|minecraft|craft|bukkit|paper|velocity" | head -8 || true
            echo "== python =="; python3 --version
          } > "$D" 2>&1
          true

      - name: Aduce serverul din release
        run: |
          set -uo pipefail
          cd /opt/mc
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/lite" \
                --jq '.assets[] | select(.name=="CUANTIC-Server-CatServer-1.7.7.zip") | .browser_download_url')
          if [ ! -s srv.zip ]; then
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$url" -o srv.zip || echo "DESCARCARE ESUATA" >> diag.txt
          fi
          if [ -s srv.zip ]; then
            unzip -oq srv.zip || true
            if [ ! -f server.properties ]; then
              d=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)
              if [ -n "${d:-}" ]; then (cd "$d" && find . -maxdepth 1 -mindepth 1 -exec mv -t /opt/mc {} +) || true; fi
            fi
            JAR=$(find . -maxdepth 2 -name '*.jar' ! -name '*client*' -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
            if [ -n "${JAR:-}" ]; then echo "JAR=/opt/mc/${JAR#./}" >> "$GITHUB_ENV"; fi
          fi
          {
            echo "== java =="; java -version 2>&1 || echo "JAVA LIPSA pe VPS"
            echo "== marime dir =="; du -sh . 2>/dev/null
            echo "== fisierle (maxdepth 2, cap 80) =="; find . -maxdepth 2 2>/dev/null | sed 's|^\./||' | sort | head -80
            test -n "${JAR:-}" || echo "FARA JAR - release-ul nu a putut fi adus/pregatit pe VPS"
          } >> diag.txt 2>&1
          true

      - name: Configurare sigura de staging
        if: env.JAR != ''
        run: |
          set -uo pipefail
          cd /opt/mc
          echo "eula=true" > eula.txt
          openssl rand -hex 12 > .rcpass
          python3 - <<'PY'
          from pathlib import Path
          sp = Path("/opt/mc/server.properties")
          lines = sp.read_text(encoding="utf-8").splitlines() if sp.exists() else []
          want = {
              "online-mode": "false",
              "server-port": "25575",           # alt port, ca sa NU calcam serverul live al lui marius
              "view-distance": "4",
              "simulation-distance": "4",
              "max-players": "2",
              "spawn-protection": "0",
              "level-name": "staging",
              "level-type": "minecraft\\:flat",
              "generate-structures": "false",
              "allow-nether": "false",
              "enable-command-block": "false",
              "motd": "CUANTIC staging - nu intra",
              "enable-rcon": "true",
              "rcon.port": "25585",
              "rcon.password": Path("/opt/mc/.rcpass").read_text().strip(),
          }
          out = []
          seen = set()
          for ln in lines:
              k = ln.split("=", 1)[0].strip()
              if k in want:
                  out.append(f"{k}={want[k]}"); seen.add(k)
              elif ln.strip():
                  out.append(ln)
          out += [f"{k}={v}" for k, v in want.items() if k not in seen]
          sp.write_text("\n".join(out) + "\n", encoding="utf-8")
          for lock in Path("/opt/mc").rglob("session.lock"):
              try:
                  lock.unlink()
              except OSError:
                  pass
          PY

      - name: Porneste si probeaza
        if: env.JAR != ''
        run: |
          cd /opt/mc
          PASS=$(cat .rcpass 2>/dev/null || echo nimeni)
          nohup java -Xms1G -Xmx3G -XX:+UseG1GC -jar "$JAR" nogui > console.log 2>&1 &
          echo "java pid $!"
          python3 "$GITHUB_WORKSPACE/scripts/mc_run_check.py" \
            --log /opt/mc/console.log --wait 420 --port 25575 \
            --rcon-port 25585 --rcon-pass "$PASS" --soak 30 \
            --out /opt/mc/summary.json > checker.log 2>&1
          echo "checker a iesit cu $?" >> /opt/mc/diag.txt
          pkill -9 -f 'staging' 2>/dev/null || true
          sleep 2
          true

      - name: Redacteaza ce se poate
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          try:
              from rp_archive_inspect import scrub
          except Exception as exc:
              scrub = None
              print("scrub indisponibil:", exc)
          base = pathlib.Path("/opt/mc")
          for f in ("console.log", "checker.log", "diag.txt", "runner-diag.txt", "summary.json"):
              p = base / f
              if p.exists() and scrub:
                  try:
                      scrub(p)
                  except Exception as exc:
                      print("scrub esuat pe", f, exc)
          pwfile = base / ".rcpass"
          pw = pwfile.read_text().strip() if pwfile.exists() else ""
          for f in ("console.log", "checker.log", "diag.txt", "runner-diag.txt", "summary.json"):
              p = base / f
              if pw and p.exists():
                  t = p.read_text(encoding="utf-8", errors="replace")
                  if pw in t:
                      p.write_text(t.replace(pw, "<REDACTAT>"), encoding="utf-8")
          try:
              tail = (base / "console.log").read_bytes()[-400000:]
              (base / "console-tail.log").write_bytes(tail)
              (base / "boot.log").write_bytes((base / "console.log").read_bytes()[:160000])
          except OSError:
              pass
          try:
              pwfile.unlink()
              (base / "console.log").unlink()
          except OSError:
              pass
          PY
          true

      - name: Publica pe bransa mc-run
        if: always()
        run: |
          set -euo pipefail
          test -d /opt/mc || { echo "nimic de publicat"; exit 0; }
          if ! git ls-remote --exit-code origin refs/heads/mc-run >/dev/null 2>&1; then
            empty=$(git commit-tree "$(git hash-object -w -t tree --stdin </dev/null)" -m "mc-run: radacina")
            git push -q origin "$empty:refs/heads/mc-run"
          fi
          git fetch -q origin refs/heads/mc-run
          git worktree prune || true
          rm -rf /tmp/wt-mcrun
          git worktree add -q /tmp/wt-mcrun -B mc-run FETCH_HEAD
          mkdir -p /tmp/wt-mcrun/mc-run
          cp /opt/mc/runner-diag.txt /tmp/wt-mcrun/mc-run/ 2>/dev/null || true
          cp /opt/mc/summary.json /tmp/wt-mcrun/mc-run/ 2>/dev/null || true
          cp /opt/mc/boot.log /tmp/wt-mcrun/mc-run/boot.log 2>/dev/null || true
          cp /opt/mc/console-tail.log /tmp/wt-mcrun/mc-run/console-tail.log 2>/dev/null || true
          cp /opt/mc/diag.txt /tmp/wt-mcrun/mc-run/diag.txt 2>/dev/null || true
          cp /opt/mc/checker.log /tmp/wt-mcrun/mc-run/checker.log 2>/dev/null || true
          { echo "run: $GITHUB_RUN_ID"; echo "url: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; \
            echo "data: $(date -u '+%F %T UTC')"; \
            echo "note: executat pe VPS-ul conectat ca runner self-hosted; logrosit, lumea nu a fost atinguta de acest tur."; } > /tmp/wt-mcrun/mc-run/PROVENIENTA.txt
          git -C /tmp/wt-mcrun add -A mc-run
          git -C /tmp/wt-mcrun -c commit.gpgsign=false commit -qm "mc-run: tur $(date -u '+%H:%M') de pe VPS" || echo "nimic nou"
          git -C /tmp/wt-mcrun push -q origin HEAD:refs/heads/mc-run
          echo "publicat pe mc-run"
