name: FC-BENCH
# v4 — banca de MASURARE (v1-v3 masurau instalarea bootstrap-ului si/sau mergeau cu
# jar-uri false + java 17; acum: acelasi harness 2-faze validat de FC-SMOKE36, java 11,
# pack 36/14 neschimbat cu SHA fix, 4 braate in paralel, 3 probe boot-la-cald pe world
# comun, probe de login protocol 1.16.5, esantionare TPS/MSPT prin consola, "Can't keep
# up!" numarata, RSS/CPU, jurnal GC). Practici noi de CI: pasul de garda esueaza chior
# (fara exit-0 mascat), rapoarte JSON + loguri pe functity-out, verdict doar din cifre.
on:
  push:
    paths:
      - deploy/fc-bench.txt
      - .github/workflows/fc-bench.yml
      - benches/functity/arms/**
      - scripts/fc_bench.py

permissions:
  contents: write

jobs:
  leg:
    name: FC-BENCH36 ${{ matrix.arm.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.arm.budget_min }}
    strategy:
      fail-fast: false
      matrix:
        arm:
          - { id: oficial1237, conf: oficial, sha: "17d08ed544aab50f0c9c0281507a44d765cfeb371289a10d47e2143146255bff", trials: 3, run_seconds: 300, budget_min: 120 }
          - { id: functity_b0, conf: functity_b0, sha: "248fb54d4a97d8396a45e3edf859a19275c67c81e6115ca219ece5ebb0ef7f79", trials: 3, run_seconds: 300, budget_min: 120 }
          - { id: functity_b1, conf: functity_b1, sha: "6a63721c376ffb48d2fbff9c5bba425c9c69b9b9392bb543a53af64f70a98194", trials: 3, run_seconds: 300, budget_min: 120 }
          - { id: catserver, conf: catserver, sha: "", trials: 3, run_seconds: 300, budget_min: 150 }
    env:
      TRIALS: "3"
      RUN_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }

      - name: Testele de garda (iesirea nenula = alergarea cade, nu se maschcheaza)
        run: python3 -m unittest discover -s tests -q

      - name: Packul de referinta (functity-out:pack/, fall-back release, pază de SHA)
        shell: bash {0}
        run: |
          set -uo pipefail
          mkdir -p /tmp/fcb
          say() { echo "$(date -u +%H:%M:%S) $*"; }
          git clone -q --depth 1 -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" /tmp/fcb/out
          PK=/tmp/fcb/out/pack/CUANTIC-Server-CatServer-1.7.7.zip
          if [ -f "$PK" ] && [ "$(stat -c %s $PK)" -gt 40000000 ]; then
            cp "$PK" /tmp/fcb/pack.zip
            WANT=$(cut -d' ' -f1 /tmp/fcb/out/pack/SHA256SUMS.txt 2>/dev/null || echo fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15)
            say "pack din functity-out (git, fara CDN)"
          else
            say "pack LIPSA din functity-out:pack/ — incerc release direct (x4)"
            WANT=fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15
            for i in 1 2 3 4; do
              rm -f /tmp/fcb/pack.zip
              gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -D /tmp/fcb 2>&1 | tail -1 || true
              SZ=$(stat -c %s /tmp/fcb/pack.zip 2>/dev/null || echo 0)
              say "gh try$i marime=$SZ"
              [ "$SZ" -gt 40000000 ] && break
              sleep $((i*12))
            done
          fi
          SHA=$(sha256sum /tmp/fcb/pack.zip 2>/dev/null | cut -d' ' -f1)
          say "SHA=$SHA WANT=$WANT"
          if [ "$SHA" != "$WANT" ]; then say "::error::SHA pack nepotrivit (got=$SHA want=$WANT)"; exit 1; fi
          mkdir -p /tmp/fcb/diag; : > /tmp/fcb/diag/pack.txt; echo "sursa=$PK sha=$SHA marime=$(stat -c %s /tmp/fcb/pack.zip)" > /tmp/fcb/diag/pack.txt
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      - name: Jarul bratului (tot din functity-out, zero CDN), cu pază de SHA + manifest
        shell: bash {0}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -uo pipefail
          ARM='${{ matrix.arm.id }}'
          mkdir -p /tmp/fcb; : > /tmp/fcb/diag.txt
          say() { echo "$(date -u +%H:%M:%S) $*"; echo "$(date -u +%H:%M:%S) $*" >> /tmp/fcb/diag.txt; }
          trap 'rc=$?; say "CAPAT-JAR rc=$rc"; if [ $rc -ne 0 ]; then
            git clone -q --depth 1 -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" /tmp/fcb/jdiag 2>/dev/null
            D="/tmp/fcb/jdiag/bench-v4/diag/$(date -u +%Y%m%d-%H%M%S)-jar-$ARM.txt"; mkdir -p "$(dirname "$D")"; cp /tmp/fcb/diag.txt "$D"
            ( cd /tmp/fcb/jdiag && git config user.name fcb-diag && git config user.email d@l && git add -A bench-v4/ && git commit -qm "fcb jar-diag $ARM" && git push -q origin HEAD:refs/heads/functity-out ) && say "jar-diag publicat"
          fi; exit $rc' EXIT
          case "$ARM" in
            catserver) say "brat catserver: foloseste jarul din pack"; exit 0;;
            oficial1237) REF='builds/b0/mohist-1.16.5-1237-server.jar';;
            functity_b0) REF='builds/b0/FunCity-1.16.5-b0.jar';;
            functity_b1) REF='builds/b1.2256/FunCity-1.16.5-b1.2256.jar';;
            *) say "::error::brat necunoscut $ARM"; exit 1;;
          esac
          cp "/tmp/fcb/out/$REF" /tmp/fcb/arm.jar || { say "::error::lipseste $REF: $(ls /tmp/fcb/out/builds 2>/dev/null | tr '\n' ' ')"; exit 1; }
          echo '${{ matrix.arm.sha }}  /tmp/fcb/arm.jar' | sha256sum -c - || { say "::error::SHA jar brat nepotrivit"; exit 1; }
          unzip -p /tmp/fcb/arm.jar META-INF/MANIFEST.MF > /tmp/fcb/MANIFEST.MF 2>/tmp/fcb/unzip.err; UZ=$?
          say "unzip rc=$UZ marime_manifest=$(stat -c %s /tmp/fcb/MANIFEST.MF 2>/dev/null || echo 0) unzip_err=$(head -c 80 /tmp/fcb/unzip.err 2>/dev/null | tr '\n' ' ')"
          say "fisiere_jar=$(unzip -l /tmp/fcb/arm.jar 2>/dev/null | sed -n '$d' ; unzip -l /tmp/fcb/arm.jar 2>/dev/null | tail -1)"
          NLINES=$(sed 's/\r$//' /tmp/fcb/MANIFEST.MF 2>/dev/null | wc -l); say "manifest_nlinii_sed=$NLINES"
          GCOUNT=$(sed 's/\r$//' /tmp/fcb/MANIFEST.MF 2>/dev/null | grep -c ServerLaunchArgs || true); say "grep_count=$GCOUNT"
          grep -c . /tmp/fcb/MANIFEST.MF >/dev/null 2>&1 || say "manifest illegibil"
          [ "$UZ" = 0 ] && [ "$GCOUNT" -ge 1 ] || { say "::error::jar fara manifest ServerLaunchArgs — refuz (vezi linii de mai sus)"; exit 1; }
          say "jar OK: $REF marime=$(stat -c %s /tmp/fcb/arm.jar)"

      - name: Gonest pe runner (documentat in raport)
        env: { ARM: '${{ matrix.arm.id }}' }
        run: lscpu | sed -n '1,15p'; free -l | head -2; nproc

      - name: Alergare banca (faza A instalare + 3 probe la cald a 300s)
        env:
          ARM: '${{ matrix.arm.id }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          FC_JAR: '/tmp/fcb/arm.jar'
          FC_STAGE: '/tmp/fcb/stage'
          FC_OUT: '/tmp/fcb/results'
          FC_TRIALS: '${{ matrix.arm.trials }}'
          FC_RUN_SECONDS: '${{ matrix.arm.run_seconds }}'
          FC_JAVA_LABEL: 'temurin-11 @ ubuntu-24.04 (4 vCPU, 16GB)'
        shell: bash {0}
        run: |
          set +e
          if [ ! -f "$FC_JAR" ] && [ "$ARM" != "catserver" ]; then echo "FC_JAR lipseste ($FC_JAR) — il creeaza pasul jar"; fi
          python3 scripts/fc_bench.py --arm-conf benches/functity/arms/${{ matrix.arm.conf }}.json > /tmp/fcb/driver-$ARM.log 2>&1 &
          DPID=$!
          (
            n=0
            while kill -0 $DPID 2>/dev/null; do
              sleep 120; kill -0 $DPID 2>/dev/null || break
              n=$((n+1))
              { echo "live-snapshot $n la $(date -u +%H:%M:%S)"; tail -c 6000 /tmp/fcb/driver-$ARM.log; echo; echo "--- driver tail ---"; tail -c 1500 /tmp/fcb/results/install.log 2>/dev/null; echo; tail -c 1500 /tmp/fcb/stage/logs/latest.log 2>/dev/null | tail -6; } > /tmp/fcb/live-$ARM.txt
              rm -rf /tmp/fcb/lpub
              git clone -q --filter=blob:none --no-checkout -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" /tmp/fcb/lpub 2>/dev/null || continue
              ( cd /tmp/fcb/lpub && git sparse-checkout init --no-cone && git sparse-checkout set bench-v4 && git checkout -q functity-out ) || true
              mkdir -p /tmp/fcb/lpub/bench-v4/live
              cp /tmp/fcb/live-$ARM.txt "/tmp/fcb/lpub/bench-v4/live/$(date -u +%Y%m%d-%H%M%S)-$ARM.txt"
              ( cd /tmp/fcb/lpub && git config user.name fcb-live && git config user.email l@l && git add -A bench-v4/live && git commit -qm "live $ARM #$n" && git push -q origin HEAD:refs/heads/functity-out ) || true
            done
          ) &
          wait $DPID
          RC=$?
          echo "driver rc=$RC"
          tail -3 /tmp/fcb/driver-$ARM.log
          if [ ! -f /tmp/fcb/results/$ARM.json ]; then
            { echo "=== driver log ==="; tail -c 12000 /tmp/fcb/driver-$ARM.log; echo "=== install.log tail ==="; tail -c 8000 /tmp/fcb/results/install.log 2>/dev/null; echo "=== ls stage ==="; ls -la /tmp/fcb/stage 2>/dev/null | head -20; } > /tmp/fcb/diag-$ARM.txt
            cd /tmp/fcb
            git clone -q --depth 1 -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" dpub
            D="dpub/bench-v4/diag/$(date -u +%Y%m%d-%H%M%S)-$ARM.txt"
            mkdir -p "$(dirname "$D")" && cp /tmp/fcb/diag-$ARM.txt "$D"
            ( cd dpub && git config user.name fcb-diag && git config user.email d@l && git add -A bench-v4/ && git commit -qm "fcb diag $ARM" && git push -q origin HEAD:refs/heads/functity-out ) && echo "diag publicat $D"
            echo "::error::bratul $ARM nu a produs raport (rc=$RC) — vezi bench-v4/diag pe functity-out"
            exit 1
          fi
          if [ -f /tmp/fcb/results/$ARM.json ]; then
            cd /tmp/fcb
            for att in 1 2 3 4 5; do
              rm -rf rpub
              git clone -q --filter=blob:none --no-checkout -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" rpub 2>/dev/null && ( cd rpub && git sparse-checkout init --no-cone && git sparse-checkout set bench-v4 && git checkout -q functity-out ) && break
              sleep $((att*6))
            done
            D="rpub/bench-v4/$(date -u +%Y%m%d-%H%M)"
            mkdir -p "$D"; cp /tmp/fcb/results/$ARM.json "$D/"
            for lg in /tmp/fcb/results/server-trial*.log; do [ -f "$lg" ] && tail -c 300000 "$lg" > "$D/$(basename $lg .log)-$ARM.log"; done
            tail -c 12000 /tmp/fcb/driver-$ARM.log > "$D/driver-$ARM.txt"
            ( cd rpub && git config user.name fcb-pub && git config user.email p@l && git add -A bench-v4/ && git commit -qm "fcb $ARM raport $(date -u +%H%M)" && git push -q origin HEAD:refs/heads/functity-out ) && echo "raport publicat $D" || echo "PUSH rapoarte esuat"
          fi
          if [ "$RC" -ge 3 ]; then
            { echo "=== driver log (raport exista, boot esuat) ==="; tail -c 12000 /tmp/fcb/driver-$ARM.log; } > /tmp/fcb/diag-$ARM.txt
            cd /tmp/fcb
            git clone -q --depth 1 -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" dpub 2>/dev/null || true
            D="dpub/bench-v4/diag/$(date -u +%Y%m%d-%H%M%S)-$ARM-bootesec.txt"
            mkdir -p "$(dirname "$D")" && cp /tmp/fcb/diag-$ARM.txt "$D"
            ( cd dpub && git config user.name fcb-diag && git config user.email d@l && git add -A bench-v4/ && git commit -qm "fcb diag $ARM boot" && git push -q origin HEAD:refs/heads/functity-out ) && echo "diag publicat $D"
          fi

      - name: Verdict pe leg
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path('/tmp/fcb/results/${{ matrix.arm.id }}.json').read_text(encoding='utf-8'))
          parts = [f"status={d.get('status')}", f"probe={d.get('probate_reusite')}/{len(d.get('probe', []))}"]
          for k in ("boot_medie_s", "boot_cv_pct", "join_medie_ms", "tps_p50", "overrun_total", "overrun_max_ms",
                    "critice_total", "rss_medie_mb", "cpu_medie_pct", "gc_pauza_max_ms"):
              if d.get(k) is not None:
                parts.append(f"{k}={d[k]}")
          print("::warning::FC-BENCH ${{ matrix.arm.id }}: " + " ".join(parts))
          if d.get("tps_p50") is None:
              print("::warning::FC-BENCH ${{ matrix.arm.id }}: TPS NEMASURAT prin consola — " + str(d.get("tps_motiv", "")))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcbench-${{ matrix.arm.id }}
          path: /tmp/fcb/results/
          if-no-files-found: error
          retention-days: 14

  agregat:
    name: FC-BENCH36 verdict comparat
    needs: leg
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'fcbench-*', path: /tmp/fcb/arms, merge-multiple: true }
      - name: Compara + praguri + publicare pe functity-out
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, pathlib, statistics, sys
          rows = {}
          for f in sorted(pathlib.Path('/tmp/fcb/arms').glob('*.json')):
              d = json.loads(f.read_text(encoding='utf-8'))
              rows[d['arm']] = d
          if not rows:
              print("::error::nicun raport de la legs"); sys.exit(1)
          order = [a for a in ("catserver", "oficial1237", "functity_b0", "functity_b1") if a in rows]
          lines = ["# FC-BENCH v4 — rezultate (masurate, nu estimate)", "",
                   "Metoda: boot la cald, 3 probe/arm, world comun post-instalare, java 11, -Xmx1536M, pack 36/14 cu SHA fix.",
                   "Deviatii declarate: seed fix, online-mode=false pentru probele de login, view-distance=10, check_update=false (Mohist).", ""]
          hdr = ["brat", "stare", "boot_mediu_s", "CV%", "join_mediu_ms", "TPS_p50", "overrun", "overrun_max_ms", "critice", "RSS_MB", "CPU%", "GC_max_ms"]
          lines.append("| " + " | ".join(hdr) + " |")
          lines.append("|" + "---|" * len(hdr))
          for a in order:
              d = rows[a]
              lines.append("| " + " | ".join(str(x) for x in [
                  d.get('eticheta', a), d.get('status'), d.get('boot_medie_s'), d.get('boot_cv_pct'),
                  d.get('join_medie_ms'), d.get('tps_p50'), d.get('overrun_total'), d.get('overrun_max_ms'),
                  d.get('critice_total'), d.get('rss_medie_mb'), d.get('cpu_medie_pct'), d.get('gc_pauza_max_ms')]) + " |")
          # verdicturi comparative, doar unde ambele brațe au MASURAT
          def cmp(metric, a, b, better="lower", pct=True):
              if a in rows and b in rows and rows[a].get(metric) is not None and rows[b].get(metric) is not None:
                  va, vb = rows[a][metric], rows[b][metric]
              else:
                  return f"{metric} {a} vs {b}: NEMASURAT (lipsa date)"
              diff = (va - vb) / vb * 100 if pct and vb else va - vb
              cast = "MAI BINE" if (diff < 0) == (better == "lower") and diff != 0 else ("egal" if diff == 0 else "MAI PROST")
              return f"{metric} {a} vs {b}: {va} vs {vb} ({diff:+.1f}%) — {a} {cast}"
          checks = [
              cmp("boot_medie_s", "functity_b1", "functity_b0"),
              cmp("boot_medie_s", "functity_b0", "oficial1237"),
              cmp("boot_medie_s", "functity_b1", "oficial1237"),
              cmp("join_medie_ms", "functity_b1", "oficial1237", better="lower"),
              cmp("rss_medie_mb", "functity_b1", "oficial1237", better="lower"),
              cmp("tps_p50", "functity_b1", "oficial1237", better="higher"),
              cmp("boot_medie_s", "oficial1237", "catserver"),
          ]
          lines += ["", "## Verdicturi comparative", ""] + [f"- {c}" for c in checks]
          # praguri fixes (acceptante)
          praguri = []
          for a in order:
              d = rows[a]
              cv = d.get("boot_cv_pct")
              praguri.append((f"{a}: boot CV<10%", "TRECUT" if cv is not None and cv < 10 else ("ESUAT" if cv is not None else "NEMĂSURAT")))
              if a == "functity_b1":
                  crit = d.get("critice_total")
                  praguri.append(("functity_b1: 0 erori critice pe 3 probe", "TRECUT" if crit == 0 else ("ESUAT" if crit is not None else "NEMĂSURAT")))
          lines += ["", "## Praguri (fixate INAINTE de rulare)", ""] + [f"- {k}: {v}" for k, v in praguri]
          lines += ["", "## Semnificatie si limite", "",
                    "- 'boot_medie_s' = timp real de pornire pana la 'Done' (Include FML+plugini, world deja existent). Nu e un castig de gameplay.",
                    "- TPS vine din comenzile console; NEMASURAT inseamna ca motorul nu le publica parseabil, NU ca ar fi 20.",
                    "- probele de login masoara intarzierea de logare headless (offline); nu includ ecranul de asset-uri al clientului.",
                    "- overrun = numar de 'Can't keep up!' in fereastra masurata; 0 nu garanteaza absenta sub 120s idle.",
                    ""]
          out = pathlib.Path('/tmp/fcb/ARTEFACT/summary.md'); out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding='utf-8')
          json.dump(rows, open('/tmp/fcb/ARTEFACT/combined.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print("\n".join(lines))
          PY
      - name: Publicare pe functity-out (esec = rosu, nu warn)
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b functity-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" pub
          D="pub/bench-v4/$(date -u +%Y%m%d-%H%M)"
          mkdir -p "$D"
          cp /tmp/fcb/ARTEFACT/summary.md /tmp/fcb/ARTEFACT/combined.json "$D/"
          cp /tmp/fcb/arms/*.json "$D/" 2>/dev/null || true
          cd pub
          git config user.name 'functity-ci[bot]'; git config user.email 'fc@localhost'
          git add -A bench-v4/
          git commit -qm "fc-bench v4 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:refs/heads/functity-out; then echo "publicat in $D"; exit 0; fi
            git pull -q --no-rebase -X theirs origin functity-out && git commit -qm rerere || true
            sleep $((i*7))
          done
          echo "::error::nu am putut publica pe functity-out"; exit 1
