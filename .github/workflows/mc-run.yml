name: MC-RUN
# Serverul VIU de pe masina (Cloud Shell + frp, 92.5.171.150:25565).
# Regula casei (PROMPT-CUANTIC-AGENT.md): verdictul se publica DEVREME, inainte de
# orice asteptare; restart SE cere prin puntea cmd.in, nu prin java manual (pe aceeasi
# lume = mort); gh-ul masinii (cheering inel) pune raportul inapoi in repo pentru ca
# token-ul runner-ului e read-only.
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml

jobs:
  live:
    runs-on: self-hosted
    steps:
      - name: Stare inainte (verdict rapid)
        run: |
          export GH_TOKEN= GITHUB_TOKEN=
          T=/tmp/mcst.txt
          D=$HOME/cuantic-live
          {
            echo "=== stare $(date -u '+%F %T UTC') ==="
            pgrep -af "java @unix_args" | head -2 || echo "JAVA: jos"
            (exec 3<>/dev/tcp/127.0.0.1/25565) 2>/dev/null && echo "PORT 25565: viu" || echo "PORT 25565: inchis"
            pgrep -f "frpc" >/dev/null && echo "frpc: sus" || echo "frpc: jos"
            pgrep -f "c.sh|cuantic-live" >/dev/null && echo "supervisor c.sh: sus" || echo "supervisor c.sh: jos"
            [ -f "$D/logs/latest.log" ] && { echo "--- latest.log ( ultimele 15 )"; tail -15 "$D/logs/latest.log"; } || echo "fara latest.log"
            awk '/MemTotal|MemAvailable/ {printf "%s %d MiB\n", $1, $2/1024}' /proc/meminfo
            uptime 2>/dev/null || cat /proc/loadavg
          } > $T 2>&1
          cat $T
          pune() {
            local msg="$1"
            for i in 1 2 3; do
              sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
              if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md" \
                   -f message="$msg $(date -u +%H:%M:%S)" -f content="$(base64 -w0 < $T)" \
                   -f branch="$GITHUB_REF_NAME" ${sha:+-f sha=$sha} >/dev/null 2>&1; then
                echo "verdict publicat (incearca $i)"; return 0
              fi
              sleep 3
            done
            echo "verdict N-A AJUNS pe github"; return 0
          }
          pune "mc-run: stare inainte"
          # marcaj pentru "Done (" proaspat
          if [ -f "$D/logs/latest.log" ]; then wc -l < "$D/logs/latest.log" > /tmp/mcmark; else echo 0 > /tmp/mcmark; fi

      - name: Trezire (doar daca e jos; altfel nu ating nimic)
        timeout-minutes: 8
        run: |
          export GH_TOKEN= GITHUB_TOKEN=
          D=$HOME/cuantic-live
          if pgrep -f "java @unix_args" >/dev/null; then
            echo "java e deja sus - nu fac nimic"
            exit 0
          fi
          mkdir -p "$D"
          if pgrep -f "c.sh|cuantic-live.sh" >/dev/null; then
            echo "punte: trimite restart in cmd.in"
            echo restart > "$D/cmd.in"
          else
            echo "supervisorul e jos - il pornesc pe c.sh (masina il mai si reaprinde din bash ~/b.sh)"
            [ -x "$HOME/c.sh" ] || curl -fsSLo "$HOME/c.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/scripts/cuantic-live.sh" && chmod +x "$HOME/c.sh"
            ( setsid bash "$HOME/c.sh" >> "$D/sup.log" 2>&1 </dev/null & )
          fi
          OK=0
          for i in $(seq 1 45); do
            sleep 10
            if [ -f "$D/logs/latest.log" ]; then
              tail -n +"$(($(cat /tmp/mcmark) + 1))" "$D/logs/latest.log" 2>/dev/null | grep -q "Done (" && { OK=1; break; }
            fi
            pgrep -f "java @unix_args" >/dev/null || sleep 20
          done
          echo "boot: $([ $OK = 1 ] && echo "DONE (proaspat)" || echo "NU a apucat sa termine in fereastra")"
          {
            echo "=== dupa trezire $(date -u '+%F %T UTC') ==="
            echo "rezultat: $([ $OK = 1 ] && echo 'serverul a ajuns la Done ( proaspat' || echo 'Done ( NU s-a vazut in fereastra de ~7 minute')"
            pgrep -af "java @unix_args" | head -2 || echo "java inca jos"
            (exec 3<>/dev/tcp/127.0.0.1/25565) 2>/dev/null && echo "PORT 25565: viu" || echo "PORT 25565: inchis"
            [ -f "$D/logs/latest.log" ] && tail -n +"$(($(cat /tmp/mcmark) + 1))" "$D/logs/latest.log" 2>/dev/null | grep -E "Done \(|ERROR|Can.t keep up" | tail -8
            awk '/MemAvailable/ {printf "MemAvailable %d MiB\n", $2/1024}' /proc/meminfo
          } > /tmp/mcst.txt 2>&1
          cat /tmp/mcst.txt
          for i in 1 2 3; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md" \
              -f message="mc-run: dupa trezire $(date -u +%H:%M:%S)" -f content="$(base64 -w0 < /tmp/mcst.txt)" \
              -f branch="$GITHUB_REF_NAME" ${sha:+-f sha=$sha} >/dev/null 2>&1 && { echo "verdict final publicat"; break; }
            sleep 3
          done
          exit 0
