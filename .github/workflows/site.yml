name: Site CUANTIC (auto-update)
on:
  push:
    paths: ["analysis/**", "site/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regenereaza site-ul din verdictele reale
        run: python3 site/build_site.py && mkdir -p _site && cp site/index.html _site/
      - name: Salveaza cartea recordurilor
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add site/records.json site/index.html || true
          git commit -m "cartea recordurilor actualizata" || true
          git pull --rebase -X ours || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        id: deployment
