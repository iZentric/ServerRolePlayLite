name: curate-client
on:
  push:
    paths:
      - .github/workflows/curate-client.yml
jobs:
  curate:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: FunCity 1.2.4 = gameplay + optimizari active, cu LazyDFU si Oculus
        run: |
          set -e
          exec > >(tee /tmp/curate.log) 2>&1
          gh release download funcity -R "$GITHUB_REPOSITORY" -p FunCity-1.1.0.mrpack -D /tmp
          gh release download lite -R "$GITHUB_REPOSITORY" -p CUANTIC-Client-1.7.7.mrpack -D /tmp
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" -p functity-jare-toate.tar.gz -D /tmp
          mkdir -p /tmp/jare && tar xzf /tmp/functity-jare-toate.tar.gz -C /tmp/jare
          python3 - <<'PY'
          import json, zipfile
          SRC = "/tmp/FunCity-1.1.0.mrpack"
          LITE = "/tmp/CUANTIC-Client-1.7.7.mrpack"
          DST = "/tmp/FunCity-1.2.0.mrpack"
          WANT = ["radon", "entityculling", "out_of_sight", "entitycollisionfpsfix"]
          import os, glob
          picks = {}
          lite = zipfile.ZipFile(LITE)
          for n in lite.namelist():
              low = n.lower()
              if low.endswith(".jar") and any(w in low for w in WANT):
                  picks[n.split("/")[-1]] = lite.read(n)
          for fpath in glob.glob("/tmp/jare/**/*.jar", recursive=True):
              low = os.path.basename(fpath).lower()
              if any(w in low for w in WANT) and os.path.basename(fpath) not in picks:
                  picks[os.path.basename(fpath)] = open(fpath, "rb").read()
          print("GASITE IN LITE:", list(picks.keys()))
          zin = zipfile.ZipFile(SRC)
          idx = json.load(zin.open("modrinth.index.json"))
          src_names = set()
          for e in idx.get("files", []):
              fn = (e.get("filename") or (e.get("downloads") or ["?"])[0].rsplit("/", 1)[-1]).lower()
              src_names.add(fn.split("/")[-1])
          lidx = json.load(lite.open("modrinth.index.json"))
          extra = []
          for e in lidx.get("files", []):
              fn = (e.get("filename") or (e.get("downloads") or ["?"])[0].rsplit("/", 1)[-1]).lower()
              if any(w in fn for w in WANT) and fn not in src_names and fn not in [p.lower() for p in picks]:
                  extra.append(e)
          idx["files"] = idx.get("files", []) + extra
          zout = zipfile.ZipFile(DST, "w", zipfile.ZIP_DEFLATED)
          have = set()
          for n in zin.namelist():
              if n == "modrinth.index.json":
                  zout.writestr(n, json.dumps(idx, ensure_ascii=False, indent=2))
              else:
                  zout.writestr(n, zin.read(n))
              have.add(n.split("/")[-1].lower())
          added = []
          for name, data in picks.items():
              if name.lower() in have:
                  continue
              zout.writestr("overrides/mods/" + name, data)
              added.append(name)
          zout.close()
          print("ADAUGATE fizic:", added, "| din index lite:", [e.get("filename") for e in extra])
          d = json.load(zipfile.ZipFile(DST).open("modrinth.index.json"))
          zn = zipfile.ZipFile(DST).namelist()
          print("1.2.0: index", len(d["files"]), "| jar-uri override:", len([x for x in zn if x.endswith('.jar')]), "| marime:", __import__("os").path.getsize(DST))
          PY
          python3 - <<'PY'
          import zipfile,json,re,os
          SRC="/tmp/FunCity-1.2.0.mrpack"; DST="/tmp/FunCity-1.2.4.mrpack"
          REMOVE=re.compile(r'dynamic[-_]?fps|textruesrubidiumoptions|sound|audio|music|ambient|voice[-_]?chat',re.I)
          zin=zipfile.ZipFile(SRC); idx=json.load(zin.open("modrinth.index.json"))
          allm=[]
          for e in idx.get("files",[]):
              fn=(e.get("filename") or (e.get("downloads") or ["?"])[0]).rsplit("/",1)[-1]; allm.append(fn)
          for n in zin.namelist():
              b=n.rsplit("/",1)[-1]
              if b.endswith(".jar") and b not in allm: allm.append(b)
          print("LISTA CLIENT (inainte):")
          for m in sorted(allm): print("  ",m)
          keep=[e for e in idx.get("files",[]) if not REMOVE.search((e.get("filename") or (e.get("downloads") or ["?"])[0]).rsplit("/",1)[-1])]
          cut=[m for m in allm if REMOVE.search(m)]
          zout=zipfile.ZipFile(DST,"w",zipfile.ZIP_DEFLATED); nrem=0
          for n in zin.namelist():
              b=n.rsplit("/",1)[-1]
              if n=="modrinth.index.json":
                  idx["files"]=keep; zout.writestr(n,json.dumps(idx,ensure_ascii=False,indent=2)); continue
              if b.endswith(".jar") and REMOVE.search(b):
                  nrem+=1; continue
              zout.writestr(n,zin.read(n))
          zout.close()
          print("SCOS din client:",cut,"| fisiere jar eliminate:",nrem,"| marime:",os.path.getsize(DST))
          PY
          cp /tmp/FunCity-1.2.4.mrpack "$GITHUB_WORKSPACE/FunCity-1.2.4.mrpack"
          cp "$GITHUB_WORKSPACE/tools/FunCity-Update.bat" "$GITHUB_WORKSPACE/FunCity-Update.bat"
          gh release upload funcity "$GITHUB_WORKSPACE/FunCity-1.2.4.mrpack" "$GITHUB_WORKSPACE/FunCity-Update.bat" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit funcity -R "$GITHUB_REPOSITORY" --notes "## 🏙️ FUNCTITY 1.7.7 — client 1.2.4 gameplay + performanta in joc
          **🎮 CLIENT:** [FunCity-1.2.4.mrpack](https://github.com/iZentric/ServerRolePlayLite/releases/download/funcity/FunCity-1.2.4.mrpack) = content gameplay + optimizari active (Rubidium/ModernFix/Ferrite/EntityCulling/Radon/OutOfSight/CollisionFix); cu LazyDFU si Oculus pastrate; fara Dynamic FPS, sunete/voice chat si meniul TextruesRubidiumOptions
          **⚡ INSTALARE AUTOMATA pe PC-ul tau:** [FunCity-Update.bat](https://github.com/iZentric/ServerRolePlayLite/releases/download/funcity/FunCity-Update.bat) — dublu-click, gata: Isi pune singur in instantele FunCity si CUANTIC-Client-1.7.7, face backup data trecuta, seteaza RAM/GC. Ruleaza-l oricand = la zi.
          **🖥️ SERVER:** [FUNCTITY-SERVER.zip](https://github.com/iZentric/ServerRolePlayLite/releases/download/funcity/FUNCTITY-SERVER.zip) 486MB, Java inclus, Start/Actualizare bat
          Motor FunCity b1.0827 (fara Paper). Baza: [release lite](https://github.com/iZentric/ServerRolePlayLite/releases/tag/lite)."
          echo CURATE-DONE
      - name: Trimite logul
        if: always()
        run: |
          git config user.email b@b && git config user.name chk
          mkdir -p diag && cp /tmp/curate.log diag/curate.log 2>/dev/null || true
          git add -f diag/curate.log && git commit -qm "curate log $(date +%s)" && git push -q "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY" HEAD:"$GITHUB_REF_NAME" || true
