name: Zampto API probe
on:
  workflow_dispatch: {}
  push:
    branches: [ "arena/a29b4ef4-serverroleplaylite" ]
    paths: [ "deploy/trigger-probe.txt" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interogheaza API-ul Zampto
        env:
          KEY: ${{ secrets.ZAMPTO_API_KEY }}
        shell: bash
        run: |
          mkdir -p analysis
          OUT=analysis/zampto-api-probe.md
          echo "# Rezultat probe API Zampto ($(date -u))" > $OUT
          if [ -z "$KEY" ]; then
            echo "" >> $OUT
            echo "**EROARE: secretul ZAMPTO_API_KEY nu este setat in repo!**" >> $OUT
          else
            for URL in \
              "https://api.zampto.net/servers" \
              "https://api.zampto.net/" \
              "https://api.zampto.net/endpoints" \
            ; do
              CODE=$(curl -s -o /tmp/body -w '%{http_code}' -m 20 \
                -H "Authorization: $KEY" -H "Accept: application/json" "$URL" || echo "ERR")
              BODY=$(head -c 500 /tmp/body | tr -d '\r' | sed "s/$KEY/***/g")
              echo "" >> $OUT
              echo "## [raw-auth] $URL" >> $OUT
              echo "- status: **$CODE**" >> $OUT
              echo '```' >> $OUT
              echo "$BODY" >> $OUT
              echo '```' >> $OUT
              sleep 5
            done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/zampto-api-probe.md
          git commit -m "analysis: rezultat probe API Zampto" || echo "nimic"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
