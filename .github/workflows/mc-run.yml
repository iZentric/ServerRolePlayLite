name: MC-RUN
# Serverul VIU al lui marius, masina lui (Cloud Shell, frp, 92.5.171.150:25565).
# Semantica de culori: VERDE = server sanatos (SLP raspunde local). ROSU = boala si
# incercare de reanimare prin puntea casei (cmd.in -> c.sh -> FIFO JVM; NU java
# manual pe aceeasi lume). Verdictul il pune gh-ul MASINII in analysis/MC-STATUS.md
# (token-ul workflow-ului e read-only pe self-hosted public, cel din keyring nu).
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml

jobs:
  live:
    runs-on: self-hosted
    steps:
      - name: SLP local cu node (probe sanatatii)
        run: |
          cat > /tmp/slp.js <<'JS'
          const net = require("net");
          function vi(n){ n &= 0xFFFFFFFF; const o = []; while (true) { const hi = n & 0xFFFFFF80; if (hi === 0 || hi === 0xFFFFFF80) { o.push(n & 0xFF); return Buffer.from(o); } o.push((n & 0x7F) | 0x80); n >>>= 7; } }
          const host = "127.0.0.1", port = 25565;
          const s = net.connect(port, host);
          const tmo = setTimeout(() => { console.log("SLP: TIMEOUT 6s"); process.exit(1); }, 6000);
          s.on("error", e => { console.log("SLP: EROARE " + e.code); process.exit(1); });
          s.on("connect", () => {
            const h = "127.0.0.1";
            const hs = Buffer.concat([vi(0), vi(-1), vi(h.length), Buffer.from(h), (() => { const b = Buffer.alloc(2); b.writeUInt16BE(port); return b; })(), vi(1)]);
            s.write(Buffer.concat([vi(hs.length), hs, vi(1), Buffer.from([0])]));
          });
          let buf = Buffer.alloc(0);
          s.on("data", d => {
            buf = Buffer.concat([buf, d]);
            let n = 0, sh = 0, i = 0;
            while (i < buf.length) { const b = buf[i++]; n |= (b & 0x7F) << sh; if (!(b & 0x80)) break; sh += 7; }
            if (buf.length - i < n) return;
            try {
              const st = JSON.parse(buf.slice(i, i + n).toString("utf8"));
              clearTimeout(tmo);
              console.log("SLP: VIU | " + (st.version && st.version.name) + " | jucatori " + (st.players && st.players.online) + "/" + (st.players && st.players.max));
              s.end();
              process.exit(0);
            } catch (e) { console.log("SLP: raspuns stricat " + e.message); process.exit(1); }
          });
          JS
          node /tmp/slp.js; echo "SLP_RC=$?" | tee -a /tmp/mcflag
          true

      - name: Sanatate si reanimare (puntea caseii)
        run: |
          D=$HOME/cuantic-live
          MARK=0
          if pgrep -f "java @unix_args" >/dev/null; then S=ok; else S=jos; fi
          if [ "$S" = ok ]; then node /tmp/slp.js > /tmp/slp2.txt 2>&1 && H=sanatos || H=blocat; else H=absent; fi
          echo "stare: java=$S health=$H"
          if [ "$H" != sanatos ]; then
            if [ "$S" = jos ] && [ ! -x "$HOME/c.sh" ]; then
              curl -fsSLo "$HOME/c.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/scripts/cuantic-live.sh" && chmod +x "$HOME/c.sh"
            fi
            if [ "$S" = jos ]; then
              echo "java jos: ridic supervisorul c.sh (self-repara si pack-ul)"
              ( setsid bash "$HOME/c.sh" >> "$D/sup.log" 2>&1 </dev/null & )
            else
              echo "java sus dar SLP $H: cer RESTART prin punte (cmd.in)"
              mkdir -p "$D"; echo restart > "$D/cmd.in"
            fi
            if [ -f "$D/logs/latest.log" ]; then wc -l < "$D/logs/latest.log" > /tmp/mcmark; else echo 0 > /tmp/mcmark; fi
            for i in $(seq 1 40); do
              sleep 10
              if node /tmp/slp.js >/dev/null 2>&1; then echo "revino la viata dupa $((i*10))s"; break; fi
            done
            node /tmp/slp.js && H=redresat || H="nu s-a redresat in ~7 min"
            echo "dupa reanimare: $H"
          fi
          {
            echo "=== MC-RUN $(date -u '+%F %T UTC') ==="
            echo "java: $S | health: $H"
            pgrep -af "java @unix_args" | head -2
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/25565' 2>/dev/null && echo "port local 25565: viu" || echo "port local 25565: inchis"
            pgrep -f frpc >/dev/null && echo "frpc: sus" || echo "frpc: jos"
            [ -f "$D/logs/latest.log" ] && { echo "--- log (ultimele 12 din fereastra noua)"; tail -n +"$(( $(cat /tmp/mcmark 2>/dev/null || echo 0) + 1 ))" "$D/logs/latest.log" | tail -12; }
            awk '/MemAvailable/ {printf "MemAvailable %d MiB\n", $2/1024}' /proc/meminfo
            cat /proc/loadavg
          } > /tmp/mcst.txt
          cat /tmp/mcst.txt
          if [ "$H" = sanatos ] || [ "$H" = redresat ]; then R=success; else R=failure; fi
          export GH_TOKEN= GITHUB_TOKEN=
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md" \
            -f message="mc-run: $H @ $(date -u '+%H:%M')" -f content="$(base64 -w0 /tmp/mcst.txt)" \
            -f branch="$GITHUB_REF_NAME" -f sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)" \
            >/dev/null 2>&1 && echo "verdict publicat" || echo "verdict NU a ajuns (gh pe masina?)"
          [ "$R" = success ]
