name: VITEZA — 1.5.7 vs aceeasi-1.5.6 (A/B cuantificat)
on:
  push:
    paths: [ "deploy/viteza-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "CUANTIC-1.5.8-cu-spark", refpack: "nu" }
          - { id: "REF-fara-spark", refpack: "da" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Monta baza CUANTIC (jar campion identic ambelor randuri)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download lite -R "$GITHUB_REPOSITORY" -p '*Server-CatServer*.zip' -O srv.zip
          mkdir -p "$GITHUB_WORKSPACE/srv" && cd "$GITHUB_WORKSPACE/srv" && unzip -qo ../srv.zip
          ls *.jar | head -1 > /tmp/cjar
          echo "MODURI=$(ls mods 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
      - name: Ajustare REF (scoate noutatile 1.5.7 — ferritecore + spigot CUANTIC)
        run: |
          set +e
          if [ "${{ matrix.refpack }}" = "da" ]; then
            cd "$GITHUB_WORKSPACE/srv"
            ls -1 mods/ 2>/dev/null | grep -iE "ferrite|spark" > /tmp/scose.txt || true
            rm -f mods/[Ss]park*.jar
            echo "REF: spark scos ($(cat /tmp/scose.txt 2>/dev/null))" > /tmp/refnote
          else
            cd "$GITHUB_WORKSPACE/srv"
            ls -1 mods/ 2>/dev/null | grep -iE "ferrite|spark" > /tmp/scose.txt || true
            echo "1.5.8: spark PREZENT: $(cat /tmp/scose.txt 2>/dev/null)" > /tmp/refnote
          fi
          sha1sum "$(cat /tmp/cjar)" | cut -c1-12 > /tmp/jarmd5
      - name: Porne-ste si masora (mecanism identic cu tribunalul functional)
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/srv"
          echo "eula=true" > eula.txt
          START=$(date +%s)
          mkfifo in
          exec 3<> in
          java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false @unix_args.txt < in > boot.log 2>&1 &
          JP=$!
          MAXRSS=0; DONE=""; DUR=0; STABIL=0
          for k in $(seq 1 100); do
            if ! kill -0 $JP 2>/dev/null; then break; fi
            RSS=$(ps -o rss= -p $JP 2>/dev/null | awk '{print int($1/1024)}')
            [ -n "$RSS" ] && [ "$RSS" -gt "$MAXRSS" ] && MAXRSS=$RSS
            if [ -z "$DONE" ] && grep -q "Done (" boot.log 2>/dev/null; then
              DONE=$(grep -m1 -oE "Done \([0-9.]+s\)" boot.log)
              DUR=$(( $(date +%s) - START ))
              for q in $(seq 1 18); do
                sleep 5
                R=$(ps -o rss= -p $JP 2>/dev/null | awk '{print int($1/1024)}')
                [ -n "$R" ] && STABIL=$R
              done
              break
            fi
            sleep 5
          done
          if [ -z "$DONE" ]; then kill -0 $JP 2>/dev/null && DONE="TIMEOUT" || DONE="CRAPAT"; fi
          echo "stop" >&3 2>/dev/null; sleep 8
          kill -9 $JP 2>/dev/null
          PLGI=$(grep -cE "\]: Enabling " boot.log)
          ERRN=$(grep -c "ERROR" boot.log)
          MODN=$(ls mods | wc -l)
          mkdir -p "$GITHUB_WORKSPACE/analysis/viteza"
          {
            echo "# ${{ matrix.id }}"
            echo "- $(cat /tmp/refnote) | jar $(cat /tmp/jarmd5) | mods: $MODN"
            echo "- STATUS: **$DONE** in ${DUR}s | RAM varf ${MAXRSS}MB | STABIL@+90s ${STABIL}MB | plugini $PLGI | linii ERROR $ERRN"
            echo '```'
            tail -8 boot.log
            echo '```'
          } > "$GITHUB_WORKSPACE/analysis/viteza/${{ matrix.id }}.md"
          echo "verdict salvat"
      - name: Verdictul calatoreste prin artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viteza-${{ matrix.id }}
          path: analysis/viteza/${{ matrix.id }}.md
          if-no-files-found: ignore
  tablou:
    needs: probe
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: viteza-*
          path: vb
          merge-multiple: true
      - name: Tabloul de viteza
        run: |
          set +e
          {
            echo "# ⚛️ TABLOUL DE VITEZĂ — 1.5.7 vs 1.5.6-fără-noutăți"
            echo "_$(date -u '+%F %T UTC') — acelasi hardware, acelasi jar campion, diferenta = DOAR ferritecore + spigot.yml CUANTIC_"; echo
            for F in vb/*.md; do
              [ -f "$F" ] || continue
              echo "## $(basename "$F" .md)"
              sed -n '2,3p' "$F"
              echo
            done
            echo "Criterii: boot (Done), RAM stabil@+90s, zero erori noi."
          } > docs/VITEZA-CUANTIC.md
          mkdir -p analysis/viteza && cp vb/*.md analysis/viteza/ 2>/dev/null
          cat docs/VITEZA-CUANTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/VITEZA-CUANTIC.md analysis/viteza
          git commit -m "viteza: tablou A/B 1.5.7" || true
          for t in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "$GITHUB_REF_NAME" && break; sleep $((RANDOM%5+3)); done
          exit 0
