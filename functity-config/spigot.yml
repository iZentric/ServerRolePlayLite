# spigot.yml - reteta CUANTIC (a lui, testata pe servere mari)
settings:
  save-user-cache-on-stop-only: true
  log-villager-deaths: false
  moved-wrongly-threshold: 0.35
  moved-too-quickly-multiplier: 25.0
world-settings:
  default:
    mob-spawn-range: 4
    entity-activation-range:
      animals: 12
      monsters: 16
      raiders: 16
      misc: 6
      water: 12
      villagers: 12
      tick-inactive-villagers: false
    entity-tracking-range:
      players: 48
      animals: 24
      monsters: 24
      misc: 12
      other: 32
      water: 16
    merge-radius:
      item: 4.0
      exp: 6.0
    max-tnt-per-tick: 10
    item-despawn-rate: 6000
    max-entity-collisions: 2
    nerf-spawner-mobs: false
    zombie-aggressive-towards-villager: false
    arrow-despawn-rate: 200
    trident-despawn-rate: 200
    hopper-amount: 3
    ticks-per:
      hopper-transfer: 24
      hopper-check: 24
      monster-spawns: 10
