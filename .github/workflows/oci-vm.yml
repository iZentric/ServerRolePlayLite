name: OCI-VM
on:
  workflow_dispatch:
  push:
    branches: ['arena/*']
    paths: ['.github/workflows/oci-vm.yml']
permissions:
  contents: write
jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TEN: ${{ secrets.OCI_TENANCY }}
      USR: ${{ secrets.OCI_USER }}
      FPR: ${{ secrets.OCI_FINGERPRINT }}
      KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      REG: ${{ secrets.OCI_REGION }}
      GT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: "STEP1: auth"
        continue-on-error: true
        run: |
          mkdir -p /tmp/oc
          T=$(printf '%s' "$TEN" | tr -d '[:space:]'); U=$(printf '%s' "$USR" | tr -d '[:space:]'); F=$(printf '%s' "$FPR" | tr -d '[:space:]'); R=$(printf '%s' "$REG" | tr -d '[:space:]')
          printf 'TEN=%s\nUSR=%s\nFPR=%s\nREG=%s\n' "${T:0:25}" "${U:0:25}" "$F" "$R" > /tmp/oc/env.txt
          printf '%s\n' "$KEY" > /tmp/oc/oci.key
          openssl rsa -in /tmp/oc/oci.key -check -noout >> /tmp/oc/env.txt 2>&1
          cat > /tmp/oc/call.sh <<'EOS'
          TEN="$1"; shift
          RQ=$(cat /tmp/oc/rq)
          SIG=$(printf '%s' "$RQ" | openssl dgst -sha256 -sign /tmp/oc/oci.key | openssl base64 -A)
          EOS
          echo "STEP1 DONE" >> /tmp/oc/env.txt
      - name: "STEP2: API call de test"
        continue-on-error: true
        run: |
          cd /tmp/oc
          TEN=$(printf '%s' "${{ env.TEN }}" | tr -d '[:space:]')
          USR=$(printf '%s' "${{ env.USR }}" | tr -d '[:space:]')
          REG=$(printf '%s' "${{ env.REG }}" | tr -d '[:space:]')
          F256=$(openssl rsa -in oci.key -pubout -outform DER 2>/dev/null | openssl dgst -sha256 -binary | od -An -tx1 | tr -d ' \n' | sed 's/../&:/g;s/:$//')
          F1=$(openssl rsa -in oci.key -pubout -outform DER 2>/dev/null | openssl dgst -sha1 -binary | od -An -tx1 | tr -d ' \n' | sed 's/../&:/g;s/:$//')
          FM=$(openssl rsa -in oci.key -pubout -outform DER 2>/dev/null | openssl dgst -md5 -binary | od -An -tx1 | tr -d ' \n' | sed 's/../&:/g;s/:$//')
          { echo "FP_sha256=$F256"; echo "FP_sha1=$F1"; echo "FP_md5=$FM"; } > out2.txt
          P="/20160918/availabilityDomains?compartmentId=$TEN"
          D=$(date -u +"%a, %d %b %Y %H:%M:%S UTC")
          printf 'GET %s\ndate: %s' "$P" "$D" > rq.txt
          echo "PAS: rq" >> out2.txt
          SIG=$(openssl dgst -sha256 -sign oci.key < rq.txt | openssl base64 -A)
          echo "PAS: sig ${SIG:0:12}" >> out2.txt
          curl -s "https://iaas.$REG.oraclecloud.com$P" -H "date: $D" -H "Authorization: Signature headers=\"date (request-target)\",keyId=\"$TEN/$USR/$F1\",algorithm=\"rsa-sha256\",signature=\"$SIG\"" -o resp.json
          echo "PAS: curl" >> out2.txt
          head -c 300 resp.json >> out2.txt
          cat out2.txt
      - name: "STEP3: raport"
        if: always()
        run: |
          { echo "== run $GITHUB_RUN_ID $(date -u) =="; cat /tmp/oc/env.txt 2>/dev/null; echo "-- step2:"; cat /tmp/oc/out2.txt 2>/dev/null; } > /tmp/rep.txt
          python3 .github/oci-report.py
