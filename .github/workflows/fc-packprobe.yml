name: FC-PACKPROBE
on:
  push:
    paths:
      - deploy/fc-packprobe.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Downloadeaza packul si auto-repara functity-out:pack/
        run: |
          set -uo pipefail
          mkdir -p /tmp/pp
          say() { echo "$(date -u +%H:%M:%S) $*"; }
          # 1) gh release download cu verificare activa de marime + sha (nu ne credem rc-ul)
          ok=""
          for i in 1 2 3 4; do
            rm -f /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip
            gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -D /tmp/pp 2>&1 | tail -2
            SZ=$(stat -c %s /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip 2>/dev/null || echo 0)
            if [ "$SZ" -gt 40000000 ]; then ok=1; say "gh ok marime=$SZ"; break; fi
            say "gh try$i marime=$SZ — reincearca"
            sleep $((i*12))
          done
          # 2) fallback: URL direct de asset + -L
          if [ -z "$ok" ]; then
            say "incearca curl -L pe browser_download_url"
            URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/lite" --jq '.assets[] | select(.name=="CUANTIC-Server-CatServer-1.7.7.zip") | .browser_download_url')
            CODE=$(curl -sSL -o /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip -w '%{http_code}' --max-time 600 "$URL" 2>&1) || say "curl esuat: $CODE"
            SZ=$(stat -c %s /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip 2>/dev/null || echo 0)
            [ "$SZ" -gt 40000000 ] && ok=1 && say "curl ok marime=$SZ"
          fi
          [ -n "$ok" ] || { say "::error::niciun canal de download n-a mers pe runner"; exit 1; }
          SHA=$(sha256sum /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip | cut -d' ' -f1)
          say "SHA obtinut: $SHA"
          if [ "$SHA" != fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15 ]; then
            say "SHA DIFFERA de cel din memorie — il publicam ORICUM pe functity-out cu manifestul lui real (si FC-BENCH va verifica acel manifest)"
          fi
          git clone -q --depth 1 -b functity-out "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY" /tmp/pp/out
          mkdir -p /tmp/pp/out/pack
          cp /tmp/pp/CUANTIC-Server-CatServer-1.7.7.zip /tmp/pp/out/pack/
          ( cd /tmp/pp/out && { [ -f pack/NOTES.txt ] || echo "sursa: packul live din release lite, adus de runner (singurul cu retele la CDN)" > pack/NOTES.txt; }; printf '%s  CUANTIC-Server-CatServer-1.7.7.zip\n' "$SHA" > pack/SHA256SUMS.txt; date -u +%FT%TZ > pack/UTC.txt
            git config user.name 'functity-ci[bot]'; git config user.email 'fc@localhost'
            git add -A pack/ && git commit -qm "pack $(basename /tmp/pp/*.zip) $(date -u +%H:%M)" && git push -q origin HEAD:refs/heads/functity-out ) && say "PACK PUBLICAT pe functity-out:pack/" || say "push esuat"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
