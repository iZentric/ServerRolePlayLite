name: pc-cp
on:
  push:
    paths:
      - .github/workflows/pc-cp.yml
jobs:
  cp:
    permissions:
      contents: write
    timeout-minutes: 8
    runs-on: [self-hosted, Windows]
    steps:
      - name: Curata workdir
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          try { Set-Location "$env:GITHUB_WORKSPACE" } catch { exit 0 }
          Remove-Item -Force -ErrorAction SilentlyContinue "diag\CoreProtect.jar.b64","diag\pc-cp.txt"
          git checkout -- . 2>$null
          git clean -fdx diag 2>$null
          exit 0
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: CoreProtect via PC
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $steps = @()
          try {
            Set-Location $env:GITHUB_WORKSPACE
            $t = Join-Path $env:RUNNER_TEMP "cp.jar"
            $ok = $false
            foreach ($u in @("https://github.com/PlayPro/CoreProtect/releases/download/v21.2/CoreProtect-21.2.jar","https://github.com/PlayPro/CoreProtect/releases/download/v21.1/CoreProtect-21.1.jar")) {
              try { Invoke-WebRequest -UseBasicParsing $u -OutFile $t -TimeoutSec 120; if ((Get-Item $t).Length -gt 500000) { $ok = $true; $steps += "dl-ok"; break } } catch { $steps += "dl-esec" }
            }
            if ($ok) {
              [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\diag\CoreProtect.jar", [IO.File]::ReadAllBytes($t))
              $steps += "jar-pus $((Get-Item diag\CoreProtect.jar).Length)B"
            }
            "PC: $($steps -join ', ') la $(Get-Date -Format HH:mm:ss)" | Set-Content diag\pc-cp.txt -Encoding ascii
            git config user.email pc@functity.local
            git config user.name functity-pc
            git add -f diag/CoreProtect.jar diag/pc-cp.txt
            git commit -qm "cp $(Get-Random)"
            $steps += "commit"
            git push "https://x-access-token:$env:GH_TOKEN@github.com/iZentric/ServerRolePlayLite" "HEAD:$env:GITHUB_REF_NAME" > pushout.txt 2>&1
            $steps += "push=$LASTEXITCODE"
          } catch { $steps += "EX:$($_.Exception.Message)" }
          $steps -join " " | Out-File "$env:RUNNER_TEMP\stepsum.txt"
          exit 0
      - name: Raport final
        shell: powershell
        run: |
          $s = Get-Content "$env:RUNNER_TEMP\stepsum.txt" -Raw -ErrorAction SilentlyContinue
          "FINAL: $s"
          exit 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sanseaza token pe push
        shell: powershell
        run: exit 0
