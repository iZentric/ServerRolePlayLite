name: Hosted RoadRunner vs Performant (or no optimizer) bounded A/B
# GitHub-hosted ONLY. Never touches the owner's PC, server, worlds, accounts or Prism.
# No public service, login, world uploads, raw logs, binaries or releases.
# Generated 80-zombie test is NOT RP gameplay, player capacity or client FPS.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/server-optimizer-ab.yml
      - scripts/fc_server_optimizer_ab.py
      - scripts/fc_server_optimizer_ab_test.py
permissions:
  contents: read
jobs:
  closed-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Synthetic guards — no Minecraft, no binaries or private world
        run: python3 scripts/fc_server_optimizer_ab_test.py
      - name: Fetch already-pinned historical FunCity lab inputs
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          mkdir -p "$root"
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" \
            -p functity-jare-toate.tar.gz -O "$root/engines.tar.gz"
          echo "f2cb921efbf751fa24534a9a02b57197db46294ca7b71d9711b04996bf6d1784  $root/engines.tar.gz" | sha256sum -c -
          python3 scripts/fc_plugin_first_extract.py "$root/engines.tar.gz" "$root/motor.jar"
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -O "$root/old-plugins.zip"
          echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  $root/old-plugins.zip" | sha256sum -c -
          gh release download v21.2 -R PlayPro/CoreProtect \
            -p CoreProtect-21.2.jar -O "$root/CoreProtect.jar"
          echo "04f31b609d1e3e1c53e99aaa06ca10ea6bdf5172c94bf5af8ccf108b0bc4b977  $root/CoreProtect.jar" | sha256sum -c -
          gh release download v21.0 -R google/guava \
            -p guava-21.0.jar -O "$root/guava-21.0.jar"
          echo "972139718abc8a4893fa78cba8cf7b2c903f35c97aaf44fa3031b0669948b480  $root/guava-21.0.jar" | sha256sum -c -
      - name: Fetch exact original Performant file 4562378 if vendor allows anonymous download
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          target="$root/performant-1.16.2-5-4.1m.jar"
          if curl -fsSL --connect-timeout 10 --max-time 70 --retry 1 \
               'https://www.curseforge.com/api/v1/mods/354143/files/4562378/download' \
               -o "$target" 2>/dev/null && \
             python3 - "$target" <<'PY'
          import sys
          from pathlib import Path
          from fc_mod_binary_evidence import inspect_jar
          p = Path(sys.argv[1])
          try:
              m = inspect_jar(p.read_bytes())
              good = 100_000 < p.stat().st_size < 1_000_000 and m['metadata'] == 'mods.toml' and 'performant' in m['mod_ids']
          except Exception:
              good = False
          sys.exit(0 if good else 2)
          PY
          then
            echo "PERFORMANT_PATH=$target" >> "$GITHUB_ENV"
            echo '::notice title=Optimizer test arms::Original Performant 4.1m available; compare R vs P on this hosted runner'
          else
            rm -f "$target"
            echo 'PERFORMANT_PATH=-' >> "$GITHUB_ENV"
            echo '::warning title=Optimizer test arms::Official Performant file unavailable to this hosted runner; compare RoadRunner vs NO OPTIMIZER only. DO NOT call this a RoadRunner-vs-Performant result.'
          fi
      - name: Stage full 15-mod RP content + 6 plugins (not published)
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-server-optimizer-ab"
          python3 scripts/fc_modded_candidate.py --engine "$root/motor.jar" \
            --archive "$root/old-plugins.zip" --coreprotect "$root/CoreProtect.jar" \
            --guava21 "$root/guava-21.0.jar" --output "$root/stage" --server-optimizer-lab
      - name: Generated-world R/P/P/R or R/N/N/R; publish numbers ONLY if all valid
        run: |
          set -Eeuo pipefail
          python3 scripts/fc_server_optimizer_ab.py \
            "$RUNNER_TEMP/fc-server-optimizer-ab" "$PERFORMANT_PATH"
