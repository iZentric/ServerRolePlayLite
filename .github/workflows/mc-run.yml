name: MC-RUN
# VPS ARM64 runner, bash+curl curat (fara incredere in python/git in container).
# FIECARE pas isi scrie randul in TRACE.txt pe bransa mc-run prin contents API,
# ca sa se vada si cand crapam pe loc. Boot de server = dovada "Done (" + port viu.
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml
      - scripts/mc_run_check.py

jobs:
  boot:
    runs-on: self-hosted
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Trace si unelte
        run: |
          MC="$GITHUB_WORKSPACE/mcw"
          mkdir -p "$MC" || { MC="${RUNNER_TEMP:-/tmp}/mcw"; mkdir -p "$MC"; }
          echo "MC=$MC" >> "$GITHUB_ENV"
          {
            echo "data: $(date -u '+%F %T UTC')"
            echo "shell: $BASH_VERSION"
            echo "python3: $(command -v python3 || echo absent)"
            echo "curl: $(command -v curl || echo absent)"
            echo "unzip: $(command -v unzip || echo absent)"
            echo "java: $(command -v java || echo absent)"; echo "shells: $(ls /bin | grep -cE '^(bash|sh)$') /busybox: $(readlink /bin/sh 2>/dev/null || echo nu)"
            echo "gh: $(command -v gh || echo absent)"
            echo "git: $(command -v git || echo absent)"
            echo "disk: $(df -h "$MC" | tail -1)"
            echo "mem: $(awk '/MemTotal|MemAvailable/{printf "%s %dM ", $1, $2/1024}' /proc/meminfo)"
            echo "container: $([ -e /.dockerenv ] && echo DA || echo nu-pare)"
          } > "$MC/trace.txt" 2>&1
          echo "PAS1: unelte inregistrate $(wc -l < "$MC/trace.txt") randuri" >> "$MC/trace.txt"
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt" \
            -d "{\"message\":\"trace pas1\",\"branch\":\"mc-run\",\"content\":\"$(base64 < "$MC/trace.txt" | tr -d '\n')\"}" > "$MC/put1.json" 2>&1 \
            || echo "PUT1 a esuat"
          echo "  PUT1 raspuns: $(head -c 180 "$MC/put1.json" 2>/dev/null)" >> "$MC/trace.txt"
          true

      - name: Java 16
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'

      - name: Trace java
        run: |
          { java -version 2>&1 | head -1 || echo "java LIPSA"; } >> "$MC/trace.txt"
          echo "PAS2: java $(command -v java || echo absent)" >> "$MC/trace.txt"
          sha=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt?ref=mc-run" | grep -o '"sha": *"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
          [ -n "$sha" ] && extra="\"sha\":\"$sha\"," || extra=""
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt" \
            -d "{\"message\":\"trace pas2\",\"branch\":\"mc-run\",$extra\"content\":\"$(base64 < "$MC/trace.txt" | tr -d '\n')\"}" || echo "PUT2 esuat"
          true

      - name: Aduce serverul din release
        run: |
          cd "$MC" || exit 0
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/lite" --jq '.assets[] | select(.name=="CUANTIC-Server-CatServer-1.7.7.zip") | .browser_download_url' 2>/dev/null || true)
          echo "PAS3: url=${url:-lipsa} srv.zip=$([ -s srv.zip ] && echo prezent $(stat -c%s srv.zip)B || echo absent)" >> trace.txt
          if [ -n "$url" ] && [ ! -s srv.zip ]; then
            curl -sfL "$url" -o srv.zip && echo "  download: $(stat -c%s srv.zip)B" >> trace.txt || echo "  DOWNLOAD ESUAT" >> trace.txt
          fi
          if [ -s srv.zip ]; then
            rm -rf unz && mkdir unz && (cd unz && unzip -oq ../srv.zip) 2>>trace.txt || echo "  UNZIP ESUAT (busybox?)" >> trace.txt
            JAR=$( (cd unz && find . -name '*.jar' ! -name '*client*' | while read -r j; do sz=$(wc -c < "$j" 2>/dev/null || echo 0); echo "$sz $j"; done) | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "$JAR" ]; then
              d=$(dirname "$JAR"); (cd "$d" && find . -maxdepth 1 -mindepth 1 -exec mv -t "$MC" {} +) 2>/dev/null || true
              [ -f "$MC/$(basename "$JAR")" ] && echo "JAR=$MC/$(basename "$JAR")" >> "$GITHUB_ENV"
              echo "  jar=$(basename "$JAR") mutat in \$MC" >> trace.txt
            else
              echo "  FARA JAR in zip:" >> trace.txt; unzip -l srv.zip | head -8 >> trace.txt 2>&1 || true
            fi
          fi
          sha=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt?ref=mc-run" | grep -o '"sha": *"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
          [ -n "$sha" ] && extra="\"sha\":\"$sha\"," || extra=""
          curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt" \
            -d "{\"message\":\"trace pas3\",\"branch\":\"mc-run\",$extra\"content\":\"$(base64 < trace.txt | tr -d '\n')\"}" || echo "PUT3 esuat"
          true

      - name: Configurare sigura
        run: |
          [ -n "${JAR:-}" ] || { echo "PAS4: sari (fara jar)" >> "$MC/trace.txt"; exit 0; }
          cd "$MC" || exit 0
          echo "eula=true" > eula.txt
          PASS=$(head -c 24 /dev/urandom | md5sum | cut -c1-16)
          echo "$PASS" > .rcpass
          touch server.properties
          for kv in "online-mode false" "server-port 25575" "view-distance 2" "simulation-distance 2" "max-players 2" "spawn-protection 0" "level-name staging" "level-type minecraft\\\\:flat" "generate-structures false" "allow-nether false" "enable-rcon true" "rcon.port 25585"; do
            k=${kv%% *}; v=${kv#* }
            grep -q "^$k=" server.properties && sed -i "s|^$k=.*|$k=$v|" server.properties || echo "$k=$v" >> server.properties
          done
          grep -q "^rcon.password=" server.properties && sed -i "s|^rcon.password=.*|rcon.password=$PASS|" server.properties || echo "rcon.password=$PASS" >> server.properties
          rm -f -- */session.lock world/session.lock 2>/dev/null || true
          echo "PAS4: configurat port 25575 rcon 25585" >> "$MC/trace.txt"
          true

      - name: Porneste si probeaza
        run: |
          cd "$MC" || exit 0
          if [ -z "${JAR:-}" ]; then echo "PAS5: sari boot" >> trace.txt; exit 0; fi
          FREE=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo 2>/dev/null || echo 1500)
          if [ "$FREE" -gt 3200 ]; then X=2048; elif [ "$FREE" -gt 2100 ]; then X=1400; else X=900; fi
          echo "PAS5: porneesc -Xmx${X}M (liber ${FREE}M)" >> trace.txt
          nohup java -Xms256M -Xmx${X}M -XX:MaxMetaspaceSize=320M -XX:+UseG1GC -jar "$JAR" nogui > console.log 2>&1 &
          JPID=$!
          echo "  pid $JPID" >> trace.txt
          OK=0
          for i in $(seq 1 100); do
            sleep 4
            if grep -q "Done (" console.log 2>/dev/null; then OK=1; break; fi
            if ! kill -0 "$JPID" 2>/dev/null; then echo "  java a murit la it $i" >> trace.txt; break; fi
          done
          if [ "$OK" = 1 ]; then
            SECS=$(grep -o "Done ([0-9.]*s)" console.log | head -1)
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/25575' 2>/dev/null && PORT=viu || PORT=inchis
            RSS=$(awk "/VmRSS/{print int(\\$2/1024)}" /proc/$JPID/status 2>/dev/null || echo ?)
            echo "  BOOT OK $SECS | port 25575 $PORT | RSS ${RSS} MiB" >> trace.txt
            echo "{\"state\":\"booted\",\"boot\":\"$SECS\",\"port\":\"$PORT\",\"rss_mib\":$RSS}" > summary.json 2>/dev/null \
              || printf '{"state":"booted","boot":"%s","port":"%s"}\n' "$SECS" "$PORT" > summary.json
            sleep 25
            echo "  soak 25s, rss max: $(awk "/VmRSS/{print int(\\$2/1024)}" /proc/$JPID/status 2>/dev/null || echo ?) MiB" >> trace.txt
          else
            echo "{\"state\":\"esuat\"}" > summary.json
            echo "  BOOT ESUAT - vezi boot.log" >> trace.txt
            head -c 60000 console.log > boot.log 2>/dev/null || true
          fi
          kill "$JPID" 2>/dev/null; sleep 6; kill -9 "$JPID" 2>/dev/null || true
          tail -c 380000 console.log > console-tail.log 2>/dev/null || true
          head -c 120000 console.log > boot.log 2>/dev/null || true
          PASS=$(cat .rcpass 2>/dev/null)
          for f in console-tail.log boot.log trace.txt summary.json; do
            [ -f "$f" ] && sed -i "s|$PASS|<REDACTAT>|g" "$f" 2>/dev/null || true
          done
          rm -f .rcpass eula.txt console.log
          true

      - name: Publica prin API
        if: always()
        run: |
          cd "$MC" || exit 0
          echo "PAS6: public" >> trace.txt
          upl() {
            f="$1"
            [ -s "$f" ] || return 0
            sha=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/$f?ref=mc-run" | grep -o '"sha": *"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
            [ -n "$sha" ] && extra="\"sha\":\"$sha\"," || extra=""
            curl -sf -o /dev/null -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/$f" \
              -d "{\"message\":\"mc-run $f la $(date -u '+%H:%M')\",\"branch\":\"mc-run\",$extra\"content\":\"$(base64 < "$f" | tr -d '\n')\"}" \
              && echo "  $f: OK" >> trace.txt || echo "  $f: PUT-ESUAT cod $(curl -s -o /dev/null -w '%{http_code}' "https://api.github.com" )" >> trace.txt
          }
          upl summary.json
          upl boot.log
          upl console-tail.log
          upl trace.txt
          { echo "run $GITHUB_RUN_ID: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "VPS ARM64 self-hosted; doar text rosit; lumea nu a fost atinguta."
          } > PROVENIENTA.txt
          upl PROVENIENTA.txt
          # trace-ul actualizat merge din nou, ca sa arate si succesele PUT-urilor
          sha=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt?ref=mc-run" | grep -o '"sha": *"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
          [ -n "$sha" ] && extra="\"sha\":\"$sha\"," || extra=""
          curl -sf -o /dev/null -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/mc-run/TRACE.txt" \
            -d "{\"message\":\"trace final\",\"branch\":\"mc-run\",$extra\"content\":\"$(base64 < trace.txt | tr -d '\n')\"}" || true
          true
