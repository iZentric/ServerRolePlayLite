name: HidenCloud SSH key retired - rotate before verification
# The previously pinned private key was pasted into chat. Never read an Actions
# Secret or report it as usable until a NEW key pair is generated on the PC.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/verify-hidencloud-ssh-secret.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Block verification of the exposed identity
        run: |
          echo '::error title=HidenCloud SSH key::EXPOSED_KEY_ROTATION_REQUIRED; do not use existing GitHub Secrets or the old PC key'
          exit 2
