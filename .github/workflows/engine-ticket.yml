# Experimental CatServer JAR patch from measured Spark ticket-expiry hot path.
# GitHub-hosted isolated test only; NO production restart or JAR deployment.
name: ENGINE TICKET — CatServer sorted-ticket prototype A/B
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-ticket.txt"]
permissions:
  contents: write
jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      CATSERVER_REV: 1d8d63138be77a606df2a5e940b960065948f983
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Download exact live-source LGPL-3.0 CatServer and unchanged 36-mod pack
        run: |
          set -euo pipefail
          mkdir -p engine-ticket-results /tmp/cuantic-ticket-source
          curl -fL --retry 3 --retry-delay 5 "https://codeload.github.com/Luohuayu/CatServer/tar.gz/$CATSERVER_REV" -o /tmp/ticket-source.tgz
          tar -xzf /tmp/ticket-source.tgz -C /tmp/cuantic-ticket-source --strip-components=1
          gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -O /tmp/cuantic-ticket.zip
          cp patches/engine-ticket/SortedArraySet.java.patch /tmp/cuantic-ticket-source/patches/minecraft/net/minecraft/util/SortedArraySet.java.patch
          cp /tmp/cuantic-ticket-source/LICENSE engine-ticket-results/CATSERVER-LICENSE.txt
      - name: Build experimental standalone JAR with source patch
        run: |
          set -euo pipefail
          cd /tmp/cuantic-ticket-source
          chmod +x gradlew
          sed -i -e 's/-XX:MaxPermSize=512m//g' -e 's/-Xmx3G/-Xmx5G/g' -e 's/org.gradle.parallel=true/org.gradle.parallel=false/' -e 's/org.gradle.configureondemand=true/org.gradle.configureondemand=false/' gradle.properties
          ./gradlew --no-daemon --no-parallel setup 2>&1 | tee "$GITHUB_WORKSPACE/engine-ticket-results/build.log"
          grep -q 'CUANTIC: expire chunk tickets' projects/forge/src/main/java/net/minecraft/util/SortedArraySet.java
          cat >> build.gradle <<'EOF'
          project(':forge') {
              tasks.withType(JavaCompile).configureEach {
                  options.fork = true
                  options.forkOptions.memoryMaximumSize = '4g'
              }
          }
          EOF
          sed -i 's/-Xmx5G/-Xmx2G/g' gradle.properties
          ./gradlew --no-daemon --no-parallel --max-workers=1 buildCatServer 2>&1 | tee -a "$GITHUB_WORKSPACE/engine-ticket-results/build.log"
      - name: Smoke 36 mods and 14 plugins; candidate never goes live
        run: |
          set -euo pipefail
          jar=$(find /tmp/cuantic-ticket-source -type f -iname 'CatServer*server.jar' -size +5M | head -1)
          test -s "$jar"
          python3 scripts/brand_engine.py "$jar" engine-ticket-results/CUANTIC-CatServer-ticket-experimental.jar > engine-ticket-results/brand.json
          sha256sum engine-ticket-results/*.jar > engine-ticket-results/SHA256SUMS.txt
          mkdir -p /tmp/cuantic-ticket-smoke
          unzip -q /tmp/cuantic-ticket.zip -d /tmp/cuantic-ticket-smoke
          cp engine-ticket-results/CUANTIC-CatServer-ticket-experimental.jar /tmp/cuantic-ticket-smoke/CatServer-1.16.5-1d8d6313-server.jar
          python3 scripts/engine_lab.py /tmp/cuantic-ticket-smoke engine-ticket-results/smoke.log
      - name: ABBA identical 64-ticket isolated workload
        run: python3 scripts/engine_ticket_compare.py /tmp/cuantic-ticket.zip engine-ticket-results/CUANTIC-CatServer-ticket-experimental.jar engine-ticket-results/abba
      - name: Publish verdict only; never release experimental JAR
        if: always()
        run: |
          { echo '# ENGINE TICKET — Spark-guided JAR prototype, experimental'; echo;
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            echo 'Exact-source CatServer LGPL-3.0; patch: patches/engine-ticket/SortedArraySet.java.patch.';
            echo 'No real player or vehicles in A/B. Live JAR unchanged. No promotion without repeatable win and player testing.'; echo;
            echo '## Smoke'; echo '```json'; cat engine-ticket-results/smoke-result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
            echo '## ABBA 64 force-loaded chunks'; echo '```json'; cat engine-ticket-results/abba/result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
            echo '## Build tail'; echo '```'; tail -24 engine-ticket-results/build.log 2>/dev/null || true; echo '```';
          } > docs/ENGINE-TICKET-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-TICKET-RESULT.md
          git commit -m 'engine ticket: isolated source patch benchmark verdict' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Experimental JAR retained only as short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuantic-engine-ticket-EXPERIMENTAL
          path: |
            engine-ticket-results/CUANTIC-CatServer-ticket-experimental.jar
            engine-ticket-results/CATSERVER-LICENSE.txt
            engine-ticket-results/SHA256SUMS.txt
            engine-ticket-results/smoke-result.json
            engine-ticket-results/abba/result.json
          retention-days: 7
