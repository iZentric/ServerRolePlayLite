name: Fix boot (jarul campion + opreste auto-stopul de idle)
on:
  push:
    paths: [ "deploy/fixboot-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: "2022"
  SFTP_USER: 15254.1388b9af
jobs:
  repara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instaleaza lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Ia jarul campion din release custom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fix
          gh release download custom -R "$GITHUB_REPOSITORY" -p '*server.jar' -O fix/server.jar
          ls -la fix/ | tail -2
          md5sum fix/server.jar
      - name: Patch server.properties (idle off) + pune jarul + VERIFICA byte-cu-byte
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get server.properties -o fix/sp.txt;
            bye"
          if grep -q '^player-idle-timeout' fix/sp.txt; then
            sed -i -E 's/^player-idle-timeout=.*/player-idle-timeout=0/' fix/sp.txt
          else
            echo 'player-idle-timeout=0' >> fix/sp.txt
          fi
          grep -E '^(player-idle|enable-rcon|rcon\.port)' fix/sp.txt | sed 's/=.*//' | tr '\n' ' '; echo
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            put fix/sp.txt -o server.properties;
            put fix/server.jar -o server.jar;
            bye"
          sleep 2
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get server.jar -o fix/verify.jar;
            bye"
          M1=$(md5sum fix/server.jar | cut -d' ' -f1)
          M2=$(md5sum fix/verify.jar 2>/dev/null | cut -d' ' -f1)
          OK="NU"; [ "$M1" = "$M2" ] && OK="DA"
          {
            echo "# FIX BOOT — $(date -u '+%F %T UTC')"
            echo "- jar campion local: \`$M1\` ($(stat -c%s fix/server.jar) bytes)"
            echo "- jar citat INAPOI de pe server: \`$M2\`"
            echo "- IDENTIC pe discul serverului: **$OK**"
            echo "- player-idle-timeout: 0 (auto-stopul de degeaba, oprit)"
            echo "- enable-rcon: DA, port 28147 (se inarmeaza la bootul urmator)"
          } > analysis/fix-boot.md
          cat analysis/fix-boot.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/fix-boot.md
          git commit -m "analysis: fix boot — jar campion + idle off" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push || true
          exit 0
