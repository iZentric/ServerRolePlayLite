name: FunCity experimental Rust packet compression - microbench ONLY
# Public deterministic byte arrays; never the owner pack, world, clients or JAR.
# This measures compressor throughput OUTSIDE JNI, not server player capacity.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/funcity-native-packet-research.yml
      - experiments/packet-compression/**
      - scripts/fc_packet_vectors.py
      - scripts/fc_packet_vectors_test.py
permissions:
  contents: read
jobs:
  native-versus-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Confirm deterministic public workload and toolchains
        run: |
          set -Eeuo pipefail
          python3 scripts/fc_packet_vectors_test.py
          rustc --version
          javac -version
      - name: Build pinned MIT libdeflate only in disposable runner temp
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-native-packet-research"
          mkdir "$root"
          git clone -q --depth 1 --filter=blob:none https://github.com/ebiggers/libdeflate.git "$root/libdeflate"
          git -C "$root/libdeflate" fetch -q --depth 1 origin 0758d0a12d34fac281b0fe27c5155fbe753d9511
          git -C "$root/libdeflate" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root/libdeflate" rev-parse HEAD)" = 0758d0a12d34fac281b0fe27c5155fbe753d9511
          test -s "$root/libdeflate/COPYING"
          cmake -S "$root/libdeflate" -B "$root/build" -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF -DLIBDEFLATE_BUILD_GZIP=OFF -DLIBDEFLATE_INSTALL=OFF
          cmake --build "$root/build" --target libdeflate_static --parallel 2
          rustc --edition=2021 --crate-name fc_packet -O \
            -L "native=$root/build" experiments/packet-compression/RustLibdeflate.rs \
            -o "$root/rust-packet"
          javac -d "$root" experiments/packet-compression/JavaDeflater.java
          python3 scripts/fc_packet_vectors.py "$root/packets" > "$root/manifest.txt"
      - name: Interleave Java/Rust/Rust/Java and verify zlib round-trip
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-native-packet-research"
          while read -r name loops; do
            for arm in J R R J; do
              index="$(find "$root" -maxdepth 1 -name "$name-$arm-*.zlib" | wc -l)"
              output="$root/$name-$arm-$index.zlib"
              if [ "$arm" = J ]; then
                java -cp "$root" JavaDeflater "$root/packets/$name" "$output" "$loops"
              else
                "$root/rust-packet" "$root/packets/$name" "$output" "$loops"
              fi
            done
          done < "$root/manifest.txt" > "$root/timings.txt"
          ROOT="$root" python3 - <<'PY'
          import json, os, re, statistics, zlib
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          lines = (root/'timings.txt').read_text().splitlines()
          vectors = [line.split() for line in (root/'manifest.txt').read_text().splitlines()]
          assert len(vectors) == 6 and len(lines) == 24
          results = {}
          for i, (name, _loops) in enumerate(vectors):
              raw = (root/'packets'/name).read_bytes()
              times = {'J': [], 'R': []}
              for j, arm in enumerate(('J', 'R', 'R', 'J')):
                  data = (root/f'{name}-{arm}-{times[arm].__len__()}.zlib').read_bytes()
                  assert zlib.decompress(data) == raw, 'protocol zlib round-trip failed'
                  prefix = 'JAVA' if arm == 'J' else 'RUST'
                  match = re.fullmatch(prefix + r'_ZLIB_MS=([0-9.]+) loops=\d+ source_bytes=\d+ compressed_bytes=\d+', lines[4*i+j])
                  assert match, 'missing/incorrect benchmark observation'
                  times[arm].append(float(match.group(1)))
              results[name] = {'java_ms': round(statistics.median(times['J']), 2),
                               'rust_libdeflate_ms': round(statistics.median(times['R']), 2)}
          print('PUBLIC_ZLIB_MICROBENCH=' + json.dumps(results, separators=(',', ':')))
          print('LIMITS: native Rust calls MIT libdeflate outside JNI; no real players, JVM/network overhead, 34/13 pack or capacity claim')
          PY
