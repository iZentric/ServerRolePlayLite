name: Site CUANTIC (rezultate verificate)
on:
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["analysis/**", "docs/ENGINE-*.md", "docs/BENCHMARK-MOTOARE-CUANTIC-2026-10-12.md", "docs/STRATEGIE-ROLEPLAY-SURVIVAL.md", "site/**", "tests/test_site_claims.py", "pack-rules.json", "deploy/play-address.txt", ".github/workflows/site.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/arena/a29b4ef4-serverroleplaylite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Status public direct, fara restart automat
        run: |
          STATUS=0
          R=$(python3 scripts/minecraft_status.py 92.5.171.150 25565) || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "SUS public (status handshake, nu login modat): $R" > /tmp/alive.txt
          else
            echo "NECONFIRMAT extern — $R; fara restart din testul site-ului" > /tmp/alive.txt
          fi
          { echo "# ALIVE CUANTIC — $(date -u '+%Y-%m-%d %H:%M:%S') UTC"; echo; echo '```'; cat /tmp/alive.txt; echo '```'; } > analysis/ALIVE.md
      - name: Regenereaza site-ul din probele reale si verifica afirmatiile
        run: |
          python3 site/build_site.py
          python3 -m unittest discover -s tests -p 'test_site_claims.py'
          mkdir -p _site && cp site/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
      - name: Pastreaza pagina si verdictul datat pe ramura sesiunii
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add site/index.html site/records.json analysis/ALIVE.md
          git commit -m 'site: status si probe actualizate' || true
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || git rebase --abort 2>/dev/null
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
