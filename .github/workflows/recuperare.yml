# PUNTE TEMPORARA DE RECUPERARE — nu atinge serverul live, nu publica release.
#
# De ce exista: sandbox-ul agentului are egress DOAR spre github.com /
# api.github.com / codeload.github.com / pypi / npm. Arhiva de recuperare este
# pe Google Drive (inaccesibil din sandbox). Artefactele de workflow ajung pe
# Azure Blob, iar log-urile pe actions.githubusercontent.com — ambele blocate.
# Singurul canal care functioneaza este git prin github.com, asa ca jobul publica
# arhiva pe o RAMURA IZOLATA, de unde sandbox-ul o preia cu `git fetch`.
#
# Siguranta:
#   * runner ubuntu-latest, NU self-hosted => zero contact cu serverul live
#   * ramura `recuperare-arhiva` este ORFANA si contine DOAR arhiva + manifestul;
#     nu contine .github/workflows, deci nimic nu se poate declansa de pe ea
#   * nu se atinge de `main`, de ramura sesiunii, de release-ul `lite` si nu
#     produce niciun JAR
#   * push-ul este conditionat de sha256 identic cu cel citit din Drive
#
# Se sterge dupa ce arhiva este preluata.
name: RECUPERARE — aduce arhiva de surse din Drive pe o ramura izolata

on:
  push:
    branches: ["arena/9bbcb24f-serverroleplaylite"]
    paths: [".github/workflows/recuperare.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recuperare-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_TRACKING_ID: ""
  FILE_ID: "1ipnjpUmC6TXd8vjvYuy2UsVxS4M6H6ix"
  SHA256_ASTEPTAT: "11f62e29440ae614cb77179548267bf6fa3fe5bb1359f6ac9d3f6bb0cced200e"
  MD5_ASTEPTAT: "8ddb97e685d9ed2b81bb6b54ff731198"
  DIM_ASTEPTATA: "428186"
  NUME: "RECUPERARE-CUANTIC-surse-2026-10-12.tar.gz"
  RAMURA_IZOLATA: "recuperare-arhiva"

jobs:
  preia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descarca arhiva si verifica suma de control
        run: |
          set -uo pipefail
          mkdir -p out
          incercari=(
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t"
            "https://drive.google.com/uc?export=download&id=${FILE_ID}"
          )
          ok=0
          for url in "${incercari[@]}"; do
            echo "--- incerc: $url"
            curl -fsSL --retry 2 --max-time 120 -o out/candidat "$url" || { echo "curl a esuat"; continue; }
            magia=$(head -c 2 out/candidat | od -An -tx1 | tr -d ' ')
            suma=$(sha256sum out/candidat | cut -d' ' -f1)
            md5=$(md5sum out/candidat | cut -d' ' -f1)
            dim=$(stat -c %s out/candidat)
            echo "    magie=0x$magia dim=$dim sha256=$suma md5=$md5"
            if [ "$magia" = "1f8b" ] && [ "$suma" = "$SHA256_ASTEPTAT" ] && [ "$md5" = "$MD5_ASTEPTAT" ]; then
              mv out/candidat "out/$NUME"
              echo "    POTRIVIRE — gzip valid, sha256 si md5 identice cu Drive"
              ok=1
              break
            fi
            echo "    nu corespunde — urmatoarea sursa"
            head -c 200 out/candidat; echo
          done
          [ "$ok" -eq 1 ] || { echo "::error::suma de control nu corespunde"; exit 1; }

      - name: Verifica integritatea arhivei in sine
        run: |
          cd out
          gzip -t "$NUME" && echo "gzip -t: OK"
          echo "intrari in arhiva: $(tar -tzf "$NUME" | wc -l)"
          tar -tzf "$NUME" | head -25

      - name: Publica pe ramura izolata (doar arhiva + manifest)
        run: |
          set -euo pipefail
          mkdir -p publicare && cd publicare
          cp "../out/$NUME" .
          {
            echo "fisier: $NUME"
            echo "octeti: $(stat -c %s "$NUME") (asteptat $DIM_ASTEPTATA)"
            echo "sha256: $(sha256sum "$NUME" | cut -d' ' -f1)"
            echo "md5: $(md5sum "$NUME" | cut -d' ' -f1)"
            echo "sursa: Google Drive file $FILE_ID"
            echo "publicat: $(date -u '+%Y-%m-%d %H:%M:%S') UTC de run $GITHUB_RUN_ID"
            echo "intrari: $(tar -tzf "$NUME" | wc -l)"
          } > MANIFEST-RECUPERARE.txt
          cat MANIFEST-RECUPERARE.txt
          git init -q .
          git checkout -q -b "$RAMURA_IZOLATA"
          git config user.name "arena-recuperare"
          git config user.email "arena-recuperare@users.noreply.github.com"
          git add "$NUME" MANIFEST-RECUPERARE.txt
          git commit -q -m "RECUPERARE: arhiva de surse CUANTIC, sha256 verificat (punte temporara; ramura orfana, doar arhiva + manifest)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$RAMURA_IZOLATA"
          echo "impins pe refs/heads/$RAMURA_IZOLATA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
