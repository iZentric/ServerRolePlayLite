name: schedule-zampto

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/schedule-trigger.txt"

jobs:
  creeaza-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Creeaza restart zilnic 06:00 prin API-ul panoului (Pterodactyl)
        run: |
          set -eo pipefail
          K='${{ secrets.ZAMPTO_PANEL_KEY }}'
          [ -z "$K" ] && { echo "LIPSESTE secretul ZAMPTO_PANEL_KEY (panou -> Account -> API Credentials -> cheie noua; apoi GitHub -> Settings -> Secrets -> Actions)"; exit 1; }
          H="Authorization: Bearer $K"
          J="Content-Type: application/json"
          A="Accept: Application/vnd.pterodactyl.v1+json"
          BASE="https://dash.zampto.net/api/client"
          # gaseste serverul
          SID=$(curl -sf -H "$H" -H "$A" "$BASE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data'][0]['attributes']['identifier'])")
          echo "server: $SID"
          # exista deja?
          if curl -sf -H "$H" -H "$A" "$BASE/servers/$SID/schedules" | grep -q "Restart zilnic"; then
            echo "schedule-ul exista deja"; exit 0
          fi
          # creeaza schedule 06:00 zilnic
          SCH=$(curl -sf -X POST -H "$H" -H "$J" -H "$A" "$BASE/servers/$SID/schedules" \
            -d '{"name":"Restart zilnic","minute":"0","hour":"6","day_of_month":"*","month":"*","day_of_week":"*","is_active":true}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['attributes']['id'])")
          echo "schedule id: $SCH"
          # task: restart
          curl -sf -X POST -H "$H" -H "$J" -H "$A" "$BASE/servers/$SID/schedules/$SCH/tasks" \
            -d '{"action":"power","payload":"restart","time_offset":0}' > /dev/null
          echo "RESTART ZILNIC 06:00 - CREAT"
