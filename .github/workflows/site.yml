name: site
# Publicarea paginii necesita decizie separata: nu publicam la push un status nevalidat.
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -Eeuo pipefail
          python3 site/build_site.py
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/assets/funcity-city.webp _site/assets/funcity-city.webp
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
