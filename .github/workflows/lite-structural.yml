name: FunCity Lite structural checks
# No PC runner, no server, no downloaded binaries, no release or deployment.
on:
  push:
    branches:
      - arena/9bbcb24f-serverroleplaylite
    paths:
      - 'scripts/fc_client_audit.py'
      - 'scripts/fc_mrpack_audit*.py'
      - 'scripts/fc_lite_repack*.py'
      - 'scripts/fc_server_lite_candidate*.py'
      - 'scripts/fc_mod_cost_review_test.py'
      - 'scripts/fc_plugin_first_gate*.py'
      - 'scripts/fc_plugin_first_stage*.py'
      - 'scripts/fc_plugin_first_smoke.py'
      - 'agent/PLUGIN-FIRST.json'
      - 'agent/PLUGIN-FIRST.md'
      - 'scripts/fc_mod_binary_evidence*.py'
      - 'agent/AUDIT-COST-MODURI.md'
      - 'scripts/fc_pack_stage_test.py'
      - 'scripts/fc_plugin_audit*.py'
      - 'scripts/fc_open_city_test.py'
      - 'scripts/fc_legacy_config_audit*.py'
      - 'scripts/fc_community_preflight*.py'
      - 'scripts/fc_bench.py'
      - 'scripts/fc_spawner_ab.py'
      - 'agent/DECIZII.md'
      - 'agent/voicechat-1.16.5-2.3.23.json'
      - 'diag/pc-client.txt'
      - '.github/workflows/lite-structural.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test archived inventory, Lite packaging and fail-closed staging
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts
        run: |
          set -Eeuo pipefail
          python3 scripts/fc_client_audit.py --self-test
          python3 scripts/fc_mrpack_audit_test.py
          python3 scripts/fc_lite_repack_test.py
          python3 scripts/fc_server_lite_candidate_test.py
          python3 scripts/fc_mod_cost_review_test.py
          python3 scripts/fc_plugin_first_gate_test.py
          python3 scripts/fc_plugin_first_stage_test.py
          python3 scripts/fc_mod_binary_evidence_test.py
          python3 scripts/fc_pack_stage_test.py
          python3 scripts/fc_plugin_audit_test.py
          python3 scripts/fc_open_city_test.py
          python3 scripts/fc_legacy_config_audit_test.py
          python3 scripts/fc_community_preflight_test.py
          git diff --check
