name: OCI — mută serverul pe VM-ul care nu doarme (systemd, Restart=always)
on:
  push:
    paths: [ "scripts/oci-takeover.sh", "deploy/oci.txt", ".github/workflows/oci.yml" ]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  RUNNER_TRACKING_ID: ""
jobs:
  a:
    runs-on: [self-hosted]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/oci-takeover.sh

      - name: Regula — serverul ramane pornit dupa orice comanda
        if: always()
        run: bash scripts/ensure-up.sh
