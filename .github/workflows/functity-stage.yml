name: FUNCIŢY-STAGE
# Staging FunCity PE GAZDA: backup, asamblare, boot, oprire, repornire din date salvate.
# Jobul h ruleaza pe masina (self-hosted); rezultatul se intoarce pe bransa prin artefact
# + relay hosted (gazda n-are chei de push). Reguli: nu atingem productia, port separat,
#backup inainte de orice boot. Mod: din inputs (dispatch) sau din markerul deploy/funcity-stage.txt (push).
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "backup | assemble | test | up | down"
        required: true
        default: "test"
      candidat:
        description: "build din functity-out:builds/ (ex. b1.2256)"
        required: false
        default: "b1.2256"
      port:
        description: "port test (NU 25565 decat cu productia Jos)"
        required: false
        default: "25566"
      heap:
        description: "Xmx heap staging"
        required: false
        default: "3G"
  push:
    paths: [ "deploy/funcity-stage.txt" ]
permissions:
  contents: write
jobs:
  s:
    runs-on: [ self-hosted ]
    timeout-minutes: 28
    continue-on-error: true
    env:
      FUNCITY_JAR: ${{ inputs.candidat }}
      FUNCITY_PORT: ${{ inputs.port }}
      FUNCITY_XMX: ${{ inputs.heap }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - name: Ruleaza modul cerut (auto = din marker)
        run: |
          set +e
          MOD="${{ inputs.mod }}"
          [ -z "$MOD" ] && MOD=auto
          bash scripts/functity-stage.sh "$MOD"
          echo "RC=$?" >> /tmp/funcity-stage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage-raw, path: /tmp/funcity-stage.txt }
      - name: Plasa de siguranta world -> release (ruleaza DOAR dupa snapgit)
        if: always()
        run: |
          set +e
          R="$HOME/functity-out/worldsync.ready"
          [ -f "$R" ] || exit 0
          API=https://api.github.com/repos/$GITHUB_REPOSITORY
          UP=https://uploads.github.com/repos/$GITHUB_REPOSITORY
          TOK="${{ secrets.GITHUB_TOKEN }}"
          GETID='import sys,json;print(json.load(sys.stdin).get("id","") or "")'
          RID=$(curl -s -H "Authorization: Bearer $TOK" $API/releases/tags/world-live 2>/dev/null | python3 -c "$GETID" 2>/dev/null)
          if [ -z "$RID" ] || [ "$RID" = None ]; then
            RID=$(curl -s -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" -d '{"tag_name":"world-live","name":"FunCity world snapshots","draft":false,"body":"Plasa de siguranta a lumii FunCity. Nu stergeti release-ul."}' $API/releases | python3 -c "$GETID" 2>/dev/null)
          fi
          if [ -z "$RID" ] || [ "$RID" = None ]; then echo "ESUEC: nu am putut crea/gasi release world-live"; rm -f "$R"; exit 0; fi
          AID=$(curl -s -H "Authorization: Bearer $TOK" $API/releases/$RID/assets | python3 -c 'import sys,json;print(next((x["id"] for x in json.load(sys.stdin) if x["name"]=="worldsync.tar.gz"),""))' 2>/dev/null)
          if [ -n "$AID" ]; then curl -s -X DELETE -H "Authorization: Bearer $TOK" $API/releases/assets/$AID > /dev/null; fi
          curl -s -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/gzip" --data-binary "@$HOME/functity-out/worldsync.tar.gz" "$UP/releases/$RID/assets?name=worldsync.tar.gz" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("ASSET OK, bytes:",d.get("size"))' 2>/dev/null || echo "ESUEC UPLOAD (raspuns negat)"
          echo "semnatura: $(cat $R)"
          rm -f "$R"
  relay:
    needs: s
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: stage-raw, path: /tmp/relay }
      - name: Raport = check annotation (zero fisiere md)
        run: |
          set +e
          F=/tmp/relay/funcity-stage.txt
          [ -f "$F" ] || { echo "fara raport de la gazda"; exit 0; }
          HEAD=$(git rev-parse HEAD)
          SLP=$(timeout 15 python3 scripts/minecraft_status.py 92.5.171.150 25565 2>/dev/null | grep -oE '"online": [0-9]+|"max": [0-9]+' | tr "\n" " ")
          TXT=$(python3 -c 'import sys,os,json
t=open("/tmp/relay/funcity-stage.txt").read()
t=t.replace("\r","")
slp=os.environ.get("SLP","")
msg=("sonda: "+slp+" | " if slp else "")+t
print(json.dumps(msg)[:5800])' 2>/dev/null)
          SLP="$SLP" python3 - <<'EO' > /tmp/payload.json 2>/dev/null || true
import os,json
t=open("/tmp/relay/funcity-stage.txt").read().replace("\r","")
slp=os.environ.get("SLP","")
msg=(("sonda 25565: "+slp+" | ") if slp else "")+t
head=os.environ.get("HEAD")
print(json.dumps({"commit_id":head,"annotations":[{"path":"functity-stage","start_line":1,"end_line":1,"annotation_level":"notice","title":"Raport gazda (annotation, nu fisier)","message":msg[:5900]}]}))
EO
          HEAD="$HEAD" curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" --data @/tmp/payload.json "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -o /dev/null -w "annotation HTTP %{http_code}\n"
