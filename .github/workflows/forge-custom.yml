name: FORJA CatServer-Custom
on:
  push:
    paths: ["deploy/forja-trigger.txt"]
permissions:
  contents: write
jobs:
  forja:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - name: Clonam sursa CatServer (1.16.5)
        run: git clone --depth 25 -b 1.16.5 https://github.com/Luohuayu/CatServer catsrc
      - name: FAZA 1 - construim jarul NOSTRU din sursa
        run: |
          cd catsrc
          # BRANDUL EvoKode cusut in sursa: numele raportat de server -> EvoKode
          for f in $(grep -rln 'getServerModName' src patches 2>/dev/null | head -5); do
            sed -i 's/return "CatServer"/return "EvoKode"/g' "$f"
            echo "brand EvoKode cusut in: $f"
          done
          git log -1 --format="sursa: %h %s (%ci)" | tee ../forja.log
          ls | tee -a ../forja.log
          chmod +x gradlew || true
          (./gradlew tasks --all --no-daemon -q 2>&1 | grep -iE "setup|build|jar|launcher" | head -20) >> ../forja.log 2>&1 || true
          (timeout 90m ./gradlew setup --no-daemon >> ../forja.log 2>&1 && echo "SETUP OK" >> ../forja.log) || echo "setup esuat/inexistent" >> ../forja.log
          (timeout 25m ./gradlew buildCatServer --no-daemon >> ../forja.log 2>&1 && echo "BUILDCATSERVER OK" >> ../forja.log) || echo "build esuat" >> ../forja.log
          echo "== jaruri nascute (toate build/libs + nume CatServer):" >> ../forja.log
          find . -path "*build/libs/*.jar" >> ../forja.log 2>/dev/null || true
          find . -iname "*catserver*.jar" -not -path "*/caches/*" >> ../forja.log 2>/dev/null || true
      - name: Raport in analysis/
        if: always()
        run: |
          mkdir -p analysis
          { echo "# FORJA CatServer-Custom ($(date -u))"; echo '```'; tail -120 forja.log; echo '```'; } > analysis/forja-catserver.md
          J=$(find catsrc -iname "*catserver*.jar" -path "*libs*" | head -1)
          [ -z "$J" ] && J=$(find catsrc -path "*build/libs/*.jar" -size +10M | head -1)
          if [ -n "$J" ]; then
            gh release delete custom -y 2>/dev/null || true
            gh release create custom -t "CatServer-Custom (forja noastra)" -n "jar construit de noi din sursa" "$J" || true
            echo "JAR URCAT: $J" >> analysis/forja-catserver.md
          fi
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add analysis/ && git commit -m "raport forja" && git pull --rebase -X ours && git push || true
        env:
          GH_TOKEN: ${{ github.token }}
