name: Read-only Lite and server distance/performance-settings audit
# Read numeric/boolean options only; never edit Prism, game, server or private logs.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths: [.github/workflows/pc-lite-render-distance-audit.yml]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic sanitized server and client options
        shell: pwsh
        run: ./scripts/fc_render_distance_audit_test.ps1
  pc-read-only:
    needs: guards
    runs-on: [self-hosted, Windows]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only approved Lite profile and FunCity server options
        shell: powershell
        run: |
          $profile='C:\Users\Administrator\AppData\Roaming\PrismLauncher\instances\FunCity RP Lite'
          $server='C:\Users\Administrator\Desktop\FunCityLocal\server'
          & ./scripts/fc_render_distance_audit.ps1 -Profile $profile -Server $server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
