name: OCI-VM
on:
  workflow_dispatch:
  push:
    branches: ['arena/*']
    paths: ['.github/workflows/oci-vm.yml']
permissions:
  contents: write
jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TEN: ${{ secrets.OCI_TENANCY }}
      USR: ${{ secrets.OCI_USER }}
      FPR: ${{ secrets.OCI_FINGERPRINT }}
      KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      REG: ${{ secrets.OCI_REGION }}
      GT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "STEP1: auth"
        continue-on-error: true
        run: |
          mkdir -p /tmp/oc
          T=$(printf '%s' "$TEN" | tr -d '[:space:]'); U=$(printf '%s' "$USR" | tr -d '[:space:]'); F=$(printf '%s' "$FPR" | tr -d '[:space:]'); R=$(printf '%s' "$REG" | tr -d '[:space:]')
          printf 'TEN=%s\nUSR=%s\nFPR=%s\nREG=%s\n' "${T:0:25}" "${U:0:25}" "$F" "$R" > /tmp/oc/env.txt
          printf '%s\n' "$KEY" > /tmp/oc/oci.key
          openssl rsa -in /tmp/oc/oci.key -check -noout >> /tmp/oc/env.txt 2>&1
          cat > /tmp/oc/call.sh <<'EOS'
          TEN="$1"; shift
          RQ=$(cat /tmp/oc/rq)
          SIG=$(printf '%s' "$RQ" | openssl dgst -sha256 -sign /tmp/oc/oci.key | openssl base64 -A)
          EOS
          echo "STEP1 DONE" >> /tmp/oc/env.txt
      - name: "STEP2: API call de test"
        continue-on-error: true
        run: |
          cd /tmp/oc
          TEN=$(printf '%s' "${{ env.TEN }}" | tr -d '[:space:]')
          USR=$(printf '%s' "${{ env.USR }}" | tr -d '[:space:]')
          FPR=$(printf '%s' "${{ env.FPR }}" | tr -d '[:space:]')
          REG=$(printf '%s' "${{ env.REG }}" | tr -d '[:space:]')
          D=$(date -u +"%a, %d %b %Y %H:%M:%S UTC")
          P="/20160918/availabilityDomains?compartmentId=$TEN"
          printf 'GET %s\ndate: %s' "$P" "$D" > rq.txt
          SIG=$(openssl dgst -sha256 -sign oci.key < rq.txt | openssl base64 -A)
          curl -s "https://iaas.$REG.oraclecloud.com$P" -H "date: $D" -H "Authorization: Signature headers=\"date (request-target)\",keyId=\"$TEN/$USR/$FPR\",algorithm=\"rsa-sha256\",signature=\"$SIG\"" -o resp.json
          head -c 400 resp.json >> out2.txt; echo >> out2.txt
          python3 -c "import json;d=json.load(open('resp.json'));print('AD:',d[0]['name'])" >> out2.txt 2>&1
          cat out2.txt
      - name: "STEP3: raport"
        if: always()
        run: |
          git config user.email b@b && git config user.name vm
          git checkout -q -B packdiag origin/packdiag 2>/dev/null || git checkout -q --orphan packdiag
          mkdir -p diag
          { echo "== run $GITHUB_RUN_ID $(date -u) =="; cat /tmp/oc/env.txt; echo "-- step2:"; cat /tmp/oc/out2.txt 2>/dev/null; } > diag/oci-run.txt
          git add -f diag && git commit -qm "oci trace $GITHUB_RUN_ID" --allow-empty
          git push -qf origin packdiag:packdiag && echo IMPINS || echo IMPINS-ESUAT
