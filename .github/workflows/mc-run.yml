name: MC-RUN
# Serverul VIU al lui marius, masina lui (Cloud Shell, frp, 92.5.171.150:25565).
# Semantica de culori: VERDE = server sanatos (SLP raspunde local). ROSU = boala si
# incercare de reanimare prin puntea casei (cmd.in -> c.sh -> FIFO JVM; NU java
# manual pe aceeasi lume). Verdictul il pune gh-ul MASINII in analysis/MC-STATUS.md
# (token-ul workflow-ului e read-only pe self-hosted public, cel din keyring nu).
on:
  push:
    paths:
      - deploy/mc-run.txt
      - .github/workflows/mc-run.yml

jobs:
  live:
    runs-on: self-hosted
    steps:
      - name: SLP local cu node (probe sanatatii)
        run: |
          set +e
          cat > /tmp/slp.js <<'JS'
          const net = require("net");
          function vi(n){ n &= 0xFFFFFFFF; const o = []; while (true) { const hi = n & 0xFFFFFF80; if (hi === 0 || hi === 0xFFFFFF80) { o.push(n & 0xFF); return Buffer.from(o); } o.push((n & 0x7F) | 0x80); n >>>= 7; } }
          const host = "127.0.0.1", port = 25565;
          const s = net.connect(port, host);
          const tmo = setTimeout(() => { console.log("SLP: TIMEOUT 6s"); process.exit(1); }, 6000);
          s.on("error", e => { console.log("SLP: EROARE " + e.code); process.exit(1); });
          s.on("connect", () => {
            const h = "127.0.0.1";
            const hs = Buffer.concat([vi(0), vi(-1), vi(h.length), Buffer.from(h), (() => { const b = Buffer.alloc(2); b.writeUInt16BE(port); return b; })(), vi(1)]);
            s.write(Buffer.concat([vi(hs.length), hs, vi(1), Buffer.from([0])]));
          });
          let buf = Buffer.alloc(0);
          s.on("data", d => {
            buf = Buffer.concat([buf, d]);
            let n = 0, sh = 0, i = 0;
            while (i < buf.length) { const b = buf[i++]; n |= (b & 0x7F) << sh; if (!(b & 0x80)) break; sh += 7; }
            if (buf.length - i < n) return;
            try {
              const st = JSON.parse(buf.slice(i, i + n).toString("utf8"));
              clearTimeout(tmo);
              console.log("SLP: VIU | " + (st.version && st.version.name) + " | jucatori " + (st.players && st.players.online) + "/" + (st.players && st.players.max));
              s.end();
              process.exit(0);
            } catch (e) { console.log("SLP: raspuns stricat " + e.message); process.exit(1); }
          });
          JS
          node /tmp/slp.js; echo "SLP_RC=$?" | tee -a /tmp/mcflag
          true

      - name: Sanatate si reanimare (puntea caseii)
        run: |
          set +e
          D=$HOME/cuantic-live
          MARK=0
          if pgrep -f "java @unix_args" >/dev/null; then S=ok; else S=jos; fi
          if [ "$S" = ok ]; then node /tmp/slp.js > /tmp/slp2.txt 2>&1 && H=sanatos || H=blocat; else H=absent; fi
          echo "stare: java=$S health=$H"
          if [ "$H" != sanatos ]; then
            if [ "$S" = jos ] && [ ! -x "$HOME/c.sh" ]; then
              curl -fsSLo "$HOME/c.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/scripts/cuantic-live.sh" && chmod +x "$HOME/c.sh"
            fi
            if [ "$S" = jos ]; then
              echo "java jos: ridic supervisorul c.sh (self-repara si pack-ul)"
              ( setsid bash "$HOME/c.sh" >> "$D/sup.log" 2>&1 </dev/null & )
            else
              echo "java sus dar SLP $H: cer RESTART prin punte (cmd.in)"
              mkdir -p "$D"; echo restart > "$D/cmd.in"
            fi
            if [ -f "$D/logs/latest.log" ]; then wc -l < "$D/logs/latest.log" > /tmp/mcmark; else echo 0 > /tmp/mcmark; fi
            for i in $(seq 1 40); do
              sleep 10
              if node /tmp/slp.js >/dev/null 2>&1; then echo "revino la viata dupa $((i*10))s"; break; fi
            done
            node /tmp/slp.js && H=redresat || H="nu s-a redresat in ~7 min"
            echo "dupa reanimare: $H"
          fi
          {
            echo "=== MC-RUN $(date -u '+%F %T UTC') ==="
            echo "java: $S | health: $H"
            pgrep -af "java @unix_args" | head -2
            bash -c 'exec 3<>/dev/tcp/127.0.0.1/25565' 2>/dev/null && echo "port local 25565: viu" || echo "port local 25565: inchis"
            pgrep -f frpc >/dev/null && echo "frpc: sus" || echo "frpc: jos"
            [ -f "$D/logs/latest.log" ] && { echo "--- log (ultimele 12 din fereastra noua)"; tail -n +"$(( $(cat /tmp/mcmark 2>/dev/null || echo 0) + 1 ))" "$D/logs/latest.log" | tail -12; }
            awk '/MemAvailable/ {printf "MemAvailable %d MiB\n", $2/1024}' /proc/meminfo
            cat /proc/loadavg
          } > /tmp/mcst.txt
          cat /tmp/mcst.txt
          if [ "$H" = sanatos ] || [ "$H" = redresat ]; then echo success > /tmp/mcverdict; else echo failure > /tmp/mcverdict; fi
          true

      - name: Verdict pe bransa
        run: |
          set +e
          echo "canale: gh=$(command -v gh || echo absent) node=$(command -v node || echo absent) curl=$(command -v curl || echo absent) python3=$(command -v python3 || echo absent)"
          echo "keyring: hosts.yml $([ -f "$HOME/.config/gh/hosts.yml" ] && echo DA || echo NU) / .git-credentials $([ -f "$HOME/.git-credentials" ] && echo DA || echo NU)"
          export GH_TOKEN= GITHUB_TOKEN=
          MSG="mc-run: stare $(date -u '+%H:%M') - vezi MC-STATUS.md"
          ok=""
          if command -v gh >/dev/null 2>&1; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/analysis/MC-STATUS.md" \
                 -f message="$MSG" -f content="$(base64 -w0 /tmp/mcst.txt)" -f branch="$GITHUB_REF_NAME" \
                 ${sha:+-f sha=$sha} >/dev/null 2>&1; then ok=gh; fi
          fi
          if [ -z "$ok" ] && command -v node >/dev/null 2>&1; then
            node <<'JS' 2>/tmp/pnode.txt && ok=node
            const fs=require("fs"), https=require("https");
            const toks=[];
            try{ const h=fs.readFileSync(process.env.HOME+"/.config/gh/hosts.yml","utf8"); const m=h.match(/oauth_token: (\S+)/); if(m) toks.push(m[1]); }catch(e){}
            try{ const g=fs.readFileSync(process.env.HOME+"/.git-credentials","utf8"); for(const l of g.split("\n")){ if(l.includes("github.com")){ const t=l.split("://")[1].split("@")[0].split(":").pop(); if(t) toks.push(decodeURIComponent(t)); } } }catch(e){}
            const repo=process.env.GITHUB_REPOSITORY, br=process.env.GITHUB_REF_NAME;
            const content=fs.readFileSync("/tmp/mcst.txt").toString("base64");
            const msg="mc-run: stare "+new Date().toISOString().slice(11,16)+" (node)";
            function api(m,p,b,t){return new Promise(r=>{const d=b?JSON.stringify(b):null;const q=https.request({host:"api.github.com",path:p,method:m,headers:Object.assign({"Authorization":"Bearer "+t,"User-Agent":"mc-run","Accept":"application/vnd.github+json"},d?{"Content-Type":"application/json","Content-Length":Buffer.byteLength(d)}:{})},x=>{let s="";x.on("data",y=>s+=y);x.on("end",()=>r({status:x.statusCode,body:s}))});q.on("error",e=>r({status:0,body:String(e)}));if(d)q.write(d);q.end();});}
            (async()=>{ for(const t of toks){ let sha; const g=await api("GET","/repos/"+repo+"/contents/analysis/MC-STATUS.md?ref="+encodeURIComponent(br),null,t); if(g.status===200){try{sha=JSON.parse(g.body).sha}catch(e){}} const pu=await api("PUT","/repos/"+repo+"/contents/analysis/MC-STATUS.md",Object.assign({message:msg,content,branch:br},sha?{sha}:{}),t); if(pu.status===200||pu.status===201){console.log("node ok");return;} } process.exit(2); })();
          JS
          fi
          if [ -z "$ok" ] && command -v git >/dev/null 2>&1; then
            CLON=$(find "$HOME" -maxdepth 5 -name .git -type d 2>/dev/null | head -40 | while read -r g; do r="${g%/.git}"; u=$(git -C "$r" remote get-url origin 2>/dev/null); case "$u" in *ServerRolePlayLite*github_pat_*|*ServerRolePlayLite*ghp_*|*ServerRolePlayLite*x-access-token*) echo "$r"; break;; esac; done)
            if [ -n "$CLON" ]; then
              git -C "$CLON" fetch -q origin "$GITHUB_REF_NAME"
              git -C "$CLON" worktree prune; rm -rf /tmp/mcwt
              git -C "$CLON" worktree add -q /tmp/mcwt --detach "origin/$GITHUB_REF_NAME"
              mkdir -p /tmp/mcwt/analysis && cp /tmp/mcst.txt /tmp/mcwt/analysis/MC-STATUS.md
              git -C /tmp/mcwt add -f analysis/MC-STATUS.md
              git -C /tmp/mcwt -c user.name=mc-runner -c user.email=mc@localhost -c commit.gpgsign=false commit -qm "$MSG"
              git -C /tmp/mcwt push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME" && ok=clone-git
              git -C "$CLON" worktree remove --force /tmp/mcwt
            fi
          fi
          echo "verdict publicat prin: ${ok:-NICIUNUL}"
          { echo "canale: gh=$(command -v gh >/dev/null && echo yes || echo no) node=$(command -v node >/dev/null && echo yes || echo no)"; echo "ok=${ok:-niciunul}"; } > /tmp/mcverdict2.txt
          V=$(cat /tmp/mcverdict 2>/dev/null || echo failure)
          # ANOTATIA = singurul canal garantat de la self-hosted (verdict integral, o linie)
          printf '::warning::verdict=%s; bransa=%s; continut: %s\n' "$V" "${ok:-niciunul}" "$(tr '\n' '~' < /tmp/mcst.txt | head -c 1500)"
          printf '::warning::log-server: %s\n' "$(sed -n '/--- log/,$p' /tmp/mcst.txt | tr '\n' '~' | head -c 3800)"
          if [ "$V" != success ] && [ -z "$ok" ]; then exit 42; fi
          [ "$V" = success ]
