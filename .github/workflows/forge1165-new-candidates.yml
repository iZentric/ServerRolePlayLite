name: Official Forge 1.16.5 server candidates - separate closed canaries
# Research only: new runner, one process at a time, no PC/real world/clients.
# Exact author file IDs and first-hosted-retrieval SHAs pinned. No rollout.
on:
  push:
    branches: [arena/9bbcb24f-serverroleplaylite]
    paths:
      - .github/workflows/forge1165-new-candidates.yml
      - scripts/fc_server_candidate_scan.py
      - scripts/fc_server_candidate_scan_test.py
permissions:
  contents: read
jobs:
  isolated-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Synthetic exact source/metadata/dependency guards
        run: |
          python3 scripts/fc_server_candidate_scan_test.py
          python3 scripts/fc_full_rp_engine_boot_test.py
      - name: SHA-pinned official CatServer and historical RP content on new runner
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-full-rp-catserver-official"
          mkdir -p "$root"
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" \
            -p functity-jare-toate.tar.gz -O "$root/engines.tar.gz"
          echo "f2cb921efbf751fa24534a9a02b57197db46294ca7b71d9711b04996bf6d1784  $root/engines.tar.gz" | sha256sum -c -
          python3 scripts/fc_plugin_first_extract.py "$root/engines.tar.gz" "$root/motor.jar"
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -O "$root/historic.zip"
          echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  $root/historic.zip" | sha256sum -c -
          gh release download 23.05.26-1 -R Luohuayu/CatServer \
            -p CatServer-1.16.5-1d8d6313-server.jar -O "$root/engine.jar"
          echo "8edea98c597e7af44a45ef9093678c38ca3749d55a71cdff10218c1c6b946fd0  $root/engine.jar" | sha256sum -c -
          gh release download v21.2 -R PlayPro/CoreProtect \
            -p CoreProtect-21.2.jar -O "$root/CoreProtect.jar"
          echo "04f31b609d1e3e1c53e99aaa06ca10ea6bdf5172c94bf5af8ccf108b0bc4b977  $root/CoreProtect.jar" | sha256sum -c -
          gh release download v21.0 -R google/guava \
            -p guava-21.0.jar -O "$root/guava-21.0.jar"
          echo "972139718abc8a4893fa78cba8cf7b2c903f35c97aaf44fa3031b0669948b480  $root/guava-21.0.jar" | sha256sum -c -
      - name: Get author's exact Saturn Forge 1.16.5 file 4017215, not a repack
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-full-rp-catserver-official"
          curl -fsSL --connect-timeout 10 --max-time 90 --retry 1 \
            'https://www.curseforge.com/api/v1/mods/670986/files/4017215/download' \
            -o "$root/saturn-mc1.16.5-0.0.3.jar"
          echo "c7ad5a2b51c58e7da78bca343a3ce55ab390205e965baa87d35b78af6b650953  $root/saturn-mc1.16.5-0.0.3.jar" | sha256sum -c -
      - name: Get author's exact Smooth Chunk Save Forge 1.16.5 file 4453876
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-full-rp-catserver-official"
          curl -fsSL --connect-timeout 10 --max-time 90 --retry 1 \
            'https://www.curseforge.com/api/v1/mods/582327/files/4453876/download' \
            -o "$root/smoothchunk1.16.5-2.0.jar"
          echo "e7ab1d4fd31ee8e8be75a711df7b403d54a86514432302c8ad79a87851a2bc26  $root/smoothchunk1.16.5-2.0.jar" | sha256sum -c -
      - name: Validate Forge metadata, then closed baseline and each candidate separately
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-full-rp-catserver-official"
          python3 scripts/fc_server_candidate_scan.py "$root" "$root/engine.jar" \
            "$root/historic.zip" "$root/motor.jar" "$root/CoreProtect.jar" \
            "$root/guava-21.0.jar"
