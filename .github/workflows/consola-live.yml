name: Consola (RCON de la distanta — cheia o citesc de pe server)
# Comanda de trimis = in fisierul deploy/consola-trigger.txt (orice, o linie).
# Flux: SFTP ia server.properties -> extrag rcon.password -> test ping MC + RCON list
# -> raportul (analysis/consola.md) afiseaza DOAR rezultatul, niciodata cheia.
on:
  push:
    paths: [ "deploy/consola-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: "2022"
  SFTP_USER: 15254.1388b9af
jobs:
  consola:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Instaleaza lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Extrag cheia RCON de pe server (nu se logui niciodata)
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          mkdir -p run
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get server.properties -o run/sp.txt;
            bye"
          grep '^rcon.password=' run/sp.txt | cut -d= -f2- > run/rpass
          echo "cheie extrasa: lungime $(wc -c < run/rpass | awk '{print $1-1}')"
      - name: Ping MC intreg (citire pana la EOF, taio de la '{')
        run: |
          cat > run/ping.py <<'PYEOF'
          import socket,json
          s=socket.create_connection(("node12.zampto.net",26252),15)
          s.settimeout(15)
          def vi(x):
              out=b"";x&=0xffffffff
              while True:
                  b=x&0x7f;x>>=7
                  out+=bytes([b|(0x80 if x else 0)])
                  if not x: return out
          host=b"node12.zampto.net"
          body=vi(-1)+vi(len(host))+host+__import__("struct").pack(">H",26252)+vi(1)
          s.sendall(vi(len(body))+body)
          data=b""
          while True:
              c=s.recv(65536)
              if not c: break
              data+=c
          i=data.find(b"{")
          j=json.loads(data[i:].split(b"\x00")[0])
          print("PING OK:", json.dumps(j)[:350])
          PYEOF
          python3 run/ping.py > run/ping.out 2>&1 || true
          cat run/ping.out
      - name: RCON — rulez comanda (cu variante de parsare a cheii)
        env:
          SECRETA_P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          cat > run/rcon.py <<'PYEOF'
          import socket,struct,sys,re
          def send(s,i,t,p=b""):
              d=struct.pack(">ii",i,t)+p+b"\x00\x00"
              s.sendall(struct.pack(">i",len(d)+4)+d)
          def recv(s):
              h=b""
              while len(h)<4:
                  c=s.recv(4-len(h))
                  if not c: raise EOFError
                  h+=c
              n=struct.unpack(">i",h)[0]
              b=b""
              while len(b)<n:
                  c=s.recv(n-len(b))
                  if not c: break
                  b+=c
              i,t=struct.unpack(">ii",b[:8])
              return i,t,b[8:-2].decode("utf8","replace")
          raw=open("run/sp.txt","rb").read()
          m=re.search(rb"rcon\.password=([^\r\n]*)",raw)
          cand=set()
          if m:
              v=m.group(1)
              cand.add(v); cand.add(v.rstrip()); cand.add(v.rstrip(b"\r "))
          if len(sys.argv)>1 and sys.argv[1]:
              cand.add(sys.argv[1].encode().rstrip())
          cmd="list"
          for l in open("deploy/consola-trigger.txt"):
              l=l.strip()
              if l and not re.match(r"^\d{4}-",l): cmd=l
          ok=False; detalii=[]
          for n,c in enumerate(sorted(cand,key=len,reverse=True)):
              try:
                  s=socket.create_connection(("node12.zampto.net",28147),10); s.settimeout(12)
                  send(s,1,3,c); send(s,2,2,cmd.encode())
                  out=""
                  for _ in range(4):
                      try: i,t,d=recv(s)
                      except Exception: break
                      if i==2 and d.strip(): out=d; break
                  s.close()
                  if out:
                      print("RCON-PLIN cu varianta#%d (len=%d)"%(n,len(c)))
                      print(out[:800].replace("\n"," ")); ok=True; break
                  else:
                      detalii.append("#%d len=%d: fara raspuns"%(n,len(c)))
              except Exception as e:
                  detalii.append("#%d len=%d: %s"%(n,len(c),e))
          if not ok:
              print("RCON ESUAT pe toate variantele:", " | ".join(detalii[:5]))
          PYEOF
          python3 run/rcon.py "$SECRETA_P" > run/rcon.out 2>&1 || true
          if [ -s run/sp.txt ]; then
            K=$(grep '^rcon.password=' run/sp.txt | cut -d= -f2- | tr -d '\r')
            sed -E "s|${K}|<CHEIE>|g" run/rcon.out > run/rcon.safe 2>/dev/null || cp run/rcon.out run/rcon.safe
          else cp run/rcon.out run/rcon.safe; fi
          cat run/rcon.safe
      - name: Ce zice serverul despre RCON (din log, cenzurat)
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get logs/latest.log -o run/latest.log;
            bye"
          grep -niE "rcon|authenticat" run/latest.log | tail -12 > run/rconlog.txt
          grep -c . run/rconlog.txt
          RLINES=$(grep -ciE "failed auth" run/latest.log)
          echo "incercari esuate de autentificare RCON in log: $RLINES" >> run/rconlog.txt
          cat run/rconlog.txt
      - name: Raport in repo (fara cheia nicaieri)
        if: always()
        run: |
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          {
            echo "# CONSOLA — $(date -u '+%F %T UTC')"
            echo
            echo "## Ping server (portul de joc)"
            echo '```'
            cat run/ping.out
            echo '```'
            echo "## RCON"
            echo '```'
            cat run/rcon.safe
            echo '```'
            echo "## Log server despre RCON (ultimele 12 linii)"
            echo '```'
            cat run/rconlog.txt
            echo '```'
          } > analysis/consola.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/consola.md
          git commit -m "analysis: raport consola" || true
          git push || true
          exit 0
