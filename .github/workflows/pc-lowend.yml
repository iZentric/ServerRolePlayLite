name: pc-lowend
on:
  push:
    paths:
      - .github/workflows/pc-lowend.yml
jobs:
  lo:
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: [self-hosted, Windows]
    steps:
      - name: Low-spec client
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Continue'
          $rep=@()
          $api="https://api.github.com"
          $H=@{ Authorization="token $env:GH_TOKEN"; Accept="application/vnd.github+json"; "User-Agent"="fc" }
          function PutFile($path,$txt,$msg){
            $b=@{ message=$msg; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($txt)); branch="$env:GITHUB_REF_NAME" } | ConvertTo-Json -Compress -Depth 4
            $sha=$null
            try { $sha=(Invoke-RestMethod "$api/repos/iZentric/ServerRolePlayLite/contents/$path?ref=$env:GITHUB_REF_NAME" -Headers $H -EA Stop).sha } catch {}
            if($sha){ $b=@{ message=$msg; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($txt)); branch="$env:GITHUB_REF_NAME"; sha=$sha } | ConvertTo-Json -Compress -Depth 4 }
            try { Invoke-RestMethod -Method Put -Uri "$api/repos/iZentric/ServerRolePlayLite/contents/$path" -Headers $H -ContentType "application/json" -Body $b -EA Stop | Out-Null; "put ok $path" } catch { "put fail $path : $($_.Exception.Message)" }
          }
          $inst="$env:APPDATA\PrismLauncher\instances"
          $jvmArgs="-XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:MaxGCPauseMillis=25 -Xms1G -Xmx2G"
          foreach($n in @("FunCity","CUANTIC-Client-1.7.7")){
            $root=Join-Path $inst "$n\minecraft"
            New-Item -ItemType Directory -Force $root | Out-Null
            $op=Join-Path $root "options.txt"
            $keys=[ordered]@{renderDistance=5;graphicsMode=0;ao=0;particles=2;mipmapLevels=0;entityShadow="false";enableVsync="false";useVbo="true"}
            if(Test-Path $op){$lines=@(Get-Content $op)}else{$lines=@()}
            foreach($k in $keys.Keys){
              $v=$keys[$k]; $pat="^$k``:"
              if(@($lines | Where-Object {$_ -match $pat}).Count -gt 0){
                $lines=@($lines | ForEach-Object { if($_ -match $pat){"$k`:$v"}else{$_} })
              } else { $lines+="$k`:$v" }
            }
            Set-Content -Path $op -Value $lines -Encoding ascii
            $cfg=Join-Path $inst "$n\instance.cfg"
            if(Test-Path $cfg){
              $c=@(Get-Content $cfg)
              $has=$false
              $c=@($c | ForEach-Object { if($_ -match '^Jvm[Aa]rgs='){ $script:has=$true; "JvmArgs=$jvmArgs" } else {$_} })
              if(-not $has){ $c += "JvmArgs=$jvmArgs" }
              Set-Content -Path $cfg -Value $c -Encoding ascii
            }
            $rep += "$n : options low-spec + JVM 2G plafon aplicate"
          }
          $mroot=Join-Path $inst "FunCity\minecraft\mods"
          foreach($slug in @("dynamic-fps","entityculling")){
            try{
              $j=Invoke-RestMethod "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.16.5%22%5D&loaders=%5B%22forge%22%5D" -Headers @{"User-Agent"="functity"} -EA Stop -TimeoutSec 40
              $f=$j[0].files[0]
              $tgt=Join-Path $mroot $f.filename
              if(-not (Test-Path $tgt)){
                Invoke-WebRequest $f.url -OutFile $tgt -EA Stop -TimeoutSec 120
                $rep += "$slug : adus $($f.filename)"
              } else { $rep += "$slug : era deja" }
            } catch { $rep += "$slug : FAIL $($_.Exception.Message)" }
          }
          $all=@(Get-ChildItem $mroot -Filter *.jar)
          $rep += "FunCity mods acum: $($all.Count)"
          $rep += "ts: $(Get-Date -Format 'HH:mm:ss')"
          PutFile "diag/pc-lowend.txt" ($rep -join "`n") "lowend client tweak"
