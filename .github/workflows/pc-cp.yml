name: pc-cp
on:
  push:
    paths:
      - .github/workflows/pc-cp.yml
jobs:
  cp:
    permissions:
      contents: write
    timeout-minutes: 8
    runs-on: [self-hosted, Windows]
    steps:
      - name: Gaseste si descarca CoreProtect
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Set-Location $env:RUNNER_TEMP
          $H = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "fc" }
          $api = "https://api.github.com"
          $urls = @("https://github.com/PlayPro/CoreProtect/releases/download/v21.2/CoreProtect-21.2.jar","https://github.com/PlayPro/CoreProtect/releases/download/v21.1/CoreProtect-21.1.jar")
          $pick = $null
          foreach ($u in $urls) { try { Invoke-WebRequest -UseBasicParsing $u -OutFile cp.jar -TimeoutSec 120; if ((Get-Item cp.jar).Length -gt 500000) { $pick = $u; break } } catch { Write-Host "esec $u" } }
          "pick: $pick"
          Add-Type -A System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead("$pwd\cp.jar"); $has=($z.Entries.FullName -contains 'config.yml'); $z.Dispose()
          $res = "CP-OK size=$((Get-Item cp.jar).Length) valid=$has url=$pick"
          Compress-Archive cp.jar cp.zip -Force
          $H2 = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $zipb = [Convert]::ToBase64String([IO.File]::ReadAllBytes("cp.zip"))
          foreach ($f in @(
            @{p="diag/cp.zip.b64"; body=@{ message="cpjar $(Get-Random)"; content=$zipb; branch="$env:GITHUB_REF_NAME"; encoding="base64" }},
            @{p="diag/pc-cp.txt"; body=@{ message="cpreport $(Get-Random)"; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($res)); branch="$env:GITHUB_REF_NAME" }})) {
            $sha=$null
            try { $cur=Invoke-RestMethod "$api/repos/iZentric/ServerRolePlayLite/contents/$($f.p)?ref=$env:GITHUB_REF_NAME" -Headers $H2 -EA SilentlyContinue; if($cur){$sha=$cur.sha} } catch {}
            if ($sha) { $f.body["sha"]=$sha }
            try { Invoke-RestMethod -Method Put -Uri "$api/repos/iZentric/ServerRolePlayLite/contents/$($f.p)" -Headers $H2 -ContentType "application/json" -Body ($f.body|ConvertTo-Json -Compress -Depth 4) | Out-Null } catch { Write-Host "push fail: $($_.Exception.Message)" }
          }
          $res
        env:
          GH_TOKEN: ${{ github.token }}
