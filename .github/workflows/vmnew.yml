name: VMNEW — VM Ampere gratuit (cont propriu, 0 lei)

# Rulează pe runner-ul self-hosted din Cloud Shell (acolo este config-ul OCI).
# Rezultatul complet ajunge în analysis/vm-run.txt și verdictul scurt în vm-status.txt.
on:
  push:
    paths:
      - "deploy/vmnew.txt"
      - "scripts/vmnew.py"
      - "scripts/cuantic-vm.sh"
      - ".github/workflows/vmnew.yml"
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  RUNNER_TRACKING_ID: ""
jobs:
  vm:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verifică OCI și creează/verifică VM-ul idempotent
        shell: bash
        run: |
          set +e
          OUT=/tmp/vmnew.out
          rm -f /tmp/vm.txt /tmp/vmverdict
          {
            echo "## pasul a început în $(date -Is), HOME=$HOME, pwd=$(pwd)"
            OCLI=$(command -v oci 2>/dev/null)
            PY=""
            if [ -n "$OCLI" ]; then
              C=$(head -1 "$OCLI" | sed 's/^#!//')
              if [ -x "$C" ] && "$C" -c "import oci" 2>/dev/null; then
                PY="$C"
                echo "PY: $PY (din shebang-ul lui oci)"
              fi
            fi
            P3=$(command -v python3 2>/dev/null)
            for C in "$HOME/oci-venv/bin/python" "$HOME/.venv/bin/python" "$P3"; do
              if [ -z "$PY" ] && [ -n "$C" ] && [ -x "$C" ] && "$C" -c "import oci" 2>/dev/null; then
                PY="$C"
                echo "PY: $PY (import oci OK)"
              fi
            done
            if [ -z "$PY" ] && [ -n "$P3" ]; then
              "$P3" -m pip install --quiet --disable-pip-version-check --user oci >/dev/null 2>&1
              if "$P3" -c "import oci" 2>/dev/null; then
                PY="$P3"
                echo "PY: $P3 (după pip --user)"
              else
                "$P3" -m pip install --quiet --disable-pip-version-check --user --break-system-packages oci >/dev/null 2>&1
                if "$P3" -c "import oci" 2>/dev/null; then
                  PY="$P3"
                  echo "PY: $P3 (după pip --break-system-packages)"
                fi
              fi
            fi

            if [ -z "${OCI_CONFIG_FILE:-}" ] && [ ! -f "$HOME/.oci/config" ] && [ -d "$HOME/remote/.oci" ]; then
              cp -r "$HOME/remote/.oci" "$HOME/.oci"
            fi
            CFG=${OCI_CONFIG_FILE:-$HOME/.oci/config}
            if [ -z "$PY" ]; then
              echo "VERDICT: lipsesc Python și SDK OCI (pip poate să fi eșuat)"
            elif [ ! -f "$CFG" ]; then
              echo "VERDICT: lipsește config OCI: $CFG"
            else
              echo "## rulez scripts/vmnew.py"
              "$PY" scripts/vmnew.py 2>&1
              RC=$?
              echo "## cod ieșire $RC"
            fi
          } > "$OUT" 2>&1

          VER=$(cat /tmp/vmverdict 2>/dev/null | head -1)
          [ -n "$VER" ] || VER=$(grep -a -E "VM:|VERDICT:|verdict|profil|Traceback|Error" "$OUT" | tail -3 | tr '\n' ' ' | tr -d '"')
          [ -n "$VER" ] || VER=$(tail -2 "$OUT" | tr '\n' ' ')
          VER=$(echo "$VER" | tr -d '"' | head -c 190)
          mkdir -p analysis
          cp "$OUT" analysis/vm-run.txt
          if [ -s /tmp/vm.txt ]; then
            cp /tmp/vm.txt analysis/vm-status.txt
          else
            printf 'VM: NECONFIRMAT — workflow-ul nu a produs un raport OCI.\n' > analysis/vm-status.txt
          fi
          git config user.name "cuantic-bot"
          git config user.email "bot@cuantic.local"
          git add -f analysis/vm-run.txt analysis/vm-status.txt
          git commit -q -m "vmnew: ${VER:-fără verdict}" || echo "commit: niciun fișier nou"
          git pull --rebase -q origin "$GITHUB_REF_NAME" || echo "pull --rebase: eșuat"
          if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
            echo "raportul a fost publicat în branch"
          else
            echo "push: eșuat — raportul rămâne în logul acestui workflow"
          fi
          echo "===== VERDICT ====="
          sed 's/^/  /' "$OUT" | tail -30

      - name: Regula — serverul rămâne pornit după orice comandă
        if: always()
        run: bash scripts/ensure-up.sh
