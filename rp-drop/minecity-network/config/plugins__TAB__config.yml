# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  header:
  - '%animation:logo%'
  - '&f'
  - <&#104cff>&m                                                <&#104cff>
  - '&f&l♨ &6Ping: &f%ping%'
  - ''
  footer:
  - ''
  - '&f%localtime_time%'
  - ''
  - <&#104cff>&m                                                <&#104cff>
  - '%animation:an1%'
  - ''
  - '&6&l→ &fᴍɪɴᴇᴄɪᴛʏ.ɢᴏᴍᴄ.ʀᴏ &f&n&6&l←'
  per-world:
    world1:
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world2;world3:
      header:
      - This is a shared header for
      - world2 and world3
  disable-condition: '%world%=disabledworld'
tablist-name-formatting:
  enabled: true
  align-tabsuffix-on-the-right: false
  character-width-overrides: {}
  anti-override: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: true
  anti-override: true
  sorting-types:
  - GROUPS:fondator,co-fondator,operator,developer,sindicat,super-admin,admin,moderator,helper-avansat,helper,trainee,primar,vice-primar,diicot,chestor-general,chestor-sef,chestor-politie,comisar-sef,comisar,subcomisar,inspector,subinspector,agent-sef,agent-principal,agent-politie,spg,los-vagos,cmr,bra,mafia-italiana,inf,ber,medic,asistent-medic,mecanic,fermier,padurar,miner,lopatar,taxi,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  unlimited-nametag-mode:
    enabled: false
    disable-on-boats: true
    dynamic-lines:
    - abovename
    - nametag
    - belowname
    - another
    static-lines:
      myCustomLine: 0.66
    disable-condition: '%world%=disabledworld'
  disable-condition: '%world%=disabledworld'
  can-see-friendly-invisibles: false
yellow-number-in-tablist:
  enabled: false
  value: '%ping%'
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: false
  number: '%health%'
  text: '&cHealth'
  disable-condition: '%world%=disabledworld'
prevent-spectator-effect:
  enabled: true
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: NOTCHED_20
      color: RED
      progress: '100'
      text: '&E&Lᴅsᴄ.ɢɢ/ztp'
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  use-numbers: false
  static-number: 0
  delay-on-join-milliseconds: 0
  respect-other-plugins: true
  scoreboards:
    scoreboard:
      title: '%animation:logo%'
      lines:
      - ''
      - '&#104cff&lɪɴꜰᴏʀᴍᴀᴛɪɪ'
      - ' &#104cff✎ &fɴᴜᴍᴇ: &7%player_name%'
      - ' #44F800&l$ &fʙᴀɴᴄᴀ: &a$%vault_eco_balance_formatted%'
      - ' &#104cff⛏ &fꜰᴀᴄᴛɪᴜɴᴇ: %vault_prefix%'
      - ' &#104cff☄ &fᴏʀᴇ: &a%playtime_time%'
      - ' &#104cff⛏ &fꜱᴀʟᴀʀɪᴜ: &a%puzzlepayday_time_left% '
      - ' '
      - '&#104cff&lꜱᴇʀᴠᴇʀ'
      - '  &#104cff⚓ &7ʟᴏᴄᴜɪᴛᴏʀɪ: &f%online%'
      - '  &#104cff⚓ &7ᴛʀᴇᴄᴀᴛᴏʀɪ: &f%server_unique_joins%'
      - ''
      - '&6&l→ &fᴍɪɴᴇᴄɪᴛʏ.ɢᴏᴍᴄ.ʀᴏ &6&l←'
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%player_ping%':
    true: ' &o[PING]&r'
    false: ''
  '%essentials_nickname%':
    '%essentials_nickname%': '%player%'
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
placeholderapi-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
assign-groups-by-permissions: false
primary-group-finding-list:
- Owner
- Admin
- Mod
- Helper
- default
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
use-online-uuid-in-tablist: true
global-playerlist:
  enabled: false
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    staff:
      condition: permission:tab.staff
      fixed-slots:
      - '1|&3RAM&f:'
      - 2|&b%memory-used%MB / %memory-max%MB
      - '3|&8&m                       '
      - '4|&3TPS&f:'
      - 5|&b%tps%
      groups:
        staff:
          condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
    default:
      fixed-slots:
      - '1|&3WEBSITE&f:'
      - 2|&bᴇɴᴅᴇʀʟᴀɴᴅ.ʀᴏ
      - '3|&8&m                       '
      - '4|&3Nume&f:'
      - 5|&b%player%
      - '7|&3Grad&f:'
      - '8|Grad: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bts.myserver.net
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bshop.myserver.net
      - '43|&8&m                       '
      groups:
        staff:
          condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
per-world-playerlist:
  enabled: false
ping-spoof:
  enabled: false
fix-pet-names:
  enabled: false
