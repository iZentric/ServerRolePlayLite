name: Zampto API probe
on:
  workflow_dispatch: {}
  push:
    branches: [ "arena/a29b4ef4-serverroleplaylite" ]
    paths: [ "deploy/trigger-probe.txt" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interogheaza API-ul Zampto
        env:
          KEY: ${{ secrets.ZAMPTO_API_KEY }}
        shell: bash
        run: |
          mkdir -p analysis
          OUT=analysis/zampto-api-probe.md
          echo "# Rezultat probe API Zampto ($(date -u))" > $OUT
          if [ -z "$KEY" ]; then
            echo "" >> $OUT
            echo "**EROARE: secretul ZAMPTO_API_KEY nu este setat in repo!**" >> $OUT
          else
            SERVER_ID=17192
            for URL in \
              "https://api.zampto.net/v1/user" \
              "https://api.zampto.net/v1/me" \
              "https://api.zampto.net/v1/account" \
              "https://api.zampto.net/v1/user/servers" \
              "https://api.zampto.net/v1/hosting/servers" \
              "https://api.zampto.net/v1/server/$SERVER_ID" \
              "https://api.zampto.net/user" \
              "https://api.zampto.net/me" \
              "https://api.zampto.net/servers" \
              "https://api.zampto.net/server/$SERVER_ID" \
              "https://api.zampto.net/hosting/servers" \
              "https://api.zampto.net/account/servers" \
            ; do
              for STYLE in bearer apikey; do
                if [ "$STYLE" = "bearer" ]; then
                  CODE=$(curl -s -o /tmp/body -w '%{http_code}' -m 20 \
                    -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$URL" || echo "ERR")
                else
                  CODE=$(curl -s -o /tmp/body -w '%{http_code}' -m 20 \
                    -H "x-api-key: $KEY" -H "Accept: application/json" "$URL" || echo "ERR")
                fi
                BODY=$(head -c 400 /tmp/body | tr -d '\r' | sed "s/$KEY/***/g")
                echo "" >> $OUT
                echo "## [$STYLE] $URL" >> $OUT
                echo "- status: **$CODE**" >> $OUT
                echo '```' >> $OUT
                echo "$BODY" >> $OUT
                echo '```' >> $OUT
              done
            done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/zampto-api-probe.md
          git commit -m "analysis: rezultat probe API Zampto" || echo "nimic"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
