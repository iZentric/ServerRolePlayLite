name: FUNCIŢY-HOSTINFO
# Sondate READ-ONLY pe gazda mamei (self-hosted). Nu atinge java de producție, nu scrie
# nimic pe gazda în afară de /tmp; publica raportul pe bransa sesiunii.
on:
  workflow_dispatch: {}
  push:
    paths: [ "deploy/funcity-hostinfo.txt" ]
permissions:
  contents: read
jobs:
  h:
    runs-on: [ self-hosted ]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Raport gazda (read-only)
        run: bash scripts/functity-stage.sh host-info || true
      - name: Publica raportul pe bransa sesiunii (canale: gh masinii, credential store, clone gazda)
        run: |
          { echo; echo "== DIAGNOSTICA CANALE =="; command -v gh >/dev/null && gh auth status 2>&1 | head -4 || echo "gh absent"; ls -l "$HOME/.git-credentials" 2>/dev/null || echo "(fara .git-credentials)"; } >> /tmp/funcity-stage.txt
          bash scripts/functity-publish.sh /tmp/funcity-stage.txt analysis/FUNCTITY-HOSTINFO.md "FUNCIŢY-HOSTINFO: raport read-only gazda $(date -u '+%F %H:%M') UTC"

