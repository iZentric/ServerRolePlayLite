name: VITEZAMETRUL (TPS+RAM live de pe host, din log)
on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    paths: [ "deploy/vitezametru-trigger.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  citeste:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Extrage bataile TPS-ului din latest.log
        env:
          SFTP_HOST: node12.zampto.net
          SFTP_PORT: "2022"
          SFTP_USER: 15254.1388b9af
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          mkdir -p run analysis
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            get logs/latest.log -o run/latest.log;
            mirror spark run/spark;
            bye" || true
          {
            echo "# Vitezametru CUANTIC — ultima citire $(date -u '+%F %T UTC')"
            echo
            echo "| timp | TPS 1m/5m/15m | RAM |"
            echo "|---|---|---|"
            grep -E "TPS from last" run/latest.log | tail -8 > /tmp/tps.raw
            grep -E "Current Memory Usage" run/latest.log | tail -8 | grep -oE "[0-9]+/[0-9]+ *mb" > /tmp/mem.txt
            while IFS= read -r LIN; do
              T=$(echo "$LIN" | grep -oE "[0-9]{2}:[0-9]{2}:[0-9]{2}" | head -1)
              V=$(echo "$LIN" | grep -oE "[0-9]+\.[0-9]+, \*?[0-9]+\.[0-9]+, \*?[0-9]+\.[0-9]+" | head -1)
              echo "| $T | $V | $(sed -n "${N:-0}p" /tmp/mem.txt) |"
              N=$(( ${N:-0} + 1 ))
            done < /tmp/tps.raw
            echo
            NULT=$(tail -1 /tmp/tps.raw | grep -oE "[0-9]+\.[0-9]+" | head -1)
            echo "- Ultima fereastra 1m: ${NULT:-N/A} / 20"
            if [ -n "$NULT" ]; then
              python3 -c "print('- ALERTA sub 18 TPS: **' + ('DA' if $NULT < 18 else 'NU') + '**')"
            fi
            echo "- Can't keep up (intarzieri tick): $(grep -c "Can't keep up" run/latest.log)"
            echo "- Evenimente join/leave: $(grep -cE 'entered the game|lost connection' run/latest.log)"
            echo '- Linii [ERROR] in log: $(grep -cE "[[]ERROR[]]" run/latest.log)'
            H=$(ls -t run/spark/reports/health-report*.json 2>/dev/null | head -1)
            if [ -n "$H" ]; then
              echo
              echo "## RAPORT SPARK (profilare sub sarcina reala)"
              python3 - "$H" <<'PYP'
import json,sys
d=json.load(open(sys.argv[1]))
g=d.get("gc",{}) or {}
m=d.get("memory",{}) or {}
print(f"- TPS mediu **{d.get('average_tps','?')}** | mediana {d.get('median_tps','?')} | minim {d.get('min_tps','?')} / 20")
print(f"- Uptime {int(d.get('uptime_ms',0)/1000)}s | jucatori max: {d.get('players','?')}")
print(f"- GC: {g.get('collections','?')} colectii, pauza totala {g.get('total_pause_time','?')}ms")
pt=m.get("pools",{}).get("heap",{})
print(f"- Heap: {int(pt.get('used',0)/1e6)}MB/{int(pt.get('max',0)/1e6)}MB")
tl=d.get("tick_list",[])
if tl:
    s=sorted(tl); n=len(s)
    print(f"- Tick (MSPT): mediana {s[n//2]:.1f}ms | p95 {s[int(n*0.95)]:.1f}ms | varf {s[-1]:.1f}ms (limita 50)")
PYP
            fi
            echo
            echo '<details><summary>ultimele 6 linii log (debug format)</summary>'
            echo '```'
            tail -6 run/latest.log | cut -c1-150
            echo '```</details>'
          } > analysis/viteza-live.md
          cat analysis/viteza-live.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/viteza-live.md
          git commit -m "vitezametru: citire" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
          exit 0
