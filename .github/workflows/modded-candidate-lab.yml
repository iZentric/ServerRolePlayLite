name: FunCity isolated modded compatibility experiment
# NOT a list of owner-authored mods; historical content tested locally only.
# No release, artifact, PC/Prism write, login, world copy, public port or benchmark.
# Trial ONLY: three broad-impact server optimizers on top of ALL original RP content.
# A boot cannot prove MSPT/RAM improvement; baseline 15-mod boot tested separately.
on:
  push:
    branches:
      - arena/9bbcb24f-serverroleplaylite
    paths:
      - .github/workflows/modded-candidate-lab.yml
      - scripts/fc_modded_candidate.py
      - scripts/fc_modded_candidate_smoke.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closed-modded:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Fetch existing SHA-pinned engine, plugin and content archives
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-modded-experiment"
          mkdir -p "$root"
          gh release download jars-20261017-0952 -R "$GITHUB_REPOSITORY" \
            -p functity-jare-toate.tar.gz -O "$root/engines.tar.gz"
          echo "f2cb921efbf751fa24534a9a02b57197db46294ca7b71d9711b04996bf6d1784  $root/engines.tar.gz" | sha256sum -c -
          python3 scripts/fc_plugin_first_extract.py "$root/engines.tar.gz" "$root/motor.jar"
          gh release download lite -R "$GITHUB_REPOSITORY" \
            -p CUANTIC-Server-CatServer-1.7.7.zip -O "$root/old-plugins.zip"
          echo "fe1e261097d92f26c6653239a7161613e6be54b8e9f82c79739c101ce8aa8a15  $root/old-plugins.zip" | sha256sum -c -
          gh release download v21.2 -R PlayPro/CoreProtect \
            -p CoreProtect-21.2.jar -O "$root/CoreProtect.jar"
          echo "04f31b609d1e3e1c53e99aaa06ca10ea6bdf5172c94bf5af8ccf108b0bc4b977  $root/CoreProtect.jar" | sha256sum -c -
          gh release download v21.0 -R google/guava \
            -p guava-21.0.jar -O "$root/guava-21.0.jar"
          echo "972139718abc8a4893fa78cba8cf7b2c903f35c97aaf44fa3031b0669948b480  $root/guava-21.0.jar" | sha256sum -c -
      - name: Stage all original RP content plus three trial server optimizers
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/fc-modded-experiment"
          python3 scripts/fc_modded_candidate.py --engine "$root/motor.jar" \
            --archive "$root/old-plugins.zip" --coreprotect "$root/CoreProtect.jar" \
            --guava21 "$root/guava-21.0.jar" --output "$root/stage" --server-optimizer-lab
      - name: Boot and stop modded experiment on hosted loopback only
        run: |
          set -Eeuo pipefail
          python3 scripts/fc_modded_candidate_smoke.py "$RUNNER_TEMP/fc-modded-experiment/stage"
