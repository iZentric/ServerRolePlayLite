name: Deploy pe Zampto (SFTP)
on:
  workflow_dispatch: {}
  push:
    branches: [ "arena/a29b4ef4-serverroleplaylite" ]
    paths: [ "deploy/trigger.txt" ]
concurrency:
  group: zampto-deploy
  cancel-in-progress: true
permissions:
  contents: write
env:
  SFTP_HOST: node12.zampto.net
  SFTP_PORT: "2022"
  SFTP_USER: 15254.1388b9af
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica parola
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          if [ -z "$P" ]; then
            echo "::error::Lipseste secretul ZAMPTO_SFTP_PASS!"
            exit 1
          fi
          echo "Parola e in seif, OK."
      - name: Descarca pack-ul de server din release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download lite -R ${{ github.repository }} -p '*Server-CatServer*.zip' -O server.zip
          mkdir -p srv && cd srv && unzip -q ../server.zip && ls -la
          # INCORONAREA FORJEI: jarul compilat de NOI peste cel oficial (2656MB vs 2999MB la tribunal)
          cd "$GITHUB_WORKSPACE"
          if gh release download custom -R ${{ github.repository }} -p '*.jar' -O /tmp/custom.jar; then
            CJ=$(ls srv/*.jar | grep -iE "catserver" | head -1)
            cp /tmp/custom.jar "$CJ" && echo "JAR FORJAT MONTAT: $CJ"
          else
            echo "custom indisponibil - ramane oficialul"
          fi
          # REGULA ZAMPTO: jarul se numeste OBLIGATORIU server.jar
          CJ=$(ls srv/*.jar | head -1)
          mv "$CJ" srv/server.jar
          sed -i -E "s|[A-Za-z0-9._-]+\.jar|server.jar|" srv/unix_args.txt
          grep jar srv/unix_args.txt
          # LUMEA din fabrica: montata DOAR daca hostul NU are deja o lume vie (lumea copiilor = SFANTA)
          if gh release download world -R ${{ github.repository }} -p 'world-pregen.zip' -O /tmp/world.zip 2>/dev/null; then
            HASW=$(lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "cls world/level.dat; bye" 2>/dev/null | grep -c level.dat || true)
            if [ "$HASW" = "0" ]; then
              rm -rf srv/world && unzip -q /tmp/world.zip -d srv/ && echo "LUMEA DIN FABRICA MONTATA ($(du -sh srv/world | cut -f1))"
            else
              echo "hostul ARE deja lume vie - n-o ating (sfanta)"
            fi
          else
            echo "fabrica inca n-a livrat - lumea se naste la START"
          fi
      - name: Instaleaza lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Urca fisierele pe server
        env:
          P: ${{ secrets.ZAMPTO_SFTP_PASS }}
        run: |
          set +e
          lftp -u "$SFTP_USER","$P" "sftp://$SFTP_HOST:$SFTP_PORT" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 60;
            rm -f forge-1.16.5-36.2.42-installer.jar install-forge.sh install-forge.bat;
            rm -f mods/Multiplayer-Server-Pause-1.16.5-Forge-1.1.0.jar;
            mirror -R --verbose --parallel=2 --only-newer --ignore-time srv/ /;
            bye
          " > deploy-log.txt 2>&1
          RC=$?
          echo "exit=$RC" >> deploy-log.txt
          tail -40 deploy-log.txt
          mkdir -p analysis
          { echo "# Deploy Zampto - $(date -u)"; echo; tail -60 deploy-log.txt; } > analysis/deploy-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/deploy-log.txt
          git commit -m "analysis: log deploy Zampto" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
          exit $RC
