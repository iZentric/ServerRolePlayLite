name: VM — creeaza Ampere A1 cu serverul CUANTIC
on:
  push:
    paths: [ "deploy/vm.txt" ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  v:
    runs-on: [self-hosted]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          PYPY=$(head -1 "$(which oci)" 2>/dev/null | sed 's/^#!//' | tr -d '\r')
          echo "python: $PYPY"
          "$PYPY" scripts/vm.py > /tmp/vm-run.txt 2>&1; echo "rc=$?" >> /tmp/vm-run.txt
          tail -40 /tmp/vm-run.txt
          mkdir -p analysis
          { printf '# VM — %s\n' "$(date -u '+%F %T UTC')"; echo '```'; cat /tmp/vm.txt 2>/dev/null; echo '---- tail ----'; tail -20 /tmp/vm-run.txt; echo '```'; } > analysis/vm.md
          git config user.name "vm-bot"
          git config user.email "bot@arena.local"
          git add -f analysis/vm.md
          git commit -q -m "vm: creare A1" || true
          git pull --rebase -q origin "$GITHUB_REF_NAME" || true
          git push -q origin "$GITHUB_REF_NAME" || true
