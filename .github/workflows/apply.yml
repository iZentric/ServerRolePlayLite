name: APPLY — aduce serverul live la ultimul release si il porneste
on:
  push:
    paths: [ "scripts/apply-live.sh", "deploy/apply.txt", ".github/workflows/apply.yml" ]
  workflow_dispatch:
    inputs:
      versiune: { description: "asteapta versiunea asta pe release `lite` (ex 1.6.0)", required: false, default: "1.6.0" }
permissions:
  contents: write
jobs:
  a:
    runs-on: [self-hosted]
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/apply-live.sh
        env:
          VETA_ASTEPTAT: ${{ github.event.inputs.versiune || '1.6.0' }}
