name: decompile-pizzaland

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/decompile-trigger.txt"

concurrency:
  group: decompile-pizzaland
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descarca pack-ul si decompileaza Pizzaland
        run: |
          set -eo pipefail
          mkdir -p analysis/pizzaland-src work
          exec > >(tee analysis/pizzaland-src/decompile-log.txt) 2>&1
          set -x
          curl -L --retry 4 -o work/pack.zip "https://dc-bot.palma-city.de/api/download/freeroam-pack"
          unzip -q -o work/pack.zip -d work/pack
          JAR=$(find work/pack -iname "*izzaland*.jar" | head -1)
          echo "Jar gasit: $JAR ($(du -h "$JAR" | cut -f1))"
          curl -L --retry 4 -o work/vineflower.jar \
            "https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar"
          mkdir -p work/out
          java -jar work/vineflower.jar -dgs=1 -hdc=0 "$JAR" work/out/ || true
          OUTJAR=$(find work/out -name "*.jar" | head -1)
          mkdir -p work/src
          unzip -q -o "$OUTJAR" -d work/src

          mkdir -p analysis/pizzaland-src
          # doar sursa java + meta, fara assets (alea-s 95% din marime)
          cd work/src
          zip -q -r ../../analysis/pizzaland-src/pizzaland-sursa-java.zip . \
            -i "*.java" "*.toml" "*.json" "META-INF/*" -x "assets/*" "data/*"
          cd ../..

          # raport: structura modului
          {
            echo "# Analiza Pizzaland (decompilat cu Vineflower 1.12.0)"
            echo
            echo "Jar original: $(basename "$JAR") ($(du -h "$JAR" | cut -f1))"
            echo
            echo "## Numar fisiere"
            echo "- fisiere .java decompilate: $(find work/src -name '*.java' | wc -l)"
            echo "- assets (texturi/modele/sunete): $(find work/src/assets -type f 2>/dev/null | wc -l)"
            echo
            echo "## Pachete principale (primele 40)"
            find work/src -name '*.java' | sed 's|work/src/||; s|/[^/]*\.java$||' | sort | uniq -c | sort -rn | head -40
            echo
            echo "## mods.toml"
            echo '```'
            cat work/src/META-INF/mods.toml 2>/dev/null || echo "(lipsa)"
            echo '```'
            echo
            echo "## Primele 60 clase (nume complete)"
            find work/src -name '*.java' | sed 's|work/src/||' | sort | head -60
          } > analysis/pizzaland-src/ANALIZA.md

          du -h analysis/pizzaland-src/*

      - name: Commit rezultatul
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/pizzaland-src
          git commit -m "analysis: sursa decompilata Pizzaland (doar studiu, nu redistribuiti)" || echo "nimic de comis"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 5
          done
