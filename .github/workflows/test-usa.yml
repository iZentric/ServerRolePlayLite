name: sonda-usa
on:
  push:
    paths: ["deploy/usa-trigger.txt"]
permissions:
  contents: write
jobs:
  bate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: O bataie in usa cu cheia de proba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "15254.1388b9af","REDACTED_SFTP_PASS" "sftp://node12.zampto.net:2022" -e "
            set sftp:auto-confirm yes;
            cls -l | head -5;
            du -sb mods;
            bye" > analysis/usa-test.txt 2>&1 || true
          cat analysis/usa-test.txt
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add analysis/ && git commit -m "sonda usa" && git pull --rebase -X ours && git push || true
