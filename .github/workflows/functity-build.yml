name: FUNCITY-BUILD
# Build 0 = referinta: Mohist 1.16.5 la commit fixat, compilat reproducibil pe runner
# curat. Fara patch-uri FunCity in acest tur (incă). Arunca JAR-ul + logul + metadata
# pe bransa functity-out; de acolo le citesc si decidem pasul cu patch-urile.
on:
  push:
    paths:
      - deploy/functity-build.txt
      - .github/workflows/functity-build.yml
      - functity/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MOHIST_PIN: 754b578ef3e4881d854bcd1df5d299ada3fd429f
    steps:
      - uses: actions/checkout@v4

      - name: Adu sursa la commit fixat
        run: |
          set -euo pipefail
          git clone -q https://github.com/MohistMC/Mohist -b 1.16.5 src
          git -C src fetch -q --tags origin || true
          git -C src checkout -q "$MOHIST_PIN" -B 1.16.5
          git -C src log -1 --format='pin: %H %ci %s' | head -1
          git -C src describe --tags --abbrev=7 || echo "describe ESUAT (semnal ca clone-ul e stramb)"
          shopt -s nullglob
          PATCHES=(functity/patches/*.patch)
          if grep -q NOPATCH deploy/functity-build.txt 2>/dev/null; then
            PATCHES=()
            echo "NOPATCH: build de referinta, fara patch-uri"
          fi
          if [ ${#PATCHES[@]} -gt 0 ]; then
            git -C src apply --check "${PATCHES[0]}" 2>/tmp/applycheck.txt || { echo "PATCH respins:"; cat /tmp/applycheck.txt; exit 1; }
            for pt in "${PATCHES[@]}"; do git -C src apply "$pt" && echo "aplicat: $(basename "$pt")"; done
            echo "BUILD_ID=b1.$(date -u +%H%M)" >> "$GITHUB_ENV"
          else
            echo "BUILD_ID=b0" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Compileaza
        continue-on-error: true
        run: |
          set -uo pipefail
          cd src
          chmod +x gradlew
          /usr/bin/time -v ./gradlew setup mohistJar --no-daemon --stacktrace --max-workers=4 > ../build-out.log 2>&1
          GE=$?
          echo "gradle exit: $GE" | tee -a ../build-out.log
          printf '::warning::gradle exit=%s tail=%s\n' "$GE" "$(tail -c 1400 ../build-out.log | tr '\n' '~')"

      - name: Colecteaza artefactele
        run: |
          set -uo pipefail
          mkdir -p /tmp/fc
          JAR=$(find src/projects src/build src/run -name '*server*.jar' -size +5M -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
          [ -n "$JAR" ] || JAR=$(find src/projects src/build src/run -name '*.jar' -size +5M -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
          if [ -n "${JAR:-}" ]; then
            cp "$JAR" "/tmp/fc/FunCity-1.16.5-${BUILD_ID:-b0}.jar"
            ( cd /tmp/fc && sha256sum "FunCity-1.16.5-${BUILD_ID:-b0}.jar" > SHA256SUMS.txt )
            JNAME=$(basename "$JAR")
          else
            echo "NICIUN JAR GASIT" > /tmp/fc/ESUARE.txt
            find src -name '*.jar' 2>/dev/null | head -20 >> /tmp/fc/ESUARE.txt || true
          fi
          tail -c 350000 build-out.log > /tmp/fc/BUILD-LOG.txt 2>/dev/null || cp src/build-out.log /tmp/fc/BUILD-LOG.txt 2>/dev/null || echo "log pierdut" > /tmp/fc/BUILD-LOG.txt
          {
            echo "{"
            echo "  \"build\": \"b0-baseline\","
            echo "  \"mohist_pin\": \"$MOHIST_PIN\","
            echo "  \"jar\": \"${JNAME:-niciunul}\","
            echo "  \"data_utc\": \"$(date -u '+%F %T')\","
            echo "  \"runner\": \"ubuntu-24.04 hosted\","
            echo "  \"java\": \"$(java -version 2>&1 | head -1 | tr -d '"')\""
            echo "}"
          } > /tmp/fc/metadata.json
          ls -la /tmp/fc

      - name: Publica pe functity-out (model rp-drop cu token in URL)
        run: |
          set +e
          cd /tmp; rm -rf fcout
          git clone -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" -b functity-out fcout 2>/tmp/clone.err
          CL=$?
          printf '::warning::clone functity-out: exit=%s err=%s\n' "$CL" "$(tr '\n' '~' < /tmp/clone.err | head -c 300)"
          cd fcout || { echo "fara clone, opresc"; exit 0; }
          git config user.name 'functity-ci[bot]'
          git config user.email 'functity-ci@localhost'
          mkdir -p "builds/$BUILD_ID"
          cp /tmp/fc/* "builds/$BUILD_ID/" 2>/dev/null
          git add -A "builds/$BUILD_ID"
          git commit -qm "functity $BUILD_ID" || echo "nimic de commituit"
          git push -q origin HEAD:refs/heads/functity-out 2>/tmp/push.err
          PE=$?
          printf '::warning::push: exit=%s err=%s fisiere=%s\n' "$PE" "$(tr '\n' '~' < /tmp/push.err | head -c 400)" "$(cd builds/$BUILD_ID && ls | tr '\n' ',' | head -c 200)"
          if [ $PE -ne 0 ]; then
            git pull -q --rebase origin functity-out 2>/dev/null
            git push -q origin HEAD:refs/heads/functity-out 2>/tmp/push2.err
            printf '::warning::push retry: exit=%s err=%s\n' "$?" "$(tr '\n' '~' < /tmp/push2.err | head -c 400)"
          fi
      - name: Verific local (infolare bara de progres)
        if: always()
        run: |
          set +e
          echo "BUILD_ID=$BUILD_ID"
          echo "::group::gradle tail"
          tail -c 2000 build-out.log | tr '\n' '~' | head -c 1500
          echo
          echo "::endgroup::"
          printf '::warning::sfarsit: build=%s jar=%s logmarime=%s\n' "$BUILD_ID" "$(ls /tmp/fc/*.jar 2>/dev/null | head -1 || echo NICIUN)" "$(stat -c %s build-out.log 2>/dev/null || echo 0)"

