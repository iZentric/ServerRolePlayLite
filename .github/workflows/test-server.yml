name: test-server

# TRIBUNALUL JARURILOR: testeaza TOATE variantele de server pe Java-ul Zampto
on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/test-trigger.txt"

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: Mist, java: "11" }
          - { variant: Arclight, java: "11" }
          - { variant: CatServer, java: "11" }
          - { variant: CatServer, java: "17", suffix: "-J17" }
          - { variant: CatServer, java: "21", suffix: "-J21" }
          - { variant: CatServer, java: "17", suffix: "-MCMT", mcmt: "da" }
          - { variant: CatServer, java: "17", suffix: "-PERF", perfswap: "da" }
          - { variant: MaxLite, java: "17", suffix: "-MCMT", mcmt: "da" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - name: Descarca varianta ${{ matrix.variant }}
        run: |
          gh release download lite -R ${{ github.repository }} -p '*Server-${{ matrix.variant }}*.zip' -O srv.zip
          mkdir srv && cd srv && unzip -q ../srv.zip
          echo "eula=true" > eula.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PORNESTE serverul ${{ matrix.variant }}
        run: |
          cd srv
          V="${{ matrix.variant }}${{ matrix.suffix }}"
          if [ "${{ matrix.perfswap }}" = "da" ]; then
            rm -f mods/RoadRunner*.jar mods/roadrunner*.jar
            FID=$(curl -s https://api.cfwidget.com/354143 | python3 -c "
import json,sys
d=json.load(sys.stdin)
f=[x for x in d.get('files',[]) if '4.1m' in x.get('name','') and x.get('name','').startswith('performant-1.16')]
print(f[-1]['id'] if f else '')")
            [ -n "$FID" ] && curl -sL -o mods/performant-1.16.2-5-4.1m.jar "https://media.forgecdn.net/files/$((FID/1000))/$((FID%1000))/performant-1.16.2-5-4.1m.jar" && echo "== PERFORMANT pe campion ==" >> boot.log
          fi
          if [ "${{ matrix.mcmt }}" = "da" ]; then
            # EXPERIMENTUL FINAL DE CAPACITATE: serverul pe TOATE nucleele (MCMT)
            curl -sL -o mods/jmt_mcmt-1.16.5-0.22.87.jar https://github.com/jediminer543/JMT-MCMT/releases/download/v0.22.87/jmt_mcmt-1.16.5-0.22.87.jar
            echo "== MCMT montat ==" >> boot.log
          fi
          if [ "$V" = "Mist" ]; then
            # LAZARUS 10b: rescriem REGISTRUL de amprente (md5) din jarul Mist - doar shell, fara acrobatii
            curl -sL -o /tmp/ml.jar https://maven.minecraftforge.net/cpw/mods/modlauncher/8.1.3/modlauncher-8.1.3.jar
            M5=$(md5sum /tmp/ml.jar | cut -d' ' -f1); SZ=$(stat -c%s /tmp/ml.jar)
            MJ=$(ls mist-*.jar | head -1)
            echo "== LAZARUS: cautam registrul de amprente ==" >> boot.log
            unzip -Z1 "$MJ" | grep -viE '\.class$|\.jar$|^META-INF/' > /tmp/entries.txt || true
            : > /tmp/found.txt
            while read -r f; do
              if unzip -p "$MJ" "$f" 2>/dev/null | grep -q "modlauncher-8.0.9"; then echo "$f" >> /tmp/found.txt; fi
            done < /tmp/entries.txt
            cat /tmp/found.txt >> boot.log
            while read -r r; do
              mkdir -p "/tmp/fix/$(dirname "$r")"
              unzip -p "$MJ" "$r" > "/tmp/fix/$r"
              grep "modlauncher-8.0.9" "/tmp/fix/$r" | head -2 >> boot.log || true
              sed -i -E "/modlauncher-8\.0\.9/ s/[0-9a-fA-F]{32}/$M5/g" "/tmp/fix/$r"
              sed -i -E "/modlauncher-8\.0\.9/ s/\b[0-9]{5,9}\b/$SZ/g" "/tmp/fix/$r"
              grep "modlauncher-8.0.9" "/tmp/fix/$r" | head -2 >> boot.log || true
              (cd /tmp/fix && zip -q "$GITHUB_WORKSPACE/srv/$MJ" "$r")
            done < /tmp/found.txt
            zip -dq "$MJ" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
            mkdir -p libraries/cpw/mods/modlauncher/8.0.9
            cp /tmp/ml.jar libraries/cpw/mods/modlauncher/8.0.9/modlauncher-8.0.9.jar
            mkdir -p mohist-config
            printf 'check_update: false\n' > mohist-config/mohist.yml
            # LAZARUS 13 (ordinul Overlordului): RoadRunner JOS de pe Mist, PERFORMANT sus
            rm -f mods/RoadRunner*.jar mods/roadrunner*.jar
            FID=$(curl -s https://api.cfwidget.com/354143 | python3 -c "
import json,sys
d=json.load(sys.stdin)
f=[x for x in d.get('files',[]) if '4.1m' in x.get('name','') and x.get('name','').startswith('performant-1.16')]
print(f[-1]['id'] if f else '')")
            if [ -n "$FID" ]; then
              URL="https://media.forgecdn.net/files/$((FID/1000))/$((FID%1000))/performant-1.16.2-5-4.1m.jar"
              curl -sL -o mods/performant-1.16.2-5-4.1m.jar "$URL" && echo "== PERFORMANT montat ($URL)" >> boot.log
            else
              echo "== cfwidget nu a dat fileid - Mist ramane fara motor de tick in testul asta" >> boot.log
            fi
            # LAZARUS 12: nu inlocuim RoadRunner - ii stingem DOAR circuitul care se bate cu Mist
            mkdir -p config
            for cf in roadrunner.properties lithium.properties; do
              printf 'mixin.alloc.chunk_random=false\n' > config/$cf
            done
            # LAZARUS 11: rescriem pasapoartele modurilor - cerinta de Forge relaxata la 36.2.0
            # (Mist are 36.2.4 inghetat; modurile cer 36.2.9-36.2.33 doar din stampila, poate nu din API)
            for j in mods/*.jar; do
              if unzip -p "$j" META-INF/mods.toml 2>/dev/null | grep -q 'versionRange="\[36\.2\.[1-9]'; then
                echo "== pasaport rescris: $j" >> boot.log
                rm -rf /tmp/mt && mkdir -p /tmp/mt/META-INF
                unzip -p "$j" META-INF/mods.toml > /tmp/mt/META-INF/mods.toml
                sed -i -E 's/versionRange="\[36\.2\.[0-9]+/versionRange="[36.2.0/g' /tmp/mt/META-INF/mods.toml
                (cd /tmp/mt && zip -q "$GITHUB_WORKSPACE/srv/$j" META-INF/mods.toml)
              fi
            done
          fi
          START=$(date +%s)
          mkfifo in
          exec 3<> in
          java -Xms128M -XX:MaxRAMPercentage=90.0 -Dterminal.jline=false @unix_args.txt < in > boot.log 2>&1 &
          JPID=$!
          STATUS=TIMEOUT
          for i in $(seq 1 100); do
            if grep -q 'Done (' boot.log 2>/dev/null; then STATUS=PORNIT; break; fi
            if ! kill -0 $JPID 2>/dev/null; then STATUS=CRAPAT; break; fi
            sleep 10
          done
          T=$(( $(date +%s) - START ))
          RAM="n/a"
          kill -0 $JPID 2>/dev/null && RAM=$(( $(ps -o rss= -p $JPID 2>/dev/null || echo 0) / 1024 ))MB
          echo "stop" >&3; sleep 25; kill -9 $JPID 2>/dev/null || true
          {
            echo "# VERDICT ${V} ($(date -u))"
            echo "- REZULTAT: **$STATUS** in ${T}s | RAM: **$RAM**"
            echo "- Done-line:"; grep 'Done (' boot.log | head -2 | sed 's/^/    /' || true
            echo "- Erori cheie:"
            grep -iE "ERROR|FATAL|NoSuchMethod|Exception in thread|Could not load" boot.log | sort | uniq -c | sort -rn | head -12 | sed 's/^/    /' || true
            echo "- Contextul erorilor invalid-dist (vinovatul cu nume):"
            grep -B6 "invalid dist" boot.log | grep -iE "mod |\.jar|modid|scan|candidate" | head -8 | sed 's/^/    /' || true
            echo "- Contextul erorii File not found (ultimul mister):"
            grep -B8 -A2 "File not found" boot.log | head -14 | sed 's/^/    /' || true
            echo "- Pluginuri pornite:"
            grep -iE "Enabling (AuthMe|SkinsRestorer|FastLogin|ProtocolLib|LuckPerms|Essentials|WorldGuard|spark|Chunky|GriefPrevention|ZNPC|Vault|WorldEdit)" boot.log | head -17 | sed 's/^/    /' || true
          } > ../analysis/test-boot-${V}.md
          tail -200 boot.log > ../analysis/test-boot-${V}-tail.log
          for cf in catserver.yml mohist-config/mohist.yml bukkit.yml spigot.yml; do
            if [ -f "$cf" ]; then
              echo "===== CONFIG NATIV: $cf =====" >> ../analysis/test-boot-${V}-tail.log
              head -80 "$cf" >> ../analysis/test-boot-${V}-tail.log
            fi
          done
          if [ "$V" = "Mist" ]; then
            MJ=$(ls mist-*.jar | head -1)
            { echo "===== DOSAR MIST ====="
              echo "-- MANIFEST:"; unzip -p "$MJ" META-INF/MANIFEST.MF | head -20
              echo "-- clase modlauncher cusute in jar:"; unzip -l "$MJ" | grep -c "cpw/mods/modlauncher" || true
              echo "-- clase mohist/mist wrapper:"; unzip -l "$MJ" | grep -iE "mohistmc|ServerMain|Main\.class" | head -10
              echo "-- jaruri nascute de instalare:"; find libraries -name '*.jar' -path '*forge*' | head -10
              find libraries -name '*.jar' -path '*minecraft*' | head -10
              ls -la *.jar 2>/dev/null
            } >> ../analysis/test-boot-${V}-tail.log 2>&1
          fi
          # autopsia completa: jurnalele interne ale serverului (eroarea reala ascunsa de wrapper)
          for f in $(find . -name '*.log' -not -name boot.log 2>/dev/null | head -6); do
            echo "===== JURNAL INTERN: $f =====" >> ../analysis/test-boot-${V}-tail.log
            tail -60 "$f" >> ../analysis/test-boot-${V}-tail.log
          done
          for f in $(find crash-reports -name '*.txt' 2>/dev/null | head -2); do
            echo "===== CRASH REPORT: $f =====" >> ../analysis/test-boot-${V}-tail.log
            head -60 "$f" >> ../analysis/test-boot-${V}-tail.log
          done
          cat ../analysis/test-boot-${V}.md
      - name: Publica verdictul
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          for t in 1 2 3 4 5; do
            git add analysis/ || true
            git commit -m "analysis: verdict ${{ matrix.variant }}" || true
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((RANDOM % 15 + 3))
          done
