# Follow-up on the previously built candidate; no rebuild, no live server access.
name: ENGINE TICKET STEADY — isolated A/B/B/A
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a29b4ef4-serverroleplaylite"]
    paths: ["deploy/engine-ticket-steady.txt"]
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: 38175428475
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch same experimental JAR and unchanged release pack
        run: |
          set -euo pipefail
          mkdir -p engine-ticket-steady
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" -n cuantic-engine-ticket-EXPERIMENTAL -D engine-ticket-steady
          gh release download lite --repo "$GITHUB_REPOSITORY" -p 'CUANTIC-Server-CatServer-1.7.7.zip' -O /tmp/cuantic-ticket-steady.zip
          echo 'Expected original candidate SHA from first experiment:'
          cat engine-ticket-steady/SHA256SUMS.txt
          expected=$(cut -d' ' -f1 engine-ticket-steady/SHA256SUMS.txt)
          actual=$(sha256sum engine-ticket-steady/CUANTIC-CatServer-ticket-experimental.jar | cut -d' ' -f1)
          test "$expected" = "$actual"
      - name: A/B/B/A after 55s world warmup, CPU measured over 75s steady state
        run: python3 scripts/engine_ticket_compare.py /tmp/cuantic-ticket-steady.zip engine-ticket-steady/CUANTIC-CatServer-ticket-experimental.jar engine-ticket-steady/abba
      - name: Publish result, NEVER promote JAR automatically
        if: always()
        run: |
          { echo '# ENGINE TICKET — steady-state follow-up'; echo;
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID";
            echo 'Candidate from build run 38175428475; same unmodified production pack in a disposable GitHub VM.';
            echo 'No players, driving, or production world. Live JAR unchanged.'; echo;
            echo 'CPU window begins after 55s warmup and lasts 75s; Spark 1m p95 sampled near the end.'; echo;
            echo '```json'; cat engine-ticket-steady/abba/result.json 2>/dev/null || echo 'NOT RUN'; echo '```';
          } > docs/ENGINE-TICKET-STEADY-RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGINE-TICKET-STEADY-RESULT.md
          git commit -m 'engine ticket: steady-state A/B benchmark verdict' || true
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
